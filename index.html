ue mantiene la forma y resiste las arrugas."},"chirimen":{"name":"Chirimen, crepé de seda","region":"Tango (Kioto), Nagahama (Shiga)","era":"Desde el siglo XVI; en Tango desde el XVIII","about":"El suave crepé de seda que sirve de tela base para la mayoría de los kimonos teñidos, incluido el yuzen. Su superficie rizada absorbe el color de maravilla y cae con elegancia.","process":"Los hilos de trama se retuercen miles de veces por metro, alternando torsiones a izquierda y derecha. Tras el tejido, la tela se hierve para eliminar la sericina, los hilos intentan destorcerse y el tejido se encoge formando diminutas arrugas llamadas shibo.","look":"Una superficie suave cubierta de diminutos relieves; el tamaño del rizado varía según el tipo."},"nishijin":{"name":"Brocado Nishijin","region":"Barrio de Nishijin, Kioto","era":"Nombre del siglo XV; se teje aquí desde los siglos V–VI","about":"El brocado más importante de Japón, llamado así por el 'Campamento Occidental' de la guerra de Onin. Los tejedores de Nishijin producen obi espléndidos y telas para la corte imperial, los templos y el teatro Noh.","process":"Los hilos se tiñen antes de tejer en decenas de colores y se combinan con hilos de oro y plata. Los telares Jacquard llegaron de Francia en la década de 1870, mientras que el tapiz más fino todavía se teje a mano, apretando la trama con las uñas dentadas.","look":"Tela pesada y ricamente decorada con hilos de oro y plata; se ve sobre todo en obi formales."},"saga-nishiki":{"name":"Saga Nishiki, brocado de papel y seda","region":"Saga","era":"Finales del periodo Edo","about":"Un brocado poco común del dominio de Kashima. Cuenta la leyenda que la esposa del señor lo ideó inspirándose en el motivo de bambú trenzado (ajiro) de su techo, y que se transmitió entre las damas de la casa. Llamado primero Kashima Nishiki, recibió el nombre de 'Saga Nishiki' en la Exposición Anglo-Japonesa de 1910.","process":"La urdimbre está hecha de finas tiras de papel washi recubiertas de oro, plata o laca. Una pequeña espátula de bambú levanta las tiras de papel una a una y se pasa la trama de seda de color. Solo se pueden tejer unos pocos centímetros al día.","look":"Motivos geométricos diminutos y precisos sobre un fondo dorado reluciente; se usa en obi formales, bolsos y accesorios."},"hakata":{"name":"Tejido Hakata","region":"Fukuoka","era":"1241","about":"Lo inició un comerciante que aprendió a tejer en la China de la dinastía Song. En el periodo Edo, el señor local lo ofrecía cada año al shogun, por eso el diseño clásico se llama Hakata 'kenjo' (ofrenda).","process":"Muchos hilos finos de urdimbre se colocan muy juntos y la trama gruesa se aprieta con fuerza, de modo que el motivo lo forma sobre todo la urdimbre. Los motivos clásicos proceden de objetos rituales budistas y de rayas.","look":"Un obi firme que hace un sonido 'kyu-kyu' al atarse y nunca se afloja."},"wana":{"name":"Wana, tejido de bucles","region":"Kioto","era":"Desde el siglo XVII","about":"'Wana' significa lazo. Este tejido levanta pequeños bucles de seda en la superficie, la misma técnica con la que se hace el terciopelo en Japón. Da a los obi y abrigos un relieve suave y esculpido.","process":"Se tejen finos alambres bajo la urdimbre para levantarla en bucles; luego se retiran los alambres. Si los bucles se dejan, es wana; si se cortan, se convierte en terciopelo. Los motivos pueden combinar bucles cortados y sin cortar.","look":"Un motivo en relieve y aterciopelado de diminutos bucles, suave al tacto."},"sagara":{"name":"Sagara, bordado de nudos","region":"De China; se practica en Kioto y en todo Japón","era":"Técnica antigua","about":"Un bordado hecho de innumerables nuditos, parecidos al punto de nudo francés. Crea una textura tridimensional como de cuentas y es muy resistente, por lo que se usa para acentos y contornos.","process":"El hilo se enrolla alrededor de la aguja y se pasa hacia abajo a través de la tela para formar un pequeño nudo. Los nudos se alinean uno a uno para rellenar una forma o trazar una línea.","look":"Puntos en relieve muy juntos, como perlas diminutas."},"kinkoma":{"name":"Kinkoma, bordado de oro sobrepuesto","region":"Kioto y todo Japón","era":"Técnica antigua","about":"El hilo de oro es demasiado rígido para atravesar la seda, así que se coloca sobre la superficie y se sujeta. Esto da a contornos y motivos una línea dorada marcada y brillante.","process":"El hilo de oro, enrollado en pequeños carretes de madera (koma), se coloca a lo largo del diseño, normalmente por parejas, y se fija a intervalos cortos con un fino hilo de seda.","look":"Líneas de oro lisas y continuas que descansan sobre la tela."},"takeyamachi":{"name":"Takeyamachi, bordado sobre gasa","region":"Takeyamachi, Kioto","era":"Periodo Edo","about":"Un bordado sobre gasa de seda de trama abierta, llamado así por la calle de Kioto donde nació. Las puntadas siguen la cuadrícula del tejido con tanta precisión que el resultado parece tejido en lugar de bordado.","process":"Principalmente hilo de oro plano (a veces con seda de color) se pasa por los diminutos orificios de la gasa, contando cada uno, para rellenar el diseño como un mosaico.","look":"Un motivo dorado nítido, de aspecto tejido, sobre gasa transparente; se usa en obi, fukusa y montajes de rollos colgantes."},"swatow":{"name":"Swatow, bordado calado","region":"Shantou (Swatow), Guangdong, China","era":"Finales del siglo XIX","about":"Un delicado bordado calado del sur de China que combina el bordado chino con el encaje europeo. Los kimonos con bordado Swatow se aprecian desde hace mucho en Japón como prendas elegantes y refinadas.","process":"Se sacan hilos de la tela o se recortan pequeñas zonas, y las aberturas se rematan y rellenan con puntadas finas para crear motivos de encaje. Todo se hace a mano.","look":"Motivos tono sobre tono, como de encaje, con diminutas aberturas, a menudo en blanco o en suaves tonos pastel."},"suzhou":{"name":"Bordado de seda de Suzhou","region":"Suzhou, Jiangsu, China","era":"Más de 2.000 años","about":"Una de las cuatro grandes tradiciones de bordado de China, famosa por su extrema finura. En kimonos y obi se usa para animales y flores realistas.","process":"Un solo hilo de seda se divide en hasta varias decenas de filamentos finos como un cabello. Los colores se mezclan puntada a puntada, y algunas piezas se bordan de modo que ambas caras muestran una imagen terminada.","look":"Un realismo casi fotográfico, como gatos en los que se distingue cada pelo."},"ran":{"name":"Bordado de puntada aleatoria (luanzhen)","region":"Changzhou, Jiangsu, China; también se ve en kimonos y obi","era":"Creado a principios del siglo XX (décadas de 1920-30)","about":"Un bordado en el que puntadas de distintas longitudes y direcciones se cruzan y se superponen, como las pinceladas de un óleo. Expresa con naturalidad el pelaje, las plumas, la luz y la sombra.","process":"En lugar de colocar las puntadas ordenadamente una junto a otra, la bordadora las superpone libremente en direcciones cruzadas y mezcla colores en cada capa para crear profundidad.","look":"Una superficie pictórica con degradados suaves en lugar de líneas de puntada definidas."},"hitta":{"name":"Hitta, shibori de puntos cuadrados","region":"Kioto","era":"Muy desarrollado ya en el siglo XVII","about":"El tipo de shibori más lujoso. Diminutos puntos cuadrados se alinean en diagonal; un kimono cubierto por completo de hitta se llama 'so-hitta' y es el colmo del lujo.","process":"La artesana pellizca un trocito de tela, lo dobla en cuatro y le enrolla hilo varias veces. Cada punto se ata a mano, así que un furisode totalmente cubierto puede llevar un año o más.","look":"Puntos cuadrados uniformes y en relieve, dispuestos en ordenadas filas diagonales."},"kanoko":{"name":"Kanoko, shibori de manchas de cervatillo","region":"Kioto y todo Japón","era":"Desde la antigüedad","about":"'Kanoko' significa cervatillo, porque los puntitos blancos con el centro de color recuerdan las manchas de un ciervo joven. Es el shibori más conocido y aparece en obiage, kimonos y accesorios.","process":"Se levantan pequeños puntos de tela y se atan con fuerza con hilo antes de teñir. Tras el teñido y el desatado, cada punto deja un pequeño anillo con una textura en relieve y abultada.","look":"Pequeños anillos punteados con un diminuto 'ojo' de color en el centro."},"boshi":{"name":"Boshi shibori (con capuchón)","region":"Kioto, Arimatsu","era":"Periodo Edo","about":"'Boshi' significa sombrero. Este método protege del tinte grandes zonas del diseño cubriéndolas con un capuchón, lo que permite dejar en blanco grandes flores o círculos.","process":"El contorno se cose y se frunce, y luego la zona interior se cubre como con un gorro, tradicionalmente con vaina de bambú y hoy por lo general con vinilo, y se ata con fuerza con hilo antes de teñir.","look":"Grandes formas sin teñir con bordes suaves y ligeramente difuminados."},"nuishime":{"name":"Nuishime, shibori cosido","region":"Kioto, Arimatsu-Narumi (Nagoya)","era":"Al menos desde el periodo Muromachi","about":"Un método de shibori que usa puntadas corridas para trazar líneas y formas precisas. Permite formas mucho más libres que el atado por sí solo.","process":"El diseño se cose con pequeñas puntadas corridas, y los hilos se tensan para que la tela se recoja en pliegues. Las zonas plegadas repelen el tinte y dejan un contorno punteado.","look":"Contornos nítidos formados por hileras de pequeños trazos."},"arashi":{"name":"Arashi, shibori enrollado en poste","region":"Arimatsu-Narumi (Nagoya)","era":"Finales del siglo XIX","about":"'Arashi' significa tormenta: las líneas diagonales parecen lluvia empujada por el viento. Es un clásico de Arimatsu, la mayor ciudad del shibori en Japón, y es muy popular para yukata.","process":"La tela se enrolla en diagonal alrededor de un poste largo, se ata con hilo y se empuja hacia abajo formando pliegues apretados. Solo los relieves exteriores absorben el tinte.","look":"Finas líneas diagonales que parecen lluvia inclinada."},"tatsumaki":{"name":"Tatsumaki, shibori de remolino","region":"Arimatsu-Narumi (Nagoya), Kioto","era":"Técnica tradicional","about":"'Tatsumaki' significa tornado. Se enrolla un hilo en espiral alrededor de la tela, de modo que el motivo gira como atrapado en un torbellino.","process":"La tela se frunce (a menudo tras coserla o plisarla) alrededor de un núcleo formando una barra larga y redonda, y antes de teñir se enrolla un hilo en espiral de arriba abajo. Solo la superficie expuesta absorbe el tinte, dejando bandas en espiral.","look":"Rayas arremolinadas en espiral con una fuerte sensación de movimiento."},"yanagi":{"name":"Yanagi, shibori de sauce","region":"Arimatsu-Narumi (Nagoya)","era":"Periodo Edo","about":"'Yanagi' significa sauce. El motivo parece ramas de sauce meciéndose con la brisa y es uno de los favoritos para los yukata de verano.","process":"La tela se recoge a lo largo en pliegues estrechos y se ata con hilo a intervalos. Los pliegues repelen el tinte y dejan finas líneas verticales discontinuas.","look":"Suaves líneas verticales que parecen ramas de sauce colgantes."},"oke":{"name":"Oke, shibori de cubeta","region":"Kioto","era":"Técnica tradicional de Kioto","about":"'Oke' significa cubeta. Esta técnica poco común mantiene secas grandes partes de la tela sellándolas dentro de una cubeta de madera, lo que permite grandes zonas de distintos colores en un mismo kimono. Muy pocos artesanos saben hacerla todavía.","process":"La parte que debe quedar sin teñir se mete en una cubeta de madera de ciprés y las tapas se sujetan con fuerza y se atan con cuerdas sobre la tela, dejando fuera la parte que se va a teñir. Luego se sumerge toda la cubeta en una tina de tinte más grande. Se repite para cada color.","look":"Grandes bloques marcados de distintos colores, con bordes limpios y ligeramente suaves."},"itajime":{"name":"Itajime, teñido con tablillas","region":"Arimatsu, Kioto y otros lugares","era":"Desde el siglo VIII","about":"Una de las técnicas de reserva más antiguas de Japón; su antecesora, el kyokechi (teñido entre tablillas talladas), se conserva en el Shosoin, el depósito de tesoros del siglo VIII. La tela plegada se prensa entre tablillas para crear motivos repetidos.","process":"La tela se pliega en triángulos o cuadrados y se prensa con fuerza entre tablillas de madera, y después se sumerge en el tinte. Las zonas cubiertas quedan blancas y forman un motivo simétrico.","look":"Formas geométricas repetidas, como los motivos parecidos a copos de nieve llamados sekka."},"tsukami":{"name":"Tsukami, shibori de agarre","region":"Diversos centros de shibori","era":"Tradicional","about":"'Tsukami' significa agarrar. Se juntan puñados de tela y se atan, así que cada pieza sale distinta. Da un efecto libre y natural.","process":"El artesano agarra la tela, la retuerce en manojos irregulares y los ata con hilo antes de teñir. Los pliegues al azar crean motivos impredecibles.","look":"Motivos irregulares, como nubes o jaspeados, sin repetición."},"kumihimo":{"name":"Kumihimo, trenzado de seda","region":"Kioto, Iga (Mie)","era":"Desde los siglos VII–VIII","about":"Cordones de seda trenzada, usados primero para objetos budistas y vestimenta cortesana, y más tarde para armaduras y cordones de espada de los samuráis. Hoy son conocidos sobre todo como obijime, el cordón que se ata alrededor del centro del obi.","process":"Decenas de hilos de seda se enrollan en bobinas con peso y se cruzan entre sí sobre un soporte de madera como el marudai redondo. Distintos soportes y movimientos crean cordones redondos, cuadrados o planos.","look":"Un trenzado firme y uniforme con finos motivos diagonales y ricas combinaciones de colores."},"zogan":{"name":"Zogan, taracea de metal","region":"Kioto, Kumamoto (Higo)","era":"Floreció en el periodo Edo en guarniciones de espadas y armas de fuego","about":"El arte de incrustar oro y plata en el hierro. Antes se usaba para decorar guarniciones de espada; hoy adorna accesorios del kimono como los obidome (broches para obi) y los adornos para el pelo.","process":"La superficie del hierro se raya con finas estrías cruzadas. Se martillean láminas e hilos de oro o plata en las estrías, y después el hierro se oxida a propósito y se cuece con laca o aceite hasta lograr un negro profundo.","look":"Brillantes diseños en oro y plata sobre un fondo negro profundo."},"makie":{"name":"Maki-e, laca dorada","region":"Kioto, Wajima, Kanazawa y otros lugares","era":"Desde los siglos VIII–IX","about":"Un arte de la laca en el que los diseños se dibujan con laca y se espolvorean con polvo de oro o plata. En el mundo del kimono se encuentra en peinetas, horquillas, obidome y sandalias geta.","process":"El diseño se pinta con laca y, antes de que se seque, se espolvorea polvo fino de oro o plata a través de un tubo de bambú. Luego la pieza se recubre y se pule varias veces.","look":"Delicadas imágenes doradas con un brillo profundo y lustroso sobre laca negra o roja."},"mizuhiki":{"name":"Mizuhiki, cordones de papel","region":"Iida (Nagano), Kanazawa (Ishikawa)","era":"Orígenes que se remontan al siglo VII","about":"Cordones decorativos de papel washi retorcido, atados en nudos que expresan deseos de buena suerte. Decoran sobres de regalo y, en el estilismo del kimono, se usan para adornos de pelo de novia y decoraciones de obi.","process":"El washi se retuerce en cordones finos y se endurece con almidón, y luego se tiñe o se envuelve en una película de color o metalizada. Los cordones se atan en nudos como el nudo awaji o se moldean en forma de grullas, pinos y ciruelos.","look":"Cordones brillantes y rígidos atados en nudos simétricos, a menudo en rojo y blanco o en oro y plata."},"ro":{"name":"Ro, gasa de verano con franjas caladas","region":"Kioto y otras zonas de tejido de seda","era":"Nombre documentado ya en el siglo XV; extendido desde el periodo Edo","about":"Una seda de verano con hileras ordenadas de diminutas aberturas que dejan pasar el aire. Es la tela clásica para kimonos formales y de diario en los meses más calurosos, de principios a finales del verano.","process":"Se tejen varias pasadas en tafetán y luego, durante una sola pasada, los hilos de urdimbre se retuercen por parejas para dejar una línea de huecos. El número de pasadas de tafetán entre los huecos da los nombres 'ro de tres pasadas', 'ro de cinco pasadas', etc.","look":"Finas líneas horizontales (o a veces verticales) de pequeñas aberturas sobre una seda por lo demás compacta."},"sha":{"name":"Sha, gasa de seda completa","region":"Kioto y otras zonas de tejido de seda","era":"Llegó de China en los siglos VII–VIII","about":"Una seda ligera y transparente que se lleva en pleno verano. Es más ligera y transparente que el ro, y también se usa para haori y abrigos de verano que se llevan sobre el kimono.","process":"En cada pasada, los hilos de urdimbre se retuercen por parejas y quedan fijados por la trama. Así se crea una malla uniforme y abierta en toda la tela.","look":"Una malla uniforme y transparente, sin franjas compactas; las capas de debajo se transparentan suavemente."},"ra":{"name":"Ra, gasa compleja en red","region":"Kioto","era":"Antigüedad (siglos VII–VIII); recuperado en el siglo XX","about":"Una de las más antiguas y la más compleja de las gasas; se conservan ejemplos en el Shosoin, el depósito de tesoros del siglo VIII. En Japón la técnica decayó después de la Edad Media y fue recuperada por maestros tejedores modernos. Hoy se ve sobre todo en lujosos obi de verano.","process":"Cada hilo de urdimbre se cruza para retorcerse con varios hilos vecinos, no solo con uno, de modo que los hilos forman una red. Se teje lentamente a mano en un telar especial.","look":"Una malla elástica en forma de red con aberturas en rombo, a menudo con motivos que aparecen en la red."},"kobai":{"name":"Kobai, tela de verano con cuadrícula de gofre","region":"Zonas de tejido de algodón y seda de todo Japón","era":"Tela de verano tradicional","about":"Una tela de verano con una textura de cuadrícula en relieve, de algodón (men-kobai) o de seda con algodón (kinu-kobai). Es una de las favoritas para yukata de calidad y kimonos informales de verano.","process":"Sobre un fondo fino y ligero se tejen hilos más gruesos a intervalos regulares, tanto a lo largo como a lo ancho. Los hilos gruesos forman una cuadrícula en relieve.","look":"Una tela ligera con un cuadriculado de líneas en relieve; los relieves evitan que se pegue a la piel."},"rokechi":{"name":"Rokechi, teñido con reserva de cera","region":"Kioto y todo Japón","era":"Siglo VIII; recuperado en el siglo XX","about":"Uno de los tres antiguos métodos de teñido con reserva del periodo Nara, del que se conservan ejemplos en el tesoro del Shosoin. Desapareció durante el periodo Heian y fue recuperado por artistas del siglo XX, que lo convirtieron en una forma de teñido libre y pictórica.","process":"Se aplica cera fundida con pincel o sello sobre la tela allí donde no debe llegar el color, y luego se tiñe la tela. Después se retira la cera con calor o agua caliente. Donde la cera se agrietó, el tinte se filtra y deja líneas finas.","look":"Formas audaces atravesadas por finas líneas de craquelado, como telarañas."},"mokuhan":{"name":"Mokuhan, estampado con bloques de madera","region":"Kioto y otras zonas","era":"Raíces antiguas","about":"Una técnica de estampado en la que diseños tallados en bloques de madera se presionan sobre la tela. Cada impresión lleva la mano del artesano, y las ligeras variaciones dan al tejido un carácter cálido y artesanal. Hoy pocos talleres la siguen practicando.","process":"Se talla un diseño en un bloque de madera dura. El bloque se cubre de tinte o pasta y se presiona con firmeza sobre la tela tensada, una impresión cada vez. Para cada color se usa un bloque distinto.","look":"Motivos repetidos con un color ligeramente irregular y de bordes suaves, y la tenue textura de la veta de la madera."},"chusen":{"name":"Chusen, teñido por vertido","region":"Osaka (Sakai), Hamamatsu (Shizuoka), Tokio","era":"Finales del siglo XIX (era Meiji)","about":"Un método japonés para teñir yukata y toallas tenugui de algodón. El tinte atraviesa por completo la tela, de modo que ambas caras tienen el mismo color, y los colores se ven suaves y frescos.","process":"La tela se pliega en zigzag en muchas capas, extendiendo pasta de reserva a través de una plantilla en cada una. Se forman muros de pasta alrededor de cada zona, se vierte el tinte desde una tetera y una succión desde abajo lo hace pasar por todas las capas a la vez.","look":"Colores suaves y ligeramente difuminados, degradados delicados y el mismo motivo claramente visible en el reverso."},"bingata":{"name":"Bingata, estarcido de Okinawa","region":"Okinawa","era":"Reino de Ryukyu (desde aproximadamente el siglo XV)","about":"El vivo arte del teñido de Okinawa, que en su día vestían la familia real y los nobles del Reino de Ryukyu. Sus colores brillantes y sus motivos procedentes tanto de Japón como de los mares del sur le dan un carácter alegre y tropical.","process":"Se recorta un motivo en una plantilla de papel y se aplica pasta de arroz a través de ella. Se aplican con pincel pigmentos minerales y tintes vegetales en cada zona, y luego se frota un tono más oscuro sobre los bordes (kumadori) para dar profundidad. La versión teñida solo con índigo se llama eigata.","look":"Amarillos, rojos y azules brillantes con bordes sombreados, y motivos como flores, aves, olas y nubes."},"aizome":{"name":"Aizome, teñido con índigo","region":"Tokushima (Awa) y todo Japón","era":"Antigüedad; muy extendido en el periodo Edo","about":"El índigo era el tinte más común en Japón y se usaba para todo, desde la ropa de trabajo de los campesinos hasta los kimonos. Los visitantes extranjeros de la era Meiji quedaron tan impresionados que el color pasó a conocerse como 'Japan Blue'.","process":"Las hojas de índigo se compostan para obtener sukumo, que luego se fermenta en una tina con lejía de ceniza de madera, salvado de trigo y cal. La tela se sumerge y se saca una y otra vez: sale verde y se vuelve azul al contacto con el aire. Cuantos más baños, más intenso es el color.","look":"Un azul profundo y vivo, del celeste pálido al casi negro, que se suaviza maravillosamente con el uso."},"lace":{"name":"Encaje","region":"Desarrollado en Europa; fabricado en Japón y en todo el mundo","era":"Encaje europeo desde el siglo XVI; con el kimono desde las eras Meiji–Taisho","about":"El encaje es un tejido calado hecho solo de hilos. En la moda actual del kimono son populares los kimonos, haori y obi de encaje, a menudo superpuestos sobre un kimono de color para que este se transparente.","process":"La mayor parte del encaje para kimono se fabrica en máquinas de bordar. El motivo se borda sobre una red fina (encaje de tul) o sobre una tela base que después se disuelve, dejando solo los hilos bordados (encaje químico).","look":"Un motivo transparente de hilos, floral o geométrico, con el color de debajo asomando por los huecos."},"tsuzure":{"name":"Tsuzure, tapiz tejido","region":"Kioto (Nishijin)","era":"Ejemplos en Japón desde el siglo VIII (probablemente importados de China); tejido en Nishijin desde el siglo XVIII (periodo Edo)","about":"La versión japonesa del tapiz, emparentada con el tapiz europeo de los Gobelinos. Se considera el obi de mayor categoría, y las piezas más finas se tejen a mano con las uñas del tejedor.","process":"Cada trama de color va y viene solo dentro de su propia parte del diseño, ocultando por completo la urdimbre. El tejedor lima sus uñas en forma de dientes de sierra y las usa para apretar cada trama en su sitio. En un día solo se tejen unos pocos centímetros.","look":"Tela firme y plana, con la misma imagen por el derecho y por el revés, y diminutas ranuras donde se encuentran dos colores."},"benibana":{"name":"Benibana, teñido con cártamo","region":"Yamagata (Mogami) y Kioto","era":"Llegó por la Ruta de la Seda hacia los siglos VI–VII","about":"Un tinte rojo natural obtenido de los pétalos de cártamo, muy apreciado por la corte de Heian. En el periodo Edo era tan valioso que se decía 'una medida de rojo vale una medida de oro'. Tradicionalmente se usaba para los forros de seda roja de los kimonos (momi).","process":"Los pétalos se lavan con agua para eliminar gran parte del pigmento amarillo, y luego se fermentan y se prensan en tortas llamadas 'beni-mochi'. El rojo se extrae con lejía de ceniza y se fija en la seda con vinagre de ciruela ahumada (ubai). Los teñidos repetidos intensifican el color.","look":"Un rosa claro y luminoso hasta un carmesí profundo; el color es delicado y se desvanece con la luz intensa."}}},"zh":{"ui":{"tagline":"和服背后的匠艺——日本50种传统技法","all":"全部","search":"搜索技法…","region":"产地","era":"起源","about":"简介","process":"制作方法","look":"辨识要点","listen":"收听日语名称","close":"关闭","language":"语言","count":"{n} 种技法","noResults":"没有符合搜索条件的技法。","prev":"上一个","next":"下一个","intro":"一件和服要经过许多道工序制成，每道工序都有各自的匠人。请选择一个类别，或点击任意技法了解更多。"},"cats":{"dye":{"name":"染色","desc":"在织好的白色丝绸上手绘、型染或印染图案。染色和服一般属于较正式的类型，用于典礼和喜庆场合。"},"weave":{"name":"织造","desc":"先将丝线染色，图案在织布过程中逐渐显现。紬等织造和服被视为讲究的日常服装而备受珍视，而织造的腰带则可以是最正式的一种。"},"embroidery":{"name":"刺绣","desc":"用丝线和金属线以手工绣在布料上，增添质感、光泽和层次。正式和服上常将刺绣与染色结合使用。"},"shibori":{"name":"绞染（扎染）","desc":"将布料的部分区域扎紧、缝缩、折叠或夹住，使染料无法渗入。拆去线后，图案便会显现，并带有柔和的立体质感。"},"other":{"name":"配饰工艺","desc":"和服要搭配绳带、饰物和装饰才算完整，这些由其他传统领域的匠人制作：编绳师、金工师、漆艺师和纸绳匠人。"}},"items":{"kaga-yuzen":{"name":"加贺友禅（手绘丝绸）","region":"石川县金泽","era":"18世纪初","about":"源自旧加贺藩的手绘染色风格。以“加贺五彩”描绘写实的花草而闻名：靛蓝、胭脂红、黄土色、草绿和古紫。","process":"先用细细的米糊线勾勒图案轮廓，防止颜色渗开。随后用毛笔为各个区域上色，晕染由外缘向中心过渡。通常由一位匠人统筹整件作品。","look":"自然、富有绘画感的图案，有时会画出“虫蛀”的叶子（虫喰）。很少或完全不用金箔和刺绣。"},"kyo-yuzen":{"name":"京友禅（手绘丝绸）","region":"京都","era":"17世纪末","about":"最早的友禅风格，以京都扇面画师宫崎友禅斋命名。它为和服带来了如绘画般自由的设计，并成为正式礼服的经典风格。","process":"整个工艺分为约二十道工序，每道由专业匠人负责：设计、勾勒轮廓、涂敷米糊防染、刷色、蒸制、水洗，最后加上金箔和刺绣。","look":"典雅的宫廷风图案，色彩浓丽，由中心向外晕染，常以金箔和刺绣收尾。"},"edo-komon":{"name":"江户小纹（细纹型染）","region":"东京","era":"17世纪（江户时代）","about":"以单色染出的细小重复图案，细密到远看布料仿佛素色。它起源于武士的礼服，每位大名都有自己专用的纹样。","process":"图案雕刻在以柿漆加固的多层和纸型纸上。匠人将型纸铺在丝绸上，透过型纸刮上米糊，再以精准的对位移动型纸，最后将整块布染色。","look":"近看：成千上万的细小圆点、波纹或线条。退后几步看：一种沉静的素色。"},"tsujigahana":{"name":"辻之花（缝绞染）","region":"京都及其他地区","era":"15世纪–17世纪初","about":"室町和桃山时代的奢华风格，将缝绞染与墨绘、金箔和刺绣相结合。它在17世纪初消失，后来被称为“幻之染”。","process":"沿图案轮廓缝线并收紧，使染料无法渗入，布料分多个阶段染色。之后再用墨描绘叶脉等细节。20世纪，现代艺术家使这种风格重获新生。","look":"柔和、略带晕开的形状，边缘有皱褶，并搭配纤细的墨绘。"},"sarasa":{"name":"更纱（异国印花图案）","region":"源自印度；在长崎、堺、京都和江户制作","era":"16–17世纪","about":"经由对外贸易传入的印度及东南亚彩色花纹棉布。其异国风情的花鸟和几何图案备受珍爱，日本匠人很快便制作出了自己的版本。","process":"在印度，图案是用媒染剂和蜡手绘或木版印制的。日本的“和更纱”通常使用多张型纸，每种颜色一张，依次印染。","look":"密集、富有异国情调的花卉及类似佩斯利的图案，色调为土红、靛蓝和褐色。"},"kinsai":{"name":"金彩（金箔装饰）","region":"京都","era":"历史悠久；16世纪盛行","about":"用真金真银装饰成品和服的工艺。它通常是友禅染正式和服的最后一道点缀，为花卉、云纹和轮廓增添光彩。","process":"通过型纸涂上粘合剂，或用细锥形筒描绘，再压上金箔，并将不需要留下的部分刷掉。金也可以撒成细小的金片，或以金泥描成线条。","look":"染色图案之上闪耀的金银细节，随穿着者的动作而闪烁。"},"oshima":{"name":"大岛紬（泥染紬）","region":"鹿儿岛县奄美大岛","era":"超过1300年的历史","about":"日本最著名的和服面料之一。其深邃而有光泽的黑褐色，来自先用当地树木、再用富含铁质的泥土对丝线进行染色。它轻盈顺滑，几乎不起皱。","process":"先将丝线紧密织成临时的席状物以预留图案。这块席子用车轮梅树皮染色数十次，再进行泥染，然后拆开，将丝线逐根重新织造，以手工对准每一个细小的点。","look":"深色、丝滑的表面，带有由细小十字组成的极其精细的几何图案。"},"yuki":{"name":"结城紬（手纺紬）","region":"茨城县结城市及栃木县小山市","era":"起源于奈良时代（8世纪）或更早；17世纪起闻名","about":"2010年被联合国教科文组织列入非物质文化遗产名录。据说是最奢华的便装和服，温暖轻盈，穿得越久越柔软。","process":"以手工从丝绵中纺出不加捻的丝线。图案用线以手工扎结、染色，再在腰机上织造，由织工自身的身体绷紧经线。一匹布可能需要数月乃至一年以上。","look":"柔软、略带不均匀的质感，以及哑光而温和的光泽。"},"ushikubi":{"name":"牛首紬（双宫茧紬）","region":"石川县白山市","era":"超过800年","about":"产自山村的稀有紬，以两只蚕共同结成的“双宫茧”制成。它极为结实，因而被称为“拔钉紬”：挂到钉子上时，布不会撕破，反而会把钉子拔出来。","process":"直接从热水中的双宫茧抽丝，使丝线带有天然的粗节。先织成白布，之后常再染色，甚至施以友禅手绘。","look":"结实的丝绸，带有细小的天然结节和沉静温润的光泽。"},"kihachijo":{"name":"黄八丈（岛上黄色丝绸）","region":"东京都八丈岛","era":"室町时代起已有记载；盛行于江户时代","about":"在偏远海岛上织造的丝绸，只使用取自岛上植物的三种天然颜色：金黄、锈褐和黑色。它曾在江户町人中流行一时。","process":"黄色取自青茅草（刈安），褐色取自红楠树皮，黑色则取自经富含铁质的泥土处理的米槠树皮。丝线反复染色，再织成格纹和条纹。","look":"亮黄、褐色和黑色的格纹或条纹，表面富有光泽。"},"meisen":{"name":"铭仙（印经丝绸）","region":"伊势崎、秩父、足利、桐生、八王子","era":"1910至1930年代盛行","about":"价格亲民的丝绸，在大正至昭和初期把时尚带给了普通女性。其大胆的新艺术和装饰艺术风格设计，如今深受世界各地古着收藏家的喜爱。","process":"经线被松松地临时固定在一起，再用型纸将图案印在上面。织造时拆去临时固定线并织入真正的纬线，因此颜色会略有错位，边缘呈现柔和的晕开效果。","look":"大胆、现代的图案，轮廓如羽毛般柔和并略有错位。"},"jofu":{"name":"上布（精细苎麻布）","region":"越后（新潟）、宫古（冲绳）、近江（滋贺）、能登（石川）","era":"超过1200年","about":"“上等的布”：一种以苎麻纤维织成、极其精细挺括的面料，于盛夏穿着。越后上布和小千谷缩已被列入联合国教科文组织非物质文化遗产名录。","process":"用手将苎麻纤维劈成发丝般细的纤维，再逐根首尾相接。织成后，越后上布会在春季晴天铺在雪地上进行自然漂白。","look":"轻薄、透光而清凉，手感挺括，略似纸张。"},"omeshi":{"name":"御召（织造绉绸）","region":"京都（西阵）、桐生、盐泽","era":"江户时代","about":"一种织造的丝绉，因深受将军德川家齐喜爱而得名：“御召”意为“贵人所穿”。它介于染色和服与织造和服之间，适合较讲究的拜访和聚会。","process":"丝线在织造前先染色。纬线被加以极强的捻度并上浆；织成后，用温水使捻度释放，形成细密的皱纹表面。","look":"挺实的绉绸，带有细微的颗粒质感，能保持形状且不易起皱。"},"chirimen":{"name":"缩缅（丝绉）","region":"丹后（京都）、长滨（滋贺）","era":"16世纪起；丹后自18世纪起","about":"柔软的丝绉，是包括友禅在内大多数染色和服的底布。其皱纹表面上色效果极佳，垂坠感优雅。","process":"纬线每米加捻数千次，左右捻交替使用。织成后将布煮练以去除丝胶，丝线试图回捻，布料随之收缩，形成称为“皱”（shibo）的细小皱纹。","look":"柔软的表面布满细小的凸纹；皱纹大小因种类而异。"},"nishijin":{"name":"西阵织（锦缎）","region":"京都西阵地区","era":"15世纪得名；当地自5–6世纪起即有织造","about":"日本首屈一指的锦缎，因应仁之乱中的“西军阵地”而得名。西阵的织工为皇室、寺院和能剧织造华丽的腰带和织物。","process":"丝线在织造前预先染成数十种颜色，并与金银线搭配使用。1870年代从法国引进了提花织机，而最精细的缀织至今仍以手工完成，用锯齿状的指甲将纬线打紧。","look":"厚重、图案丰富的织物，织入金银线；最常见于正式的腰带。"},"saga-nishiki":{"name":"佐贺锦（纸丝锦缎）","region":"佐贺","era":"江户时代后期","about":"鹿岛藩流传的一种稀有锦缎。相传藩主夫人从天花板上的竹编（网代）图案中获得灵感而创制，此后在府中女眷之间代代相传。最初称为“鹿岛锦”，在1910年日英博览会上更名为“佐贺锦”。","process":"经线由贴有金、银箔或涂漆的细和纸条制成。用小竹刀将纸条逐根挑起，再穿入彩色丝纬线。一天只能织几厘米。","look":"闪亮金色底上细小而精确的几何图案；用于正式腰带、包袋和饰品。"},"hakata":{"name":"博多织","region":"福冈","era":"1241年","about":"由一位在宋代中国学习织造的商人创始。江户时代，当地藩主每年将其进献给将军，因此经典图案被称为“献上”（进献）博多。","process":"大量细经线紧密排列，粗纬线被用力打紧，因此图案主要由经线构成。经典纹样源自佛教法器和条纹。","look":"挺实的腰带，系结时会发出“咻咻”声，且从不松脱。"},"wana":{"name":"轮奈织（毛圈织）","region":"京都","era":"17世纪起","about":"“轮奈”（wana）意为圈。这种织法在表面起出细小的丝圈，与日本制作天鹅绒的技法相同。它为腰带和外套带来柔软而富有雕塑感的浮雕效果。","process":"将细金属丝织入经线下方，把经线挑成圈状，然后抽出金属丝。若保留线圈，便是轮奈织；若剪开线圈，则成为天鹅绒。图案可将剪开与未剪开的线圈混合使用。","look":"由细小线圈构成的凸起天鹅绒般图案，触感柔软。"},"sagara":{"name":"相良绣（打籽绣）","region":"源自中国；在京都及日本各地施作","era":"古老技法","about":"由无数细小结粒构成的刺绣，类似法式结粒绣。它能营造出珠粒般的立体质感，且非常耐用，因此用于点缀和勾边。","process":"将线绕在针上，再穿过布面向下拉，形成一个小结。一个个结粒依次排列，以填满形状或勾画线条。","look":"紧密排列的凸起圆点，宛如细小的珍珠。"},"kinkoma":{"name":"金驹绣（钉金绣）","region":"京都及日本各地","era":"古老技法","about":"金线太硬，无法穿过丝绸，因此将其铺在表面并加以固定。这为轮廓和图案带来醒目而闪亮的金色线条。","process":"将绕在小木轴（驹）上的金线沿图案铺设，通常两根一组，再用细丝线以短间距钉缝固定。","look":"平滑、连续的金色线条浮于布面之上。"},"takeyamachi":{"name":"竹屋町绣（纱地刺绣）","region":"京都竹屋町","era":"江户时代","about":"在稀疏透孔的丝纱上进行的刺绣，以其发源地京都的街道命名。针脚紧贴布料的网格，使成品看起来像是织出来的而非绣出来的。","process":"主要将扁平金线（有时也用彩色丝线）穿过纱上的细小孔眼，逐孔计数，像马赛克一样填满图案。","look":"透明纱上清晰的、如织物般的金色图案；用于腰带、袱纱和挂轴装裱。"},"swatow":{"name":"汕头抽纱刺绣","region":"中国广东汕头","era":"19世纪后期","about":"源自华南的精致抽纱刺绣，融合了中国刺绣与欧洲蕾丝工艺。饰有汕头刺绣的和服作为典雅精致的服装，长久以来深受日本人喜爱。","process":"从布中抽出丝线或剪去小块区域，再用细密针脚锁边和填充开口，形成蕾丝般的图案。全部以手工完成。","look":"同色系、带细小镂空的蕾丝般图案，多为白色或柔和的浅色。"},"suzhou":{"name":"苏绣（苏州丝绣）","region":"中国江苏苏州","era":"超过2000年","about":"中国四大名绣之一，以极致精细而闻名。在和服和腰带上，用于绣制栩栩如生的动物和花卉。","process":"一根丝线被劈成多达数十根发丝般细的丝缕。逐针调和色彩，有些作品绣成两面都呈现完整画面。","look":"如照片般逼真，例如可看清每一根毛的猫。"},"ran":{"name":"乱针绣","region":"中国江苏常州；亦见于和服和腰带","era":"创立于20世纪初（1920–30年代）","about":"一种长短、方向各异的针脚交叉重叠的刺绣，宛如油画的笔触。它能自然地表现毛发、羽毛和光影。","process":"绣者不将针脚整齐并排，而是自由地交叉叠绣，并在每一层中混合色彩，以营造层次与深度。","look":"富有绘画感的表面，呈现柔和的渐变，而非清晰的针脚线条。"},"hitta":{"name":"疋田绞（方点绞染）","region":"京都","era":"17世纪时已高度发达","about":"最奢华的一种绞染。细小的方点沿对角线排列；全身布满疋田绞的和服称为“总疋田”，是奢华的极致。","process":"女匠人捏起一小块布，折成四折，再用线缠绕数圈。每个点都以手工扎结，因此一件满布的振袖可能需要一年或更长时间。","look":"均匀凸起的方点，整齐地排成斜列。"},"kanoko":{"name":"鹿子绞（鹿斑绞染）","region":"京都及日本各地","era":"自古以来","about":"“鹿子”意为小鹿，因为中心带颜色的小白点看起来像幼鹿身上的斑点。它是最广为人知的绞染，见于带扬、和服和饰品。","process":"染色前挑起布上的小点，用线紧紧扎住。染色并解开后，每个点会留下一个带有凸起颗粒质感的环形圆点。","look":"小小的点状圆环，中间有一个带颜色的小“眼”。"},"boshi":{"name":"帽子绞","region":"京都、有松","era":"江户时代","about":"“帽子”（boshi）就是帽子的意思。这种方法通过给图案的大面积区域罩上“帽子”来防止染色，使大朵花卉或圆形得以保持白色。","process":"先沿轮廓缝线并收紧，再像戴帽子一样将内部区域罩住——传统上用竹皮，如今多用塑料薄膜——并在染色前用线扎紧。","look":"大面积的未染色形状，边缘柔和并略带羽毛状。"},"nuishime":{"name":"缝缔绞（缝绞染）","region":"京都、有松·鸣海（名古屋）","era":"至少自室町时代起","about":"一种用平针缝出精确线条和形状的绞染方法。它能做出比单纯扎结自由得多的形状。","process":"用细小的平针缝出图案，再将线拉紧，使布料聚拢成褶。折叠的部分会防染，留下点线状的轮廓。","look":"由一排排细小短线构成的清晰轮廓。"},"arashi":{"name":"岚绞（缠杆绞染）","region":"有松·鸣海（名古屋）","era":"19世纪后期","about":"“岚”意为风暴：斜线看起来就像被风吹斜的雨。它是日本最大的绞染之乡有松的经典技法，常用于浴衣。","process":"将布斜着缠绕在长杆上，用线扎紧，再向下推挤成紧密的褶皱。只有外侧的凸棱会着色。","look":"细密的斜线，宛如斜飘的雨丝。"},"tatsumaki":{"name":"龙卷绞（旋风绞染）","region":"有松·鸣海（名古屋）、京都","era":"传统技法","about":"“龙卷”意为龙卷风。将线呈螺旋状缠绕在布上，使图案仿佛卷入旋风般扭转。","process":"将布料（通常先经缝线或打褶）围绕芯材收拢成长圆棒状，染色前用线自上而下螺旋缠绕。只有外露的表面会着色，留下螺旋状条纹。","look":"旋转的螺旋条纹，富有强烈的动感。"},"yanagi":{"name":"柳绞（柳枝绞染）","region":"有松·鸣海（名古屋）","era":"江户时代","about":"“柳”即柳树。图案看起来像在微风中摇曳的柳枝，是夏季浴衣的热门选择。","process":"将布纵向收成窄褶，并按一定间隔用线扎紧。褶皱处防染，留下细而断续的竖线。","look":"柔和的竖线，宛如低垂的柳枝。"},"oke":{"name":"桶绞（桶染）","region":"京都","era":"京都的传统技法","about":"“桶”即木桶。这种稀有技法通过将布料的大部分封入木桶中保持干燥，使一件和服上能呈现大面积的不同颜色。如今仍能施作的匠人寥寥无几。","process":"将要保留不染的部分塞进桧木桶，把布夹在中间，盖紧桶盖并用绳捆牢，要染色的部分则留在桶外。然后将整个木桶浸入更大的染缸中。每种颜色都要重复一次。","look":"大块醒目的不同色块，边界清晰而略带柔和。"},"itajime":{"name":"板缔染（夹板染）","region":"有松、京都等地","era":"8世纪起","about":"日本最古老的防染技法之一；其前身夹缬（用雕刻木板夹住布料染色）留存于8世纪的正仓院宝库中。将折叠的布夹在木板之间，形成重复的图案。","process":"将布折成三角形或正方形，紧夹在木板之间，然后浸入染液。被遮住的部分保持白色，形成对称的图案。","look":"重复的几何形状，例如称为“雪花”（sekka）的雪晶状纹样。"},"tsukami":{"name":"抓绞（随手绞染）","region":"各地绞染产地","era":"传统技法","about":"“抓”（tsukami）即抓取之意。将一把把布料抓起扎住，因此每件作品都各不相同。呈现自由、自然的效果。","process":"匠人抓起布料，扭成不规则的团状，在染色前用线扎紧。随机的褶皱会形成难以预料的图案。","look":"不规则、如云朵或大理石般的图案，没有重复。"},"kumihimo":{"name":"组纽（丝绳编织）","region":"京都、伊贺（三重）","era":"7–8世纪起","about":"编织的丝绳，最初用于佛具和宫廷服饰，后来也用于武士铠甲和刀绪。如今最为人熟知的是带缔，即系在腰带中间的绳子。","process":"将数十根丝线绕在带重量的线轴上，在圆台（丸台）等木制编台上彼此交叉。不同的编台和手法可编出圆形、方形或扁平的绳子。","look":"紧实均匀的编绳，带有细密的斜纹和丰富的配色。"},"zogan":{"name":"象嵌（金属镶嵌）","region":"京都、熊本（肥后）","era":"江户时代盛行于刀装具和枪炮装饰","about":"将金银镶嵌于铁上的工艺。过去用于装饰刀装具，如今用于带留（腰带饰扣）和发饰等和服配饰。","process":"在铁的表面刻出细密的交叉网状沟槽。将金、银箔和金属丝锤入沟槽中，再刻意使铁生锈，并以漆或油烘烤成深黑色。","look":"深黑底色上闪耀的金银图案。"},"makie":{"name":"莳绘（金漆）","region":"京都、轮岛、金泽等地","era":"8–9世纪起","about":"一种漆艺，用漆描绘图案，再撒上金粉或银粉。在和服世界中，见于梳子、发簪、带留和木屐。","process":"用漆描绘图案，在漆未干之前，通过竹管撒上细金粉或银粉。随后再多次罩漆和打磨。","look":"黑漆或朱漆上精致的金色图画，光泽深邃。"},"mizuhiki":{"name":"水引（纸绳）","region":"饭田（长野）、金泽（石川）","era":"起源可追溯至7世纪","about":"用捻制的和纸做成的装饰绳，打成寄托吉祥祝愿的绳结。它们用于装饰礼金袋；在和服造型中，则用于新娘发饰和腰带装饰。","process":"将和纸捻成细绳，用浆糊使其变硬，再染色或包裹彩色或金属色薄膜。绳子被打成淡路结等绳结，或塑造成鹤、松、梅等形状。","look":"光亮挺硬的绳子打成对称的结，常为红白或金银配色。"},"ro":{"name":"絽（条纹透孔夏季纱罗）","region":"京都及其他丝织产地","era":"15世纪已见其名；江户时代起普及","about":"一种夏季丝织物，整齐排列着一行行细小的孔隙，可以透风。它是最炎热的几个月里——从初夏到夏末——正装与日常和服的经典面料。","process":"先织数行平纹，再将经线两两相互绞缠织一行，留下一排孔隙。孔隙之间平纹的行数决定了“三本絽”“五本絽”等名称。","look":"在原本密实的丝绸上，横向（有时为纵向）排列着细密的小孔线条。"},"sha":{"name":"纱（全绞透孔丝绸）","region":"京都及其他丝织产地","era":"7至8世纪自中国传入","about":"一种轻薄透明的丝绸，于盛夏穿着。它比絽更轻、更透，也用于夏季的羽织和穿在和服外的外套。","process":"每一行都将经线两两相互绞缠，并由纬线固定。由此在整块布上形成均匀、通透的网眼。","look":"均匀、透薄的网眼，没有密实的条纹；里层的衣物柔和地透出来。"},"ra":{"name":"罗（网状复杂绞织）","region":"京都","era":"古代（7至8世纪）；20世纪复原","about":"绞织中历史最悠久、也最复杂的一种，8世纪的正仓院宝库中留存有实物。这项技艺在中世以后于日本逐渐衰落，后由近代名匠复原。如今主要见于华贵的夏季腰带。","process":"每根经线不只与一根固定的经线绞缠，而是交叉与相邻的多根经线绞缠，使线形成网状。它在专用织机上以手工缓慢织成。","look":"富有弹性的网状织物，带有菱形孔隙，网中常浮现出图案。"},"kobai":{"name":"红梅织（格纹凹凸夏布）","region":"日本各地的棉织和丝织产地","era":"传统夏季面料","about":"一种带有凸起格子纹理的夏季面料，有棉制（棉红梅）和丝中织入棉（绢红梅）两种。它是高级浴衣和休闲夏季和服的热门之选。","process":"在轻薄的底布中，按固定间隔纵横织入较粗的线。这些粗线形成凸起的方格。","look":"轻薄的布料上有凸起线条组成的格纹；这些凸棱使布料不会贴在皮肤上。"},"rokechi":{"name":"蜡缬染（蜡防染）","region":"京都及日本各地","era":"8世纪；20世纪复兴","about":"奈良时代三种古老防染技法之一，正仓院宝库中保存有其实例。它在平安时代逐渐失传，20世纪由艺术家们复兴，使其成为一种自由、富有绘画感的染色形式。","process":"将熔化的蜡刷涂或压印在布上不需要上色的地方，然后将布染色。之后用热力或热水除去蜡。蜡出现裂纹的地方，染料会渗入，留下细线。","look":"大胆的形状，其间贯穿着细密如蛛网般的冰裂纹线条。"},"mokuhan":{"name":"木版染（木版印花）","region":"京都及其他地区","era":"源远流长","about":"一种将雕刻在木版上的图案压印到布上的印染技法。每一次印压都带有匠人的手感，细微的差异赋予布料温暖的手作气息。如今仍从事这项技艺的工坊已寥寥无几。","process":"在硬木版上雕刻图案。在木版上涂上染料或色浆，然后一次一印，用力压在绷紧的布上。每种颜色使用一块单独的木版。","look":"重复的纹样，颜色略带不均、边缘柔和，并隐约透出木纹的质感。"},"chusen":{"name":"注染（浇注染色）","region":"大阪（堺）、滨松（静冈县）、东京","era":"19世纪后期（明治时代）","about":"一种日本的染色方法，用于棉质浴衣和手拭巾。染料完全渗透布料，因此两面颜色相同，色彩显得柔和而清新。","process":"将布来回折叠成许多层，每一层都透过型纸涂上防染糊。在每个区域周围用糊筑起围墙，从壶中注入染料，再从下方抽吸，使染料一次穿透所有布层。","look":"柔和、略带晕染的色彩，温和的渐变，背面也清晰可见相同的图案。"},"bingata":{"name":"红型（冲绳型染）","region":"冲绳","era":"琉球王国时代（约15世纪起）","about":"冲绳色彩鲜艳的染色艺术，曾为琉球王国的王族与贵族所穿着。明亮的色彩以及融合日本与南方海洋的纹样，赋予它欢快的南国风情。","process":"将图案刻在纸型上，透过纸型涂上米糊。用刷子将矿物颜料和植物染料刷入各个区域，再在边缘刷擦上较深的色调（隈取），以增加立体感。只用蓝靛染成的版本称为“蓝型”。","look":"明亮的黄、红、蓝色，边缘带有晕色，纹样有花、鸟、波浪与云等。"},"aizome":{"name":"蓝染（蓝靛染色）","region":"德岛（阿波）及日本各地","era":"古代；江户时代广泛普及","about":"蓝靛是日本最常见的染料，从农民的工作服到和服无所不用。明治时代的外国访客对它印象深刻，这种颜色因而被称为“日本蓝”（Japan Blue）。","process":"将蓼蓝叶堆积发酵制成“蒅”（sukumo），再放入染缸中，加入木灰碱水、麦麸和石灰进行发酵。布料一次又一次浸入再提起：出缸时呈绿色，接触空气后转为蓝色。浸染次数越多，颜色越深。","look":"深邃而有生命力的蓝色，从淡淡的天蓝到近乎黑色，随着穿着而变得柔和美丽。"},"lace":{"name":"蕾丝","region":"发展于欧洲；日本及世界各地均有制作","era":"欧洲蕾丝始于16世纪；明治至大正时代起用于和服","about":"蕾丝是仅由丝线构成的镂空织物。在当今的和服时尚中，蕾丝和服、羽织和腰带很受欢迎，常叠穿在有色和服之上，让底色透出来。","process":"和服用的蕾丝大多以刺绣机制作。图案绣在细网上（网纱蕾丝），或绣在之后会被溶解的底布上，只留下绣线（化学蕾丝）。","look":"由丝线构成的透明花卉或几何图案，底下的颜色从镂空处透出。"},"tsuzure":{"name":"缀织（挂毯织）","region":"京都（西阵）","era":"日本存有8世纪的实例（可能自中国传入）；18世纪（江户时代）起于西阵织造","about":"日本的挂毯织法，与欧洲的戈布兰挂毯同属一类。被视为最高等级的腰带，最精美的作品由织工用指甲手工织成。","process":"每种颜色的纬线只在图案中属于自己的区域内来回穿梭，将经线完全遮盖。织工把指甲锉成锯齿状，用它把每根纬线推紧到位。一天只能织几厘米。","look":"紧实平整的织物，正反两面图案相同，两种颜色相接处有细小的缝隙。"},"benibana":{"name":"红花染（红花染色）","region":"山形（最上）及京都","era":"约6至7世纪经丝绸之路传入","about":"用红花花瓣制成的天然红色染料，深受平安朝宫廷喜爱。江户时代它极为珍贵，有“红一份，金一份”之说。传统上用于和服的红色绢里衬（红绢，momi）。","process":"先用水洗去花瓣中大部分黄色色素，再将其发酵并压制成“红饼”（beni-mochi）。用草木灰碱水萃取出红色，并以乌梅醋固着于丝绸上。反复染色可使颜色加深。","look":"从清澈明亮的粉红到深沉的绯红；颜色娇嫩，遇强光易褪色。"}}},"yue":{"ui":{"tagline":"和服背後嘅工藝——日本50種傳統技法","all":"全部","search":"搜尋技法…","region":"產地","era":"起源","about":"簡介","process":"點樣製作","look":"點樣辨認","listen":"聽日文名稱","close":"關閉","language":"語言","count":"{n} 種技法","noResults":"搵唔到符合搜尋條件嘅技法。","prev":"上一個","next":"下一個","intro":"一件和服要經過好多道工序先完成，每道工序都有各自嘅師傅。揀一個類別，或者撳任何一種技法了解更多。"},"cats":{"dye":{"name":"染色","desc":"喺織好嘅白色絲綢上手繪、型染或印染圖案。染色和服一般屬於較正式嘅類型，用於典禮同喜慶場合。"},"weave":{"name":"織造","desc":"先將絲線染色，圖案喺織布過程中逐漸顯現。紬等織造和服被視為講究嘅日常服裝而備受珍視，而織造嘅腰帶則可以係最正式嘅一種。"},"embroidery":{"name":"刺繡","desc":"用絲線同金屬線以人手繡喺布料上，增添質感、光澤同層次。正式和服上經常將刺繡同染色結合使用。"},"shibori":{"name":"絞染（紮染）","desc":"將布料部分位置紮緊、縫縮、摺疊或夾住，令染料滲唔入去。拆走啲線之後，圖案就會出現，並帶有柔和嘅立體質感。"},"other":{"name":"配飾工藝","desc":"和服要配上繩帶、飾物同裝飾先算完整，呢啲由其他傳統行業嘅師傅製作：編繩師、金工師、漆藝師同紙繩師傅。"}},"items":{"kaga-yuzen":{"name":"加賀友禪（手繪絲綢）","region":"石川縣金澤","era":"18世紀初","about":"源自舊加賀藩嘅手繪染色風格。以「加賀五彩」描繪寫實嘅花草而聞名：靛藍、胭脂紅、黃土色、草綠同古紫。","process":"先用幼細嘅米糊線勾勒圖案輪廓，防止顏色化開。之後用毛筆為各個位置上色，暈染由外緣向中心過渡。通常由一位師傅統籌整件作品。","look":"自然、富繪畫感嘅圖案，有時會畫出「蟲蛀」嘅葉（蟲喰）。好少或完全唔用金箔同刺繡。"},"kyo-yuzen":{"name":"京友禪（手繪絲綢）","region":"京都","era":"17世紀末","about":"最早嘅友禪風格，以京都扇面畫師宮崎友禪齋命名。佢為和服帶來如繪畫般自由嘅設計，並成為正式禮服嘅經典風格。","process":"成個工藝分成大約二十道工序，每道由專業師傅負責：設計、勾勒輪廓、塗上米糊防染、掃色、蒸製、水洗，最後加上金箔同刺繡。","look":"典雅嘅宮廷風圖案，色彩濃麗，由中心向外暈染，經常以金箔同刺繡收尾。"},"edo-komon":{"name":"江戶小紋（細紋型染）","region":"東京","era":"17世紀（江戶時代）","about":"以單色染出嘅細小重複圖案，細密到遠望似素色布料。佢源自武士嘅禮服，每位大名都有自己專用嘅紋樣。","process":"圖案雕刻喺以柿漆加固嘅多層和紙型紙上。師傅將型紙鋪喺絲綢上，透過型紙刮上米糊，再精準對位移動型紙，最後將成塊布染色。","look":"近睇：成千上萬嘅細小圓點、波紋或線條。退後幾步睇：一種沉靜嘅素色。"},"tsujigahana":{"name":"辻之花（縫絞染）","region":"京都及其他地區","era":"15世紀–17世紀初","about":"室町同桃山時代嘅奢華風格，將縫絞染同墨繪、金箔及刺繡結合。佢喺17世紀初消失，後來被稱為「幻之染」。","process":"沿圖案輪廓縫線再收緊，令染料滲唔入去，布料分幾個階段染色。之後再用墨描繪葉脈等細節。20世紀，現代藝術家令呢種風格重現。","look":"柔和、略帶朦朧嘅形狀，邊緣有皺褶，配上纖細嘅墨繪。"},"sarasa":{"name":"更紗（異國印花圖案）","region":"源自印度；喺長崎、堺、京都同江戶製作","era":"16–17世紀","about":"經對外貿易傳入嘅印度及東南亞彩色花紋棉布。佢充滿異國風情嘅花鳥同幾何圖案備受珍愛，日本師傅好快就做出自己嘅版本。","process":"喺印度，圖案係用媒染劑同蠟手繪或木版印製。日本嘅「和更紗」通常用多張型紙，每種顏色一張，逐一印染。","look":"密集、富異國情調嘅花卉及類似佩斯利嘅圖案，色調為泥紅、靛藍同啡色。"},"kinsai":{"name":"金彩（金箔裝飾）","region":"京都","era":"歷史悠久；16世紀盛行","about":"用真金真銀裝飾成品和服嘅工藝。通常係友禪染正式和服嘅最後點綴，為花卉、雲紋同輪廓增添光彩。","process":"透過型紙塗上黏合劑，或用幼細錐形筒描繪，再壓上金箔，並掃走唔需要留低嘅部分。金亦可以撒成細小金片，或用金泥描成線條。","look":"染色圖案之上閃耀嘅金銀細節，隨穿著者嘅動作而閃爍。"},"oshima":{"name":"大島紬（泥染紬）","region":"鹿兒島縣奄美大島","era":"超過1,300年歷史","about":"日本最著名嘅和服布料之一。佢深邃而有光澤嘅黑啡色，來自先用當地樹木、再用富含鐵質嘅泥土為絲線染色。佢輕盈順滑，幾乎唔會起皺。","process":"先將絲線緊密織成臨時嘅蓆狀物以預留圖案。呢塊蓆用車輪梅樹皮染幾十次，再進行泥染，然後拆開，將絲線逐條重新織造，以人手對準每一粒細小嘅點。","look":"深色、絲滑嘅表面，帶有由細小十字組成嘅極精細幾何圖案。"},"yuki":{"name":"結城紬（手紡紬）","region":"茨城縣結城市及栃木縣小山市","era":"起源於奈良時代（8世紀）或更早；17世紀起聞名","about":"2010年被聯合國教科文組織列入非物質文化遺產名錄。據說係最奢華嘅便裝和服，溫暖輕盈，越著越柔軟。","process":"以人手從絲綿紡出不加捻嘅絲線。圖案線以人手紮結、染色，再喺腰機上織造，由織工自己嘅身體拉緊經線。一匹布可能要幾個月至一年以上。","look":"柔軟、略帶不均勻嘅質感，加上啞光而溫和嘅光澤。"},"ushikubi":{"name":"牛首紬（雙宮繭紬）","region":"石川縣白山市","era":"超過800年","about":"產自山村嘅罕有紬，以兩條蠶一齊結成嘅「雙宮繭」製成。佢極之堅韌，因而有「拔釘紬」之稱：勾到釘時，布唔會撕爛，反而會將口釘拔出嚟。","process":"直接從熱水中嘅雙宮繭抽絲，令絲線帶有天然粗節。先織成白布，之後經常再染色，甚至加上友禪手繪。","look":"結實嘅絲綢，帶有細小天然結節同沉靜溫潤嘅光澤。"},"kihachijo":{"name":"黃八丈（島上黃色絲綢）","region":"東京都八丈島","era":"室町時代起已有記載；盛行於江戶時代","about":"喺偏遠海島上織造嘅絲綢，只用取自島上植物嘅三種天然顏色：金黃、鏽啡同黑色。佢曾經喺江戶町人之間流行一時。","process":"黃色取自青茅草（刈安），啡色取自紅楠樹皮，黑色則取自經富含鐵質泥土處理嘅米櫧樹皮。絲線反覆染色，再織成格紋同條紋。","look":"鮮黃、啡色同黑色嘅格紋或條紋，表面富光澤。"},"meisen":{"name":"銘仙（印經絲綢）","region":"伊勢崎、秩父、足利、桐生、八王子","era":"1910至1930年代盛行","about":"價錢親民嘅絲綢，喺大正至昭和初期將時尚帶畀普通女性。佢大膽嘅新藝術同裝飾藝術風格設計，而家深受世界各地古著收藏家喜愛。","process":"經線被鬆鬆咁臨時固定埋一齊，再用型紙將圖案印上去。織造時拆走臨時固定線並織入真正嘅緯線，所以顏色會略有錯位，邊緣呈現柔和嘅朦朧效果。","look":"大膽、現代嘅圖案，輪廓如羽毛般柔和並略有錯位。"},"jofu":{"name":"上布（精細苧麻布）","region":"越後（新潟）、宮古（沖繩）、近江（滋賀）、能登（石川）","era":"超過1,200年","about":"「上等嘅布」：一種以苧麻纖維織成、極精細挺身嘅布料，喺盛夏穿著。越後上布同小千谷縮已列入聯合國教科文組織非物質文化遺產名錄。","process":"用手將苧麻纖維撕成髮絲般幼嘅纖維，再逐條首尾駁埋。織好之後，越後上布會喺春天晴朗嘅日子鋪喺雪地上自然漂白。","look":"輕薄、透光又清涼，手感挺身，略似紙張。"},"omeshi":{"name":"御召（織造縐綢）","region":"京都（西陣）、桐生、鹽澤","era":"江戶時代","about":"一種織造嘅絲縐，因深受將軍德川家齊喜愛而得名：「御召」意思係「貴人所穿」。佢介乎染色和服同織造和服之間，適合較講究嘅拜訪同聚會。","process":"絲線喺織造前先染色。緯線加上極強嘅捻度並上漿；織好之後，用溫水令捻度釋放，形成細密嘅皺紋表面。","look":"挺實嘅縐綢，帶有細微嘅顆粒質感，能保持形狀又唔易起皺。"},"chirimen":{"name":"縮緬（絲縐）","region":"丹後（京都）、長濱（滋賀）","era":"16世紀起；丹後自18世紀起","about":"柔軟嘅絲縐，係包括友禪在內大多數染色和服嘅底布。佢嘅皺紋表面上色效果極佳，垂墜感優雅。","process":"緯線每米加捻幾千次，左右捻交替使用。織好之後將布煮練去除絲膠，絲線想回捻，布料隨之收縮，形成叫做「皺」（shibo）嘅細小皺紋。","look":"柔軟嘅表面佈滿細小凸紋；皺紋大小因種類而異。"},"nishijin":{"name":"西陣織（錦緞）","region":"京都西陣地區","era":"15世紀得名；當地自5–6世紀起已有織造","about":"日本首屈一指嘅錦緞，因應仁之亂中嘅「西軍陣地」而得名。西陣織工為皇室、寺院同能劇織造華麗嘅腰帶同布料。","process":"絲線喺織造前預先染成幾十種顏色，再同金銀線配合使用。1870年代從法國引入提花織機，而最精細嘅綴織至今仍以人手完成，用鋸齒狀嘅指甲將緯線打緊。","look":"厚重、圖案豐富嘅布料，織入金銀線；最常見於正式腰帶。"},"saga-nishiki":{"name":"佐賀錦（紙絲錦緞）","region":"佐賀","era":"江戶時代後期","about":"鹿島藩流傳嘅一種罕有錦緞。相傳藩主夫人從天花板上嘅竹編（網代）圖案得到靈感而創製，之後喺府中女眷之間代代相傳。最初叫「鹿島錦」，喺1910年日英博覽會上改名為「佐賀錦」。","process":"經線由貼上金、銀箔或塗漆嘅幼和紙條製成。用細竹刀將紙條逐條挑起，再穿入彩色絲緯線。一日只可以織幾厘米。","look":"閃亮金色底上細小而精確嘅幾何圖案；用於正式腰帶、手袋同飾物。"},"hakata":{"name":"博多織","region":"福岡","era":"1241年","about":"由一位喺宋代中國學習織造嘅商人創始。江戶時代，當地藩主每年將佢進獻畀將軍，所以經典圖案叫做「獻上」（進獻）博多。","process":"大量幼經線緊密排列，粗緯線用力打緊，所以圖案主要由經線構成。經典紋樣源自佛教法器同條紋。","look":"挺實嘅腰帶，綁嘅時候會發出「咻咻」聲，而且永不鬆脫。"},"wana":{"name":"輪奈織（毛圈織）","region":"京都","era":"17世紀起","about":"「輪奈」（wana）意思係圈。呢種織法喺表面起出細小絲圈，同日本製作天鵝絨嘅技法一樣。佢為腰帶同外套帶來柔軟而富雕塑感嘅浮雕效果。","process":"將幼金屬線織入經線下面，將經線挑成圈狀，然後抽走金屬線。如果保留線圈，就係輪奈織；如果剪開線圈，就變成天鵝絨。圖案可以混合剪開同未剪開嘅線圈。","look":"由細小線圈構成嘅凸起天鵝絨般圖案，摸落柔軟。"},"sagara":{"name":"相良繡（打籽繡）","region":"源自中國；喺京都及日本各地施作","era":"古老技法","about":"由無數細小結粒構成嘅刺繡，類似法式結粒繡。佢營造出珠粒般嘅立體質感，而且非常耐用，所以用於點綴同勾邊。","process":"將線繞喺針上，再穿過布面向下拉，形成一粒小結。一粒粒結逐一排列，填滿形狀或勾畫線條。","look":"緊密排列嘅凸起圓點，好似細小珍珠。"},"kinkoma":{"name":"金駒繡（釘金繡）","region":"京都及日本各地","era":"古老技法","about":"金線太硬，穿唔過絲綢，所以將佢鋪喺表面再加以固定。咁樣令輪廓同圖案有醒目閃亮嘅金色線條。","process":"將繞喺細木軸（駒）上嘅金線沿圖案鋪設，通常兩條一組，再用幼絲線以短間距釘縫固定。","look":"平滑、連續嘅金色線條浮喺布面之上。"},"takeyamachi":{"name":"竹屋町繡（紗地刺繡）","region":"京都竹屋町","era":"江戶時代","about":"喺稀疏透孔嘅絲紗上進行嘅刺繡，以佢發源地京都嘅街道命名。針步緊貼布料嘅網格，令成品睇落似織出嚟而唔似繡出嚟。","process":"主要將扁平金線（有時亦會用彩色絲線）穿過紗上細小嘅孔，逐個孔數，好似馬賽克咁填滿圖案。","look":"透明紗上清晰、好似織出嚟咁嘅金色圖案；用於腰帶、袱紗同掛軸裝裱。"},"swatow":{"name":"汕頭抽紗刺繡","region":"中國廣東汕頭","era":"19世紀後期","about":"源自華南嘅精緻抽紗刺繡，融合中國刺繡同歐洲蕾絲工藝。飾有汕頭刺繡嘅和服作為典雅精緻嘅服裝，一直深受日本人喜愛。","process":"從布中抽走絲線或剪走細小位置，再用細密針步鎖邊同填充開口，形成蕾絲般嘅圖案。全部以人手完成。","look":"同色系、帶細小鏤空嘅蕾絲般圖案，多數係白色或柔和淺色。"},"suzhou":{"name":"蘇繡（蘇州絲繡）","region":"中國江蘇蘇州","era":"超過2,000年","about":"中國四大名繡之一，以極致精細而聞名。喺和服同腰帶上，用嚟繡栩栩如生嘅動物同花卉。","process":"一條絲線被分成多達幾十條髮絲般幼嘅絲縷。逐針調和色彩，有啲作品繡到兩面都呈現完整畫面。","look":"好似相片咁逼真，例如睇得清每一條毛嘅貓。"},"ran":{"name":"亂針繡","region":"中國江蘇常州；亦見於和服同腰帶","era":"創立於20世紀初（1920–30年代）","about":"一種長短、方向各異嘅針步交叉重疊嘅刺繡，好似油畫嘅筆觸。佢能夠自然表現毛髮、羽毛同光影。","process":"繡者唔係將針步整齊並排，而係自由咁交叉疊繡，並喺每一層混合色彩，營造層次同深度。","look":"富繪畫感嘅表面，呈現柔和漸變，而唔係清晰嘅針步線條。"},"hitta":{"name":"疋田絞（方點絞染）","region":"京都","era":"17世紀時已高度發達","about":"最奢華嘅一種絞染。細小方點沿對角線排列；全身佈滿疋田絞嘅和服叫做「總疋田」，係奢華嘅極致。","process":"女師傅捏起一小撮布，摺成四摺，再用線纏繞幾圈。每粒點都以人手紮結，所以一件滿佈嘅振袖可能要一年或更長時間。","look":"均勻凸起嘅方點，整齊排成斜行。"},"kanoko":{"name":"鹿子絞（鹿斑絞染）","region":"京都及日本各地","era":"自古以來","about":"「鹿子」意思係小鹿，因為中心帶顏色嘅細白點睇落似幼鹿身上嘅斑點。佢係最廣為人知嘅絞染，見於帶揚、和服同飾物。","process":"染色前挑起布上嘅細點，用線紮實。染色並解開之後，每粒點會留低一個帶凸起顆粒質感嘅環形圓點。","look":"細細嘅點狀圓環，中間有一隻帶顏色嘅細「眼」。"},"boshi":{"name":"帽子絞","region":"京都、有松","era":"江戶時代","about":"「帽子」意思係帽。呢種方法透過為圖案嘅大面積位置罩上「帽」嚟防止染色，令大朵花卉或圓形可以保持白色。","process":"先沿輪廓縫線並收緊，再好似戴帽咁將內部位置罩住——傳統用竹皮，而家多數用膠膜——並喺染色前用線紮實。","look":"大面積未染色嘅形狀，邊緣柔和並略帶羽毛狀。"},"nuishime":{"name":"縫締絞（縫絞染）","region":"京都、有松・鳴海（名古屋）","era":"最遲自室町時代起","about":"一種用平針縫出精確線條同形狀嘅絞染方法。佢可以做出比單純紮結自由得多嘅形狀。","process":"用細小平針縫出圖案，再將線拉緊，令布料聚攏成褶。摺疊嘅部分會防染，留低點線狀嘅輪廓。","look":"由一排排細小短線構成嘅清晰輪廓。"},"arashi":{"name":"嵐絞（纏桿絞染）","region":"有松・鳴海（名古屋）","era":"19世紀後期","about":"「嵐」意思係風暴：斜線睇落好似被風吹斜嘅雨。佢係日本最大絞染之鄉有松嘅經典技法，常用於浴衣。","process":"將布斜斜咁纏喺長桿上，用線紮實，再向下推擠成緊密嘅褶。只有外側凸起嘅位置會上色。","look":"幼細嘅斜線，好似斜飄嘅雨絲。"},"tatsumaki":{"name":"龍卷絞（旋風絞染）","region":"有松・鳴海（名古屋）、京都","era":"傳統技法","about":"「龍卷」意思係龍捲風。將線以螺旋狀纏繞喺布上，令圖案好似捲入旋風咁扭轉。","process":"將布料（通常先經縫線或打褶）圍住芯材收攏成長圓棒狀，染色前用線由上至下螺旋纏繞。只有外露嘅表面會上色，留低螺旋狀條紋。","look":"旋轉嘅螺旋條紋，充滿動感。"},"yanagi":{"name":"柳絞（柳枝絞染）","region":"有松・鳴海（名古屋）","era":"江戶時代","about":"「柳」即係柳樹。圖案睇落好似喺微風中搖曳嘅柳枝，係夏季浴衣嘅熱門之選。","process":"將布縱向收成窄褶，並按一定間隔用線紮實。褶位防染，留低幼細而斷續嘅直線。","look":"柔和嘅直線，好似低垂嘅柳枝。"},"oke":{"name":"桶絞（桶染）","region":"京都","era":"京都嘅傳統技法","about":"「桶」即係木桶。呢種罕有技法透過將布料大部分封入木桶保持乾爽，令一件和服上可以有大面積嘅不同顏色。而家仲識做嘅師傅寥寥可數。","process":"將要保留唔染嘅部分塞入檜木桶，將布夾喺中間，蓋實桶蓋再用繩綁緊，要染色嘅部分就留喺桶外。然後將成個木桶浸入更大嘅染缸。每種顏色都要重複一次。","look":"大塊醒目嘅不同色塊，邊界清晰而略帶柔和。"},"itajime":{"name":"板締染（夾板染）","region":"有松、京都等地","era":"8世紀起","about":"日本最古老嘅防染技法之一；佢嘅前身夾纈（用雕刻木板夾住布料染色）留存喺8世紀嘅正倉院寶庫。將摺疊嘅布夾喺木板之間，形成重複圖案。","process":"將布摺成三角形或正方形，緊緊夾喺木板之間，然後浸入染液。被遮住嘅部分保持白色，形成對稱圖案。","look":"重複嘅幾何形狀，例如叫做「雪華」（sekka）嘅雪花狀圖案。"},"tsukami":{"name":"抓絞（隨手絞染）","region":"各地絞染產地","era":"傳統技法","about":"「抓」（tsukami）即係抓。將一把把布料抓起紮實，所以每件作品都唔一樣。呈現自由、自然嘅效果。","process":"師傅抓起布料，扭成不規則嘅團狀，喺染色前用線紮實。隨機嘅褶會形成難以預計嘅圖案。","look":"不規則、好似雲朵或雲石嘅圖案，冇重複。"},"kumihimo":{"name":"組紐（絲繩編織）","region":"京都、伊賀（三重）","era":"7–8世紀起","about":"編織嘅絲繩，最初用於佛具同宮廷服飾，後來亦用於武士盔甲同刀緒。而家最為人熟悉嘅係帶締，即係綁喺腰帶中間嘅繩。","process":"將幾十條絲線繞喺有重量嘅線轆上，喺圓台（丸台）等木製編台上互相交叉。唔同嘅編台同手法可以編出圓形、方形或扁平嘅繩。","look":"緊實均勻嘅編繩，帶有細密斜紋同豐富配色。"},"zogan":{"name":"象嵌（金屬鑲嵌）","region":"京都、熊本（肥後）","era":"江戶時代盛行於刀裝具同槍炮裝飾","about":"將金銀鑲嵌喺鐵上嘅工藝。以前用嚟裝飾刀裝具，而家用於帶留（腰帶飾扣）同髮飾等和服配飾。","process":"喺鐵嘅表面刻出細密交叉網狀坑紋。將金、銀箔同金屬線錘入坑紋，再刻意令鐵生鏽，並用漆或油烘成深黑色。","look":"深黑底色上閃耀嘅金銀圖案。"},"makie":{"name":"蒔繪（金漆）","region":"京都、輪島、金澤等地","era":"8–9世紀起","about":"一種漆藝，用漆描繪圖案，再撒上金粉或銀粉。喺和服世界，見於梳、髮簪、帶留同木屐。","process":"用漆描繪圖案，趁漆未乾，透過竹管撒上幼細金粉或銀粉。之後再多次罩漆同打磨。","look":"黑漆或朱漆上精緻嘅金色圖畫，光澤深邃。"},"mizuhiki":{"name":"水引（紙繩）","region":"飯田（長野）、金澤（石川）","era":"起源可追溯至7世紀","about":"用捻製嘅和紙做成嘅裝飾繩，打成寄託吉祥祝願嘅繩結。佢哋用嚟裝飾禮金封；喺和服造型中，就用於新娘髮飾同腰帶裝飾。","process":"將和紙捻成幼繩，用漿糊令佢變硬，再染色或者包上彩色或金屬色薄膜。繩會打成淡路結等繩結，或者造成鶴、松、梅等形狀。","look":"光亮挺硬嘅繩打成對稱嘅結，多數係紅白或金銀配色。"},"ro":{"name":"絽（條紋透孔夏季紗羅）","region":"京都及其他絲織產地","era":"15世紀已見其名；江戶時代起普及","about":"一種夏季絲織物，整齊排列住一行行細小嘅孔隙，可以透風。佢係最炎熱嘅幾個月——由初夏到夏末——正裝同日常和服嘅經典布料。","process":"先織幾行平紋，再將經線兩兩互相絞纏織一行，留低一排孔隙。孔隙之間平紋嘅行數決定咗「三本絽」「五本絽」等名稱。","look":"喺原本密實嘅絲綢上，橫向（有時係直向）排列住細密嘅小孔線條。"},"sha":{"name":"紗（全絞透孔絲綢）","region":"京都及其他絲織產地","era":"7至8世紀由中國傳入","about":"一種輕薄透明嘅絲綢，喺盛夏穿著。佢比絽更輕、更透，亦用於夏季嘅羽織同穿喺和服外面嘅外套。","process":"每一行都將經線兩兩互相絞纏，再由緯線固定。咁樣喺成塊布上形成均勻、通透嘅網眼。","look":"均勻、透薄嘅網眼，冇密實嘅條紋；裏層嘅衣物柔和咁透出嚟。"},"ra":{"name":"羅（網狀複雜絞織）","region":"京都","era":"古代（7至8世紀）；20世紀復原","about":"絞織之中歷史最悠久、亦最複雜嘅一種，8世紀嘅正倉院寶庫留有實物。呢項技藝喺中世之後喺日本逐漸衰落，後來由近代名匠復原。而家主要見於華貴嘅夏季腰帶。","process":"每條經線唔只同一條固定嘅經線絞纏，而係交叉同相鄰嘅幾條經線絞纏，令線形成網狀。佢喺專用織機上以手工慢慢織成。","look":"富有彈性嘅網狀織物，帶有菱形孔隙，網中經常浮現出圖案。"},"kobai":{"name":"紅梅織（格紋凹凸夏布）","region":"日本各地嘅棉織同絲織產地","era":"傳統夏季布料","about":"一種帶有凸起格仔紋理嘅夏季布料，有棉製（綿紅梅）同絲中織入棉（絹紅梅）兩種。佢係高級浴衣同休閒夏季和服嘅熱門之選。","process":"喺輕薄嘅底布入面，按固定間距直橫織入較粗嘅線。呢啲粗線形成凸起嘅方格。","look":"輕薄嘅布料上有凸起線條組成嘅格紋；呢啲凸稜令布料唔會黐住皮膚。"},"rokechi":{"name":"蠟纈染（蠟防染）","region":"京都及日本各地","era":"8世紀；20世紀復興","about":"奈良時代三種古老防染技法之一，正倉院寶庫入面保存有佢嘅實例。佢喺平安時代逐漸失傳，到20世紀由藝術家復興，令佢成為一種自由、富有繪畫感嘅染色形式。","process":"將溶咗嘅蠟掃上或者壓印喺布上唔需要上色嘅地方，然後將布染色。之後用熱力或熱水除去啲蠟。蠟出現裂紋嘅地方，染料會滲入去，留低幼細嘅線。","look":"大膽嘅形狀，中間貫穿住幼細如蜘蛛網咁嘅冰裂紋線條。"},"mokuhan":{"name":"木版染（木版印花）","region":"京都及其他地區","era":"源遠流長","about":"一種將雕刻喺木版上嘅圖案壓印落布上嘅印染技法。每一次印壓都帶有師傅嘅手感，細微嘅差異令布料有一種溫暖嘅手作氣息。而家仍然做緊呢門技藝嘅工房已經寥寥無幾。","process":"喺硬木版上雕刻圖案。喺木版上塗上染料或色漿，然後一次印一下，用力壓喺繃緊嘅布上。每種顏色用一塊獨立嘅木版。","look":"重複嘅紋樣，顏色略帶不均、邊緣柔和，仲隱約透出木紋嘅質感。"},"chusen":{"name":"注染（澆注染色）","region":"大阪（堺）、濱松（靜岡縣）、東京","era":"19世紀後期（明治時代）","about":"一種日本嘅染色方法，用嚟染棉質浴衣同手拭巾。染料完全滲透布料，所以兩面顏色一樣，色彩睇落柔和又清新。","process":"將布來回摺成好多層，每一層都透過型紙塗上防染糊。喺每個區域周圍用糊築起圍牆，由壺入面倒入染料，再由下面抽吸，令染料一次過穿透所有布層。","look":"柔和、略帶暈染嘅色彩，溫和嘅漸變，背面亦清楚睇到同樣嘅圖案。"},"bingata":{"name":"紅型（沖繩型染）","region":"沖繩","era":"琉球王國時代（約15世紀起）","about":"沖繩色彩鮮艷嘅染色藝術，以前係琉球王國嘅王族同貴族穿著嘅。明亮嘅色彩，加上融合日本同南方海洋嘅紋樣，令佢帶有歡快嘅南國風情。","process":"將圖案刻喺紙型上，透過紙型塗上米糊。用掃將礦物顏料同植物染料掃入每個區域，再喺邊緣擦上較深嘅色調（隈取），增加立體感。只用藍靛染成嘅版本叫做「藍型」。","look":"明亮嘅黃、紅、藍色，邊緣帶有暈色，紋樣有花、鳥、波浪同雲等。"},"aizome":{"name":"藍染（藍靛染色）","region":"德島（阿波）及日本各地","era":"古代；江戶時代廣泛普及","about":"藍靛係日本最常見嘅染料，由農民嘅工作服到和服都用得着。明治時代嘅外國訪客對佢印象深刻，呢種顏色因此被稱為「日本藍」（Japan Blue）。","process":"將蓼藍葉堆積發酵製成「蒅」（sukumo），再放入染缸，加入木灰鹼水、麥麩同石灰發酵。布料一次又一次浸入再提起：出缸時係綠色，接觸空氣後變成藍色。浸得越多次，顏色越深。","look":"深邃而有生命力嘅藍色，由淡淡嘅天藍到近乎黑色，隨住穿著變得柔和好睇。"},"lace":{"name":"蕾絲","region":"發展於歐洲；日本及世界各地都有製作","era":"歐洲蕾絲始於16世紀；明治至大正時代起用於和服","about":"蕾絲係淨係由絲線構成嘅鏤空織物。喺而家嘅和服時尚入面，蕾絲和服、羽織同腰帶好受歡迎，通常疊穿喺有色和服上面，等底色透出嚟。","process":"和服用嘅蕾絲大多數用刺繡機製作。圖案繡喺幼網上（網紗蕾絲），或者繡喺之後會溶走嘅底布上，淨低繡線（化學蕾絲）。","look":"由絲線構成嘅透明花卉或幾何圖案，底下嘅顏色由鏤空位透出嚟。"},"tsuzure":{"name":"綴織（掛毯織）","region":"京都（西陣）","era":"日本存有8世紀嘅實例（相信由中國傳入）；18世紀（江戶時代）起喺西陣織造","about":"日本嘅掛毯織法，同歐洲嘅戈布蘭掛毯屬同一類。被視為最高級嘅腰帶，最精美嘅作品由織工用指甲人手織成。","process":"每種顏色嘅緯線只喺圖案入面屬於自己嘅範圍內來回穿梭，將經線完全遮住。織工將指甲銼成鋸齒狀，用嚟將每條緯線推緊到位。一日只可以織幾厘米。","look":"結實平整嘅布料，正反兩面圖案一樣，兩種顏色相接嘅地方有細小嘅縫隙。"},"benibana":{"name":"紅花染（紅花染色）","region":"山形（最上）及京都","era":"約6至7世紀經絲綢之路傳入","about":"用紅花花瓣製成嘅天然紅色染料，深受平安朝宮廷喜愛。江戶時代佢極之珍貴，有「紅一份，金一份」嘅講法。傳統上用嚟做和服嘅紅色絲綢裏布（紅絹，momi）。","process":"先用水洗走花瓣入面大部分黃色色素，再將佢發酵後壓製成「紅餅」（beni-mochi）。用草木灰鹼水萃取出紅色，並用烏梅醋固定喺絲綢上。重複染色可以令顏色更深。","look":"由清澈明亮嘅粉紅到深沉嘅緋紅；顏色嬌嫩，遇到強光會褪色。"}}},"ko":{"ui":{"tagline":"기모노 뒤에 숨은 장인의 기술 — 일본 전통 기법 50가지","all":"전체","search":"기법 검색…","region":"산지","era":"시작","about":"개요","process":"만드는 방법","look":"알아보는 법","listen":"일본어 이름 듣기","close":"닫기","language":"언어","count":"기법 {n}개","noResults":"검색과 일치하는 기법이 없습니다.","prev":"이전","next":"다음","intro":"기모노는 여러 공정을 거쳐 만들어지며, 공정마다 전문 장인이 있습니다. 카테고리를 고르거나 원하는 기법을 눌러 자세히 알아보세요."},"cats":{"dye":{"name":"염색","desc":"다 짜인 흰 비단 위에 손으로 그리거나, 형지로 찍거나, 날염해 무늬를 넣습니다. 염색 기모노는 대체로 격식이 높아 의식이나 경사에 입습니다."},"weave":{"name":"직조","desc":"실을 먼저 염색하고, 천을 짜면서 무늬가 나타납니다. 쓰무기 같은 직조 기모노는 멋스러운 평상복으로 사랑받으며, 직조 오비는 가장 격식 높은 것이 되기도 합니다."},"embroidery":{"name":"자수","desc":"명주실과 금속사를 손으로 수놓아 질감, 빛, 깊이를 더합니다. 예복 기모노에서는 염색과 함께 쓰이는 경우가 많습니다."},"shibori":{"name":"시보리 (홀치기염색)","desc":"천의 일부를 묶거나, 꿰매거나, 접거나, 죄어서 염료가 닿지 않게 합니다. 실을 풀면 부드럽고 입체적인 질감의 무늬가 나타납니다."},"other":{"name":"장신구 공예","desc":"기모노 차림은 매듭 장인, 금속 공예가, 칠기 작가, 미즈히키 장인 등 다른 분야의 장인이 만든 끈과 장식으로 완성됩니다."}},"items":{"kaga-yuzen":{"name":"가가 유젠 (加賀友禅) 손그림 비단","region":"이시카와현 가나자와","era":"18세기 초","about":"옛 가가 번에서 전해 온 손그림 염색 양식입니다. 쪽빛, 진홍, 황토, 풀빛, 고대 보라의 '가가 오채(加賀五彩)'로 그린 사실적인 꽃과 풀로 유명합니다.","process":"색이 번지지 않도록 가는 쌀풀 선(이토메노리, 糸目糊)으로 도안의 윤곽을 그립니다. 그다음 각 부분을 붓으로 칠하는데, 음영은 바깥쪽에서 중심으로 넣습니다. 보통 한 작가가 작품 전체를 맡습니다.","look":"자연스럽고 회화적인 무늬로, '벌레 먹은' 잎(무시쿠이)을 그려 넣기도 합니다. 금박이나 자수는 거의 쓰지 않습니다."},"kyo-yuzen":{"name":"교 유젠 (京友禅) 손그림 비단","region":"교토","era":"17세기 후반","about":"교토의 부채 화가 미야자키 유젠사이의 이름을 딴 원조 유젠 양식입니다. 그림처럼 자유로운 디자인을 기모노에 가져왔으며 예복의 대표 양식이 되었습니다.","process":"작업은 약 20개 공정으로 나뉘며, 공정마다 전문가가 따로 맡습니다. 도안, 밑그림, 쌀풀 방염, 붓 채색, 찌기, 물 헹굼, 마지막으로 금박과 자수까지 이어집니다.","look":"풍부한 색채의 우아하고 궁정풍인 무늬로, 음영은 중심에서 바깥쪽으로 들어가며 금박과 자수로 마무리하는 경우가 많습니다."},"edo-komon":{"name":"에도 고몬 (江戸小紋) 형지 염색","region":"도쿄","era":"17세기 (에도 시대)","about":"아주 작은 무늬를 한 가지 색으로 반복해 염색한 것으로, 너무 섬세해서 멀리서 보면 무지처럼 보입니다. 사무라이의 예복에서 시작되었으며, 각 다이묘 가문마다 전용 무늬가 있었습니다.","process":"감물로 단단하게 만든 와시(일본 종이)를 겹쳐 만든 형지(가타가미, 型紙)에 무늬를 새깁니다. 장인이 형지를 비단 위에 놓고 쌀풀을 바른 뒤 한 치 어긋남 없이 옮겨 가며 반복하고, 마지막에 천 전체를 염색합니다.","look":"가까이서 보면 수천 개의 작은 점, 물결, 선. 몇 걸음 떨어지면 차분한 단색으로 보입니다."},"tsujigahana":{"name":"쓰지가하나 (辻が花) 꿰매기 방염","region":"교토 및 기타 지역","era":"15세기~17세기 초","about":"무로마치·모모야마 시대의 화려한 양식으로, 꿰매어 묶는 시보리에 먹 그림, 금박, 자수를 더했습니다. 1600년대 초에 사라져 훗날 '환상의 염색'이라 불렸습니다.","process":"무늬의 윤곽을 꿰매어 당겨 염료가 스며들지 않게 하고, 여러 단계에 걸쳐 염색합니다. 잎맥 같은 세부는 먹으로 그려 넣습니다. 20세기에 현대 작가들이 그 모습을 되살렸습니다.","look":"가장자리가 오글오글하고 살짝 번진 부드러운 형태에 섬세한 먹선이 어우러집니다."},"sarasa":{"name":"사라사 (更紗, 이국풍 날염)","region":"인도 발상; 나가사키, 사카이, 교토, 에도에서 제작","era":"16~17세기","about":"해외 무역을 통해 인도와 동남아시아에서 들어온 화려한 무늬의 면직물입니다. 이국적인 꽃, 새, 기하학 무늬가 귀하게 여겨졌고, 곧 일본 장인들도 직접 만들기 시작했습니다.","process":"인도에서는 매염제와 밀랍으로 무늬를 그리거나 목판으로 찍었습니다. 일본의 '와사라사'는 보통 색마다 하나씩 준비한 여러 장의 형지를 차례로 사용해 만들었습니다.","look":"흙빛 빨강, 쪽빛, 갈색으로 표현된 촘촘하고 이국적인 꽃무늬와 페이즐리풍 무늬."},"kinsai":{"name":"긴사이 (金彩) 금박 장식","region":"교토","era":"고대부터; 16세기에 번성","about":"완성된 기모노를 진짜 금과 은으로 장식하는 기술입니다. 주로 유젠 염색 예복의 마지막 손질로 쓰이며, 꽃과 구름, 윤곽선에 빛을 더합니다.","process":"형지를 통해 또는 가는 깔때기로 접착제를 바르고, 금박을 눌러 붙인 뒤 필요 없는 부분은 털어 냅니다. 금을 작은 조각으로 뿌리거나 금가루 풀로 선을 그리기도 합니다.","look":"염색 무늬 위에서 빛나는 금·은 장식이 입은 사람이 움직일 때마다 빛을 받습니다."},"oshima":{"name":"오시마 쓰무기 (大島紬) 진흙 염색 명주","region":"가고시마현 아마미오시마섬","era":"1,300년 이상의 역사","about":"일본에서 가장 유명한 기모노 직물 중 하나입니다. 깊고 윤기 있는 흑갈색은 비단을 그 지역 나무로 염색한 뒤 철분이 많은 진흙으로 염색하는 진흙 염색(도로조메, 泥染め)에서 나옵니다. 가볍고 매끄러우며 구김이 거의 생기지 않습니다.","process":"먼저 실을 시메바타(締機)로 단단히 짜서 임시 돗자리 모양으로 만들어 무늬 부분을 방염합니다. 이것을 샤린바이 나무껍질로 수십 번 염색한 뒤 진흙으로 염색하고, 풀어낸 실을 작은 점 하나하나 손으로 맞추며 다시 짭니다.","look":"어둡고 비단결 같은 표면에 작은 십자로 이루어진 극도로 섬세한 기하학 무늬."},"yuki":{"name":"유키 쓰무기 (結城紬) 손방적 명주","region":"이바라키현 유키, 도치기현 오야마","era":"나라 시대(8세기) 또는 그 이전에 기원; 17세기부터 유명","about":"2010년 유네스코 무형문화유산에 등재되었습니다. 가장 고급스러운 평상복 기모노로 일컬어지며, 따뜻하고 가볍고 입을수록 부드러워집니다.","process":"풀솜에서 꼬임 없이 손으로 실을 자아냅니다. 무늬 실은 손으로 묶어 염색하고, 직공이 자기 몸으로 날실의 장력을 조절하는 지바타(地機, 허리 베틀)로 짭니다. 한 필에 몇 달에서 1년 이상 걸리기도 합니다.","look":"부드럽고 살짝 고르지 않은 질감과 은은한 무광택 윤기."},"ushikubi":{"name":"우시쿠비 쓰무기 (牛首紬) 쌍고치 명주","region":"이시카와현 하쿠산","era":"800년 이상","about":"산골 마을에서 나는 귀한 명주로, 누에 두 마리가 함께 지은 '쌍고치(다마마유, 玉繭)'로 만듭니다. 매우 질겨서 '못 뽑는 명주'라는 별명이 있는데, 못에 걸려도 천이 찢어지는 대신 못이 뽑힌다고 합니다.","process":"뜨거운 물속의 쌍고치에서 바로 실을 뽑아 자연스러운 마디가 생깁니다. 흰 천을 먼저 짜고, 그 뒤에 염색하는 경우가 많으며 유젠 그림을 넣기도 합니다.","look":"작은 자연 마디가 있고 차분하고 따뜻한 광택을 지닌 튼튼한 비단."},"kihachijo":{"name":"기하치조 (黄八丈) 노란 섬 비단","region":"도쿄도 하치조섬","era":"무로마치 시대부터 기록됨; 에도 시대에 유행","about":"외딴섬에서 섬 식물에서 얻은 세 가지 천연색, 즉 황금빛 노랑, 적갈색, 검정만으로 짜는 비단입니다. 에도의 서민들 사이에서 유행했습니다.","process":"노랑은 가리야스 풀, 갈색은 다부노키 나무껍질, 검정은 모밀잣밤나무 껍질을 철분 많은 진흙으로 처리해 얻습니다. 실을 몇 번이고 거듭 염색한 뒤 격자와 줄무늬로 짭니다.","look":"밝은 노랑, 갈색, 검정의 격자나 줄무늬에 윤기 있는 마감."},"meisen":{"name":"메이센 (銘仙) 날실 날염 비단","region":"이세사키, 지치부, 아시카가, 기류, 하치오지","era":"1910~1930년대에 대유행","about":"다이쇼부터 쇼와 초기까지 평범한 여성들에게 패션을 선사한 저렴한 비단입니다. 대담한 아르누보·아르데코 디자인은 지금도 세계 빈티지 수집가들에게 사랑받습니다.","process":"날실을 느슨하게 가봉하듯 짠 뒤 형지로 무늬를 날염합니다(호구시가스리, 解し絣). 짤 때 임시 씨실을 풀면서 진짜 씨실을 넣기 때문에 색이 살짝 어긋나고 가장자리가 부드럽게 번져 보입니다.","look":"깃털처럼 번지고 살짝 어긋난 윤곽의 대담하고 모던한 무늬."},"jofu":{"name":"조후 (上布) 고운 모시","region":"에치고(니가타), 미야코(오키나와), 오미(시가), 노토(이시카와)","era":"1,200년 이상","about":"'좋은 천'이라는 뜻으로, 모시 섬유로 짠 매우 얇고 빳빳한 천이며 한여름에 입습니다. 에치고 조후와 오지야 지지미는 유네스코 무형문화유산에 등재되어 있습니다.","process":"모시 섬유를 손으로 머리카락처럼 가늘게 쪼개 끝과 끝을 잇습니다. 에치고 조후는 짠 뒤 맑은 봄날 눈 위에 펼쳐 자연 표백합니다.","look":"가볍고 비치며 시원하고, 빳빳하고 살짝 종이 같은 촉감."},"omeshi":{"name":"오메시 (御召) 직조 크레이프","region":"교토(니시진), 기류, 시오자와","era":"에도 시대","about":"이를 아낀 쇼군 도쿠가와 이에나리에서 이름을 딴 직조 비단 크레이프로, '오메시'는 '귀한 분이 입으시는 것'이라는 뜻입니다. 염색과 직조 기모노의 중간에 위치해 격식 있는 방문이나 파티에 어울립니다.","process":"실을 짜기 전에 염색합니다. 씨실은 강하게 꼰 실(교넨시, 強撚糸)에 풀을 먹이고, 짠 뒤 따뜻한 물로 꼬임을 풀어 섬세한 주름 표면을 만듭니다.","look":"은은한 오톨도톨한 질감의 탄탄한 크레이프로, 형태를 잘 유지하고 구김에 강합니다."},"chirimen":{"name":"지리멘 (縮緬) 비단 크레이프","region":"단고(교토), 나가하마(시가)","era":"16세기부터; 단고는 18세기부터","about":"유젠을 비롯한 대부분의 염색 기모노의 바탕천이 되는 부드러운 비단 크레이프입니다. 주름진 표면은 색이 아름답게 들고 우아하게 늘어집니다.","process":"씨실을 1미터당 수천 번 꼬되 왼꼬임과 오른꼬임을 번갈아 넣습니다. 짠 뒤 천을 삶아 실의 고무질을 제거하면 실이 꼬임을 풀려 하면서 천이 줄어들어 '시보(シボ)'라 불리는 작은 주름이 생깁니다.","look":"작은 요철로 덮인 부드러운 표면. 주름의 크기는 종류에 따라 다릅니다."},"nishijin":{"name":"니시진오리 (西陣織) 문직","region":"교토 니시진 지구","era":"15세기에 명명; 5~6세기부터 이곳에서 직조","about":"일본을 대표하는 문직(브로케이드)으로, 오닌의 난 당시 '서쪽 진영(니시진)'에서 이름을 따왔습니다. 니시진 직공들은 화려한 오비와 함께 황실, 사찰, 노 무대를 위한 직물을 만듭니다.","process":"직조 전에 실을 수십 가지 색으로 염색하고 금사·은사와 조합합니다. 1870년대에 프랑스에서 자카드 직기가 도입되었지만, 최고급 쓰메가키 혼쓰즈레(爪掻き本綴れ)는 지금도 톱니 모양으로 깎은 손톱으로 씨실을 긁어 내리며 손으로 짭니다.","look":"금실과 은실을 넣어 무늬가 풍부한 묵직한 천으로, 예복용 오비로 가장 자주 볼 수 있습니다."},"saga-nishiki":{"name":"사가니시키 (佐賀錦) 종이·비단 문직","region":"사가","era":"에도 시대 후기","about":"가시마 번에서 전해 내려온 귀한 문직입니다. 번주의 부인이 천장의 대나무 엮음(아지로) 무늬에서 영감을 받아 고안했고, 번주 집안의 여인들 사이에서 전승되었다고 전해집니다. 처음에는 가시마니시키라 불렸으나, 1910년 일영박람회에서 '사가니시키'로 이름이 바뀌었습니다.","process":"날실로는 금·은박이나 옻칠을 입힌 와시를 가늘게 자른 것을 씁니다. 작은 대나무 주걱으로 종이 날실을 한 올씩 들어 올리고 색 비단 씨실을 넣습니다. 하루에 몇 센티미터밖에 짜지 못합니다.","look":"반짝이는 금빛 바탕에 작고 정밀한 기하학 무늬. 예복용 오비, 가방, 소품에 쓰입니다."},"hakata":{"name":"하카타오리 (博多織)","region":"후쿠오카","era":"1241년","about":"송나라에서 직조를 배운 상인이 시작했습니다. 에도 시대에 지역 영주가 매년 쇼군에게 헌상했기 때문에 대표 디자인을 '겐조(献上, 헌상) 하카타'라고 부릅니다.","process":"가는 날실을 촘촘히 늘어놓고 굵은 씨실을 세게 쳐 넣기 때문에 무늬는 주로 날실로 만들어집니다. 대표 무늬는 불교 의식 도구와 줄무늬에서 유래했습니다.","look":"맬 때 '규규' 하는 소리가 나고 절대 느슨해지지 않는 탄탄한 오비."},"wana":{"name":"와나오리 (輪奈織) 고리 파일 직조","region":"교토","era":"17세기부터","about":"'와나'는 고리라는 뜻입니다. 표면에 작은 비단 고리를 세우는 직조로, 일본에서 벨벳을 만드는 것과 같은 기법입니다. 오비와 코트에 부드러운 입체감을 줍니다.","process":"날실 아래에 가는 철사를 함께 짜 넣어 고리를 세운 뒤 철사를 뽑아냅니다. 고리를 그대로 두면 와나, 자르면 벨벳이 됩니다. 자른 고리와 자르지 않은 고리를 섞은 무늬도 있습니다.","look":"작은 고리가 도드라진 벨벳 같은 무늬로, 손으로 만지면 부드럽습니다."},"sagara":{"name":"사가라 자수 (相良刺繍) 매듭수","region":"중국에서 전래; 교토를 비롯한 일본 전역","era":"오래된 기법","about":"프렌치 노트와 비슷한 수많은 작은 매듭으로 이루어진 자수입니다. 구슬 같은 입체 질감을 내고 매우 튼튼해 포인트나 윤곽선에 쓰입니다.","process":"실을 바늘에 감은 뒤 천을 통해 당겨 작은 매듭을 만듭니다. 매듭을 하나씩 늘어놓아 면을 채우거나 선을 그립니다.","look":"작은 진주처럼 오밀조밀 모인 도톰한 점들."},"kinkoma":{"name":"긴코마 자수 (金駒刺繍) 금사 고정수","region":"교토 및 일본 전역","era":"오래된 기법","about":"금실은 너무 뻣뻣해 비단을 통과할 수 없기 때문에 표면에 놓고 고정합니다. 윤곽과 무늬에 굵고 빛나는 금선을 더합니다.","process":"작은 나무 실패(고마, 駒)에 감은 금실을 보통 두 가닥씩 도안을 따라 놓고, 가는 명주실로 짧은 간격마다 고정합니다.","look":"천 위에 얹힌 매끄럽고 끊김 없는 금빛 선."},"takeyamachi":{"name":"다케야마치 자수 (竹屋町刺繍) 사(紗) 자수","region":"교토 다케야마치","era":"에도 시대","about":"성기게 짠 비단 사(紗) 위에 놓는 자수로, 처음 시작된 교토의 거리 이름을 땄습니다. 바늘땀이 천의 격자를 아주 정확히 따라가서 자수라기보다 직물처럼 보입니다.","process":"주로 납작한 금실(때로는 색 비단실과 함께)을 사의 작은 구멍을 하나하나 세어 가며 통과시켜 모자이크처럼 도안을 채웁니다.","look":"비치는 사 위에 직물처럼 또렷한 금빛 무늬. 오비, 후쿠사, 족자 표구에 쓰입니다."},"swatow":{"name":"스와토 자수 (汕頭刺繍) 투각 자수","region":"중국 광둥성 산터우(스와토)","era":"19세기 후반","about":"중국 자수 기법과 유럽 레이스 기법을 결합한 남중국의 섬세한 투각 자수입니다. 스와토 자수 기모노는 오래전부터 일본에서 우아하고 세련된 옷으로 사랑받아 왔습니다.","process":"천에서 실을 뽑아내거나 작은 부분을 잘라 내고, 그 구멍을 감치고 고운 바늘땀으로 채워 레이스 같은 무늬를 만듭니다. 모두 손으로 작업합니다.","look":"작은 구멍이 뚫린 같은 계열 색의 레이스 같은 무늬로, 흰색이나 연한 파스텔 색이 많습니다."},"suzhou":{"name":"쑤저우 자수 (蘇州刺繍)","region":"중국 장쑤성 쑤저우","era":"2,000년 이상","about":"중국 4대 자수 중 하나로, 극도의 섬세함으로 유명합니다. 기모노와 오비에서는 살아 있는 듯한 동물과 꽃을 표현하는 데 쓰입니다.","process":"명주실 한 가닥을 많게는 수십 가닥의 머리카락처럼 가는 실로 나눕니다. 한 땀 한 땀 색을 섞으며, 앞뒤 양면 모두 완성된 그림이 보이도록 수놓은 작품도 있습니다.","look":"털 한 올 한 올까지 보이는 고양이처럼 사진 같은 사실감."},"ran":{"name":"난침수 (乱針繍, 롼전) 무작위 땀 자수","region":"중국 장쑤성 창저우; 기모노와 오비에서도 볼 수 있음","era":"20세기 초(1920~30년대)에 창시","about":"길이와 방향이 다른 바늘땀을 교차시키고 겹쳐서 유화의 붓 터치처럼 표현하는 자수입니다. 털, 깃털, 빛과 그림자를 자연스럽게 나타냅니다.","process":"바늘땀을 가지런히 나란히 놓는 대신 방향을 교차시키며 자유롭게 겹치고, 층마다 색을 섞어 깊이를 쌓아 갑니다.","look":"뚜렷한 바늘땀 선 대신 부드러운 그러데이션이 있는 회화 같은 표면."},"hitta":{"name":"히타 시보리 (疋田絞り) 네모 점 홀치기","region":"교토","era":"17세기까지 고도로 발달","about":"가장 호화로운 시보리입니다. 작은 네모 점이 사선으로 늘어서며, 전체를 히타로 덮은 기모노는 '소히타(総疋田)'라 불리며 사치의 극치로 여겨집니다.","process":"장인이 천을 아주 작게 집어 네 겹으로 접고 실을 여러 번 감습니다. 점 하나하나를 손으로 묶기 때문에 전체를 덮은 후리소데는 1년 이상 걸리기도 합니다.","look":"가지런한 사선 줄로 늘어선 고르고 도톰한 네모 점."},"kanoko":{"name":"가노코 시보리 (鹿の子絞り) 아기 사슴 반점 홀치기","region":"교토 및 일본 전역","era":"아주 오래전부터","about":"가운데에 색이 남은 작은 흰 점이 아기 사슴의 반점처럼 보여 '가노코(아기 사슴)'라 부릅니다. 가장 잘 알려진 시보리로 오비아게, 기모노, 소품에서 볼 수 있습니다.","process":"염색 전에 천의 작은 지점을 집어 실로 단단히 묶습니다. 염색하고 풀면 각 지점이 오톨도톨 솟은 고리 모양 점이 됩니다.","look":"가운데에 작은 색 '눈'이 있는 작은 고리 모양 점."},"boshi":{"name":"보시 시보리 (帽子絞り) 모자 씌우기","region":"교토, 아리마쓰","era":"에도 시대","about":"'보시'는 모자라는 뜻입니다. 디자인의 넓은 부분에 모자처럼 덮개를 씌워 염료로부터 보호하는 방법으로, 큰 꽃이나 원을 하얗게 남길 수 있습니다.","process":"윤곽을 꿰매어 오므린 뒤 안쪽 부분을 모자처럼 씌워 덮고, 실로 단단히 묶어 염색합니다. 덮개는 전통적으로 대나무 껍질을, 요즘은 주로 비닐을 씁니다.","look":"부드럽고 살짝 깃털처럼 번진 가장자리를 가진 커다란 흰 형태."},"nuishime":{"name":"누이시메 시보리 (縫い締め絞り) 꿰매기 홀치기","region":"교토, 아리마쓰나루미(나고야)","era":"적어도 무로마치 시대부터","about":"홈질로 정확한 선과 형태를 그리는 시보리입니다. 묶기만 하는 것보다 훨씬 자유로운 형태를 만들 수 있습니다.","process":"도안을 작은 홈질로 꿰매고 실을 단단히 당겨 천에 주름을 잡습니다. 주름진 부분이 방염되어 점선 같은 윤곽이 남습니다.","look":"작은 짧은 선이 줄지어 만든 또렷한 윤곽."},"arashi":{"name":"아라시 시보리 (嵐絞り) 막대 감기","region":"아리마쓰나루미(나고야)","era":"19세기 후반","about":"'아라시'는 폭풍이라는 뜻으로, 사선이 바람에 휘날리는 비처럼 보입니다. 일본 최대의 시보리 마을 아리마쓰의 대표 기법이며 유카타에 인기가 많습니다.","process":"긴 막대에 천을 사선으로 감고 실로 묶은 뒤 아래로 밀어 촘촘한 주름을 잡습니다. 바깥쪽 산 부분만 염색됩니다.","look":"비스듬히 내리는 비 같은 가는 사선."},"tatsumaki":{"name":"다쓰마키 시보리 (竜巻絞り) 회오리","region":"아리마쓰나루미(나고야), 교토","era":"전통 기법","about":"'다쓰마키'는 회오리바람이라는 뜻입니다. 천에 실을 나선형으로 감아, 무늬가 회오리에 휘말린 듯 비틀려 나타납니다.","process":"천을 (흔히 꿰매거나 주름을 잡은 뒤) 심에 모아 긴 둥근 막대 모양으로 만들고, 염색 전에 위에서 아래로 실을 나선형으로 감습니다. 겉으로 드러난 부분만 염료가 배어 나선형 띠가 남습니다.","look":"역동감이 강한 소용돌이 나선 줄무늬."},"yanagi":{"name":"야나기 시보리 (柳絞り) 버드나무","region":"아리마쓰나루미(나고야)","era":"에도 시대","about":"'야나기'는 버드나무라는 뜻입니다. 산들바람에 흔들리는 버들가지 같은 무늬로, 여름 유카타에 인기가 많습니다.","process":"천을 세로로 가늘게 주름 잡고 일정한 간격으로 실로 묶습니다. 주름 부분이 방염되어 가늘고 끊어진 세로선이 남습니다.","look":"늘어진 버들가지 같은 부드러운 세로선."},"oke":{"name":"오케 시보리 (桶絞り) 통 홀치기","region":"교토","era":"교토의 전통 기법","about":"'오케'는 통이라는 뜻입니다. 천의 넓은 부분을 나무통 안에 밀봉해 젖지 않게 하는 희귀한 기법으로, 한 기모노에 서로 다른 색의 큰 면을 만들 수 있습니다. 지금은 이 기술을 할 수 있는 장인이 극히 적습니다.","process":"염색하지 않을 부분을 노송나무 통에 채워 넣고, 염색할 부분은 밖에 둔 채 천 위로 뚜껑을 단단히 조이고 끈으로 묶습니다. 그런 다음 통째로 더 큰 염료 통에 담급니다. 이를 색마다 반복합니다.","look":"깔끔하면서도 살짝 부드러운 경계를 가진, 서로 다른 색의 크고 대담한 면."},"itajime":{"name":"이타지메 (板締め) 판 조임 염색","region":"아리마쓰, 교토 등","era":"8세기부터","about":"일본에서 가장 오래된 방염 기법 중 하나로, 그 원류인 쿄케치(夾纈, 조각한 판 사이에 끼워 염색)가 8세기 쇼소인 보물창고에 남아 있습니다. 접은 천을 판 사이에 끼워 반복 무늬를 만듭니다.","process":"천을 삼각형이나 사각형으로 접어 나무판 사이에 단단히 끼운 뒤 염료에 담급니다. 판으로 덮인 부분이 하얗게 남아 대칭 무늬가 됩니다.","look":"'셋카(雪花)'라 불리는 눈 결정 같은 무늬 등 반복되는 기하학 형태."},"tsukami":{"name":"쓰카미 시보리 (つかみ絞り) 움켜쥐기","region":"여러 시보리 산지","era":"전통 기법","about":"'쓰카미'는 움켜쥐기라는 뜻입니다. 천을 한 줌씩 뭉쳐 묶기 때문에 모든 작품이 다르게 나옵니다. 자유롭고 자연스러운 느낌을 줍니다.","process":"장인이 천을 움켜쥐고 불규칙하게 비틀어 뭉친 뒤 실로 묶어 염색합니다. 무작위로 생긴 주름이 예측할 수 없는 무늬를 만듭니다.","look":"반복 없는 구름 같거나 대리석 같은 불규칙한 무늬."},"kumihimo":{"name":"구미히모 (組紐) 비단 끈목","region":"교토, 이가(미에)","era":"7~8세기부터","about":"비단실을 엮어 만든 끈으로, 처음에는 불교 용품과 궁중 의복에, 이후에는 사무라이 갑옷과 칼끈에 쓰였습니다. 오늘날에는 오비 가운데에 매는 끈인 오비지메로 가장 잘 알려져 있습니다.","process":"수십 가닥의 비단실을 추가 달린 실패에 감고, 둥근 마루다이 같은 나무 받침 위에서 서로 교차시킵니다. 받침과 엮는 방법에 따라 둥근 끈, 네모 끈, 납작한 끈이 만들어집니다.","look":"섬세한 사선 무늬와 풍부한 배색을 지닌 단단하고 고른 짜임."},"zogan":{"name":"조간 (象嵌) 금속 상감","region":"교토, 구마모토(히고)","era":"에도 시대에 칼과 총의 장식구에서 번성","about":"철에 금과 은을 박아 넣는 기술입니다. 예전에는 칼 장식구를 꾸미는 데 쓰였고, 오늘날에는 오비도메(오비 브로치)와 머리 장식 같은 기모노 소품을 장식합니다.","process":"철 표면에 가는 격자 홈을 새깁니다. 금박이나 은박, 금속선을 홈에 두드려 박은 뒤 철을 일부러 녹슬게 하고 옻이나 기름을 발라 구워 깊은 검은색을 냅니다.","look":"깊은 검은 바탕 위에 빛나는 금·은 문양."},"makie":{"name":"마키에 (蒔絵) 금 칠기","region":"교토, 와지마, 가나자와 등","era":"8~9세기부터","about":"옻으로 문양을 그리고 금가루나 은가루를 뿌리는 칠기 공예입니다. 기모노 세계에서는 빗, 비녀, 오비도메, 게타에서 볼 수 있습니다.","process":"옻으로 도안을 그리고 마르기 전에 대나무 관으로 고운 금가루나 은가루를 뿌립니다. 그 뒤 여러 번 칠하고 연마합니다.","look":"검정이나 빨강 옻칠 위에 깊고 윤기 있게 빛나는 섬세한 금빛 그림."},"mizuhiki":{"name":"미즈히키 (水引) 종이 끈","region":"이이다(나가노), 가나자와(이시카와)","era":"기원은 7세기로 거슬러 올라감","about":"꼰 와시로 만든 장식 끈으로, 행운을 비는 마음을 담은 매듭으로 묶습니다. 축의 봉투를 장식하며, 기모노 스타일링에서는 신부의 머리 장식과 오비 장식에 쓰입니다.","process":"와시를 가는 끈으로 꼬아 풀로 굳힌 뒤, 염색하거나 색 필름이나 금속 필름을 감습니다. 이 끈을 아와지 매듭 같은 매듭으로 묶거나 학, 소나무, 매화 모양으로 만듭니다.","look":"광택 있고 빳빳한 끈을 좌우 대칭 매듭으로 묶은 것으로, 홍백이나 금은 배색이 많습니다."},"ro":{"name":"로 (絽) 줄 비침 여름 비단","region":"교토 등 각지의 비단 직조 산지","era":"15세기에 이미 명칭이 기록됨; 에도 시대부터 널리 보급","about":"아주 작은 틈이 가지런히 줄지어 있어 바람이 잘 통하는 여름 비단입니다. 초여름부터 늦여름까지 가장 더운 달에 입는 예복과 평상복 기모노의 대표적인 천입니다.","process":"평직을 여러 단 짠 뒤, 한 단에서만 날실을 두 올씩 서로 꼬아 틈이 생긴 줄을 만듭니다. 틈 사이 평직 단수에 따라 '삼본로(三本絽)', '오본로(五本絽)' 등으로 부릅니다.","look":"촘촘한 비단 바탕에 작은 틈이 가로로(때로는 세로로) 가늘게 줄지어 있습니다."},"sha":{"name":"샤 (紗) 전면 비침 비단","region":"교토 등 각지의 비단 직조 산지","era":"7~8세기에 중국에서 전래","about":"한여름에 입는 가볍고 비치는 비단입니다. 로보다 가볍고 더 투명하며, 기모노 위에 입는 여름 하오리와 코트에도 쓰입니다.","process":"모든 단에서 날실을 두 올씩 서로 꼬고 씨실로 고정합니다. 그래서 천 전체에 고르고 성긴 망이 생깁니다.","look":"촘촘한 줄 없이 고르게 비치는 망. 아래에 겹친 옷이 은은하게 비칩니다."},"ra":{"name":"라 (羅) 그물 같은 복합 익직","region":"교토","era":"고대(7~8세기); 20세기에 복원","about":"익직 가운데 가장 오래된 것 중 하나이자 가장 복잡한 직물로, 8세기 쇼소인 보물창고에 그 예가 남아 있습니다. 일본에서는 중세 이후 기술이 쇠퇴했다가 근대의 명장들이 복원했습니다. 오늘날에는 주로 고급 여름 오비에서 볼 수 있습니다.","process":"날실 하나가 짝이 되는 한 올만이 아니라 이웃한 여러 올과 넘나들며 꼬여 그물 모양을 이룹니다. 전용 베틀에서 손으로 천천히 짭니다.","look":"마름모꼴 틈이 있는 신축성 있는 그물 모양의 천으로, 그물 속에 무늬가 나타나기도 합니다."},"kobai":{"name":"고바이 (紅梅) 격자 요철 여름 천","region":"일본 각지의 면·비단 직조 산지","era":"전통 여름 천","about":"도드라진 격자 질감이 있는 여름 천으로, 면으로 짠 '멘코바이(綿紅梅)'와 비단에 면을 섞은 '기누코바이(絹紅梅)'가 있습니다. 고급 유카타와 편한 여름 기모노로 사랑받습니다.","process":"얇고 가벼운 바탕에 굵은 실을 가로세로로 일정한 간격마다 짜 넣습니다. 이 굵은 실이 도드라진 사각 격자를 만듭니다.","look":"도드라진 선이 격자무늬를 이루는 가벼운 천. 두둑 덕분에 피부에 달라붙지 않습니다."},"rokechi":{"name":"로케치 (蠟纈) 밀랍 방염 염색","region":"교토 및 일본 전역","era":"8세기; 20세기에 부흥","about":"나라 시대의 고대 방염 염색 기법 세 가지 중 하나로, 쇼소인(正倉院) 보물창고에 그 예가 남아 있습니다. 헤이안 시대 중에 자취를 감췄다가 20세기 작가들에 의해 부흥되어, 자유롭고 회화적인 염색 방식이 되었습니다.","process":"색이 들어가면 안 되는 부분에 녹인 밀랍을 붓이나 도장으로 바른 뒤 천을 염색합니다. 그다음 열이나 뜨거운 물로 밀랍을 제거합니다. 밀랍이 갈라진 곳으로 염료가 스며들어 가는 선이 남습니다.","look":"대담한 형태 속으로 거미줄 같은 가는 균열 선이 퍼져 있습니다."},"mokuhan":{"name":"모쿠한 (木版) 목판 날염","region":"교토 및 기타 지역","era":"오랜 기원","about":"나무판에 새긴 문양을 천에 찍어 내는 날염 기법입니다. 한 번 한 번 찍을 때마다 장인의 손길이 담기며, 미세한 차이가 천에 따뜻한 수공예의 멋을 더합니다. 지금은 이 기법을 이어 가는 공방이 몇 곳 남지 않았습니다.","process":"단단한 나무판에 문양을 새깁니다. 판에 염료나 풀을 묻혀, 팽팽하게 편 천 위에 한 번에 하나씩 힘주어 찍습니다. 색마다 다른 판을 사용합니다.","look":"반복되는 문양에 약간 고르지 않고 가장자리가 부드러운 색, 그리고 은은한 나뭇결 질감이 보입니다."},"chusen":{"name":"주센 (注染) 부어 넣기 염색","region":"오사카 (사카이), 하마마쓰 (시즈오카), 도쿄","era":"19세기 후반 (메이지 시대)","about":"면 유카타와 데누구이 수건을 염색하는 일본의 기법입니다. 염료가 천을 완전히 통과하기 때문에 양면이 같은 색이 되며, 색감이 부드럽고 산뜻합니다.","process":"천을 앞뒤로 접어 여러 겹으로 겹치면서, 겹마다 형지를 통해 방염 풀을 바릅니다. 각 구역 둘레에 풀로 둑을 쌓고, 주전자로 염료를 부은 뒤 아래에서 빨아들여 모든 겹을 한 번에 통과시킵니다.","look":"부드럽고 살짝 번진 색과 은은한 그러데이션, 그리고 뒷면에도 같은 무늬가 선명하게 드러납니다."},"bingata":{"name":"빈가타 (紅型) 오키나와 형지 염색","region":"오키나와","era":"류큐 왕국 (15세기경부터)","about":"류큐 왕국의 왕족과 귀족이 입었던 오키나와의 화려한 염색 기법입니다. 밝은 색채와 일본 및 남쪽 바다에서 온 무늬가 어우러져 경쾌하고 열대적인 분위기를 냅니다.","process":"종이 형지에 무늬를 새기고, 형지를 통해 쌀풀을 바릅니다. 각 부분에 광물 안료와 식물 염료를 붓으로 칠한 뒤, 가장자리에 더 짙은 색을 문질러(구마도리) 입체감을 줍니다. 쪽으로만 염색한 것은 에가타(藍型)라고 합니다.","look":"가장자리에 음영을 넣은 선명한 노랑, 빨강, 파랑과 꽃, 새, 물결, 구름 등의 무늬."},"aizome":{"name":"아이조메 (藍染) 쪽 염색","region":"도쿠시마 (아와) 및 일본 전역","era":"고대부터; 에도 시대에 널리 보급","about":"쪽은 일본에서 가장 흔한 염료로, 농부의 작업복부터 기모노까지 모든 것에 쓰였습니다. 메이지 시대에 일본을 찾은 외국인들이 깊은 인상을 받아 이 색은 '재팬 블루'로 알려지게 되었습니다.","process":"쪽잎을 발효·퇴비화해 스쿠모를 만든 뒤, 나뭇재 잿물, 밀기울, 석회와 함께 통에서 발효시킵니다. 천을 담갔다 들어 올리기를 몇 번이고 반복하는데, 천은 초록색으로 나왔다가 공기에 닿으며 파랗게 변합니다. 담그는 횟수가 많을수록 색이 깊어집니다.","look":"옅은 하늘색부터 거의 검정에 가까운 색까지, 깊고 살아 있는 파랑으로 입을수록 아름답게 부드러워집니다."},"lace":{"name":"레이스","region":"유럽에서 발전; 일본 및 세계 각지에서 생산","era":"유럽 레이스는 16세기부터; 기모노와는 메이지~다이쇼 시대부터","about":"레이스는 실만으로 만든 투각 직물입니다. 오늘날 기모노 패션에서는 레이스 기모노, 하오리, 오비가 인기이며, 색이 비쳐 보이도록 색깔 있는 기모노 위에 겹쳐 입는 경우가 많습니다.","process":"기모노용 레이스는 대부분 자수 기계로 만듭니다. 고운 망사 위에 무늬를 수놓거나(튤 레이스), 바탕천 위에 수놓은 뒤 바탕천을 녹여 수놓은 실만 남깁니다(케미컬 레이스).","look":"꽃무늬나 기하학 무늬의 비치는 실 문양으로, 틈새로 아래의 색이 비쳐 보입니다."},"tsuzure":{"name":"쓰즈레오리 (綴れ織) 철직","region":"교토 (니시진)","era":"일본에는 8세기부터 사례가 있음(중국에서 전래된 것으로 추정); 18세기(에도 시대)부터 니시진에서 직조","about":"일본식 태피스트리 직조로, 유럽의 고블랭 태피스트리와 같은 계열입니다. 최고급 오비로 여겨지며, 최상급 작품은 직공의 손톱을 사용해 손으로 짭니다.","process":"각 색의 씨실은 무늬 속 자기 영역 안에서만 오가며 날실을 완전히 가립니다. 직공은 손톱을 톱니 모양으로 갈아, 그 손톱으로 씨실을 하나하나 제자리에 긁어 내립니다. 하루에 몇 센티미터밖에 짤 수 없습니다.","look":"앞뒤에 같은 그림이 나타나는 단단하고 평평한 천으로, 두 색이 만나는 곳에 아주 작은 틈이 있습니다."},"benibana":{"name":"베니바나 (紅花) 잇꽃 염색","region":"야마가타 (모가미) 및 교토","era":"6~7세기경 실크로드를 통해 전래","about":"잇꽃 꽃잎으로 만드는 천연 붉은 염료로, 헤이안 궁정에서 사랑받았습니다. 에도 시대에는 '붉은색 한 단위는 금 한 단위'라는 말이 있을 만큼 귀했습니다. 전통적으로 기모노의 붉은 비단 안감(모미)에 쓰였습니다.","process":"꽃잎을 물에 씻어 노란 색소를 상당 부분 빼낸 뒤, 발효시켜 '베니모치'라는 덩어리로 압착합니다. 잿물로 붉은색을 우려내고 훈제 매실 식초(우바이)로 비단에 정착시킵니다. 염색을 반복할수록 색이 깊어집니다.","look":"맑고 빛나는 분홍에서 깊은 진홍까지. 색이 섬세하여 강한 빛에 바랩니다."}}},"th":{"ui":{"tagline":"งานฝีมือเบื้องหลังกิโมโน — 50 เทคนิคดั้งเดิมของญี่ปุ่น","all":"ทั้งหมด","search":"ค้นหาเทคนิค…","region":"แหล่งผลิต","era":"ตั้งแต่","about":"คืออะไร","process":"ทำอย่างไร","look":"สังเกตอย่างไร","listen":"ฟังชื่อภาษาญี่ปุ่น","close":"ปิด","language":"ภาษา","count":"{n} เทคนิค","noResults":"ไม่พบเทคนิคที่ตรงกับคำค้นหา","prev":"ก่อนหน้า","next":"ถัดไป","intro":"กิโมโนหนึ่งชุดผ่านการผลิตหลายขั้นตอน และแต่ละขั้นตอนก็มีช่างผู้เชี่ยวชาญของตัวเอง เลือกหมวดหมู่หรือแตะที่เทคนิคใดก็ได้เพื่อดูรายละเอียด"},"cats":{"dye":{"name":"การย้อม","desc":"ลวดลายถูกวาด พิมพ์ผ่านแม่แบบ หรือพิมพ์ลงบนผ้าไหมสีขาวที่ทอเสร็จแล้ว กิโมโนแบบย้อมมักเป็นชุดที่เป็นทางการกว่า ใช้สวมในพิธีและงานเฉลิมฉลอง"},"weave":{"name":"การทอ","desc":"ด้ายถูกย้อมสีก่อน แล้วลวดลายจะปรากฏขึ้นระหว่างการทอผ้า กิโมโนแบบทอ เช่น สึมุงิ (tsumugi) เป็นที่นิยมในฐานะชุดลำลองที่มีสไตล์ ส่วนโอบิ (obi) แบบทออาจเป็นแบบที่เป็นทางการที่สุด"},"embroidery":{"name":"การปัก","desc":"ด้ายไหมและด้ายโลหะถูกปักลงบนผ้าด้วยมือ เพื่อเพิ่มพื้นผิว ความแวววาว และมิติ บนกิโมโนแบบเป็นทางการมักใช้การปักร่วมกับการย้อม"},"shibori":{"name":"ชิโบริ (มัดย้อม)","desc":"บางส่วนของผ้าถูกมัด เย็บ พับ หรือหนีบไว้เพื่อไม่ให้สีย้อมซึมเข้าไป เมื่อแกะด้ายออก ลวดลายจะปรากฏพร้อมพื้นผิวนูนสามมิติที่นุ่มนวล"},"other":{"name":"งานฝีมือเครื่องประดับ","desc":"กิโมโนจะสมบูรณ์ด้วยเชือก เครื่องประดับ และของตกแต่งที่ทำโดยช่างจากสายงานอื่น ได้แก่ ช่างถักเชือก ช่างโลหะ ช่างเครื่องเขิน และช่างทำเชือกกระดาษ"}},"items":{"kaga-yuzen":{"name":"คางะยูเซ็น (Kaga Yuzen) ผ้าไหมวาดมือ","region":"คานาซาวะ จังหวัดอิชิกาวะ","era":"ต้นศตวรรษที่ 18","about":"รูปแบบการย้อมด้วยการวาดมือจากแคว้นคางะในอดีต โดดเด่นด้วยภาพดอกไม้และพืชที่สมจริง วาดด้วย ‘ห้าสีแห่งคางะ’ ได้แก่ คราม แดงเข้ม เหลืองดิน เขียวใบหญ้า และม่วงเข้ม","process":"ร่างลายด้วยเส้นแป้งข้าวบาง ๆ เพื่อกันสีไม่ให้ซึมเลอะ จากนั้นลงสีแต่ละส่วนด้วยพู่กัน โดยไล่เฉดจากขอบนอกเข้าหาตรงกลาง โดยปกติศิลปินคนเดียวจะดูแลงานทั้งชิ้น","look":"ลวดลายธรรมชาติแบบภาพวาด บางครั้งมีใบไม้ ‘ถูกแมลงกัด’ (มุชิกุอิ / mushikui) วาดไว้ด้วย ใช้ทองหรืองานปักน้อยมากหรือไม่ใช้เลย"},"kyo-yuzen":{"name":"เกียวยูเซ็น (Kyo Yuzen) ผ้าไหมวาดมือแห่งเกียวโต","region":"เกียวโต","era":"ปลายศตวรรษที่ 17","about":"ยูเซ็น (yuzen) รูปแบบดั้งเดิม ตั้งชื่อตามมิยาซากิ ยูเซ็นไซ จิตรกรผู้วาดพัดในเกียวโต ทำให้การออกแบบกิโมโนมีอิสระเหมือนงานจิตรกรรม และกลายเป็นรูปแบบคลาสสิกของชุดพิธีการ","process":"งานแบ่งออกเป็นราวยี่สิบขั้นตอน แต่ละขั้นตอนมีช่างผู้เชี่ยวชาญรับผิดชอบ ได้แก่ ออกแบบ ร่างเส้น ลงแป้งข้าวกันสี ลงสีด้วยพู่กัน นึ่ง ล้าง และสุดท้ายประดับแผ่นทองและงานปัก","look":"ลวดลายสง่างามแบบราชสำนักในสีสันเข้มข้น ไล่เฉดจากตรงกลางออกไปด้านนอก มักตกแต่งด้วยทองและงานปัก"},"edo-komon":{"name":"เอโดะโคมง (Edo Komon) ย้อมลายละเอียดผ่านแม่แบบ","region":"โตเกียว","era":"ศตวรรษที่ 17 (สมัยเอโดะ)","about":"ลวดลายเล็กจิ๋วซ้ำ ๆ ย้อมด้วยสีเดียว ละเอียดจนมองจากไกลดูเหมือนผ้าพื้น เริ่มต้นจากชุดพิธีของซามูไร และเจ้าแคว้นแต่ละคนมีลวดลายเฉพาะของตนเอง","process":"แกะลวดลายลงบนแม่แบบที่ทำจากกระดาษวาชิ (washi) ซ้อนหลายชั้นและเคลือบให้แข็งด้วยน้ำลูกพลับ ช่างวางแม่แบบบนผ้าไหม ปาดแป้งข้าวผ่านแม่แบบ เลื่อนต่อให้ตรงกันอย่างแม่นยำ แล้วจึงย้อมผ้าทั้งผืน","look":"มองใกล้ ๆ: จุด คลื่น หรือเส้นเล็ก ๆ นับพัน มองห่างไปไม่กี่ก้าว: ผ้าสีพื้นที่ดูเรียบสงบ"},"tsujigahana":{"name":"สึจิงาฮานะ (Tsujigahana) ย้อมกันสีด้วยการเย็บ","region":"เกียวโตและพื้นที่อื่น ๆ","era":"ศตวรรษที่ 15 – ต้นศตวรรษที่ 17","about":"รูปแบบหรูหราแห่งสมัยมุโรมาจิและโมโมยามะ ผสมผสานมัดย้อมแบบเย็บเข้ากับการวาดหมึก แผ่นทอง และงานปัก หายไปในต้นทศวรรษ 1600 และภายหลังถูกเรียกว่า ‘ผ้าย้อมในตำนาน’","process":"เย็บรอบโครงลวดลายแล้วรูดให้แน่นเพื่อไม่ให้สีซึมเข้า และย้อมผ้าหลายขั้นตอน จากนั้นวาดรายละเอียดเล็ก ๆ เช่น เส้นใบไม้ด้วยหมึก ศิลปินสมัยใหม่ได้ฟื้นฟูรูปแบบนี้ขึ้นมาอีกครั้งในศตวรรษที่ 20","look":"รูปทรงนุ่มนวล พร่าเล็กน้อย ขอบย่น ผสานกับลายเส้นหมึกที่ประณีต"},"sarasa":{"name":"ซาราสะ (Sarasa) ลายพิมพ์แบบต่างแดน","region":"ต้นกำเนิดจากอินเดีย ผลิตในนางาซากิ ซาไก เกียวโต และเอโดะ","era":"ศตวรรษที่ 16–17","about":"ผ้าฝ้ายลวดลายสีสันจากอินเดียและเอเชียตะวันออกเฉียงใต้ที่เข้ามาผ่านการค้ากับต่างประเทศ ลายดอกไม้ นก และลายเรขาคณิตแบบต่างแดนเป็นที่หวงแหน และไม่นานช่างญี่ปุ่นก็ทำขึ้นเองในแบบของตน","process":"ในอินเดีย ลวดลายถูกวาดหรือพิมพ์ด้วยแม่พิมพ์ไม้โดยใช้สารช่วยติดสีและขี้ผึ้ง ส่วน ‘วะซาราสะ’ (wa-sarasa) ของญี่ปุ่นมักใช้แม่แบบกระดาษหลายแผ่น แผ่นละหนึ่งสี ลงทีละแผ่นตามลำดับ","look":"ลายดอกไม้และลายคล้ายเพสลีย์ที่หนาแน่นแบบต่างแดน ในโทนแดงดิน คราม และน้ำตาล"},"kinsai":{"name":"การตกแต่งด้วยแผ่นทอง","region":"เกียวโต","era":"มีมาแต่โบราณ รุ่งเรืองในศตวรรษที่ 16","about":"ศิลปะการตกแต่งกิโมโนที่เสร็จแล้วด้วยทองและเงินแท้ มักเป็นขั้นตอนสุดท้ายของกิโมโนพิธีการที่ย้อมแบบยูเซ็น ช่วยเพิ่มประกายให้ดอกไม้ ก้อนเมฆ และเส้นขอบ","process":"ทากาวผ่านแม่แบบหรือวาดด้วยกรวยปลายเล็ก แล้วกดแผ่นทองลงไปและปัดส่วนที่ไม่ต้องการออก นอกจากนี้ยังโรยทองเป็นเกล็ดเล็ก ๆ หรือวาดเป็นเส้นด้วยทองผสมกาวได้ด้วย","look":"รายละเอียดสีทองหรือเงินเปล่งประกายบนลายย้อม สะท้อนแสงเมื่อผู้สวมใส่เคลื่อนไหว"},"oshima":{"name":"โอชิมะ (Oshima) ผ้าสึมุงิย้อมโคลน","region":"เกาะอามามิโอชิมะ จังหวัดคาโกชิมะ","era":"ประวัติศาสตร์กว่า 1,300 ปี","about":"หนึ่งในผ้ากิโมโนที่มีชื่อเสียงที่สุดของญี่ปุ่น สีดำอมน้ำตาลเข้มเงางามได้จากการย้อมไหมด้วยต้นไม้ท้องถิ่น แล้วย้อมต่อด้วยโคลนที่อุดมด้วยธาตุเหล็ก ผ้าเบา ลื่น และแทบไม่ยับเลย","process":"ก่อนอื่นนำด้ายมาทอแน่นเป็นเสื่อชั่วคราวเพื่อกันลวดลายไว้ ย้อมเสื่อนั้นด้วยเปลือกต้นชารินไบ (sharinbai) หลายสิบครั้งแล้วย้อมด้วยโคลน จากนั้นแกะออก และนำด้ายมาทอใหม่ทีละเส้น โดยจัดจุดเล็ก ๆ ทุกจุดให้ตรงกันด้วยมือ","look":"พื้นผิวสีเข้มลื่นเหมือนไหม กับลวดลายเรขาคณิตละเอียดมากที่เกิดจากกากบาทเล็ก ๆ"},"yuki":{"name":"ยูกิ (Yuki) ผ้าสึมุงิปั่นมือ","region":"ยูกิ จังหวัดอิบารากิ และโอยามะ จังหวัดโทจิงิ","era":"มีต้นกำเนิดในสมัยนาระ (ศตวรรษที่ 8) หรือก่อนหน้านั้น มีชื่อเสียงตั้งแต่ศตวรรษที่ 17","about":"ได้รับการขึ้นทะเบียนเป็นมรดกวัฒนธรรมที่จับต้องไม่ได้โดยยูเนสโกในปี 2010 ว่ากันว่าเป็นกิโมโนลำลองที่หรูหราที่สุด อบอุ่นและเบา ยิ่งสวมนานยิ่งนุ่ม","process":"ปั่นไหมด้วยมือจากใยไหมโดยไม่บิดเกลียว ด้ายสำหรับลวดลายถูกมัดด้วยมือ ย้อม แล้วทอบนกี่เอว ซึ่งร่างกายของช่างทอเป็นตัวดึงด้ายยืนให้ตึง ผ้าหนึ่งม้วนอาจใช้เวลาหลายเดือนจนถึงมากกว่าหนึ่งปี","look":"พื้นผิวนุ่ม ไม่เรียบเสมอกันเล็กน้อย แล ้นผม แล้วต่อปลายเข้าด้วยกัน หลังทอเสร็จ ผ้าเอจิโงะโจฟุจะถูกนำไปวางบนหิมะในวันแดดดีช่วงฤดูใบไม้ผลิเพื่อฟอกขาวตามธรรมชาติ","look":"เบา โปร่งแสง และเย็นสบาย สัมผัสกรอบคล้ายกระดาษเล็กน้อย"},"omeshi":{"name":"โอเมชิ (Omeshi) ผ้าเครปทอ","region":"เกียวโต (นิชิจิน), คิริว, ชิโอซาวะ","era":"สมัยเอโดะ","about":"ผ้าเครปไหมแบบทอ ตั้งชื่อตามโชกุนโทกูงาวะ อิเอนาริ ผู้ชื่นชอบผ้านี้ คำว่าโอเมชิหมายถึง ‘สิ่งที่ผู้สูงศักดิ์สวมใส่’ อยู่กึ่งกลางระหว่างกิโมโนแบบย้อมและแบบทอ เหมาะกับการเยี่ยมเยียนอย่างเป็นทางการและงานเลี้ยง","process":"ย้อมด้ายก่อนทอ ด้ายพุ่งถูกบิดเกลียวแน่นมากและลงแป้ง หลังทอเสร็จ น้ำอุ่นจะคลายเกลียวและทำให้เกิดผิวผ้าย่นละเอียด","look":"ผ้าเครปเนื้อแน่น มีผิวสัมผัสเป็นเม็ดละเอียด คงรูปและไม่ยับง่าย"},"chirimen":{"name":"จิริเมง (Chirimen) ผ้าเครปไหม","region":"ทังโงะ (เกียวโต), นางาฮามะ (ชิงะ)","era":"ตั้งแต่ศตวรรษที่ 16 ทังโงะตั้งแต่ศตวรรษที่ 18","about":"ผ้าเครปไหมเนื้อนุ่มที่ใช้เป็นผ้าพื้นของกิโมโนแบบย้อมส่วนใหญ่ รวมถึงยูเซ็น ผิวย่นช่วยให้รับสีได้สวยงามและทิ้งตัวอย่างสง่างาม","process":"ด้ายพุ่งถูกบิดเกลียวหลายพันรอบต่อเมตร สลับเกลียวซ้ายและขวา หลังทอเสร็จนำผ้าไปต้มเพื่อขจัดกาวไหม ด้ายจะพยายามคลายเกลียว และผ้าหดตัวเป็นรอยย่นเล็ก ๆ ที่เรียกว่าชิโบะ (shibo)","look":"ผิวนุ่มที่มีสันนูนเล็ก ๆ ทั่วผืน ขนาดของรอยย่นแตกต่างกันตามชนิด"},"nishijin":{"name":"นิชิจิน (Nishijin) ผ้ายก","region":"ย่านนิชิจิน เกียวโต","era":"ได้ชื่อในศตวรรษที่ 15 มีการทอผ้าที่นี่ตั้งแต่ศตวรรษที่ 5–6","about":"ผ้ายกชั้นนำของญี่ปุ่น ตั้งชื่อตาม ‘ค่ายตะวันตก’ ในสงครามโอนิน ช่างทอนิชิจินผลิตโอบิอันงดงามและผ้าสำหรับราชสำนัก วัด และละครโน (Noh)","process":"ย้อมด้ายเป็นสีต่าง ๆ หลายสิบสีก่อนทอ และใช้ร่วมกับด้ายทองและด้ายเงิน กี่แจ็คการ์ดถูกนำเข้าจากฝรั่งเศสในทศวรรษ 1870 ขณะที่งานทอแบบผ้าทอภาพชั้นเยี่ยมยังคงทำด้วยมือ โดยใช้เล็บที่ตัดเป็นหยักเคาะด้ายพุ่ง","look":"ผ้าหนาลวดลายวิจิตร มีด้ายทองและเงิน มักพบเป็นโอบิแบบเป็นทางการ"},"saga-nishiki":{"name":"ซากะนิชิกิ (Saga Nishiki) ผ้ายกกระดาษและไหม","region":"ซากะ","era":"ปลายสมัยเอโดะ","about":"ผ้ายกหายากจากแคว้นคาชิมะ ตำนานเล่าว่าภรรยาของเจ้าแคว้นได้แรงบันดาลใจจากลายสานไม้ไผ่ (อาจิโระ) บนเพดานจึงคิดค้นขึ้น และสืบทอดกันมาในหมู่สตรีในราชสำนักของแคว้น เดิมเรียกว่า คาชิมะนิชิกิ ก่อนได้ชื่อใหม่ว่า ‘ซากะนิชิกิ’ ในงานนิทรรศการญี่ปุ่น-อังกฤษปี 1910","process":"ด้ายยืนทำจากกระดาษวาชิตัดเป็นเส้นบาง ๆ ที่เคลือบทอง เงิน หรือแล็กเกอร์ ใช้ไม้พายไผ่เล็ก ๆ ช้อนเส้นกระดาษขึ้นทีละเส้น แล้วสอดด้ายพุ่งไหมสีผ่านเข้าไป ทอได้เพียงไม่กี่เซนติเมตรต่อวัน","look":"ลวดลายเรขาคณิตเล็กและแม่นยำบนพื้นทองระยิบระยับ ใช้ทำโอบิพิธีการ กระเป๋า และเครื่องประดับ"},"hakata":{"name":"ฮากาตะ (Hakata) ผ้าทอ","region":"ฟุกุโอกะ","era":"ปี 1241","about":"ริเริ่มโดยพ่อค้าผู้เรียนการทอผ้าในจีนสมัยราชวงศ์ซ่ง ในสมัยเอโดะ เจ้าแคว้นท้องถิ่นนำไปถวายโชกุนทุกปี ลายคลาสสิกจึงเรียกว่าฮากาตะ ‘เค็นโจ’ (kenjo – เครื่องบรรณาการ)","process":"ด้ายยืนเส้นเล็กจำนวนมากถูกเรียงแน่น และเคาะด้ายพุ่งเส้นหนาให้แน่น ลวดลายจึงเกิดจากด้ายยืนเป็นหลัก ลายคลาสสิกได้มาจากเครื่องมือพิธีกรรมทางพุทธศาสนาและลายทาง","look":"โอบิเนื้อแน่นที่มีเสียง ‘คิว-คิว’ เวลาผูก และไม่หลุดหลวม"},"wana":{"name":"วานะ (Wana) ผ้าทอห่วงขน","region":"เกียวโต","era":"ตั้งแต่ศตวรรษที่ 17","about":"‘วานะ’ แปลว่าห่วง การทอแบบนี้ทำให้เกิดห่วงไหมเล็ก ๆ นูนขึ้นบนผิวผ้า เป็นเทคนิคเดียวกับที่ใช้ทำกำมะหยี่ในญี่ปุ่น ทำให้โอบิและเสื้อคลุมมีลายนูนนุ่ม","process":"สอดลวดเส้นบางไว้ใต้ด้ายยืนระหว่างทอเพื่อยกด้ายให้เป็นห่วง แล้วดึงลวดออก ถ้าคงห่วงไว้จะเป็นวานะ ถ้าตัดห่วงจะกลายเป็นกำมะหยี่ ลวดลายสามารถผสมทั้งห่วงที่ตัดและไม่ตัดได้","look":"ลวดลายนูนคล้ายกำมะหยี่จากห่วงเล็ก ๆ สัมผัสนุ่มมือ"},"sagara":{"name":"ซางาระ (Sagara) งานปักปม","region":"มาจากจีน ทำในเกียวโตและทั่วญี่ปุ่น","era":"เทคนิคโบราณ","about":"งานปักที่ประกอบด้วยปมเล็ก ๆ นับไม่ถ้วน คล้ายเฟรนช์นอต (French knot) ให้พื้นผิวสามมิติคล้ายลูกปัดและทนทานมาก จึงใช้สำหรับจุดเน้นและเส้นขอบ","process":"พันด้ายรอบเข็มแล้วดึงลงผ่านผ้าให้เกิดปมเล็ก ๆ เรียงปมทีละปมเพื่อเติมรูปทรงหรือวาดเส้น","look":"จุดนูนเรียงชิดกันแน่นเหมือนไข่มุกเม็ดจิ๋ว"},"kinkoma":{"name":"คินโคมะ (Kinkoma) งานปักตรึงด้ายทอง","region":"เกียวโตและทั่วญี่ปุ่น","era":"เทคนิคโบราณ","about":"ด้ายทองแข็งเกินกว่าจะสอดผ่านผ้าไหมได้ จึงวางไว้บนผิวผ้าแล้วตรึงให้อยู่กับที่ ทำให้เส้นขอบและลวดลายมีเส้นทองที่โดดเด่นเปล่งประกาย","process":"ด้ายทองที่พันบนหลอดไม้เล็ก ๆ (โคมะ / koma) ถูกวางตามลวดลาย มักวางเป็นคู่ แล้วตรึงไว้เป็นระยะสั้น ๆ ด้วยด้ายไหมเส้นเล็ก","look":"เส้นทองเรียบต่อเนื่องที่วางอยู่บนผิวผ้า"},"takeyamachi":{"name":"ทาเคยามาจิ (Takeyamachi) งานปักบนผ้าโปร่ง","region":"ทาเคยามาจิ เกียวโต","era":"สมัยเอโดะ","about":"งานปักบนผ้าไหมโปร่งเนื้อตาห่าง ตั้งชื่อตามถนนในเกียวโตที่เป็นจุดเริ่มต้น ฝีเข็มเดินตามตารางของเนื้อผ้าอย่างใกล้ชิดจนผลงานดูเหมือนผ้าทอมากกว่างานปัก","process":"สอดด้ายทองแบนเป็นหลัก (บางครั้งใช้ด้ายไหมสีด้วย) ผ่านรูเล็ก ๆ ของผ้าโปร่ง โดยนับทีละรู เพื่อเติมลวดลายคล้ายงานโมเสก","look":"ลวดลายทองคมชัดดูเหมือนงานทอบนผ้าโปร่งบาง ใช้กับโอบิ ฟุกุสะ (fukusa) และงานเย็บติดภาพม้วนแขวน"},"swatow":{"name":"ซัวเถา (Swatow) งานปักฉลุ","region":"ซัวเถา (Shantou) มณฑลกวางตุ้ง ประเทศจีน","era":"ปลายศตวรรษที่ 19","about":"งานปักฉลุอันประณีตจากจีนตอนใต้ ผสมผสานงานปักแบบจีนเข้ากับงานลูกไม้แบบยุโรป กิโมโนที่ปักแบบซัวเถาเป็นที่รักในญี่ปุ่นมาช้านานในฐานะชุดที่สง่างามและประณีต","process":"ดึงด้ายออกจากผ้าหรือตัดผ้าออกเป็นช่องเล็ก ๆ แล้วเย็บรัดขอบและเติมช่องด้วยฝีเข็มละเอียดให้เป็นลวดลายคล้ายลูกไม้ ทั้งหมดทำด้วยมือ","look":"ลวดลายลูกไม้โทนสีเดียวกับผ้า มีช่องโปร่งเล็ก ๆ มักเป็นสีขาวหรือสีพาสเทลอ่อน"},"suzhou":{"name":"งานปักไหมซูโจว (Suzhou)","region":"ซูโจว มณฑลเจียงซู ประเทศจีน","era":"กว่า 2,000 ปี","about":"หนึ่งในสี่สุดยอดงานปักของจีน มีชื่อเสียงด้านความละเอียดสูงสุด บนกิโมโนและโอบิใช้ปักสัตว์และดอกไม้ที่เหมือนจริง","process":"แยกด้ายไหมเส้นเดียวออกเป็นเส้นใยบางเท่าเส้นผมได้มากถึงหลายสิบเส้น ผสมสีทีละฝีเข็ม และบางชิ้นปักให้เห็นภาพสมบูรณ์ทั้งสองด้าน","look":"สมจริงราวภาพถ่าย เช่น แมวที่มองเห็นขนได้ทีละเส้น"},"ran":{"name":"งานปักฝีเข็มอิสระ (หลวนเจิน)","region":"ฉางโจว มณฑลเจียงซู ประเทศจีน และพบบนกิโมโนและโอบิด้วย","era":"คิดค้นขึ้นในต้นศตวรรษที่ 20 (ทศวรรษ 1920–30)","about":"งานปักที่ฝีเข็มต่างความยาวและต่างทิศทางไขว้ซ้อนกัน คล้ายรอยพู่กันในภาพสีน้ำมัน ถ่ายทอดขนสัตว์ ขนนก แสงและเงาได้อย
