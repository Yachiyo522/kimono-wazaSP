rde zum klassischen Stil für formelle Kleidung.","process":"Die Arbeit ist in rund zwanzig Schritte gegliedert, die jeweils ein Spezialist übernimmt: Entwurf, Vorzeichnen der Umrisse, Auftragen der Reispasten-Reserve, Kolorieren mit dem Pinsel, Dämpfen, Spülen und zuletzt das Aufbringen von Blattgold und Stickerei.","look":"Elegante, höfische Motive in satten Farben, von der Mitte nach außen schattiert, oft mit Gold und Stickerei vollendet."},"edo-komon":{"name":"Edo Komon – feine Schablonenfärbung","region":"Tokyo","era":"17. Jahrhundert (Edo-Zeit)","about":"Winzige, sich wiederholende Muster in einer einzigen Farbe, so fein, dass der Stoff aus der Ferne einfarbig wirkt. Sie entstanden mit der Zeremonialkleidung der Samurai, und jeder Feudalherr hatte sein eigenes, ihm vorbehaltenes Muster.","process":"Die Muster werden in Schablonen aus mehrlagigem Washi-Papier geschnitten, das mit Kakisaft gehärtet ist. Der Handwerker legt die Schablone auf die Seide, streicht Reispaste hindurch, setzt sie passgenau weiter und färbt dann den ganzen Stoff.","look":"Aus der Nähe: Tausende winzige Punkte, Wellen oder Linien. Aus ein paar Schritten Entfernung: eine ruhige, einheitliche Farbe."},"tsujigahana":{"name":"Tsujigahana – genähte Reservefärbung","region":"Kyoto und andere Regionen","era":"15. – frühes 17. Jahrhundert","about":"Ein luxuriöser Stil der Muromachi- und Momoyama-Zeit, der genähtes Shibori mit Tuschmalerei, Blattgold und Stickerei verband. Er verschwand Anfang des 17. Jahrhunderts und wurde später „die Phantomfärbung“ genannt.","process":"Die Umrisse der Motive werden genäht und festgezogen, damit keine Farbe eindringt, und der Stoff wird in mehreren Stufen gefärbt. Feine Details wie Blattadern werden danach mit Tusche gemalt. Im 20. Jahrhundert ließen moderne Künstler den Stil wieder aufleben.","look":"Weiche, leicht verschwommene Formen mit gekräuselten Rändern, kombiniert mit zarter Tuschzeichnung."},"sarasa":{"name":"Sarasa (exotische Druckmuster)","region":"Ursprünglich Indien; hergestellt in Nagasaki, Sakai, Kyoto und Edo","era":"16.–17. Jahrhundert","about":"Bunt gemusterte Baumwolle aus Indien und Südostasien, die über den Außenhandel ins Land kam. Ihre exotischen Blumen, Vögel und geometrischen Motive waren sehr begehrt, und japanische Handwerker fertigten bald eigene Versionen.","process":"In Indien wurden die Muster mit Beizen und Wachs gezeichnet oder mit Modeln gedruckt. Das japanische „Wa-Sarasa“ entstand meist mit vielen Papierschablonen, einer pro Farbe, die nacheinander aufgetragen wurden.","look":"Dichte, fremdländisch wirkende Blumen- und Paisley-ähnliche Muster in erdigem Rot, Indigo und Brauntönen."},"kinsai":{"name":"Blattgold-Verzierung","region":"Kyoto","era":"Uralt; Blütezeit im 16. Jahrhundert","about":"Die Kunst, fertige Kimonos mit echtem Gold und Silber zu verzieren. Sie ist meist der letzte Schliff bei Yuzen-gefärbten formellen Kimonos und lässt Blumen, Wolken und Umrisse leuchten.","process":"Klebstoff wird durch eine Schablone aufgetragen oder mit einer feinen Tüte gezeichnet, dann wird Blattgold aufgedrückt und dort, wo es nicht bleiben soll, abgepinselt. Gold kann auch als winzige Flocken aufgestreut oder als Linien aus Goldpaste gezogen werden.","look":"Glänzende Gold- oder Silberdetails auf einem gefärbten Motiv, die bei jeder Bewegung das Licht einfangen."},"oshima":{"name":"Oshima – schlammgefärbte Pongé-Seide","region":"Insel Amami Oshima, Kagoshima","era":"Über 1.300 Jahre Geschichte","about":"Einer der berühmtesten Kimonostoffe Japans. Sein tiefes, glänzendes Schwarzbraun entsteht, indem die Seide mit einem einheimischen Baum und danach in eisenhaltigem Schlamm gefärbt wird. Er ist leicht, glatt und knittert fast nie.","process":"Die Fäden werden zunächst fest zu einer provisorischen Matte verwebt, um das Muster auszusparen. Die Matte wird Dutzende Male mit Sharinbai-Rinde und dann in Schlamm gefärbt, wieder aufgetrennt, und die Fäden werden einzeln neu verwebt, wobei jeder winzige Punkt von Hand angepasst wird.","look":"Eine dunkle, seidige Oberfläche mit äußerst feinen geometrischen Mustern aus winzigen Kreuzen."},"yuki":{"name":"Yuki – handgesponnene Pongé-Seide","region":"Yuki (Ibaraki) und Oyama (Tochigi)","era":"Ursprünge in der Nara-Zeit (8. Jahrhundert) oder früher; berühmt seit dem 17. Jahrhundert","about":"Seit 2010 von der UNESCO als Immaterielles Kulturerbe gelistet. Er gilt als luxuriösester Alltagskimono: warm und leicht, und je länger man ihn trägt, desto weicher wird er.","process":"Die Seide wird ohne jede Drehung von Hand aus Seidenwatte gesponnen. Die Musterfäden werden von Hand abgebunden, gefärbt und auf einem Rückengurtwebstuhl verwebt, bei dem der Körper der Weberin selbst die Kette spannt. Ein Stoffballen kann Monate bis über ein Jahr dauern.","look":"Eine weiche, leicht unregelmäßige Struktur und ein matter, sanfter Schimmer."},"ushikubi":{"name":"Ushikubi – Pongé aus Doppelkokons","region":"Hakusan, Ishikawa","era":"Über 800 Jahre","about":"Eine seltene Pongé-Seide aus einem Bergdorf, hergestellt aus „Doppelkokons“, die zwei Seidenraupen gemeinsam spinnen. Sie ist so fest, dass man sie „Nagelzieher-Pongé“ nannte: Bleibt sie an einem Nagel hängen, zieht der Stoff den Nagel heraus, statt zu reißen.","process":"Der Faden wird direkt in heißem Wasser von den Doppelkokons abgehaspelt, was ihm natürliche Verdickungen gibt. Der Stoff wird zuerst weiß gewebt und danach oft gefärbt, sogar mit Yuzen-Malerei.","look":"Eine robuste Seide mit kleinen natürlichen Knötchen und einem ruhigen, warmen Glanz."},"kihachijo":{"name":"Kihachijo – gelbe Inselseide","region":"Insel Hachijo, Tokyo","era":"Belegt seit der Muromachi-Zeit; beliebt in der Edo-Zeit","about":"Eine Seide, die auf einer abgelegenen Insel mit nur drei natürlichen Farben aus Inselpflanzen gewebt wird: Goldgelb, Rostbraun und Schwarz. Bei den Stadtbewohnern von Edo wurde sie zur Mode.","process":"Gelb stammt vom Kariyasu-Gras, Braun aus Tabunoki-Rinde und Schwarz aus Pasania-Rinde, die mit eisenhaltigem Schlamm behandelt wird. Die Fäden werden immer wieder gefärbt und dann zu Karos und Streifen verwebt.","look":"Leuchtend gelbe, braune und schwarze Karos oder Streifen mit glänzendem Finish."},"meisen":{"name":"Meisen – Seide mit bedruckten Fäden","region":"Isesaki, Chichibu, Ashikaga, Kiryu, Hachioji","era":"Boom in den 1910er- bis 1930er-Jahren","about":"Erschwingliche Seide, die in der Taisho- und frühen Showa-Zeit Mode zu ganz normalen Frauen brachte. Ihre kühnen Jugendstil- und Art-déco-Designs sind heute bei Vintage-Sammlern in aller Welt beliebt.","process":"Die Kette wird lose geheftet und das Muster mit Schablonen daraufgedruckt. Beim Weben wird die Heftung entfernt und der eigentliche Schuss eingetragen, sodass sich die Farben leicht verschieben und die Ränder sanft verschwimmen.","look":"Kühne, moderne Muster mit federartigen, leicht versetzten Konturen."},"jofu":{"name":"Jofu – feines Ramiegewebe","region":"Echigo (Niigata), Miyako (Okinawa), Omi (Shiga), Noto (Ishikawa)","era":"Über 1.200 Jahre","about":"„Edles Tuch“: ein äußerst feiner, steif-griffiger Stoff aus Ramiefaser, der im Hochsommer getragen wird. Echigo Jofu und Ojiya Chijimi stehen auf der UNESCO-Liste des Immateriellen Kulturerbes.","process":"Die Ramiefasern werden von Hand in haarfeine Strähnen gespalten und aneinandergeknüpft. Nach dem Weben wird Echigo Jofu bei sonnigem Frühlingswetter auf Schnee ausgelegt und so natürlich gebleicht.","look":"Leicht, durchscheinend und kühl, mit einem trockenen, fast papierartigen Griff."},"omeshi":{"name":"Omeshi – gewebter Krepp","region":"Kyoto (Nishijin), Kiryu, Shiozawa","era":"Edo-Zeit","about":"Ein gewebter Seidenkrepp, benannt nach dem Shogun Tokugawa Ienari, der ihn liebte: Omeshi bedeutet „von einer verehrten Person getragen“. Er steht zwischen gefärbtem und gewebtem Kimono und passt zu eleganten Besuchen und Feiern.","process":"Die Fäden werden vor dem Weben gefärbt. Der Schuss wird sehr stark gedreht und gestärkt; nach dem Weben löst warmes Wasser die Drehung und erzeugt eine fein gekräuselte Oberfläche.","look":"Ein fester Krepp mit dezent körniger Struktur, der seine Form hält und kaum knittert."},"chirimen":{"name":"Chirimen – Seidenkrepp","region":"Tango (Kyoto), Nagahama (Shiga)","era":"Seit dem 16. Jahrhundert; Tango seit dem 18.","about":"Der weiche Seidenkrepp, der als Grundstoff für die meisten gefärbten Kimonos dient, auch für Yuzen. Seine gekräuselte Oberfläche nimmt Farbe wunderschön an und fällt anmutig.","process":"Die Schussfäden werden tausende Male pro Meter gedreht, abwechselnd links- und rechtsherum. Nach dem Weben wird der Stoff gekocht, um den Seidenleim zu entfernen; die Fäden wollen sich zurückdrehen, und der Stoff zieht sich zu winzigen Kräuseln zusammen, die Shibo heißen.","look":"Eine weiche Oberfläche voller winziger Rippen; die Größe der Kräuselung variiert je nach Art."},"nishijin":{"name":"Nishijin-Brokat","region":"Stadtteil Nishijin, Kyoto","era":"Benannt im 15. Jahrhundert; Weberei hier seit dem 5.–6. Jahrhundert","about":"Japans führender Brokat, benannt nach dem „Westlichen Lager“ im Onin-Krieg. Die Weber von Nishijin fertigen prächtige Obi und Stoffe für den Kaiserhof, Tempel und das Noh-Theater.","process":"Die Fäden werden vor dem Weben in Dutzenden Farben gefärbt und mit Gold- und Silberfäden kombiniert. Jacquard-Webstühle kamen in den 1870er-Jahren aus Frankreich, während die feinste Bildwirkerei noch immer von Hand entsteht: Der Schuss wird mit gezahnten Fingernägeln angeschlagen.","look":"Schwerer, reich gemusterter Stoff mit Gold- und Silberfäden; meist als formeller Obi zu sehen."},"saga-nishiki":{"name":"Saga Nishiki – Brokat aus Papier und Seide","region":"Saga","era":"Späte Edo-Zeit","about":"Ein seltener Brokat aus dem Kashima-Lehen. Der Legende nach erdachte ihn die Frau des Fürsten, inspiriert vom geflochtenen Bambusmuster (Ajiro) ihrer Zimmerdecke, und er wurde unter den Damen des Hauses weitergegeben. Zunächst Kashima Nishiki genannt, erhielt er auf der Japanisch-Britischen Ausstellung 1910 den Namen „Saga Nishiki“.","process":"Die Kette besteht aus dünnen Streifen Washi-Papier, die mit Gold, Silber oder Lack überzogen sind. Ein kleiner Bambusspatel hebt die Papierstreifen einzeln an, und der farbige Seidenschuss wird hindurchgeführt. Pro Tag lassen sich nur wenige Zentimeter weben.","look":"Winzige, präzise geometrische Muster auf schimmerndem Goldgrund; verwendet für formelle Obi, Taschen und Accessoires."},"hakata":{"name":"Hakata-Weberei","region":"Fukuoka","era":"1241","about":"Begründet von einem Kaufmann, der das Weben im China der Song-Dynastie gelernt hatte. In der Edo-Zeit überreichte der örtliche Fürst den Stoff jedes Jahr dem Shogun, daher heißt das klassische Design „Kenjo-Hakata“ (Kenjo = Opfergabe).","process":"Viele feine Kettfäden werden dicht gepackt und der dicke Schuss fest angeschlagen, sodass das Muster hauptsächlich von der Kette gebildet wird. Klassische Motive stammen von buddhistischen Ritualgegenständen und Streifen.","look":"Ein fester Obi, der beim Binden ein „kyu-kyu“-Geräusch macht und sich nie lockert."},"wana":{"name":"Wana – Schlingengewebe","region":"Kyoto","era":"Seit dem 17. Jahrhundert","about":"„Wana“ bedeutet Schlinge. Bei dieser Webart stehen kleine Seidenschlingen auf der Oberfläche hervor – dieselbe Technik, mit der in Japan Samt hergestellt wird. Sie verleiht Obi und Mänteln ein weiches, plastisches Relief.","process":"Dünne Drähte werden unter die Kette gewebt, um sie zu Schlingen anzuheben; danach werden die Drähte herausgezogen. Bleiben die Schlingen stehen, ist es Wana; werden sie aufgeschnitten, entsteht Samt. Muster können geschnittene und ungeschnittene Schlingen mischen.","look":"Ein erhabenes, samtiges Muster aus winzigen Schlingen, das sich weich anfühlt."},"sagara":{"name":"Sagara – Knotenstickerei","region":"Aus China; ausgeübt in Kyoto und ganz Japan","era":"Uralte Technik","about":"Eine Stickerei aus unzähligen winzigen Knoten, ähnlich wie Französische Knoten. Sie erzeugt eine perlenartige, dreidimensionale Struktur und ist sehr haltbar, daher wird sie für Akzente und Umrisse verwendet.","process":"Der Faden wird um die Nadel gewickelt und durch den Stoff nach unten gezogen, sodass ein kleiner Knoten entsteht. Knoten für Knoten werden aneinandergereiht, um eine Form zu füllen oder eine Linie zu ziehen.","look":"Erhabene Punkte, dicht an dicht wie winzige Perlen."},"kinkoma":{"name":"Kinkoma – aufgelegte Goldstickerei","region":"Kyoto und ganz Japan","era":"Uralte Technik","about":"Goldfaden ist zu steif, um durch Seide zu gehen, deshalb wird er auf die Oberfläche gelegt und dort fixiert. So erhalten Umrisse und Motive eine kräftige, glänzende Goldlinie.","process":"Goldfaden, aufgewickelt auf kleine Holzspulen (Koma), wird entlang des Motivs gelegt, meist paarweise, und in kurzen Abständen mit feinem Seidenfaden festgenäht.","look":"Glatte, durchgehende Goldlinien, die auf dem Stoff aufliegen."},"takeyamachi":{"name":"Takeyamachi – Stickerei auf Gaze","region":"Takeyamachi, Kyoto","era":"Edo-Zeit","about":"Eine Stickerei auf durchbrochener Seidengaze, benannt nach der Straße in Kyoto, in der sie entstand. Die Stiche folgen dem Raster des Stoffes so genau, dass das Ergebnis eher gewebt als gestickt aussieht.","process":"Hauptsächlich flacher Goldfaden (manchmal mit farbiger Seide) wird durch die winzigen Löcher der Gaze geführt, wobei jedes Loch gezählt wird, um das Motiv wie ein Mosaik zu füllen.","look":"Ein klares, gewebt wirkendes Goldmuster auf durchscheinender Gaze; verwendet für Obi, Fukusa und die Montierungen von Hängerollen."},"swatow":{"name":"Swatow – Durchbruchstickerei","region":"Shantou (Swatow), Guangdong, China","era":"Spätes 19. Jahrhundert","about":"Eine zarte Durchbruchstickerei aus Südchina, die chinesische Stickkunst mit europäischer Spitzenarbeit verbindet. Kimonos mit Swatow-Stickerei sind in Japan seit Langem als elegante, feine Kleidung geschätzt.","process":"Fäden werden aus dem Stoff gezogen oder kleine Flächen ausgeschnitten, und die Öffnungen werden mit feinen Stichen eingefasst und gefüllt, sodass spitzenartige Muster entstehen. Alles geschieht von Hand.","look":"Ton-in-Ton-Muster wie Spitze mit winzigen Öffnungen, oft in Weiß oder zarten Pastelltönen."},"suzhou":{"name":"Suzhou-Seidenstickerei","region":"Suzhou, Jiangsu, China","era":"Über 2.000 Jahre","about":"Eine der vier großen Stickereitraditionen Chinas, berühmt für ihre extreme Feinheit. Auf Kimonos und Obi wird sie für lebensechte Tiere und Blumen verwendet.","process":"Ein einzelner Seidenfaden wird in bis zu mehrere Dutzend haarfeine Fäserchen gespalten. Die Farben werden Stich für Stich gemischt, und manche Stücke sind so bestickt, dass beide Seiten ein fertiges Bild zeigen.","look":"Fotografischer Realismus, etwa Katzen, bei denen man einzelne Haare erkennen kann."},"ran":{"name":"Stickerei mit Zufallsstichen (Luanzhen)","region":"Changzhou, Jiangsu, China; auch auf Kimonos und Obi zu sehen","era":"Entstanden im frühen 20. Jahrhundert (1920er–30er-Jahre)","about":"Eine Stickerei, bei der sich Stiche unterschiedlicher Länge und Richtung kreuzen und überlagern, wie Pinselstriche in einem Ölgemälde. Sie gibt Fell, Federn, Licht und Schatten natürlich wieder.","process":"Statt die Stiche ordentlich nebeneinanderzulegen, schichtet die Stickerin sie frei in sich kreuzenden Richtungen und mischt in jeder Lage Farben, um Tiefe aufzubauen.","look":"Eine malerische Oberfläche mit sanften Übergängen statt klar erkennbarer Stichlinien."},"hitta":{"name":"Hitta – Shibori mit quadratischen Punkten","region":"Kyoto","era":"Im 17. Jahrhundert hoch entwickelt","about":"Die luxuriöseste Art von Shibori. Winzige quadratische Punkte sind diagonal aufgereiht; ein vollständig mit Hitta bedeckter Kimono heißt „So-Hitta“ und ist der Inbegriff von Luxus.","process":"Eine Handwerkerin kneift ein winziges Stück Stoff zusammen, faltet es vierfach und umwickelt es mehrmals mit Faden. Jeder Punkt wird von Hand abgebunden, sodass ein vollständig bedeckter Furisode ein Jahr oder länger dauern kann.","look":"Gleichmäßige, erhabene quadratische Punkte in ordentlichen diagonalen Reihen."},"kanoko":{"name":"Kanoko – „Rehkitz-Tupfen“-Shibori","region":"Kyoto und ganz Japan","era":"Seit alter Zeit","about":"„Kanoko“ bedeutet Rehkitz, denn die kleinen weißen Punkte mit farbiger Mitte erinnern an die Tupfen eines jungen Rehs. Es ist das bekannteste Shibori und findet sich auf Obiage, Kimonos und Accessoires.","process":"Kleine Stoffspitzen werden aufgenommen und vor dem Färben fest mit Faden abgebunden. Nach dem Färben und Lösen hinterlässt jede Spitze einen ringförmigen Punkt mit erhabener, noppiger Struktur.","look":"Kleine gepunktete Ringe mit einem winzigen farbigen „Auge“ in der Mitte."},"boshi":{"name":"Boshi – „Kappen“-Shibori","region":"Kyoto, Arimatsu","era":"Edo-Zeit","about":"„Boshi“ bedeutet Hut. Diese Methode schützt große Flächen eines Motivs vor der Farbe, indem man eine Kappe darüberstülpt; so lassen sich große Blumen oder Kreise weiß halten.","process":"Der Umriss wird genäht und gerafft, dann wird die Innenfläche wie mit einer Kappe abgedeckt – traditionell mit Bambusscheide, heute meist mit Vinyl – und vor dem Färben fest mit Faden abgebunden.","look":"Große ungefärbte Formen mit weichen, leicht fedrigen Rändern."},"nuishime":{"name":"Nuishime – genähtes Shibori","region":"Kyoto, Arimatsu-Narumi (Nagoya)","era":"Mindestens seit der Muromachi-Zeit","about":"Eine Shibori-Methode, die mit Vorstichen präzise Linien und Formen zeichnet. Sie erlaubt viel freiere Formen als das Abbinden allein.","process":"Das Motiv wird mit kleinen Vorstichen genäht, und die Fäden werden festgezogen, sodass sich der Stoff in Falten legt. Die gefalteten Bereiche nehmen keine Farbe an und hinterlassen einen gestrichelten Umriss.","look":"Klare Umrisse aus Reihen kleiner Striche."},"arashi":{"name":"Arashi – Stangenwickel-Shibori","region":"Arimatsu-Narumi (Nagoya)","era":"Spätes 19. Jahrhundert","about":"„Arashi“ bedeutet Sturm: Die diagonalen Linien sehen aus wie vom Wind getriebener Regen. Es ist ein Klassiker aus Arimatsu, Japans größter Shibori-Stadt, und beliebt für Yukata.","process":"Der Stoff wird diagonal um eine lange Stange gewickelt, mit Faden umbunden und zu engen Falten zusammengeschoben. Nur die äußeren Grate nehmen die Farbe an.","look":"Feine diagonale Linien, die wie schräger Regen aussehen."},"tatsumaki":{"name":"Tatsumaki – Wirbelwind-Shibori","region":"Arimatsu-Narumi (Nagoya), Kyoto","era":"Traditionelle Technik","about":"„Tatsumaki“ bedeutet Tornado. Ein Faden wird spiralförmig um den Stoff gewickelt, sodass sich das Muster dreht, als wäre es in einen Wirbelwind geraten.","process":"Der Stoff wird (oft nach dem Nähen oder Plissieren) um einen Kern zu einem langen runden Stab zusammengeschoben, und vor dem Färben wird ein Faden spiralförmig von oben nach unten gewickelt. Nur die freiliegende Oberfläche nimmt die Farbe an, sodass spiralförmige Bänder entstehen.","look":"Wirbelnde, spiralförmige Streifen voller Bewegung."},"yanagi":{"name":"Yanagi – Weiden-Shibori","region":"Arimatsu-Narumi (Nagoya)","era":"Edo-Zeit","about":"„Yanagi“ bedeutet Weide. Das Muster sieht aus wie Weidenzweige, die sich im Wind wiegen, und ist ein Favorit für Sommer-Yukata.","process":"Der Stoff wird längs in schmale Falten gerafft und in Abständen mit Faden abgebunden. Die Falten nehmen keine Farbe an und hinterlassen dünne, unterbrochene senkrechte Linien.","look":"Sanfte senkrechte Linien, die an herabhängende Weidenzweige erinnern."},"oke":{"name":"Oke – Bottich-Shibori","region":"Kyoto","era":"Traditionelle Technik aus Kyoto","about":"„Oke“ bedeutet Bottich. Diese seltene Technik hält große Teile des Stoffes trocken, indem sie in einem Holzbottich eingeschlossen werden; so sind große Flächen in verschiedenen Farben auf einem Kimono möglich. Nur noch sehr wenige Handwerker beherrschen sie.","process":"Der Teil, der ungefärbt bleiben soll, wird in einen Bottich aus Zypressenholz gepackt, und die Deckel werden fest auf dem Stoff verklemmt und verschnürt, während der zu färbende Teil draußen bleibt. Dann wird der ganze Bottich in ein größeres Färbebad getaucht. Das wird für jede Farbe wiederholt.","look":"Große, kräftige Farbblöcke in verschiedenen Farben mit klaren, leicht weichen Grenzen."},"itajime":{"name":"Itajime – Klemmfärbung zwischen Brettern","region":"Arimatsu, Kyoto und andernorts","era":"Seit dem 8. Jahrhundert","about":"Eine der ältesten Reservetechniken Japans; ihr Vorläufer Kyokechi (Färben zwischen geschnitzten Brettern) ist im Schatzhaus Shosoin aus dem 8. Jahrhundert erhalten. Gefalteter Stoff wird zwischen Bretter gepresst, um sich wiederholende Muster zu erzeugen.","process":"Der Stoff wird zu Dreiecken oder Quadraten gefaltet, fest zwischen Holzbretter geklemmt und dann in die Farbe getaucht. Die abgedeckten Bereiche bleiben weiß und bilden ein symmetrisches Muster.","look":"Sich wiederholende geometrische Formen, etwa schneeflockenartige Motive namens Sekka."},"tsukami":{"name":"Tsukami – „Griff“-Shibori","region":"Verschiedene Shibori-Zentren","era":"Traditionell","about":"„Tsukami“ bedeutet greifen. Der Stoff wird handvollweise zusammengerafft und abgebunden, sodass jedes Stück anders ausfällt. Das ergibt eine freie, natürliche Wirkung.","process":"Der Handwerker greift den Stoff, dreht ihn zu unregelmäßigen Bündeln und bindet sie vor dem Färben mit Faden ab. Die zufälligen Falten erzeugen unvorhersehbare Muster.","look":"Unregelmäßige, wolkige oder marmorierte Muster ohne Wiederholung."},"kumihimo":{"name":"Kumihimo – Seidenflechterei","region":"Kyoto, Iga (Mie)","era":"Seit dem 7.–8. Jahrhundert","about":"Geflochtene Seidenschnüre, zuerst für buddhistische Gegenstände und höfische Kleidung verwendet, später für Samurai-Rüstungen und Schwertschnüre. Heute kennt man sie vor allem als Obijime, die Schnur, die mittig um den Obi gebunden wird.","process":"Dutzende Seidenfäden werden auf beschwerte Spulen gewickelt und auf einem Holzgestell wie dem runden Marudai übereinander gekreuzt. Verschiedene Gestelle und Bewegungen ergeben runde, eckige oder flache Schnüre.","look":"Ein festes, gleichmäßiges Geflecht mit feinen diagonalen Mustern und reichen Farbkombinationen."},"zogan":{"name":"Zogan – Metalleinlegearbeit","region":"Kyoto, Kumamoto (Higo)","era":"Blüte in der Edo-Zeit an Schwert- und Gewehrbeschlägen","about":"Die Kunst, Gold und Silber in Eisen einzulegen. Früher schmückte sie Schwertbeschläge, heute ziert sie Kimono-Accessoires wie Obidome (Obi-Broschen) und Haarschmuck.","process":"Die Eisenoberfläche wird mit feinen, kreuzweise verlaufenden Rillen versehen. Gold- oder Silberfolie und -draht werden in die Rillen gehämmert, dann lässt man das Eisen gezielt rosten und brennt es mit Lack oder Öl zu tiefem Schwarz ein.","look":"Glänzende Gold- und Silbermotive vor tiefschwarzem Hintergrund."},"makie":{"name":"Maki-e – Goldlack","region":"Kyoto, Wajima, Kanazawa und andernorts","era":"Seit dem 8.–9. Jahrhundert","about":"Eine Lackkunst, bei der Motive mit Lack gezeichnet und mit Gold- oder Silberpulver bestreut werden. In der Kimonowelt findet man sie auf Kämmen, Haarnadeln, Obidome und Geta-Sandalen.","process":"Das Motiv wird mit Lack gemalt, und bevor er trocknet, wird feines Gold- oder Silberpulver durch ein Bambusröhrchen aufgestreut. Danach wird das Stück mehrmals überzogen und poliert.","look":"Zarte Goldbilder mit tiefem, glänzendem Schimmer auf schwarzem oder rotem Lack."},"mizuhiki":{"name":"Mizuhiki – Papierschnüre","region":"Iida (Nagano), Kanazawa (Ishikawa)","era":"Ursprünge reichen bis ins 7. Jahrhundert zurück","about":"Zierschnüre aus gedrehtem Washi-Papier, zu Knoten gebunden, die Glückswünsche überbringen. Sie schmücken Geschenkumschläge und dienen beim Kimono als Brauthaarschmuck und Obi-Verzierung.","process":"Washi wird zu dünnen Schnüren gedreht und mit Stärke versteift, dann gefärbt oder mit farbiger oder metallischer Folie umhüllt. Die Schnüre werden zu Knoten wie dem Awaji-Knoten gebunden oder zu Kranichen, Kiefern und Pflaumenblüten geformt.","look":"Glänzende, steife Schnüre, zu symmetrischen Knoten gebunden, oft in Rot-Weiß oder Gold-Silber."},"ro":{"name":"Ro – Sommergaze mit durchbrochenen Streifen","region":"Kyoto und andere Seidenwebgebiete","era":"Name ab dem 15. Jahrhundert belegt; verbreitet ab der Edo-Zeit","about":"Eine Sommerseide mit ordentlichen Reihen winziger Öffnungen, die Luft durchlassen. Sie ist der klassische Stoff für formelle wie alltägliche Kimonos in den heißesten Monaten, vom Früh- bis zum Spätsommer.","process":"Mehrere Reihen in Leinwandbindung werden gewebt, dann werden für eine Reihe jeweils zwei Kettfäden umeinander gedreht, sodass eine Linie von Lücken entsteht. Nach der Zahl der Leinwandreihen zwischen den Lücken heißt sie „dreireihiger Ro“, „fünfreihiger Ro“ und so weiter.","look":"Feine waagerechte (manchmal auch senkrechte) Linien kleiner Öffnungen auf einer sonst dichten Seide."},"sha":{"name":"Sha – vollständige Seidengaze","region":"Kyoto und andere Seidenwebgebiete","era":"Im 7.–8. Jahrhundert aus China gekommen","about":"Eine leichte, durchsichtige Seide, die im Hochsommer getragen wird. Sie ist leichter und transparenter als Ro und wird auch für sommerliche Haori und Mäntel verwendet, die über dem Kimono getragen werden.","process":"In jeder Reihe werden jeweils zwei Kettfäden umeinander gedreht und vom Schuss fixiert. So entsteht über das ganze Tuch ein gleichmäßiges, offenes Netz.","look":"Ein gleichmäßiges, durchscheinendes Netz ohne dichte Streifen; darunterliegende Lagen schimmern sanft hindurch."},"ra":{"name":"Ra – netzartige komplexe Gaze","region":"Kyoto","era":"Altertum (7.–8. Jahrhundert); im 20. Jahrhundert wiederbelebt","about":"Eine der ältesten und die komplexeste der Gazebindungen; Beispiele sind im Schatzhaus Shosoin aus dem 8. Jahrhundert erhalten. Die Technik geriet in Japan nach dem Mittelalter in Niedergang und wurde von modernen Webmeistern wiederbelebt. Heute sieht man sie vor allem bei luxuriösen Sommer-Obi.","process":"Jeder Kettfaden kreuzt hinüber und verdreht sich mit mehreren Nachbarfäden, nicht nur mit einem Partner, sodass die Fäden ein Netz bilden. Sie wird langsam von Hand auf einem speziellen Webstuhl gewebt.","look":"Ein dehnbares, netzartiges Gewebe mit rautenförmigen Öffnungen, oft mit Mustern, die im Netz erscheinen."},"kobai":{"name":"Kobai – Sommerstoff mit Waffelgitter","region":"Baumwoll- und Seidenwebgebiete in ganz Japan","era":"Traditioneller Sommerstoff","about":"Ein Sommerstoff mit erhabener Gitterstruktur, aus Baumwolle (Men-Kobai) oder Seide mit Baumwolle (Kinu-Kobai). Er ist beliebt für hochwertige Yukata und legere Sommerkimonos.","process":"In einen dünnen, leichten Grund werden in regelmäßigen Abständen dickere Fäden eingewebt, sowohl in Längs- als auch in Querrichtung. Die dicken Fäden bilden ein erhabenes Quadratgitter.","look":"Ein leichter Stoff mit einem Karomuster aus erhabenen Linien; die Rippen verhindern, dass er an der Haut klebt."},"rokechi":{"name":"Rokechi – Wachsreservefärbung","region":"Kyoto und ganz Japan","era":"8. Jahrhundert; im 20. Jahrhundert wiederbelebt","about":"Eine der drei alten Reservefärbetechniken der Nara-Zeit; Beispiele werden im Schatzhaus Shosoin aufbewahrt. Im Laufe der Heian-Zeit geriet sie in Vergessenheit und wurde von Künstlern des 20. Jahrhunderts wiederbelebt, die daraus eine freie, malerische Form des Färbens machten.","process":"Geschmolzenes Wachs wird mit dem Pinsel oder Stempel dort auf den Stoff aufgetragen, wo keine Farbe hin soll, und der Stoff wird gefärbt. Anschließend wird das Wachs mit Hitze oder heißem Wasser entfernt. Wo das Wachs gerissen ist, dringt die Farbe ein und hinterlässt feine Linien.","look":"Kräftige Formen, durchzogen von feinen, spinnwebartigen Craquelé-Linien."},"mokuhan":{"name":"Mokuhan – Holzmodeldruck","region":"Kyoto und andere Gegenden","era":"Alte Wurzeln","about":"Eine Drucktechnik, bei der in Holzblöcke geschnitzte Muster auf Stoff gedrückt werden. Jeder Abdruck trägt die Handschrift des Handwerkers, und die leichten Abweichungen verleihen dem Stoff einen warmen, handgemachten Charakter. Nur noch wenige Werkstätten beherrschen sie heute.","process":"Ein Muster wird in einen Hartholzblock geschnitzt. Der Block wird mit Farbe oder Paste bestrichen und Abdruck für Abdruck fest auf den gespannten Stoff gedrückt. Für jede Farbe wird ein eigener Block verwendet.","look":"Sich wiederholende Motive in leicht ungleichmäßiger Farbe mit weichen Rändern und der zarten Struktur der Holzmaserung."},"chusen":{"name":"Chusen – Gießfärbung","region":"Osaka (Sakai), Hamamatsu (Shizuoka), Tokyo","era":"Spätes 19. Jahrhundert (Meiji-Zeit)","about":"Ein japanisches Verfahren zum Färben von Yukata und Tenugui-Tüchern aus Baumwolle. Die Farbe dringt vollständig durch den Stoff, sodass beide Seiten dieselbe Farbe haben, und die Farben wirken weich und frisch.","process":"Der Stoff wird im Zickzack in viele Lagen gefaltet, wobei auf jede Lage Reservepaste durch eine Schablone gestrichen wird. Um jeden Bereich werden Wälle aus Paste gezogen, Farbe wird aus einer Kanne hineingegossen, und ein Sog von unten zieht sie gleichzeitig durch alle Lagen.","look":"Weiche, leicht verschwommene Farben, sanfte Übergänge und dasselbe Muster deutlich sichtbar auf der Rückseite."},"bingata":{"name":"Bingata – Schablonenfärbung aus Okinawa","region":"Okinawa","era":"Ryukyu-Königreich (ab etwa dem 15. Jahrhundert)","about":"Die farbenprächtige Färbekunst Okinawas, einst von der Königsfamilie und dem Adel des Ryukyu-Königreichs getragen. Leuchtende Farben und Motive aus Japan wie aus den Südmeeren verleihen ihr einen fröhlichen, tropischen Charakter.","process":"Ein Muster wird in eine Papierschablone geschnitten, und Reispaste wird durch sie aufgetragen. Mineralpigmente und Pflanzenfarben werden mit dem Pinsel in die einzelnen Bereiche eingebracht, dann wird ein dunklerer Ton über die Ränder gerieben (Kumadori), um Tiefe zu erzeugen. Eine nur mit Indigo gefärbte Variante heißt Eigata.","look":"Leuchtendes Gelb, Rot und Blau mit schattierten Rändern sowie Motive wie Blumen, Vögel, Wellen und Wolken."},"aizome":{"name":"Aizome – Indigofärbung","region":"Tokushima (Awa) und ganz Japan","era":"Altertum; in der Edo-Zeit weit verbreitet","about":"Indigo war der gebräuchlichste Farbstoff Japans und wurde für alles verwendet, von der Arbeitskleidung der Bauern bis zum Kimono. Ausländische Besucher der Meiji-Zeit waren so beeindruckt, dass die Farbe als „Japan Blue“ bekannt wurde.","process":"Indigoblätter werden zu Sukumo kompostiert und dann in einem Bottich mit Holzaschenlauge, Weizenkleie und Kalk fermentiert. Der Stoff wird immer wieder eingetaucht und herausgehoben: Er kommt grün heraus und wird an der Luft blau. Je mehr Tauchgänge, desto tiefer die Farbe.","look":"Ein tiefes, lebendiges Blau von hellem Himmelblau bis fast Schwarz, das beim Tragen wunderschön weicher wird."},"lace":{"name":"Spitze","region":"In Europa entwickelt; in Japan und weltweit hergestellt","era":"Europäische Spitze ab dem 16. Jahrhundert; beim Kimono seit der Meiji- und Taisho-Zeit","about":"Spitze ist ein durchbrochenes Textil, das nur aus Fäden besteht. In der heutigen Kimono-Mode sind Kimono, Haori und Obi aus Spitze beliebt, oft über einem farbigen Kimono getragen, damit die Farbe durchscheint.","process":"Die meiste Spitze für Kimono wird auf Stickmaschinen hergestellt. Das Muster wird auf ein feines Netz gestickt (Tüllspitze) oder auf einen Grundstoff, der anschließend aufgelöst wird, sodass nur die gestickten Fäden übrig bleiben (Ätzspitze).","look":"Ein durchsichtiges florales oder geometrisches Fadenmuster, durch dessen Öffnungen die darunterliegende Farbe scheint."},"tsuzure":{"name":"Tsuzure – Bildwirkerei","region":"Kyoto (Nishijin)","era":"Beispiele in Japan ab dem 8. Jahrhundert (vermutlich aus China eingeführt); in Nishijin gewebt seit dem 18. Jahrhundert (Edo-Zeit)","about":"Japans Form der Bildwirkerei, verwandt mit der europäischen Gobelin-Tapisserie. Sie gilt als Obi der höchsten Klasse, und die feinsten Stücke werden von Hand mit den Fingernägeln des Webers gewebt.","process":"Jeder farbige Schussfaden wird nur innerhalb seines eigenen Musterbereichs hin und her geführt und verdeckt die Kette vollständig. Der Weber feilt seine Fingernägel sägezahnförmig und schlägt damit jeden Schuss an. An einem Tag entstehen nur wenige Zentimeter.","look":"Fester, flacher Stoff mit demselben Bild auf Vorder- und Rückseite und winzigen Schlitzen, wo zwei Farben aufeinandertreffen."},"benibana":{"name":"Benibana – Färberdistel-Färbung","region":"Yamagata (Mogami) und Kyoto","era":"Um das 6.–7. Jahrhundert über die Seidenstraße eingeführt","about":"Ein natürlicher roter Farbstoff aus den Blütenblättern der Färberdistel (Saflor), vom Heian-Hof sehr geschätzt. In der Edo-Zeit war er so kostbar, dass man sagte: „Eine Einheit Rot ist eine Einheit Gold wert.“ Traditionell wurde er für die roten Seidenfutter von Kimonos (Momi) verwendet.","process":"Die Blütenblätter werden in Wasser gewaschen, um einen Großteil des gelben Pigments zu entfernen, dann fermentiert und zu „Beni-Mochi“-Kuchen gepresst. Das Rot wird mit Aschenlauge herausgelöst und mit Essig aus geräucherten Pflaumen (Ubai) auf der Seide fixiert. Wiederholtes Färben vertieft die Farbe.","look":"Ein klares, leuchtendes Rosa bis tiefes Karmesinrot; die Farbe ist empfindlich und verblasst bei starkem Licht."}}},"it":{"ui":{"tagline":"L'arte dietro il kimono — 50 tecniche tradizionali del Giappone","all":"Tutte","search":"Cerca tecniche…","region":"Dove","era":"Dal","about":"Che cos'è","process":"Come si realizza","look":"Come riconoscerlo","listen":"Ascolta il nome giapponese","close":"Chiudi","language":"Lingua","count":"{n} tecniche","noResults":"Nessuna tecnica corrisponde alla ricerca.","prev":"Precedente","next":"Successiva","intro":"Un kimono nasce attraverso molte fasi, e ogni fase ha i suoi maestri. Scegli una categoria o tocca una tecnica per saperne di più."},"cats":{"dye":{"name":"Tintura","desc":"I motivi vengono dipinti, stampati a stencil o impressi sulla seta bianca già tessuta. I kimono tinti sono in genere i più formali, indossati per cerimonie e celebrazioni."},"weave":{"name":"Tessitura","desc":"I fili vengono tinti prima e il motivo appare man mano che il tessuto viene tessuto. I kimono tessuti come lo tsumugi sono apprezzati come eleganti abiti di tutti i giorni, mentre gli obi tessuti possono essere i più formali in assoluto."},"embroidery":{"name":"Ricamo","desc":"Fili di seta e metallici vengono cuciti a mano sul tessuto per aggiungere consistenza, luce e profondità. Sui kimono formali il ricamo è spesso abbinato alla tintura."},"shibori":{"name":"Shibori (tintura a legatura)","desc":"Parti del tessuto vengono legate, cucite, piegate o serrate in modo che la tintura non possa raggiungerle. Tolti i fili, il motivo appare con una texture morbida e tridimensionale."},"other":{"name":"Artigianato per accessori","desc":"Il kimono è completato da cordoncini, ornamenti e decorazioni realizzati da artigiani di altre tradizioni: intrecciatori, artigiani del metallo, artisti della lacca e creatori di cordoncini di carta."}},"items":{"kaga-yuzen":{"name":"Kaga Yuzen, seta dipinta a mano","region":"Kanazawa, Ishikawa","era":"Inizio del XVIII secolo","about":"Uno stile di tintura dipinta a mano dell'antico feudo di Kaga. È noto per fiori e piante realistici dipinti nei 'cinque colori di Kaga': indaco, cremisi, ocra, verde erba e porpora reale.","process":"Il disegno viene contornato con una sottile linea di pasta di riso che impedisce ai colori di sbavare. Ogni area viene poi dipinta a pennello, con sfumature che vanno dal bordo esterno verso il centro. Di solito un solo artista segue l'intero pezzo.","look":"Motivi naturali e pittorici, a volte con foglie disegnate come 'rosicchiate dai bruchi' (mushikui). Poco o niente oro o ricamo."},"kyo-yuzen":{"name":"Kyo Yuzen, seta dipinta a mano di Kyoto","region":"Kyoto","era":"Fine del XVII secolo","about":"Lo stile yuzen originale, che prende il nome da Miyazaki Yuzensai, pittore di ventagli a Kyoto. Portò sul kimono una libertà di disegno simile alla pittura e divenne lo stile classico per gli abiti formali.","process":"Il lavoro è suddiviso in circa venti fasi, ciascuna affidata a uno specialista: progettazione, tracciatura del contorno, applicazione della riserva di pasta di riso, stesura del colore a pennello, vaporizzatura, risciacquo e infine aggiunta di foglia d'oro e ricamo.","look":"Motivi eleganti di gusto cortigiano in colori ricchi, sfumati dal centro verso l'esterno, spesso rifiniti con oro e ricamo."},"edo-komon":{"name":"Edo Komon, tintura a stencil a motivi minuti","region":"Tokyo","era":"XVII secolo (periodo Edo)","about":"Piccolissimi motivi ripetuti tinti in un solo colore, così fini che da lontano il tessuto sembra in tinta unita. Nacque con gli abiti cerimoniali dei samurai, e ogni signore feudale aveva un proprio motivo riservato.","process":"I motivi vengono intagliati in stencil di carta washi a strati indurita con succo di cachi. L'artigiano posa lo stencil sulla seta, vi stende attraverso la pasta di riso, lo sposta con un allineamento perfetto e poi tinge l'intero tessuto.","look":"Da vicino: migliaia di minuscoli puntini, onde o linee. A pochi passi di distanza: un sobrio colore uniforme."},"tsujigahana":{"name":"Tsujigahana, tintura a riserva cucita","region":"Kyoto e altre zone","era":"XV – inizio XVII secolo","about":"Uno stile lussuoso dei periodi Muromachi e Momoyama che univa lo shibori cucito a pittura a inchiostro, foglia d'oro e ricamo. Scomparve all'inizio del Seicento e fu poi chiamato 'la tintura fantasma'.","process":"I contorni dei motivi vengono cuciti e stretti in modo che la tintura non possa entrare, e il tessuto viene tinto in più fasi. I dettagli fini, come le venature delle foglie, vengono poi dipinti a inchiostro. Artisti moderni hanno fatto rivivere questo stile nel XX secolo.","look":"Forme morbide e leggermente sfocate con bordi increspati, unite a delicati disegni a inchiostro."},"sarasa":{"name":"Sarasa (motivi stampati esotici)","region":"Originario dell'India; prodotto a Nagasaki, Sakai, Kyoto ed Edo","era":"XVI–XVII secolo","about":"Cotone colorato e decorato proveniente dall'India e dal Sud-est asiatico, arrivato attraverso il commercio estero. I suoi fiori, uccelli e motivi geometrici esotici erano molto apprezzati, e gli artigiani giapponesi presto ne crearono versioni proprie.","process":"In India i motivi venivano disegnati o stampati a blocchi con mordenti e cera. Il 'wa-sarasa' giapponese veniva di solito realizzato con molti stencil di carta, uno per ogni colore, applicati uno dopo l'altro.","look":"Fitti motivi floreali e simili al paisley, dall'aspetto straniero, in rossi terrosi, indaco e marroni."},"kinsai":{"name":"Decorazione in foglia d'oro","region":"Kyoto","era":"Antica; fiorì nel XVI secolo","about":"L'arte di decorare i kimono finiti con vero oro e argento. Di solito è il tocco finale sui kimono formali tinti a yuzen, e aggiunge luce a fiori, nuvole e contorni.","process":"L'adesivo viene applicato attraverso uno stencil o tracciato con un cono sottile, poi la foglia d'oro viene pressata e spazzolata via dove non deve restare. L'oro può anche essere cosparso in minuscole scaglie o tracciato in linee di pasta d'oro.","look":"Dettagli lucenti in oro o argento sopra un disegno tinto, che catturano la luce quando chi lo indossa si muove."},"oshima":{"name":"Oshima tsumugi tinto nel fango","region":"Isola di Amami Oshima, Kagoshima","era":"Oltre 1.300 anni di storia","about":"Uno dei tessuti per kimono più famosi del Giappone. Il suo nero-marrone profondo e lucido nasce dalla tintura della seta con un albero locale e poi con fango ricco di ferro. È leggero, liscio e quasi non si stropiccia.","process":"I fili vengono prima tessuti strettamente in una stuoia provvisoria per riservare il motivo. La stuoia viene tinta decine di volte con corteccia di sharinbai e poi nel fango, quindi disfatta, e i fili vengono ritessuti uno per uno, facendo combaciare a mano ogni minuscolo puntino.","look":"Una superficie scura e setosa con motivi geometrici finissimi fatti di minuscole crocette."},"yuki":{"name":"Yuki tsumugi filato a mano","region":"Yuki, Ibaraki e Oyama, Tochigi","era":"Origini nel periodo Nara (VIII secolo) o prima; famoso dal XVII secolo","about":"Iscritto dall'UNESCO tra i Patrimoni culturali immateriali nel 2010. Si dice sia il kimono casual più lussuoso: caldo e leggero, diventa più morbido quanto più lo si indossa.","process":"La seta viene filata a mano dalla bambagia senza alcuna torsione. I fili del motivo vengono legati a mano, tinti e tessuti su un telaio a cintura, dove è il corpo stesso della tessitrice a tendere l'ordito. Un rotolo può richiedere da mesi a più di un anno.","look":"Una texture morbida e leggermente irregolare e una lucentezza opaca e delicata."},"ushikubi":{"name":"Ushikubi tsumugi a doppio bozzolo","region":"Hakusan, Ishikawa","era":"Oltre 800 anni","about":"Un raro tsumugi di un villaggio di montagna, fatto con i 'doppi bozzoli' filati insieme da due bachi da seta. È così resistente da essere soprannominato 'tsumugi strappachiodi': se si impiglia in un chiodo, il tessuto estrae il chiodo invece di strapparsi.","process":"Il filo viene tratto direttamente dai doppi bozzoli in acqua calda, il che gli dà irregolarità naturali. Il tessuto bianco viene tessuto prima e spesso tinto dopo, anche con la pittura yuzen.","look":"Una seta robusta con piccoli nodi naturali e una lucentezza calda e discreta."},"kihachijo":{"name":"Kihachijo, seta gialla dell'isola","region":"Isola di Hachijo, Tokyo","era":"Attestato dal periodo Muromachi; popolare nel periodo Edo","about":"Una seta tessuta su un'isola remota usando solo tre colori naturali ricavati da piante locali: giallo oro, marrone ruggine e nero. Divenne di moda tra i cittadini di Edo.","process":"Il giallo si ottiene dall'erba kariyasu, il marrone dalla corteccia di tabunoki e il nero dalla corteccia di castanopsis trattata con fango ricco di ferro. I fili vengono tinti più e più volte, poi tessuti a quadri e a righe.","look":"Quadri o righe giallo vivo, marroni e neri con una finitura lucente."},"meisen":{"name":"Meisen, seta a filo stampato","region":"Isesaki, Chichibu, Ashikaga, Kiryu, Hachioji","era":"Boom negli anni 1910–1930","about":"Una seta economica che portò la moda alle donne comuni nelle ere Taisho e primo Showa. I suoi audaci disegni Art Nouveau e Art Déco oggi sono amati dai collezionisti di vintage di tutto il mondo.","process":"L'ordito viene unito con punti lenti e il motivo vi viene stampato a stencil. Durante la tessitura i punti vengono tolti e si aggiunge la vera trama, così i colori si spostano leggermente e i bordi appaiono morbidamente sfumati.","look":"Motivi audaci e moderni con contorni sfrangiati e leggermente sfalsati."},"jofu":{"name":"Jofu, tessuto fine di ramiè","region":"Echigo (Niigata), Miyako (Okinawa), Omi (Shiga), Noto (Ishikawa)","era":"Oltre 1.200 anni","about":"'Tessuto superiore': una stoffa finissima e croccante di fibra di ramiè, indossata in piena estate. L'Echigo jofu e l'Ojiya chijimi sono nella lista UNESCO dei Patrimoni culturali immateriali.","process":"Le fibre di ramiè vengono divise a mano in filamenti sottili come capelli e unite capo a capo. Dopo la tessitura, l'Echigo jofu viene steso sulla neve nelle giornate di sole primaverili per essere sbiancato in modo naturale.","look":"Leggero, trasparente e fresco, con una mano croccante, quasi cartacea."},"omeshi":{"name":"Omeshi, crespo tessuto","region":"Kyoto (Nishijin), Kiryu, Shiozawa","era":"Periodo Edo","about":"Un crespo di seta tessuto che prende il nome dallo shogun Tokugawa Ienari, che lo amava: omeshi significa 'indossato da una persona illustre'. Si colloca tra i kimono tinti e quelli tessuti ed è adatto a visite eleganti e feste.","process":"I fili vengono tinti prima della tessitura. La trama viene ritorta molto strettamente e inamidata; dopo la tessitura, l'acqua calda scioglie la torsione e crea una fine superficie increspata.","look":"Un crespo compatto dalla sottile texture granulosa, che mantiene la forma e resiste alle pieghe."},"chirimen":{"name":"Chirimen, crespo di seta","region":"Tango (Kyoto), Nagahama (Shiga)","era":"Dal XVI secolo; a Tango dal XVIII","about":"Il morbido crespo di seta che fa da tessuto di base per la maggior parte dei kimono tinti, compreso lo yuzen. La sua superficie increspata assorbe magnificamente il colore e cade con grazia.","process":"I fili di trama vengono ritorti migliaia di volte per metro, alternando torsioni a sinistra e a destra. Dopo la tessitura il tessuto viene bollito per eliminare la sericina, i fili cercano di srotolarsi e la stoffa si restringe in minuscole increspature chiamate shibo.","look":"Una superficie morbida coperta di minuscole creste; la grandezza dell'increspatura varia a seconda del tipo."},"nishijin":{"name":"Broccato Nishijin","region":"Quartiere di Nishijin, Kyoto","era":"Nome dal XV secolo; si tesse qui dal V–VI secolo","about":"Il broccato più importante del Giappone, che prende il nome dal 'Campo Occidentale' della guerra di Onin. I tessitori di Nishijin producono obi sontuosi e tessuti per la corte imperiale, i templi e il teatro Noh.","process":"I fili vengono tinti prima della tessitura in decine di colori e combinati con fili d'oro e d'argento. I telai Jacquard furono introdotti dalla Francia negli anni 1870, mentre l'arazzo più pregiato si tesse ancora a mano, battendo la trama con le unghie dentellate.","look":"Tessuto pesante e riccamente decorato con fili d'oro e d'argento; si vede soprattutto negli obi formali."},"saga-nishiki":{"name":"Saga Nishiki, broccato di carta e seta","region":"Saga","era":"Tardo periodo Edo","about":"Un raro broccato del feudo di Kashima. Si racconta che la moglie del signore lo ideò ispirandosi al motivo di bambù intrecciato (ajiro) del suo soffitto, e che fu tramandato tra le dame della casata. Chiamato inizialmente Kashima Nishiki, fu ribattezzato 'Saga Nishiki' all'Esposizione nippo-britannica del 1910.","process":"L'ordito è fatto di sottili strisce di carta washi ricoperte d'oro, d'argento o di lacca. Una piccola spatola di bambù solleva le strisce di carta una alla volta e vi si fa passare la trama di seta colorata. Si riescono a tessere solo pochi centimetri al giorno.","look":"Minuscoli e precisi motivi geometrici su un fondo d'oro scintillante; usato per obi formali, borse e accessori."},"hakata":{"name":"Tessuto Hakata","region":"Fukuoka","era":"1241","about":"Fu avviato da un mercante che aveva imparato a tessere nella Cina della dinastia Song. Nel periodo Edo il signore locale lo offriva ogni anno allo shogun, per questo il disegno classico si chiama Hakata 'kenjo' (offerta).","process":"Molti fili d'ordito sottili vengono serrati fitti e la trama spessa viene battuta con forza, così il motivo è creato soprattutto dall'ordito. I motivi classici derivano da strumenti rituali buddisti e da righe.","look":"Un obi compatto che fa un suono 'kyu-kyu' quando viene annodato e non si allenta mai."},"wana":{"name":"Wana, tessuto a riccio","region":"Kyoto","era":"Dal XVII secolo","about":"'Wana' significa anello. Questo tessuto solleva piccoli anelli di seta sulla superficie, la stessa tecnica usata in Giappone per fare il velluto. Dona a obi e cappotti un rilievo morbido e scolpito.","process":"Sottili fili metallici vengono inseriti sotto l'ordito per sollevarlo in anelli; poi i fili vengono estratti. Se gli anelli restano interi è wana; se vengono tagliati diventa velluto. I motivi possono alternare anelli tagliati e non tagliati.","look":"Un motivo in rilievo, vellutato, di minuscoli anelli, morbido al tatto."},"sagara":{"name":"Sagara, ricamo a nodini","region":"Dalla Cina; praticato a Kyoto e in tutto il Giappone","era":"Tecnica antica","about":"Un ricamo fatto di innumerevoli nodini, simili al nodo francese. Crea una texture tridimensionale simile a perline ed è molto resistente, per questo si usa per accenti e contorni.","process":"Il filo viene avvolto attorno all'ago e tirato giù attraverso il tessuto per formare un piccolo nodo. I nodi vengono allineati uno a uno per riempire una forma o tracciare una linea.","look":"Puntini in rilievo fitti l'uno accanto all'altro come minuscole perle."},"kinkoma":{"name":"Kinkoma, ricamo in oro applicato","region":"Kyoto e tutto il Giappone","era":"Tecnica antica","about":"Il filo d'oro è troppo rigido per passare attraverso la seta, così viene posato sulla superficie e fissato. Questo dà a contorni e motivi una linea d'oro decisa e brillante.","process":"Il filo d'oro, avvolto su piccoli rocchetti di legno (koma), viene posato lungo il disegno, di solito a coppie, e fissato a brevi intervalli con un sottile filo di seta.","look":"Linee d'oro lisce e continue appoggiate sopra il tessuto."},"takeyamachi":{"name":"Takeyamachi, ricamo su garza","region":"Takeyamachi, Kyoto","era":"Periodo Edo","about":"Un ricamo su garza di seta a trama aperta, che prende il nome dalla via di Kyoto dove nacque. I punti seguono così fedelmente la griglia del tessuto che il risultato sembra tessuto anziché ricamato.","process":"Soprattutto filo d'oro piatto (a volte con seta colorata) viene fatto passare nei minuscoli fori della garza, contando ogni foro, per riempire il disegno come un mosaico.","look":"Un motivo dorato nitido, dall'aspetto tessuto, su garza trasparente; usato per obi, fukusa e montature dei rotoli da appendere."},"swatow":{"name":"Swatow, ricamo a traforo","region":"Shantou (Swatow), Guangdong, Cina","era":"Fine del XIX secolo","about":"Un delicato ricamo a traforo della Cina meridionale che unisce il ricamo cinese al merletto europeo. I kimono con ricamo Swatow sono da tempo apprezzati in Giappone come abiti eleganti e raffinati.","process":"Si sfilano fili dal tessuto o si ritagliano piccole aree, e le aperture vengono rifinite e riempite con punti fini per creare motivi simili al pizzo. Tutto è fatto a mano.","look":"Motivi tono su tono, simili al pizzo, con minuscole aperture, spesso in bianco o in tenui colori pastello."},"suzhou":{"name":"Ricamo in seta di Suzhou","region":"Suzhou, Jiangsu, Cina","era":"Oltre 2.000 anni","about":"Una delle quattro grandi tradizioni di ricamo della Cina, famosa per la sua estrema finezza. Su kimono e obi si usa per animali e fiori realistici.","process":"Un singolo filo di seta viene diviso in un numero di filamenti sottili come capelli che può arrivare a diverse decine. I colori vengono sfumati punto per punto, e alcuni pezzi sono ricamati in modo che entrambi i lati mostrino un'immagine finita.","look":"Un realismo quasi fotografico, come gatti di cui si vedono i singoli peli."},"ran":{"name":"Ricamo a punti casuali (luanzhen)","region":"Changzhou, Jiangsu, Cina; presente anche su kimono e obi","era":"Creato all'inizio del XX secolo (anni 1920-30)","about":"Un ricamo in cui punti di diverse lunghezze e direzioni si incrociano e si sovrappongono, come le pennellate di un dipinto a olio. Rende in modo naturale pelo, piume, luci e ombre.","process":"Invece di disporre i punti ordinatamente uno accanto all'altro, la ricamatrice li sovrappone liberamente in direzioni incrociate e mescola i colori in ogni strato per costruire profondità.","look":"Una superficie pittorica con sfumature morbide anziché linee di punti nette."},"hitta":{"name":"Hitta, shibori a puntini quadrati","region":"Kyoto","era":"Molto sviluppato già nel XVII secolo","about":"Il tipo di shibori più lussuoso. Minuscoli puntini quadrati sono allineati in diagonale; un kimono interamente coperto di hitta si chiama 'so-hitta' ed è il massimo del lusso.","process":"L'artigiana pizzica un minuscolo lembo di tessuto, lo piega in quattro e vi avvolge il filo più volte. Ogni puntino è legato a mano, quindi un furisode completamente coperto può richiedere un anno o più.","look":"Puntini quadrati regolari e in rilievo, disposti in ordinate file diagonali."},"kanoko":{"name":"Kanoko, shibori a macchie di cerbiatto","region":"Kyoto e tutto il Giappone","era":"Fin dall'antichità","about":"'Kanoko' significa cerbiatto, perché i piccoli puntini bianchi con il centro colorato ricordano le macchie di un giovane cervo. È lo shibori più conosciuto e compare su obiage, kimono e accessori.","process":"Piccoli punti di tessuto vengono sollevati e legati stretti con il filo prima della tintura. Dopo la tintura e lo scioglimento, ogni punto lascia un anellino con una texture in rilievo e bitorzoluta.","look":"Piccoli anelli puntinati con un minuscolo 'occhio' colorato al centro."},"boshi":{"name":"Boshi shibori (a cappuccio)","region":"Kyoto, Arimatsu","era":"Periodo Edo","about":"'Boshi' significa cappello. Questo metodo protegge dalla tintura grandi aree del disegno coprendole con un cappuccio, permettendo di lasciare bianchi grandi fiori o cerchi.","process":"Il contorno viene cucito e arricciato, poi l'area interna viene coperta come da un cappuccio, tradizionalmente con guaina di bambù, oggi per lo più con vinile, e legata stretta con filo prima della tintura.","look":"Grandi forme non tinte con bordi morbidi, leggermente sfrangiati."},"nuishime":{"name":"Nuishime, shibori cucito","region":"Kyoto, Arimatsu-Narumi (Nagoya)","era":"Almeno dal periodo Muromachi","about":"Un metodo shibori che usa punti filza per tracciare linee e forme precise. Permette forme molto più libere della sola legatura.","process":"Il disegno viene cucito con piccoli punti filza, e i fili vengono tirati stretti in modo che il tessuto si raccolga in pieghe. Le zone piegate respingono la tintura, lasciando un contorno tratteggiato.","look":"Contorni netti formati da file di piccoli trattini."},"arashi":{"name":"Arashi, shibori avvolto su palo","region":"Arimatsu-Narumi (Nagoya)","era":"Fine del XIX secolo","about":"'Arashi' significa tempesta: le linee diagonali sembrano pioggia spinta dal vento. È un classico di Arimatsu, la più grande città dello shibori in Giappone, ed è molto amato per gli yukata.","process":"Il tessuto viene avvolto in diagonale attorno a un lungo palo, legato con il filo e spinto in basso in pieghe strette. Solo le creste esterne assorbono la tintura.","look":"Sottili linee diagonali che sembrano pioggia obliqua."},"tatsumaki":{"name":"Tatsumaki, shibori a vortice","region":"Arimatsu-Narumi (Nagoya), Kyoto","era":"Tecnica tradizionale","about":"'Tatsumaki' significa tornado. Un filo viene avvolto a spirale attorno al tessuto, così il motivo si attorciglia come catturato da un turbine.","process":"Il tessuto viene raccolto (spesso dopo essere stato cucito o pieghettato) attorno a un'anima formando una lunga barra cilindrica, e prima della tintura un filo viene avvolto a spirale dall'alto verso il basso. Solo la superficie esposta assorbe la tintura, lasciando bande a spirale.","look":"Righe vorticose a spirale con un forte senso di movimento."},"yanagi":{"name":"Yanagi, shibori a salice","region":"Arimatsu-Narumi (Nagoya)","era":"Periodo Edo","about":"'Yanagi' significa salice. Il motivo ricorda rami di salice che ondeggiano nella brezza ed è uno dei preferiti per gli yukata estivi.","process":"Il tessuto viene raccolto per il lungo in pieghe strette e legato con il filo a intervalli. Le pieghe respingono la tintura, lasciando sottili linee verticali spezzate.","look":"Delicate linee verticali che sembrano rami di salice pendenti."},"oke":{"name":"Oke, shibori a tinozza","region":"Kyoto","era":"Tecnica tradizionale di Kyoto","about":"'Oke' significa tinozza. Questa rara tecnica mantiene asciutte ampie parti del tessuto sigillandole in una tinozza di legno, permettendo grandi aree di colori diversi su un solo kimono. Pochissimi artigiani sanno ancora praticarla.","process":"La parte che deve restare non tinta viene sistemata in una tinozza di legno di cipresso e i coperchi vengono serrati e legati con corde sul tessuto, lasciando fuori la parte da tingere. L'intera tinozza viene poi immersa in una vasca di tintura più grande. Si ripete per ogni colore.","look":"Grandi blocchi decisi di colori diversi con confini netti ma leggermente morbidi."},"itajime":{"name":"Itajime, tintura a tavolette","region":"Arimatsu, Kyoto e altrove","era":"Dall'VIII secolo","about":"Una delle più antiche tecniche a riserva del Giappone; il suo antenato, il kyokechi (tintura tra tavolette intagliate), sopravvive nello Shosoin, il tesoro dell'VIII secolo. Il tessuto piegato viene pressato tra tavolette per creare motivi ripetuti.","process":"Il tessuto viene piegato in triangoli o quadrati e serrato strettamente tra tavolette di legno, poi immerso nella tintura. Le aree coperte restano bianche e formano un motivo simmetrico.","look":"Forme geometriche ripetute, come i motivi simili a fiocchi di neve chiamati sekka."},"tsukami":{"name":"Tsukami, shibori ad afferrare","region":"Vari centri dello shibori","era":"Tradizionale","about":"'Tsukami' significa afferrare. Manciate di tessuto vengono raccolte e legate, così ogni pezzo viene diverso. Dà un effetto libero e naturale.","process":"L'artigiano afferra il tessuto, lo attorciglia in mazzetti irregolari e li lega con il filo prima della tintura. Le pieghe casuali creano motivi imprevedibili.","look":"Motivi irregolari, simili a nuvole o marmorizzati, senza ripetizioni."},"kumihimo":{"name":"Kumihimo, intreccio di seta","region":"Kyoto, Iga (Mie)","era":"Dal VII–VIII secolo","about":"Cordoncini di seta intrecciata, usati in origine per oggetti buddisti e abiti di corte, e in seguito per armature e cordoni delle spade dei samurai. Oggi sono noti soprattutto come obijime, il cordoncino annodato a metà dell'obi.","process":"Decine di fili di seta vengono avvolti su rocchetti appesantiti e incrociati tra loro su un supporto di legno come il marudai rotondo. Supporti e movimenti diversi creano cordoncini tondi, quadrati o piatti.","look":"Un intreccio compatto e regolare con fini motivi diagonali e ricche combinazioni di colori."},"zogan":{"name":"Zogan, intarsio metallico","region":"Kyoto, Kumamoto (Higo)","era":"Fiorì nel periodo Edo sulle montature di spade e armi da fuoco","about":"L'arte di intarsiare oro e argento nel ferro. Un tempo usata per decorare le montature delle spade, oggi adorna accessori del kimono come gli obidome (spille per obi) e gli ornamenti per capelli.","process":"La superficie del ferro viene incisa con sottili scanalature incrociate. Lamine e fili d'oro o d'argento vengono martellati nelle scanalature, poi il ferro viene fatto arrugginire di proposito e cotto con lacca o olio fino a un nero profondo.","look":"Disegni brillanti in oro e argento su uno sfondo nero profondo."},"makie":{"name":"Maki-e, lacca d'oro","region":"Kyoto, Wajima, Kanazawa e altrove","era":"Dall'VIII–IX secolo","about":"Un'arte della lacca in cui i disegni vengono tracciati con la lacca e cosparsi di polvere d'oro o d'argento. Nel mondo del kimono si trova su pettini, forcine, obidome e sandali geta.","process":"Il disegno viene dipinto con la lacca e, prima che asciughi, vi si cosparge una fine polvere d'oro o d'argento attraverso un tubetto di bambù. Il pezzo viene poi rivestito e lucidato più volte.","look":"Delicate immagini d'oro con una lucentezza profonda e brillante su lacca nera o rossa."},"mizuhiki":{"name":"Mizuhiki, cordoncini di carta","region":"Iida (Nagano), Kanazawa (Ishikawa)","era":"Origini fatte risalire al VII secolo","about":"Cordoncini decorativi di carta washi ritorta, annodati in nodi che portano auguri di buona fortuna. Decorano le buste regalo e, nell'abbigliamento in kimono, si usano per ornamenti per capelli da sposa e decorazioni per obi.","process":"La washi viene ritorta in cordoncini sottili e irrigidita con amido, poi tinta o avvolta in una pellicola colorata o metallizzata. I cordoncini vengono annodati in nodi come il nodo awaji o modellati a forma di gru, pino e pruno.","look":"Cordoncini lucidi e rigidi annodati in nodi simmetrici, spesso in rosso e bianco o in oro e argento."},"ro":{"name":"Ro, garza estiva a righe traforate","region":"Kyoto e altre zone di tessitura della seta","era":"Nome attestato già nel XV secolo; diffuso dal periodo Edo","about":"Una seta estiva con file ordinate di minuscole aperture che lasciano passare l'aria. È il tessuto classico per i kimono formali e quotidiani nei mesi più caldi, dall'inizio alla fine dell'estate.","process":"Si tessono diverse file in armatura tela, poi per una sola fila i fili di ordito vengono attorcigliati a coppie per lasciare una linea di aperture. Il numero di file in tela tra le aperture dà i nomi 'ro a tre file', 'ro a cinque file' e così via.","look":"Sottili linee orizzontali (o talvolta verticali) di piccole aperture su una seta altrimenti compatta."},"sha":{"name":"Sha, garza di seta integrale","region":"Kyoto e altre zone di tessitura della seta","era":"Giunto dalla Cina nel VII–VIII secolo","about":"Una seta leggera e trasparente indossata in piena estate. È più leggera e trasparente del ro ed è usata anche per haori e soprabiti estivi da indossare sopra il kimono.","process":"In ogni fila i fili di ordito vengono attorcigliati a coppie e bloccati dalla trama. Si crea così una rete uniforme e aperta su tutto il tessuto.","look":"Una rete uniforme e trasparente, senza righe compatte; gli strati sottostanti traspaiono delicatamente."},"ra":{"name":"Ra, garza complessa a rete","region":"Kyoto","era":"Antichità (VII–VIII secolo); ripreso nel XX secolo","about":"Una delle più antiche e la più complessa delle garze; alcuni esemplari si conservano nello Shosoin, il tesoro dell'VIII secolo. In Giappone la tecnica declinò dopo il Medioevo e fu ripresa da maestri tessitori moderni. Oggi si vede soprattutto in lussuosi obi estivi.","process":"Ogni filo di ordito si incrocia e si attorciglia con diversi fili vicini, non con un solo compagno, così che i fili formano una rete. Si tesse lentamente a mano su un telaio speciale.","look":"Una rete elastica con aperture a forma di rombo, spesso con motivi che compaiono nella rete."},"kobai":{"name":"Kobai, tessuto estivo a griglia a nido d'ape","region":"Zone di tessitura del cotone e della seta in tutto il Giappone","era":"Tessuto estivo tradizionale","about":"Un tessuto estivo con una texture a griglia in rilievo, in cotone (men-kobai) o in seta con cotone (kinu-kobai). È molto amato per yukata di qualità e kimono estivi informali.","process":"In un fondo sottile e leggero vengono inseriti a intervalli regolari fili più spessi, sia in ordito sia in trama. I fili spessi formano una griglia quadrata in rilievo.","look":"Un tessuto leggero a quadri di linee in rilievo; le nervature evitano che si attacchi alla pelle."},"rokechi":{"name":"Rokechi, tintura a riserva con cera","region":"Kyoto e tutto il Giappone","era":"VIII secolo; ripresa nel XX secolo","about":"Uno dei tre antichi metodi di tintura a riserva del periodo Nara, di cui si conservano esempi nel tesoro dello Shosoin. Scomparve nel corso del periodo Heian e fu ripreso da artisti del XX secolo, che ne fecero una forma di tintura libera e pittorica.","process":"La cera fusa viene stesa a pennello o a timbro sul tessuto dove il colore non deve arrivare, e poi il tessuto viene tinto. La cera viene quindi rimossa con il calore o con acqua calda. Dove la cera si è crepata, la tintura penetra e lascia linee sottili.","look":"Forme decise attraversate da sottili linee di crettatura simili a ragnatele."},"mokuhan":{"name":"Mokuhan, stampa a blocchi di legno","region":"Kyoto e altre zone","era":"Origini antiche","about":"Una tecnica di stampa in cui disegni intagliati in blocchi di legno vengono premuti sul tessuto. Ogni impressione porta la mano dell'artigiano, e le lievi variazioni danno alla stoffa un carattere caldo e artigianale. Oggi sono pochi i laboratori che la praticano ancora.","process":"Un disegno viene intagliato in un blocco di legno duro. Il blocco viene ricoperto di tintura o pasta e premuto con forza sul tessuto teso, un'impressione alla volta. Per ogni colore si usa un blocco diverso.","look":"Motivi ripetuti con un colore leggermente irregolare e dai bordi morbidi, e la tenue trama delle venature del legno."},"chusen":{"name":"Chusen, tintura per colatura","region":"Osaka (Sakai), Hamamatsu (Shizuoka), Tokyo","era":"Fine del XIX secolo (era Meiji)","about":"Un metodo giapponese per tingere yukata e asciugamani tenugui di cotone. La tintura attraversa completamente il tessuto, così entrambi i lati hanno lo stesso colore, e i colori appaiono morbidi e freschi.","process":"Il tessuto viene piegato avanti e indietro in molti strati, stendendo su ciascuno pasta di riserva attraverso uno stencil. Intorno a ogni area si formano argini di pasta, la tintura vi viene versata da un bollitore e un'aspirazione dal basso la fa passare attraverso tutti gli strati in una volta.","look":"Colori morbidi e leggermente sfumati, delicate gradazioni e lo stesso motivo ben visibile sul rovescio."},"bingata":{"name":"Bingata, tintura a stencil di Okinawa","region":"Okinawa","era":"Regno delle Ryukyu (dal XV secolo circa)","about":"La vivace arte tintoria di Okinawa, un tempo indossata dalla famiglia reale e dai nobili del Regno delle Ryukyu. Colori brillanti e motivi provenienti sia dal Giappone sia dai mari del Sud le conferiscono un carattere allegro e tropicale.","process":"Un motivo viene intagliato in uno stencil di carta e attraverso di esso si applica pasta di riso. Pigmenti minerali e tinture vegetali vengono stesi a pennello in ciascuna area, poi una tonalità più scura viene strofinata sui bordi (kumadori) per dare profondità. Una versione tinta solo con l'indaco si chiama eigata.","look":"Gialli, rossi e blu brillanti con bordi sfumati, e motivi come fiori, uccelli, onde e nuvole."},"aizome":{"name":"Aizome, tintura all'indaco","region":"Tokushima (Awa) e in tutto il Giappone","era":"Antichità; diffusa nel periodo Edo","about":"L'indaco era la tintura più comune in Giappone, usata per tutto, dagli abiti da lavoro dei contadini ai kimono. I visitatori stranieri dell'era Meiji ne rimasero così colpiti che il colore divenne noto come 'Japan Blue'.","process":"Le foglie di indaco vengono compostate per ottenere il sukumo, che viene poi fatto fermentare in una vasca con liscivia di cenere di legna, crusca di frumento e calce. Il tessuto viene immerso e sollevato più e più volte: esce verde e diventa blu a contatto con l'aria. Più immersioni danno un colore più profondo.","look":"Un blu profondo e vivo, dall'azzurro cielo pallido al quasi nero, che si ammorbidisce splendidamente con l'uso."},"lace":{"name":"Pizzo","region":"Sviluppato in Europa; prodotto in Giappone e in tutto il mondo","era":"Pizzo europeo dal XVI secolo; con il kimono dalle ere Meiji–Taisho","about":"Il pizzo è un tessuto traforato fatto di soli fili. Nella moda kimono di oggi sono popolari kimono, haori e obi in pizzo, spesso sovrapposti a un kimono colorato in modo che il colore traspaia.","process":"La maggior parte del pizzo per kimono è realizzata con macchine da ricamo. Il motivo viene ricamato su una rete sottile (pizzo su tulle) o su un tessuto di base che viene poi dissolto, lasciando solo i fili ricamati (pizzo chimico).","look":"Un motivo trasparente di fili, floreale o geometrico, con il colore sottostante che traspare dalle aperture."},"tsuzure":{"name":"Tsuzure, arazzo tessuto","region":"Kyoto (Nishijin)","era":"Esempi in Giappone dall'VIII secolo (probabilmente importati dalla Cina); tessuto a Nishijin dal XVIII secolo (periodo Edo)","about":"La versione giapponese dell'arazzo, imparentata con l'arazzo europeo dei Gobelins. È considerato l'obi di massimo pregio, e i pezzi più fini sono tessuti a mano con le unghie del tessitore.","process":"Ogni trama colorata va avanti e indietro solo nella propria parte del disegno, nascondendo completamente l'ordito. Il tessitore lima le unghie a dente di sega e le usa per battere ogni trama al suo posto. In un giorno si tessono solo pochi centimetri.","look":"Tessuto compatto e piatto, con la stessa immagine sul dritto e sul rovescio e minuscole fessure dove due colori si incontrano."},"benibana":{"name":"Benibana, tintura al cartamo","region":"Yamagata (Mogami) e Kyoto","era":"Giunta lungo la Via della Seta intorno al VI–VII secolo","about":"Una tintura rossa naturale ricavata dai petali di cartamo, molto amata dalla corte Heian. Nel periodo Edo era così preziosa che si diceva 'un’unità di rosso vale un’unità d’oro'. Tradizionalmente era usata per le fodere in seta rossa dei kimono (momi).","process":"I petali vengono lavati in acqua per eliminare gran parte del pigmento giallo, poi fatti fermentare e pressati in panetti chiamati 'beni-mochi'. Il rosso viene estratto con liscivia di cenere e fissato sulla seta con aceto di prugna affumicata (ubai). Tinture ripetute rendono il colore più profondo.","look":"Un rosa limpido e luminoso fino a un cremisi profondo; il colore è delicato e sbiadisce con la luce intensa."}}},"es":{"ui":{"tagline":"El arte detrás del kimono: 50 técnicas tradicionales de Japón","all":"Todas","search":"Buscar técnicas…","region":"Dónde","era":"Desde","about":"Qué es","process":"Cómo se hace","look":"Cómo reconocerlo","listen":"Escuchar el nombre en japonés","close":"Cerrar","language":"Idioma","count":"{n} técnicas","noResults":"Ninguna técnica coincide con tu búsqueda.","prev":"Anterior","next":"Siguiente","intro":"Un kimono se elabora en muchas etapas, y cada etapa tiene sus propios maestros. Elige una categoría o toca cualquier técnica para saber más."},"cats":{"dye":{"name":"Teñido","desc":"Los motivos se pintan, se estarcen o se estampan sobre seda blanca ya tejida. Los kimonos teñidos suelen ser los más formales y se llevan en ceremonias y celebraciones."},"weave":{"name":"Tejido","desc":"Los hilos se tiñen primero y el motivo aparece a medida que se teje la tela. Los kimonos tejidos como el tsumugi se aprecian como elegante ropa de diario, mientras que los obi tejidos pueden ser los más formales de todos."},"embroidery":{"name":"Bordado","desc":"Hilos de seda y metálicos se cosen a mano sobre la tela para añadir textura, luz y profundidad. En los kimonos formales, el bordado suele combinarse con el teñido."},"shibori":{"name":"Shibori (teñido por atado)","desc":"Partes de la tela se atan, cosen, pliegan o prensan para que el tinte no llegue a ellas. Al retirar los hilos, aparece el motivo con una textura suave y tridimensional."},"other":{"name":"Artesanía de accesorios","desc":"El kimono se completa con cordones, adornos y decoraciones hechos por artesanos de otras tradiciones: trenzadores, artesanos del metal, artistas de la laca y creadores de cordones de papel."}},"items":{"kaga-yuzen":{"name":"Kaga Yuzen, seda pintada a mano","region":"Kanazawa, Ishikawa","era":"Principios del siglo XVIII","about":"Un estilo de teñido pintado a mano del antiguo dominio de Kaga. Es conocido por sus flores y plantas realistas pintadas en los 'cinco colores de Kaga': índigo, carmesí, ocre, verde hierba y púrpura real.","process":"El diseño se perfila con una fina línea de pasta de arroz que evita que los colores se corran. Después se pinta cada zona a pincel, con un degradado que va del borde exterior hacia el centro. Normalmente un solo artista supervisa toda la pieza.","look":"Motivos naturales y pictóricos, a veces con hojas 'comidas por gusanos' (mushikui) dibujadas. Poco o nada de oro o bordado."},"kyo-yuzen":{"name":"Kyo Yuzen, seda pintada a mano de Kioto","region":"Kioto","era":"Finales del siglo XVII","about":"El estilo yuzen original, llamado así por Miyazaki Yuzensai, pintor de abanicos de Kioto. Llevó al kimono una libertad de diseño propia de la pintura y se convirtió en el estilo clásico de la ropa formal.","process":"El trabajo se divide en unos veinte pasos, cada uno a cargo de un especialista: diseño, trazado del contorno, aplicación de la reserva de pasta de arroz, pintado a pincel, vaporizado, aclarado y, por último, aplicación de pan de oro y bordado.","look":"Motivos elegantes y cortesanos en colores intensos, degradados del centro hacia fuera, a menudo rematados con oro y bordado."},"edo-komon":{"name":"Edo Komon, estarcido de motivos finos","region":"Tokio","era":"Siglo XVII (periodo Edo)","about":"Diminutos motivos repetidos teñidos en un solo color, tan finos que de lejos la tela parece lisa. Comenzó con la ropa ceremonial de los samuráis, y cada señor feudal tenía su propio motivo reservado.","process":"Los motivos se tallan en plantillas de papel washi en capas endurecido con zumo de caqui. El artesano coloca la plantilla sobre la seda, extiende pasta de arroz a través de ella, la desplaza con una alineación perfecta y luego tiñe toda la tela.","look":"De cerca: miles de puntitos, ondas o líneas diminutas. A unos pasos: un color liso y discreto."},"tsujigahana":{"name":"Tsujigahana, teñido con reserva cosida","region":"Kioto y otras zonas","era":"Siglo XV – principios del XVII","about":"Un estilo lujoso de los periodos Muromachi y Momoyama que combinaba el shibori cosido con pintura a tinta, pan de oro y bordado. Desapareció a principios del siglo XVII y más tarde se le llamó 'el tinte fantasma'.","process":"Los contornos de los motivos se cosen y se tensan para que el tinte no pueda entrar, y la tela se tiñe en varias etapas. Después se pintan a tinta los detalles finos, como las nervaduras de las hojas. Artistas modernos recuperaron este estilo en el siglo XX.","look":"Formas suaves y ligeramente difuminadas con bordes arrugados, combinadas con delicados dibujos a tinta."},"sarasa":{"name":"Sarasa (estampados exóticos)","region":"Originario de la India; elaborado en Nagasaki, Sakai, Kioto y Edo","era":"Siglos XVI–XVII","about":"Algodón estampado y colorido de la India y el Sudeste Asiático que llegó a través del comercio exterior. Sus flores, aves y motivos geométricos exóticos eran muy apreciados, y los artesanos japoneses pronto crearon sus propias versiones.","process":"En la India, los motivos se dibujaban o estampaban con bloques usando mordientes y cera. El 'wa-sarasa' japonés solía hacerse con muchas plantillas de papel, una para cada color, aplicadas una tras otra.","look":"Motivos florales densos y parecidos al paisley, de aire extranjero, en rojos terrosos, índigo y marrones."},"kinsai":{"name":"Decoración con pan de oro","region":"Kioto","era":"Antigua; floreció en el siglo XVI","about":"El arte de decorar kimonos terminados con oro y plata auténticos. Suele ser el toque final de los kimonos formales teñidos con yuzen, y aporta luz a flores, nubes y contornos.","process":"Se aplica adhesivo a través de una plantilla o se dibuja con un cono fino, y el pan de oro se presiona encima y se retira con un pincel donde no debe quedar. El oro también puede espolvorearse en escamas diminutas o trazarse en líneas de pasta de oro.","look":"Detalles brillantes en oro o plata sobre un diseño teñido, que captan la luz cuando quien lo lleva se mueve."},"oshima":{"name":"Oshima tsumugi teñido con barro","region":"Isla de Amami Oshima, Kagoshima","era":"Más de 1.300 años de historia","about":"Uno de los tejidos para kimono más famosos de Japón. Su negro parduzco, profundo y brillante, se obtiene tiñendo la seda con un árbol local y después con barro rico en hierro. Es ligero, suave y casi nunca se arruga.","process":"Primero los hilos se tejen apretados en una estera provisional para reservar el motivo. La estera se tiñe decenas de veces con corteza de sharinbai y luego en barro, se deshace, y los hilos se vuelven a tejer uno a uno, haciendo coincidir a mano cada puntito.","look":"Una superficie oscura y sedosa con motivos geométricos finísimos formados por diminutas cruces."},"yuki":{"name":"Yuki tsumugi hilado a mano","region":"Yuki, Ibaraki y Oyama, Tochigi","era":"Orígenes en el periodo Nara (siglo VIII) o antes; famoso desde el siglo XVII","about":"Inscrito por la UNESCO como Patrimonio Cultural Inmaterial en 2010. Se dice que es el kimono informal más lujoso: cálido y ligero, se vuelve más suave cuanto más se usa.","process":"La seda se hila a mano a partir de borra sin ninguna torsión. Los hilos del motivo se atan a mano, se tiñen y se tejen en un telar de cintura, donde el propio cuerpo de la tejedora tensa la urdimbre. Una pieza puede llevar desde meses hasta más de un año.","look":"Una textura suave y ligeramente irregular, con un brillo mate y delicado."},"ushikubi":{"name":"Ushikubi tsumugi de capullo doble","region":"Hakusan, Ishikawa","era":"Más de 800 años","about":"Un tsumugi poco común de una aldea de montaña, hecho con 'capullos dobles' hilados por dos gusanos de seda juntos. Es tan resistente que lo apodaron 'tsumugi arrancaclavos': si se engancha en un clavo, la tela arranca el clavo en lugar de rasgarse.","process":"El hilo se extrae directamente de los capullos dobles en agua caliente, lo que le da irregularidades naturales. La tela blanca se teje primero y a menudo se tiñe después, incluso con pintura yuzen.","look":"Una seda resistente con pequeños nudos naturales y un brillo cálido y discreto."},"kihachijo":{"name":"Kihachijo, seda amarilla de la isla","region":"Isla de Hachijo, Tokio","era":"Documentado desde el periodo Muromachi; popular en el periodo Edo","about":"Una seda tejida en una isla remota con solo tres colores naturales obtenidos de plantas de la isla: amarillo dorado, marrón óxido y negro. Se puso de moda entre los habitantes de Edo.","process":"El amarillo procede de la hierba kariyasu, el marrón de la corteza de tabunoki y el negro de la corteza de castanopsis tratada con barro rico en hierro. Los hilos se tiñen una y otra vez y luego se tejen en cuadros y rayas.","look":"Cuadros o rayas en amarillo vivo, marrón y negro con un acabado lustroso."},"meisen":{"name":"Meisen, seda de hilo estampado","region":"Isesaki, Chichibu, Ashikaga, Kiryu, Hachioji","era":"Auge entre las décadas de 1910 y 1930","about":"Una seda asequible que acercó la moda a las mujeres corrientes en las eras Taisho y principios de Showa. Sus atrevidos diseños Art Nouveau y Art Déco hoy enamoran a coleccionistas de vintage de todo el mundo.","process":"La urdimbre se hilvana de forma suelta y el motivo se estampa sobre ella con plantilla. Durante el tejido se retira el hilván y se añade la trama definitiva, de modo que los colores se desplazan un poco y los bordes se ven suavemente difuminados.","look":"Motivos atrevidos y modernos con contornos plumosos y ligeramente desplazados."},"jofu":{"name":"Jofu, tela fina de ramio","region":"Echigo (Niigata), Miyako (Okinawa), Omi (Shiga), Noto (Ishikawa)","era":"Más de 1.200 años","about":"'Tela superior': un tejido finísimo y crujiente de fibra de ramio que se lleva en pleno verano. El Echigo jofu y el Ojiya chijimi figuran en la lista de Patrimonio Cultural Inmaterial de la UNESCO.","process":"Las fibras de ramio se dividen a mano en hebras finas como un cabello y se empalman una tras otra. Tras el tejido, el Echigo jofu se extiende sobre la nieve en los días soleados de primavera para blanquearse de forma natural.","look":"Ligero, translúcido y fresco, con un tacto crujiente, casi como de papel."},"omeshi":{"name":"Omeshi, crepé tejido","region":"Kioto (Nishijin), Kiryu, Shiozawa","era":"Periodo Edo","about":"Un crepé de seda tejido que debe su nombre al shogun Tokugawa Ienari, que lo adoraba: omeshi significa 'llevado por una persona distinguida'. Está a medio camino entre los kimonos teñidos y los tejidos, y es ideal para visitas elegantes y fiestas.","process":"Los hilos se tiñen antes de tejer. La trama se retuerce con mucha fuerza y se almidona; tras el tejido, el agua tibia libera la torsión y crea una fina superficie rizada.","look":"Un crepé firme con una sutil textura granulada, q
