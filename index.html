่างเป็นธรรมชาติ","process":"แทนที่จะเรียงฝีเข็มเป็นระเบียบเคียงกัน ช่างปักจะซ้อนฝีเข็มอย่างอิสระในทิศทางไขว้กัน และผสมสีในแต่ละชั้นเพื่อสร้างมิติ","look":"พื้นผิวคล้ายภาพวาด ไล่เฉดนุ่มนวลแทนที่จะเห็นเส้นฝีเข็มชัดเจน"},"hitta":{"name":"ฮิตตะ (Hitta) ชิโบริจุดสี่เหลี่ยม","region":"เกียวโต","era":"พัฒนาถึงขั้นสูงภายในศตวรรษที่ 17","about":"ชิโบริประเภทที่หรูหราที่สุด จุดสี่เหลี่ยมเล็ก ๆ เรียงตัวในแนวทแยง กิโมโนที่ปกคลุมด้วยฮิตตะทั้งผืนเรียกว่า ‘โซฮิตตะ’ (so-hitta) ถือเป็นที่สุดแห่งความหรูหรา","process":"ช่างหญิงหยิบผ้าชิ้นเล็กจิ๋ว พับเป็นสี่ แล้วพันด้ายรอบหลายรอบ แต่ละจุดมัดด้วยมือ ฟุริโซเดะ (furisode) ที่ปกคลุมทั้งผืนจึงอาจใช้เวลาหนึ่งปีหรือมากกว่า","look":"จุดสี่เหลี่ยมนูนสม่ำเสมอ เรียงเป็นแถวทแยงอย่างเป็นระเบียบ"},"kanoko":{"name":"คาโนโกะ (Kanoko) ชิโบริลายจุดลูกกวาง","region":"เกียวโตและทั่วญี่ปุ่น","era":"ตั้งแต่สมัยโบราณ","about":"‘คาโนโกะ’ แปลว่าลูกกวาง เพราะจุดขาวเล็ก ๆ ที่มีสีอยู่ตรงกลางดูเหมือนลายจุดของกวางน้อย เป็นชิโบริที่รู้จักกันดีที่สุด พบได้บนโอบิอาเกะ (obiage) กิโมโน และเครื่องประดับ","process":"หยิบผ้าเป็นจุดเล็ก ๆ แล้วมัดด้วยด้ายให้แน่นก่อนย้อม หลังย้อมและแกะด้าย แต่ละจุดจะเหลือเป็นวงแหวนที่มีพื้นผิวนูนเป็นปุ่ม","look":"วงแหวนจุดเล็ก ๆ ที่มี ‘ตา’ สีเล็กจิ๋วอยู่ตรงกลาง"},"boshi":{"name":"โบชิ (Boshi) ชิโบริแบบครอบหมวก","region":"เกียวโต, อาริมัตสึ","era":"สมัยเอโดะ","about":"‘โบชิ’ แปลว่าหมวก วิธีนี้ป้องกันพื้นที่ขนาดใหญ่ของลวดลายจากสีย้อมด้วยการครอบไว้ ทำให้เก็บดอกไม้หรือวงกลมขนาดใหญ่ให้เป็นสีขาวได้","process":"เย็บรอบเส้นขอบแล้วรูดรวบ จากนั้นคลุมพื้นที่ด้านในเหมือนสวมหมวก ซึ่งแต่เดิมใช้กาบไผ่ ปัจจุบันมักใช้ไวนิล แล้วพันด้ายมัดให้แน่นก่อนย้อม","look":"รูปทรงขนาดใหญ่ที่ไม่ถูกย้อม ขอบนุ่มฟุ้งเล็กน้อย"},"nuishime":{"name":"นุยชิเมะ (Nuishime) ชิโบริแบบเย็บ","region":"เกียวโต, อาริมัตสึ-นารุมิ (นาโงยะ)","era":"อย่างน้อยตั้งแต่สมัยมุโรมาจิ","about":"วิธีชิโบริที่ใช้การเย็บด้นเพื่อสร้างเส้นและรูปทรงที่แม่นยำ ทำให้ได้รูปทรงที่อิสระกว่าการมัดเพียงอย่างเดียวมาก","process":"เย็บลวดลายด้วยฝีเข็มด้นเล็ก ๆ แล้วดึงด้ายให้ตึงจนผ้ารวบเป็นจีบ ส่วนที่พับจีบจะกันสีไว้ เหลือเป็นเส้นขอบแบบจุดประ","look":"เส้นขอบชัดเจนที่เกิดจากแถวของขีดเล็ก ๆ"},"arashi":{"name":"อาราชิ (Arashi) ชิโบริพันเสา","region":"อาริมัตสึ-นารุมิ (นาโงยะ)","era":"ปลายศตวรรษที่ 19","about":"‘อาราชิ’ แปลว่าพายุ เส้นทแยงดูเหมือนสายฝนที่ถูกลมพัด เป็นลายคลาสสิกของอาริมัตสึ เมืองชิโบริที่ใหญ่ที่สุดของญี่ปุ่น และเป็นที่นิยมสำหรับยูกาตะ (yukata)","process":"พันผ้าในแนวทแยงรอบเสายาว มัดด้วยด้าย แล้วดันลงให้ย่นเป็นจีบแน่น เฉพาะสันด้านนอกเท่านั้นที่รับสีย้อม","look":"เส้นทแยงละเอียดที่ดูเหมือนสายฝนเฉียง"},"tatsumaki":{"name":"ทัตสึมากิ (Tatsumaki) ชิโบริลมหมุน","region":"อาริมัตสึ-นารุมิ (นาโงยะ), เกียวโต","era":"เทคนิคดั้งเดิม","about":"‘ทัตสึมากิ’ แปลว่าพายุทอร์นาโด พันด้ายรอบผ้าเป็นเกลียว ลวดลายจึงหมุนวนราวกับติดอยู่ในลมหมุน","process":"รวบผ้า (มักเย็บหรือจับจีบก่อน) รอบแกนให้เป็นแท่งกลมยาว แล้วพันด้ายเป็นเกลียวจากบนลงล่างก่อนย้อม เฉพาะผิวด้านนอกที่โผล่ออกมาเท่านั้นที่ติดสี จึงเกิดเป็นแถบเกลียว","look":"ลายทางหมุนวนเป็นเกลียว ให้ความรู้สึกเคลื่อนไหวอย่างชัดเจน"},"yanagi":{"name":"ยานางิ (Yanagi) ชิโบริลายต้นหลิว","region":"อาริมัตสึ-นารุมิ (นาโงยะ)","era":"สมัยเอโดะ","about":"‘ยานางิ’ แปลว่าต้นหลิว ลวดลายดูเหมือนกิ่งหลิวที่พลิ้วไหวตามสายลม เป็นที่ชื่นชอบสำหรับยูกาตะฤดูร้อน","process":"รวบผ้าตามแนวยาวเป็นจีบแคบ ๆ แล้วมัดด้วยด้ายเป็นช่วง ๆ จีบผ้าจะกันสี เหลือเป็นเส้นแนวตั้งบาง ๆ ที่ขาดเป็นช่วง","look":"เส้นแนวตั้งอ่อนโยนที่ดูเหมือนกิ่งหลิวห้อยลงมา"},"oke":{"name":"โอเกะ (Oke) ชิโบริถังไม้","region":"เกียวโต","era":"เทคนิคดั้งเดิมของเกียวโต","about":"‘โอเกะ’ แปลว่าถัง เทคนิคหายากนี้รักษาผ้าส่วนใหญ่ให้แห้งด้วยการปิดผนึกไว้ในถังไม้ ทำให้กิโมโนหนึ่งชุดมีพื้นที่สีต่างกันขนาดใหญ่ได้ ปัจจุบันเหลือช่างที่ทำได้น้อยมาก","process":"ใส่ส่วนที่ไม่ต้องการย้อมลงในถังไม้สนไซเปรส หนีบฝาปิดให้แน่นบนผ้าแล้วมัดด้วยเชือก โดยให้ส่วนที่จะย้อมอยู่ด้านนอกถัง จากนั้นจุ่มทั้งถังลงในอ่างย้อมที่ใหญ่กว่า ทำซ้ำสำหรับทุกสี","look":"บล็อกสีขนาดใหญ่ต่างสีกันอย่างโดดเด่น ขอบสะอาดและนุ่มเล็กน้อย"},"itajime":{"name":"อิตะจิเมะ (Itajime) ย้อมหนีบแผ่นไม้","region":"อาริมัตสึ, เกียวโต และที่อื่น ๆ","era":"ตั้งแต่ศตวรรษที่ 8","about":"หนึ่งในเทคนิคกันสีที่เก่าแก่ที่สุดของญี่ปุ่น ต้นแบบของเทคนิคนี้คือเคียวเคจิ (kyokechi การย้อมโดยหนีบระหว่างแผ่นไม้แกะสลัก) ซึ่งยังหลงเหลืออยู่ในคลังสมบัติโชโซอินแห่งศตวรรษที่ 8 ผ้าที่พับแล้วถูกหนีบระหว่างแผ่นไม้เพื่อสร้างลวดลายซ้ำ","process":"พับผ้าเป็นรูปสามเหลี่ยมหรือสี่เหลี่ยม หนีบให้แน่นระหว่างแผ่นไม้ แล้วจุ่มลงในสีย้อม ส่วนที่ถูกปิดไว้จะคงเป็นสีขาวและเกิดเป็นลวดลายสมมาตร","look":"รูปทรงเรขาคณิตซ้ำ ๆ เช่น ลายคล้ายเกล็ดหิมะที่เรียกว่าเซกกะ (sekka)"},"tsukami":{"name":"สึกามิ (Tsukami) ชิโบริแบบกำ","region":"แหล่งผลิตชิโบริในที่ต่าง ๆ","era":"ดั้งเดิม","about":"‘สึกามิ’ แปลว่ากำ ผ้าถูกกำเป็นกระจุกแล้วมัด ทุกชิ้นจึงออกมาไม่เหมือนกัน ให้ความรู้สึกอิสระและเป็นธรรมชาติ","process":"ช่างกำผ้า บิดเป็นกระจุกไม่เป็นระเบียบ และมัดด้วยด้ายก่อนย้อม รอยพับที่สุ่มเกิดจะสร้างลวดลายที่คาดเดาไม่ได้","look":"ลวดลายไม่สม่ำเสมอ คล้ายเมฆหรือลายหินอ่อน ไม่มีลายซ้ำ"},"kumihimo":{"name":"คุมิฮิโมะ (Kumihimo) เชือกถักไหม","region":"เกียวโต, อิงะ (มิเอะ)","era":"ตั้งแต่ศตวรรษที่ 7–8","about":"เชือกไหมถัก แรกเริ่มใช้กับเครื่องใช้ทางพุทธศาสนาและเครื่องแต่งกายในราชสำนัก ต่อมาใช้กับชุดเกราะซามูไรและเชือกดาบ ปัจจุบันเป็นที่รู้จักดีที่สุดในฐานะโอบิจิเมะ (obijime) เชือกที่ผูกรอบกลางโอบิ","process":"พันด้ายไหมหลายสิบเส้นบนหลอดถ่วงน้ำหนัก แล้วไขว้ทับกันบนแท่นไม้ เช่น แท่นกลมมารุได (marudai) แท่นและวิธีถักที่ต่างกันทำให้ได้เชือกกลม เหลี่ยม หรือแบน","look":"เชือกถักแน่นสม่ำเสมอ มีลายทแยงละเอียดและการผสมสีที่เข้มข้น"},"zogan":{"name":"โซกัง (Zogan) งานฝังโลหะ","region":"เกียวโต, คุมาโมโตะ (ฮิโงะ)","era":"รุ่งเรืองในสมัยเอโดะบนเครื่องประกอบดาบและปืน","about":"ศิลปะการฝังทองและเงินลงในเหล็ก เคยใช้ตกแต่งเครื่องประกอบดาบ ปัจจุบันประดับเครื่องประดับกิโมโน เช่น โอบิโดเมะ (obidome – เข็มกลัดโอบิ) และเครื่องประดับผม","process":"ขูดผิวเหล็กเป็นร่องไขว้ละเอียด ตอกแผ่นทองหรือเงินและลวดลงในร่อง จากนั้นจงใจทำให้เหล็กขึ้นสนิม แล้วอบกับแล็กเกอร์หรือน้ำมันจนเป็นสีดำสนิท","look":"ลวดลายทองและเงินแวววาวบนพื้นสีดำสนิท"},"makie":{"name":"มากิเอะ (Maki-e) เครื่องเขินลายทอง","region":"เกียวโต, วาจิมะ, คานาซาวะ และที่อื่น ๆ","era":"ตั้งแต่ศตวรรษที่ 8–9","about":"ศิลปะเครื่องเขินที่วาดลวดลายด้วยยางรักแล้วโรยผงทองหรือเงิน ในโลกของกิโมโนพบได้บนหวี ปิ่นปักผม โอบิโดเมะ และรองเท้าเกตะ (geta)","process":"วาดลวดลายด้วยยางรัก แล้วโรยผงทองหรือเงินละเอียดผ่านหลอดไม้ไผ่ก่อนที่ยางรักจะแห้ง จากนั้นเคลือบและขัดเงาหลายครั้ง","look":"ภาพสีทองอันประณีต เงางามลึกบนพื้นเครื่องเขินสีดำหรือแดง"},"mizuhiki":{"name":"มิซุฮิกิ (Mizuhiki) เชือกกระดาษ","region":"อีดะ (นากาโนะ), คานาซาวะ (อิชิกาวะ)","era":"ต้นกำเนิดย้อนไปถึงศตวรรษที่ 7","about":"เชือกประดับที่ทำจากกระดาษวาชิบิดเกลียว ผูกเป็นปมที่สื่อถึงคำอวยพรให้โชคดี ใช้ตกแต่งซองของขวัญ และในการแต่งกิโมโนใช้เป็นเครื่องประดับผมเจ้าสาวและของตกแต่งโอบิ","process":"บิดกระดาษวาชิเป็นเชือกเส้นเล็ก ลงแป้งให้แข็ง แล้วย้อมสีหรือหุ้มด้วยฟิล์มสีหรือฟิล์มโลหะ นำเชือกมาผูกเป็นปม เช่น ปมอาวาจิ (awaji) หรือขึ้นรูปเป็นนกกระเรียน ต้นสน และดอกบ๊วย","look":"เชือกแข็งเงางามผูกเป็นปมสมมาตร มักเป็นสีแดง-ขาว หรือทอง-เงิน"},"ro":{"name":"โระ (Ro) ผ้าโปร่งฤดูร้อนลายแถบรู","region":"เกียวโตและแหล่งทอผ้าไหมอื่น ๆ","era":"มีบันทึกชื่อตั้งแต่ศตวรรษที่ 15 แพร่หลายตั้งแต่สมัยเอโดะ","about":"ผ้าไหมฤดูร้อนที่มีรูเล็ก ๆ เรียงเป็นแถวอย่างเป็นระเบียบให้ลมผ่านได้ เป็นผ้าคลาสสิกสำหรับกิโมโนทั้งแบบพิธีการและแบบลำลองในช่วงเดือนที่ร้อนที่สุด ตั้งแต่ต้นฤดูร้อนจนถึงปลายฤดูร้อน","process":"ทอลายขัดหลายแถว จากนั้นบิดด้ายยืนเป็นคู่ไขว้พันกันหนึ่งแถวเพื่อเว้นช่องเป็นแนว จำนวนแถวลายขัดระหว่างแนวช่องเป็นที่มาของชื่อ ‘โระสามแถว’ ‘โระห้าแถว’ เป็นต้น","look":"เส้นรูเล็ก ๆ ละเอียดเรียงในแนวนอน (หรือบางครั้งแนวตั้ง) บนผืนผ้าไหมที่ทึบ"},"sha":{"name":"ชะ (Sha) ผ้าไหมโปร่งทั้งผืน","region":"เกียวโตและแหล่งทอผ้าไหมอื่น ๆ","era":"มาจากจีนในศตวรรษที่ 7–8","about":"ผ้าไหมบางเบาโปร่งแสงที่สวมใส่ในช่วงกลางฤดูร้อน เบาและโปร่งกว่าโระ และยังใช้ทำฮาโอริ (haori) และเสื้อคลุมฤดูร้อนที่สวมทับกิโมโน","process":"ในทุกแถว ด้ายยืนจะถูกบิดเป็นคู่ไขว้พันกันและถูกด้ายพุ่งล็อกไว้ ทำให้เกิดตาข่ายโปร่งสม่ำเสมอทั่วทั้งผืน","look":"ตาข่ายบางโปร่งสม่ำเสมอโดยไม่มีแถบทึบ ชั้นที่อยู่ด้านล่างมองทะลุได้อย่างนุ่มนวล"},"ra":{"name":"ระ (Ra) ผ้าโปร่งซับซ้อนคล้ายตาข่าย","region":"เกียวโต","era":"ยุคโบราณ (ศตวรรษที่ 7–8) ฟื้นฟูในศตวรรษที่ 20","about":"หนึ่งในผ้าโปร่งที่เก่าแก่ที่สุดและซับซ้อนที่สุด มีตัวอย่างเก็บรักษาไว้ในคลังสมบัติโชโซอินแห่งศตวรรษที่ 8 เทคนิคนี้เสื่อมถอยลงในญี่ปุ่นหลังยุคกลาง และได้รับการฟื้นฟูโดยช่างทอระดับครูในยุคใหม่ ทุกวันนี้พบส่วนใหญ่ในโอบิฤดูร้อนชั้นหรู","process":"ด้ายยืนแต่ละเส้นไขว้ข้ามไปบิดพันกับด้ายข้างเคียงหลายเส้น ไม่ใช่เพียงคู่เดียว ทำให้ด้ายก่อตัวเป็นตาข่าย ทอด้วยมืออย่างช้า ๆ บนกี่ชนิดพิเศษ","look":"ตาข่ายยืดหยุ่นคล้ายแห มีช่องรูปข้าวหลามตัด และมักมีลวดลายปรากฏอยู่ในตาข่าย"},"kobai":{"name":"โคไบ (Kobai) ผ้าฤดูร้อนลายตารางนูน","region":"แหล่งทอผ้าฝ้ายและผ้าไหมทั่วญี่ปุ่น","era":"ผ้าฤดูร้อนแบบดั้งเดิม","about":"ผ้าฤดูร้อนที่มีผิวสัมผัสเป็นตารางนูน ทำจากฝ้าย (เมงโคไบ – men-kobai) หรือไหมผสมฝ้าย (คินุโคไบ – kinu-kobai) เป็นที่ชื่นชอบสำหรับยูกาตะคุณภาพสูงและกิโมโนฤดูร้อนแบบลำลอง","process":"ทอด้ายเส้นหนาแทรกเป็นระยะสม่ำเสมอทั้งแนวยืนและแนวขวางลงบนผ้าพื้นที่บางเบา ด้ายเส้นหนาจะก่อตัวเป็นตารางสี่เหลี่ยมนูน","look":"ผ้าเบาที่มีลายตารางจากเส้นนูน สันนูนช่วยไม่ให้ผ้าแนบติดผิว"},"rokechi":{"name":"โรเคจิ (Rokechi) ย้อมกันสีด้วยขี้ผึ้ง","region":"เกียวโตและทั่วญี่ปุ่น","era":"ศตวรรษที่ 8 ฟื้นฟูขึ้นใหม่ในศตวรรษที่ 20","about":"หนึ่งในสามวิธีย้อมกันสีโบราณของสมัยนาระ ซึ่งยังมีตัวอย่างเก็บรักษาไว้ในคลังสมบัติโชโซอิน (Shosoin) เทคนิคนี้เลือนหายไปในสมัยเฮอัน และได้รับการฟื้นฟูโดยศิลปินในศตวรรษที่ 20 ซึ่งทำให้กลายเป็นการย้อมที่อิสระและมีลักษณะคล้ายงานจิตรกรรม","process":"ใช้แปรงทาหรือประทับขี้ผึ้งที่หลอมละลายลงบนผ้าในส่วนที่ไม่ต้องการให้ติดสี แล้วนำผ้าไปย้อม จากนั้นกำจัดขี้ผึ้งออกด้วยความร้อนหรือน้ำร้อน ตรงที่ขี้ผึ้งแตกร้าว สีย้อมจะซึมเข้าไปและทิ้งเส้นเล็ก ๆ ไว้","look":"รูปทรงที่โดดเด่น มีเส้นรอยแตกละเอียดคล้ายใยแมงมุมพาดผ่าน"},"mokuhan":{"name":"โมกุฮัง (Mokuhan) พิมพ์ผ้าด้วยบล็อกไม้","region":"เกียวโตและพื้นที่อื่น ๆ","era":"มีรากฐานมาแต่โบราณ","about":"เทคนิคการพิมพ์ที่กดลวดลายซึ่งแกะสลักบนบล็อกไม้ลงบนผ้า การพิมพ์แต่ละครั้งสะท้อนฝีมือของช่าง และความแตกต่างเล็กน้อยทำให้ผ้ามีเสน่ห์อบอุ่นแบบงานทำมือ ปัจจุบันเหลือโรงงานที่ยังทำเทคนิคนี้อยู่เพียงไม่กี่แห่ง","process":"แกะลวดลายลงบนบล็อกไม้เนื้อแข็ง ทาสีย้อมหรือแป้งสีบนบล็อก แล้วกดลงบนผ้าที่ขึงตึงอย่างแน่นทีละครั้ง โดยใช้บล็อกแยกกันสำหรับแต่ละสี","look":"ลวดลายซ้ำ ๆ ที่สีไม่สม่ำเสมอเล็กน้อย ขอบนุ่ม และมีพื้นผิวลายไม้จาง ๆ"},"chusen":{"name":"ชูเซ็น (Chusen) ย้อมด้วยการเทสี","region":"โอซาก้า (ซาไก) ฮามามัตสึ (ชิซุโอกะ) โตเกียว","era":"ปลายศตวรรษที่ 19 (สมัยเมจิ)","about":"วิธีย้อมแบบญี่ปุ่นสำหรับยูกาตะ (yukata) ผ้าฝ้ายและผ้าเทนุกุอิ (tenugui) สีย้อมซึมทะลุเนื้อผ้าทั้งหมด ทั้งสองด้านจึงมีสีเดียวกัน และสีดูนุ่มนวลสดชื่น","process":"พับผ้าไปมาซ้อนกันหลายชั้น โดยปาดแป้งกันสีผ่านแม่แบบลงบนทุกชั้น สร้างกำแพงแป้งล้อมรอบแต่ละพื้นที่ เทสีย้อมลงจากกา แล้วใช้แรงดูดจากด้านล่างดึงสีให้ซึมผ่านทุกชั้นพร้อมกันในครั้งเดียว","look":"สีนุ่มนวลพร่าเลือนเล็กน้อย ไล่เฉดอย่างอ่อนโยน และเห็นลวดลายเดียวกันชัดเจนที่ด้านหลัง"},"bingata":{"name":"บิงกาตะ (Bingata) ย้อมผ่านแม่แบบแบบโอกินาวา","region":"โอกินาวา","era":"สมัยอาณาจักรริวกิว (ตั้งแต่ราวศตวรรษที่ 15)","about":"ศิลปะการย้อมสีสันสดใสของโอกินาวา ซึ่งเคยสวมใส่โดยราชวงศ์และขุนนางของอาณาจักรริวกิว สีสดใสและลวดลายจากทั้งญี่ปุ่นและทะเลทางใต้ทำให้มีบุคลิกร่าเริงแบบเขตร้อน","process":"แกะลวดลายลงบนแม่แบบกระดาษ แล้วปาดแป้งข้าวผ่านแม่แบบ ใช้แปรงระบายสีจากแร่และสีย้อมจากพืชลงในแต่ละพื้นที่ แล้วถูสีเฉดเข้มกว่าทับตามขอบ (คุมาโดริ – kumadori) เพื่อเพิ่มมิติ แบบที่ย้อมด้วยครามเพียงอย่างเดียวเรียกว่าเออิงาตะ (eigata)","look":"สีเหลือง แดง และน้ำเงินสดใส ขอบไล่เฉด และลวดลายอย่างดอกไม้ นก คลื่น และเมฆ"},"aizome":{"name":"ไอโซเมะ (Aizome) ย้อมคราม","region":"โทกุชิมะ (อาวะ) และทั่วญี่ปุ่น","era":"สมัยโบราณ แพร่หลายในสมัยเอโดะ","about":"ครามเป็นสีย้อมที่ใช้กันมากที่สุดในญี่ปุ่น ใช้กับทุกอย่างตั้งแต่ชุดทำงานของชาวนาไปจนถึงกิโมโน ชาวต่างชาติที่มาเยือนในสมัยเมจิประทับใจมากจนสีนี้เป็นที่รู้จักในชื่อ ‘เจแปนบลู’ (Japan Blue)","process":"นำใบครามไปหมักทำเป็นสุคุโมะ (sukumo) แล้วหมักในโอ่งร่วมกับน้ำด่างขี้เถ้าไม้ รำข้าวสาลี และปูนขาว จุ่มผ้าแล้วยกขึ้นซ้ำแล้วซ้ำเล่า ผ้าออกมาเป็นสีเขียวและเปลี่ยนเป็นสีน้ำเงินเมื่อสัมผัสอากาศ ยิ่งจุ่มหลายครั้งสียิ่งเข้ม","look":"สีน้ำเงินเข้มที่มีชีวิตชีวา ตั้งแต่สีฟ้าอ่อนไปจนเกือบดำ และนุ่มนวลลงอย่างสวยงามเมื่อสวมใส่"},"lace":{"name":"ลูกไม้","region":"พัฒนาขึ้นในยุโรป ผลิตในญี่ปุ่นและทั่วโลก","era":"ลูกไม้ยุโรปตั้งแต่ศตวรรษที่ 16 ใช้กับกิโมโนตั้งแต่สมัยเมจิ–ไทโช","about":"ลูกไม้คือผ้าโปร่งฉลุที่ทำจากเส้นด้ายล้วน ๆ ในแฟชั่นกิโมโนปัจจุบัน กิโมโน ฮาโอริ (haori) และโอบิ (obi) ลูกไม้เป็นที่นิยม มักสวมทับกิโมโนสีเพื่อให้สีด้านล่างมองทะลุออกมา","process":"ลูกไม้สำหรับกิโมโนส่วนใหญ่ทำด้วยเครื่องปักผ้า ปักลวดลายลงบนตาข่ายละเอียด (ลูกไม้ผ้าทูล) หรือบนผ้ารองที่จะถูกละลายออกภายหลัง เหลือไว้เพียงเส้นด้ายที่ปัก (ลูกไม้เคมี)","look":"ลวดลายดอกไม้หรือเรขาคณิตโปร่งใสจากเส้นด้าย โดยมีสีด้านล่างมองทะลุผ่านช่องโปร่ง"},"tsuzure":{"name":"สึซุเระ (Tsuzure) ผ้าทอภาพ","region":"เกียวโต (นิชิจิน)","era":"มีตัวอย่างในญี่ปุ่นตั้งแต่ศตวรรษที่ 8 (น่าจะนำเข้าจากจีน) เริ่มทอที่นิชิจินตั้งแต่ศตวรรษที่ 18 (สมัยเอโดะ)","about":"งานทอภาพแบบญี่ปุ่น ซึ่งเกี่ยวข้องกับผ้าทอภาพโกเบอแลงของยุโรป ถือเป็นโอบิระดับสูงสุด และชิ้นที่ประณีตที่สุดทอด้วยมือโดยใช้เล็บของช่างทอ","process":"ด้ายพุ่งแต่ละสีถูกทอไปกลับเฉพาะในส่วนของลวดลายที่เป็นของตัวเอง จนปิดด้ายยืนไว้ทั้งหมด ช่างทอตะไบเล็บให้เป็นหยักฟันเลื่อยแล้วใช้เล็บดันด้ายพุ่งแต่ละเส้นให้เข้าที่ ทอได้เพียงไม่กี่เซนติเมตรต่อวัน","look":"ผ้าแน่นและเรียบ มีภาพเดียวกันทั้งด้านหน้าและด้านหลัง และมีช่องเล็ก ๆ ตรงที่สองสีมาบรรจบกัน"},"benibana":{"name":"เบนิบานะ (Benibana) ย้อมดอกคำฝอย","region":"ยามากาตะ (โมกามิ) และเกียวโต","era":"เข้ามาทางเส้นทางสายไหมราวศตวรรษที่ 6–7","about":"สีย้อมแดงจากธรรมชาติที่ทำจากกลีบดอกคำฝอย เป็นที่ชื่นชอบของราชสำนักเฮอัน ในสมัยเอโดะมีค่ามากจนมีคำกล่าวว่า ‘สีแดงหนึ่งหน่วยเท่ากับทองคำหนึ่งหน่วย’ แต่เดิมใช้กับซับในผ้าไหมสีแดงของกิโมโน (โมมิ)","process":"นำกลีบดอกไปล้างน้ำเพื่อชะสารสีเหลืองออกเสียส่วนใหญ่ จากนั้นหมักแล้วอัดเป็นก้อนที่เรียกว่า ‘เบนิโมจิ’ (beni-mochi) สกัดสีแดงออกมาด้วยน้ำด่างขี้เถ้า แล้วตรึงสีลงบนผ้าไหมด้วยน้ำส้มสายชูบ๊วยรมควัน (อุบาอิ) ยิ่งย้อมซ้ำสียิ่งเข้ม","look":"ตั้งแต่สีชมพูใสเปล่งประกายไปจนถึงสีแดงเลือดนกเข้ม สีบอบบางและซีดจางเมื่อโดนแสงแรง"}}},"vi":{"ui":{"tagline":"Nghề thủ công phía sau kimono — 50 kỹ thuật truyền thống của Nhật Bản","all":"Tất cả","search":"Tìm kỹ thuật…","region":"Nơi làm","era":"Từ","about":"Đó là gì","process":"Cách làm","look":"Cách nhận biết","listen":"Nghe tên tiếng Nhật","close":"Đóng","language":"Ngôn ngữ","count":"{n} kỹ thuật","noResults":"Không có kỹ thuật nào phù hợp với tìm kiếm của bạn.","prev":"Trước","next":"Tiếp","intro":"Một bộ kimono được làm qua nhiều công đoạn, và mỗi công đoạn có những nghệ nhân bậc thầy riêng. Hãy chọn một danh mục hoặc chạm vào bất kỳ kỹ thuật nào để tìm hiểu thêm."},"cats":{"dye":{"name":"Nhuộm","desc":"Hoa văn được vẽ, in qua khuôn giấy hoặc in lên lụa trắng đã dệt xong. Kimono nhuộm thường là loại trang trọng hơn, mặc trong các nghi lễ và dịp lễ mừng."},"weave":{"name":"Dệt","desc":"Sợi được nhuộm trước và hoa văn hiện ra khi vải được dệt. Kimono dệt như tsumugi được yêu thích như trang phục thường ngày sành điệu, còn obi dệt có thể là loại trang trọng nhất."},"embroidery":{"name":"Thêu","desc":"Chỉ lụa và chỉ kim tuyến được thêu tay lên vải để tạo kết cấu, ánh sáng và chiều sâu. Trên kimono trang trọng, thêu thường được kết hợp với nhuộm."},"shibori":{"name":"Shibori (nhuộm buộc)","desc":"Một số phần của vải được buộc, khâu, gấp hoặc kẹp lại để thuốc nhuộm không thấm vào. Khi tháo chỉ ra, hoa văn hiện lên với kết cấu nổi ba chiều mềm mại."},"other":{"name":"Nghề làm phụ kiện","desc":"Bộ kimono được hoàn thiện bằng dây, đồ trang sức và vật trang trí do nghệ nhân thuộc các truyền thống khác làm ra: thợ tết dây, thợ kim loại, nghệ nhân sơn mài và thợ làm dây giấy."}},"items":{"kaga-yuzen":{"name":"Kaga Yuzen – lụa vẽ tay","region":"Kanazawa, Ishikawa","era":"Đầu thế kỷ 18","about":"Phong cách nhuộm vẽ tay từ lãnh địa Kaga xưa. Nổi tiếng với hoa lá cây cỏ chân thực được vẽ bằng 'năm màu Kaga': chàm, đỏ thẫm, vàng đất, xanh lá cỏ và tím hoàng gia.","process":"Hình vẽ được viền bằng một đường hồ gạo mảnh để màu không bị lem. Sau đó từng vùng được tô bằng cọ, với sắc độ chuyển từ mép ngoài vào giữa. Thường một nghệ nhân phụ trách toàn bộ tác phẩm.","look":"Họa tiết tự nhiên như tranh vẽ, đôi khi có cả lá 'bị sâu ăn' (mushikui). Ít hoặc không dùng vàng và thêu."},"kyo-yuzen":{"name":"Kyo Yuzen – lụa vẽ tay Kyoto","region":"Kyoto","era":"Cuối thế kỷ 17","about":"Phong cách yuzen nguyên bản, mang tên Miyazaki Yuzensai, một họa sĩ vẽ quạt ở Kyoto. Nó mang đến cho kimono sự tự do thiết kế như hội họa và trở thành phong cách kinh điển cho trang phục trang trọng.","process":"Công việc được chia thành khoảng hai mươi công đoạn, mỗi công đoạn do một chuyên gia đảm nhận: thiết kế, vẽ đường viền, phủ hồ gạo chống màu, tô màu bằng cọ, hấp, xả nước, và cuối cùng thêm lá vàng và thêu.","look":"Họa tiết cung đình thanh lịch với màu sắc đậm đà, sắc độ chuyển từ giữa ra ngoài, thường hoàn thiện bằng vàng và thêu."},"edo-komon":{"name":"Edo Komon – nhuộm khuôn họa tiết nhỏ","region":"Tokyo","era":"Thế kỷ 17 (thời Edo)","about":"Những hoa văn nhỏ li ti lặp lại, nhuộm một màu, mịn đến mức nhìn từ xa vải trông như trơn. Bắt nguồn từ lễ phục của samurai, và mỗi lãnh chúa có hoa văn riêng dành cho mình.","process":"Hoa văn được khắc trên khuôn làm từ nhiều lớp giấy washi được làm cứng bằng nước ép quả hồng. Người thợ đặt khuôn lên lụa, quét hồ gạo qua khuôn, dịch khuôn khớp hoàn hảo, rồi nhuộm cả tấm vải.","look":"Nhìn gần: hàng nghìn chấm, sóng hoặc nét nhỏ li ti. Lùi xa vài bước: một màu trơn trầm lặng."},"tsujigahana":{"name":"Tsujigahana – nhuộm chống màu bằng khâu","region":"Kyoto và các vùng khác","era":"Thế kỷ 15 – đầu thế kỷ 17","about":"Phong cách xa hoa thời Muromachi và Momoyama, kết hợp nhuộm buộc bằng khâu với vẽ mực, lá vàng và thêu. Nó biến mất vào đầu những năm 1600 và sau này được gọi là 'kiểu nhuộm huyền ảo'.","process":"Đường viền họa tiết được khâu và rút chặt để thuốc nhuộm không thấm vào, và vải được nhuộm qua nhiều giai đoạn. Sau đó các chi tiết nhỏ như gân lá được vẽ bằng mực. Các nghệ nhân hiện đại đã phục hồi phong cách này vào thế kỷ 20.","look":"Hình dạng mềm mại, hơi nhòe với mép nhăn, kết hợp nét vẽ mực tinh tế."},"sarasa":{"name":"Sarasa – hoa văn in ngoại lai","region":"Gốc Ấn Độ; làm tại Nagasaki, Sakai, Kyoto và Edo","era":"Thế kỷ 16–17","about":"Vải bông hoa văn sặc sỡ từ Ấn Độ và Đông Nam Á đến Nhật qua giao thương với nước ngoài. Hoa lá, chim chóc và họa tiết hình học ngoại lai của nó được trân quý, và chẳng bao lâu thợ Nhật đã tự làm phiên bản riêng.","process":"Ở Ấn Độ, hoa văn được vẽ hoặc in bằng khuôn gỗ với chất cắn màu và sáp. 'Wa-sarasa' của Nhật thường được làm bằng nhiều khuôn giấy, mỗi khuôn một màu, lần lượt áp lên.","look":"Hoa văn hoa lá và kiểu paisley dày đặc mang dáng dấp ngoại lai, với các tông đỏ đất, chàm và nâu."},"kinsai":{"name":"Trang trí lá vàng","region":"Kyoto","era":"Từ xa xưa; phát triển rực rỡ vào thế kỷ 16","about":"Nghệ thuật trang trí kimono đã hoàn thiện bằng vàng và bạc thật. Đây thường là nét điểm xuyết cuối cùng trên kimono trang trọng nhuộm yuzen, làm sáng bừng hoa, mây và đường viền.","process":"Keo được quét qua khuôn hoặc vẽ bằng ống nón nhỏ, lá vàng được ép lên rồi phủi đi ở những chỗ không cần. Vàng cũng có thể được rắc thành vảy nhỏ hoặc vẽ thành nét bằng hồ vàng.","look":"Chi tiết vàng hoặc bạc lấp lánh trên nền hoa văn nhuộm, bắt sáng khi người mặc chuyển động."},"oshima":{"name":"Oshima – lụa tsumugi nhuộm bùn","region":"Đảo Amami Oshima, Kagoshima","era":"Hơn 1.300 năm lịch sử","about":"Một trong những loại vải kimono nổi tiếng nhất Nhật Bản. Màu nâu đen sâu bóng có được nhờ nhuộm lụa bằng một loại cây địa phương rồi nhuộm bằng bùn giàu sắt. Vải nhẹ, mượt và hầu như không bao giờ nhăn.","process":"Trước tiên sợi được dệt chặt thành một tấm chiếu tạm để giữ hoa văn. Tấm chiếu được nhuộm hàng chục lần bằng vỏ cây sharinbai rồi nhuộm bùn, tháo ra, và sợi được dệt lại từng sợi một, khớp từng chấm nhỏ bằng tay.","look":"Bề mặt sẫm màu, mượt như lụa với hoa văn hình học cực kỳ tinh xảo tạo từ những dấu chữ thập nhỏ."},"yuki":{"name":"Yuki – lụa tsumugi se tay","region":"Yuki, Ibaraki và Oyama, Tochigi","era":"Khởi nguồn từ thời Nara (thế kỷ 8) hoặc sớm hơn; nổi tiếng từ thế kỷ 17","about":"Được UNESCO công nhận là Di sản Văn hóa Phi vật thể năm 2010. Được cho là loại kimono thường ngày sang trọng nhất, ấm và nhẹ, càng mặc lâu càng mềm.","process":"Lụa được se tay từ bông tơ mà không xoắn sợi. Sợi tạo hoa văn được buộc bằng tay, nhuộm, rồi dệt trên khung dệt đeo lưng, nơi chính cơ thể người thợ dệt căng sợi dọc. Một cuộn vải có thể mất vài tháng đến hơn một năm.","look":"Kết cấu mềm, hơi không đều và ánh bóng mờ dịu nhẹ."},"ushikubi":{"name":"Ushikubi – lụa tsumugi kén đôi","region":"Hakusan, Ishikawa","era":"Hơn 800 năm","about":"Loại tsumugi hiếm từ một ngôi làng miền núi, làm từ 'kén đôi' do hai con tằm cùng nhả tơ. Nó bền đến mức có biệt danh 'tsumugi nhổ đinh': khi mắc vào đinh, vải kéo bật đinh ra thay vì bị rách.","process":"Sợi được kéo trực tiếp từ kén đôi trong nước nóng, tạo nên những chỗ gồ tự nhiên. Vải trắng được dệt trước và thường được nhuộm sau, thậm chí bằng cách vẽ yuzen.","look":"Lụa chắc chắn với những nút nhỏ tự nhiên và ánh bóng ấm, trầm lặng."},"kihachijo":{"name":"Kihachijo – lụa vàng của đảo","region":"Đảo Hachijo, Tokyo","era":"Có ghi chép từ thời Muromachi; thịnh hành thời Edo","about":"Loại lụa dệt trên một hòn đảo xa xôi chỉ với ba màu tự nhiên từ cây cỏ trên đảo: vàng óng, nâu gỉ sắt và đen. Nó trở thành mốt trong giới thị dân Edo.","process":"Màu vàng lấy từ cỏ kariyasu, màu nâu từ vỏ cây tabunoki, và màu đen từ vỏ cây dẻ gai xử lý với bùn giàu sắt. Sợi được nhuộm đi nhuộm lại nhiều lần, rồi dệt thành kẻ ô và kẻ sọc.","look":"Kẻ ô hoặc kẻ sọc vàng tươi, nâu và đen với bề mặt bóng đẹp."},"meisen":{"name":"Meisen – lụa in hoa văn trên sợi","region":"Isesaki, Chichibu, Ashikaga, Kiryu, Hachioji","era":"Bùng nổ trong thập niên 1910–1930","about":"Loại lụa giá phải chăng đã mang thời trang đến với phụ nữ bình thường thời Taisho và đầu thời Showa. Những thiết kế Art Nouveau và Art Deco táo bạo của nó nay được giới sưu tầm đồ vintage khắp thế giới yêu thích.","process":"Sợi dọc được lược tạm lỏng với nhau và hoa văn được in qua khuôn lên đó. Khi dệt, đường lược được tháo ra và sợi ngang thật được thêm vào, nên màu hơi lệch và mép hoa văn trông nhòe mềm.","look":"Hoa văn hiện đại, táo bạo với đường viền như lông vũ, hơi lệch nhẹ."},"jofu":{"name":"Jofu – vải gai mịn","region":"Echigo (Niigata), Miyako (Okinawa), Omi (Shiga), Noto (Ishikawa)","era":"Hơn 1.200 năm","about":"'Vải thượng hạng': loại vải sợi gai cực mịn, khô và cứng mát, mặc vào giữa mùa hè. Echigo jofu và Ojiya chijimi nằm trong danh sách Di sản Văn hóa Phi vật thể của UNESCO.","process":"Sợi gai được tách bằng tay thành những sợi mảnh như sợi tóc rồi nối đầu với nhau. Sau khi dệt, Echigo jofu được trải lên tuyết vào những ngày xuân nắng đẹp để tẩy trắng tự nhiên.","look":"Nhẹ, xuyên thấu và mát, với cảm giác khô cứng, hơi giống giấy."},"omeshi":{"name":"Omeshi – crepe dệt","region":"Kyoto (Nishijin), Kiryu, Shiozawa","era":"Thời Edo","about":"Loại crepe lụa dệt mang tên shogun Tokugawa Ienari, người rất yêu thích nó: omeshi nghĩa là 'được người tôn quý mặc'. Nó nằm giữa kimono nhuộm và kimono dệt, phù hợp cho những cuộc thăm viếng lịch sự và tiệc tùng.","process":"Sợi được nhuộm trước khi dệt. Sợi ngang được xoắn rất chặt và hồ cứng; sau khi dệt, nước ấm làm sợi tháo xoắn và tạo nên bề mặt nhăn mịn.","look":"Crepe chắc tay với kết cấu lấm tấm tinh tế, giữ dáng và chống nhăn."},"chirimen":{"name":"Chirimen – crepe lụa","region":"Tango (Kyoto), Nagahama (Shiga)","era":"Từ thế kỷ 16; Tango từ thế kỷ 18","about":"Loại crepe lụa mềm làm vải nền cho hầu hết kimono nhuộm, kể cả yuzen. Bề mặt nhăn của nó ăn màu rất đẹp và rủ mềm duyên dáng.","process":"Sợi ngang được xoắn hàng nghìn vòng mỗi mét, xen kẽ xoắn trái và xoắn phải. Sau khi dệt, vải được luộc để loại bỏ keo tơ, sợi cố tháo xoắn và vải co lại thành những nếp nhăn nhỏ gọi là shibo.","look":"Bề mặt mềm phủ đầy gờ nhỏ; độ lớn của nếp nhăn thay đổi theo từng loại."},"nishijin":{"name":"Nishijin – gấm","region":"Khu Nishijin, Kyoto","era":"Có tên từ thế kỷ 15; dệt ở đây từ thế kỷ 5–6","about":"Loại gấm hàng đầu Nhật Bản, mang tên 'Doanh trại phía Tây' trong chiến tranh Onin. Thợ dệt Nishijin làm ra những chiếc obi lộng lẫy và vải cho triều đình, đền chùa và kịch Noh.","process":"Sợi được nhuộm sẵn thành hàng chục màu trước khi dệt và kết hợp với sợi vàng, sợi bạc. Khung dệt Jacquard được du nhập từ Pháp vào thập niên 1870, trong khi kiểu dệt thảm tinh xảo nhất vẫn làm bằng tay, nện sợi ngang bằng móng tay giũa răng cưa.","look":"Vải dày, hoa văn phong phú với sợi vàng và bạc; thường thấy nhất ở obi trang trọng."},"saga-nishiki":{"name":"Saga Nishiki – gấm giấy và lụa","region":"Saga","era":"Cuối thời Edo","about":"Loại gấm hiếm của lãnh địa Kashima. Truyền thuyết kể rằng phu nhân của lãnh chúa lấy cảm hứng từ hoa văn đan tre (ajiro) trên trần nhà mà sáng tạo ra nó, và kỹ thuật được truyền lại trong giới nữ quyến của phủ. Ban đầu gọi là Kashima Nishiki, nó được đổi tên thành 'Saga Nishiki' tại Triển lãm Nhật–Anh năm 1910.","process":"Sợi dọc là những dải giấy washi mảnh phủ vàng, bạc hoặc sơn mài. Một chiếc que dẹt nhỏ bằng tre nâng từng dải giấy lên, rồi sợi ngang lụa màu được luồn qua. Mỗi ngày chỉ dệt được vài centimet.","look":"Hoa văn hình học nhỏ, chính xác trên nền vàng lấp lánh; dùng cho obi trang trọng, túi và phụ kiện."},"hakata":{"name":"Hakata – vải dệt","region":"Fukuoka","era":"Năm 1241","about":"Do một thương nhân học nghề dệt ở Trung Quốc thời nhà Tống khởi xướng. Thời Edo, lãnh chúa địa phương dâng nó lên shogun mỗi năm, nên mẫu kinh điển được gọi là Hakata 'kenjo' (tiến cống).","process":"Nhiều sợi dọc mảnh được xếp sát nhau và sợi ngang dày được nện chặt, nên hoa văn chủ yếu do sợi dọc tạo thành. Họa tiết kinh điển lấy từ pháp khí Phật giáo và kẻ sọc.","look":"Chiếc obi chắc chắn phát ra tiếng 'kyu-kyu' khi thắt và không bao giờ bị tuột lỏng."},"wana":{"name":"Wana – dệt vòng nổi","region":"Kyoto","era":"Từ thế kỷ 17","about":"'Wana' nghĩa là vòng. Kiểu dệt này tạo những vòng lụa nhỏ nổi trên bề mặt, cùng kỹ thuật dùng để làm nhung ở Nhật. Nó mang lại cho obi và áo khoác những đường nổi mềm mại.","process":"Những sợi dây kim loại mảnh được dệt vào dưới sợi dọc để nâng nó thành vòng; sau đó rút dây ra. Nếu giữ nguyên vòng, đó là wana; nếu cắt vòng, nó thành nhung. Hoa văn có thể kết hợp vòng cắt và không cắt.","look":"Hoa văn nổi như nhung từ những vòng nhỏ, sờ vào thấy mềm."},"sagara":{"name":"Sagara – thêu nút","region":"Từ Trung Quốc; thực hành ở Kyoto và khắp Nhật Bản","era":"Kỹ thuật cổ","about":"Kiểu thêu gồm vô số nút nhỏ, tương tự mũi thêu nút kiểu Pháp. Nó tạo kết cấu ba chiều như hạt cườm và rất bền, nên được dùng để điểm nhấn và viền.","process":"Chỉ được quấn quanh kim rồi kéo xuống qua vải để tạo một nút nhỏ. Các nút được xếp lần lượt từng cái để lấp đầy hình hoặc vẽ thành đường.","look":"Những chấm nổi xếp sát nhau như những hạt ngọc trai li ti."},"kinkoma":{"name":"Kinkoma – thêu đính chỉ vàng","region":"Kyoto và khắp Nhật Bản","era":"Kỹ thuật cổ","about":"Chỉ vàng quá cứng để xuyên qua lụa, nên được đặt trên bề mặt và cố định lại. Điều này tạo cho đường viền và họa tiết một nét vàng đậm, sáng lấp lánh.","process":"Chỉ vàng quấn trên những ống gỗ nhỏ (koma) được đặt dọc theo hình vẽ, thường theo cặp, và đính xuống từng khoảng ngắn bằng chỉ lụa mảnh.","look":"Những đường vàng mượt, liền mạch nằm trên bề mặt vải."},"takeyamachi":{"name":"Takeyamachi – thêu trên vải sa","region":"Takeyamachi, Kyoto","era":"Thời Edo","about":"Kiểu thêu trên vải sa lụa dệt thưa, mang tên con phố ở Kyoto nơi nó ra đời. Mũi thêu bám sát lưới ô của vải đến mức thành phẩm trông như được dệt chứ không phải thêu.","process":"Chủ yếu là chỉ vàng dẹt (đôi khi kèm chỉ lụa màu) được luồn qua những lỗ nhỏ của vải sa, đếm từng lỗ một, để lấp đầy hình vẽ như tranh khảm.","look":"Hoa văn vàng sắc nét như dệt trên vải sa mỏng; dùng cho obi, fukusa và bồi tranh cuộn treo tường."},"swatow":{"name":"Swatow – thêu rút sợi","region":"Sán Đầu (Swatow), Quảng Đông, Trung Quốc","era":"Cuối thế kỷ 19","about":"Kiểu thêu rút sợi tinh tế từ miền nam Trung Quốc, kết hợp nghề thêu Trung Hoa với kỹ thuật làm ren châu Âu. Kimono thêu Swatow từ lâu đã được yêu thích ở Nhật như trang phục thanh lịch, tao nhã.","process":"Sợi được rút ra khỏi vải hoặc những vùng nhỏ được cắt bỏ, rồi các lỗ hở được viền và lấp bằng mũi thêu mịn để tạo hoa văn như ren. Tất cả đều làm bằng tay.","look":"Hoa văn ren cùng tông màu với những lỗ nhỏ, thường màu trắng hoặc pastel nhẹ."},"suzhou":{"name":"Thêu lụa Tô Châu (Suzhou)","region":"Tô Châu, Giang Tô, Trung Quốc","era":"Hơn 2.000 năm","about":"Một trong bốn dòng thêu lớn của Trung Quốc, nổi tiếng vì độ tinh xảo tột bậc. Trên kimono và obi, nó được dùng để thêu động vật và hoa lá sống động như thật.","process":"Một sợi chỉ lụa được tách thành tới hàng chục sợi mảnh như tóc. Màu được pha trộn theo từng mũi thêu, và một số tác phẩm được thêu sao cho cả hai mặt đều là bức tranh hoàn chỉnh.","look":"Chân thực như ảnh chụp, chẳng hạn những chú mèo có thể thấy từng sợi lông."},"ran":{"name":"Thêu mũi tự do (loạn châm)","region":"Thường Châu, Giang Tô, Trung Quốc; cũng thấy trên kimono và obi","era":"Ra đời vào đầu thế kỷ 20 (thập niên 1920–30)","about":"Kiểu thêu trong đó các mũi có độ dài và hướng khác nhau đan chéo, chồng lên nhau như nét cọ trong tranh sơn dầu. Nó thể hiện lông thú, lông vũ, ánh sáng và bóng tối một cách tự nhiên.","process":"Thay vì xếp mũi thêu ngay ngắn cạnh nhau, người thợ thêu chồng chúng tự do theo các hướng đan chéo và pha màu ở mỗi lớp để tạo chiều sâu.","look":"Bề mặt như tranh vẽ với sắc độ chuyển mềm thay vì đường mũi thêu rõ ràng."},"hitta":{"name":"Hitta – shibori chấm vuông","region":"Kyoto","era":"Phát triển cao độ vào thế kỷ 17","about":"Loại shibori xa xỉ nhất. Những chấm vuông nhỏ xíu xếp theo đường chéo; kimono phủ kín hitta được gọi là 'so-hitta' và là đỉnh cao của sự xa hoa.","process":"Nữ nghệ nhân véo một mẩu vải nhỏ xíu, gấp làm tư và quấn chỉ quanh nó vài vòng. Mỗi chấm được buộc bằng tay, nên một chiếc furisode phủ kín có thể mất một năm hoặc hơn.","look":"Những chấm vuông nổi đều đặn xếp thành hàng chéo ngay ngắn."},"kanoko":{"name":"Kanoko – shibori đốm nai con","region":"Kyoto và khắp Nhật Bản","era":"Từ thời cổ đại","about":"'Kanoko' nghĩa là nai con, vì những chấm trắng nhỏ có tâm màu trông như đốm trên lưng nai non. Đây là loại shibori nổi tiếng nhất, xuất hiện trên obiage, kimono và phụ kiện.","process":"Những điểm vải nhỏ được nhón lên và buộc chặt bằng chỉ trước khi nhuộm. Sau khi nhuộm và tháo chỉ, mỗi điểm để lại một chấm hình vòng với kết cấu nổi gồ ghề.","look":"Những vòng chấm nhỏ với một 'con mắt' màu nhỏ xíu ở giữa."},"boshi":{"name":"Boshi – shibori chụp mũ","region":"Kyoto, Arimatsu","era":"Thời Edo","about":"'Boshi' nghĩa là mũ. Phương pháp này bảo vệ những vùng lớn của hình vẽ khỏi thuốc nhuộm bằng cách chụp một lớp che lên, giúp giữ được những bông hoa hay vòng tròn lớn màu trắng.","process":"Đường viền được khâu và rút lại, rồi vùng bên trong được trùm lại như đội mũ, xưa bằng bẹ tre, nay thường bằng nhựa vinyl, và quấn chỉ buộc chặt trước khi nhuộm.","look":"Những hình lớn không nhuộm với mép mềm, hơi tưa như lông vũ."},"nuishime":{"name":"Nuishime – shibori khâu","region":"Kyoto, Arimatsu-Narumi (Nagoya)","era":"Ít nhất từ thời Muromachi","about":"Phương pháp shibori dùng mũi khâu lược để vẽ đường nét và hình dạng chính xác. Nó cho phép tạo hình tự do hơn nhiều so với chỉ buộc.","process":"Hình vẽ được khâu bằng những mũi lược nhỏ, rồi chỉ được rút chặt để vải dồn thành nếp. Những chỗ gấp nếp chống thấm màu, để lại đường viền chấm chấm.","look":"Đường viền rõ nét tạo thành từ những hàng gạch nhỏ."},"arashi":{"name":"Arashi – shibori quấn cột","region":"Arimatsu-Narumi (Nagoya)","era":"Cuối thế kỷ 19","about":"'Arashi' nghĩa là bão: những đường chéo trông như mưa bị gió thổi xiên. Đây là kỹ thuật kinh điển của Arimatsu, thị trấn shibori lớn nhất Nhật Bản, và được ưa chuộng cho yukata.","process":"Vải được quấn chéo quanh một cây cột dài, buộc bằng chỉ, rồi đẩy xuống thành những nếp chặt. Chỉ những gờ bên ngoài mới ăn thuốc nhuộm.","look":"Những đường chéo mảnh trông như mưa rơi xiên."},"tatsumaki":{"name":"Tatsumaki – shibori lốc xoáy","region":"Arimatsu-Narumi (Nagoya), Kyoto","era":"Kỹ thuật truyền thống","about":"'Tatsumaki' nghĩa là lốc xoáy. Chỉ được quấn xoắn ốc quanh vải, nên hoa văn xoay tròn như bị cuốn vào cơn gió lốc.","process":"Vải được dồn (thường sau khi khâu hoặc xếp ly) quanh một lõi thành thanh tròn dài, rồi chỉ được quấn xoắn ốc từ trên xuống dưới trước khi nhuộm. Chỉ phần bề mặt lộ ra mới ăn màu, để lại những dải xoắn ốc.","look":"Những sọc xoáy hình xoắn ốc tạo cảm giác chuyển động mạnh mẽ."},"yanagi":{"name":"Yanagi – shibori cành liễu","region":"Arimatsu-Narumi (Nagoya)","era":"Thời Edo","about":"'Yanagi' nghĩa là cây liễu. Hoa văn trông như cành liễu đung đưa trong gió và là lựa chọn yêu thích cho yukata mùa hè.","process":"Vải được dồn theo chiều dọc thành những nếp hẹp và buộc chỉ từng khoảng. Các nếp vải chống thấm màu, để lại những đường dọc mảnh, đứt quãng.","look":"Những đường dọc nhẹ nhàng trông như cành liễu rủ."},"oke":{"name":"Oke – shibori thùng gỗ","region":"Kyoto","era":"Kỹ thuật truyền thống của Kyoto","about":"'Oke' nghĩa là thùng. Kỹ thuật hiếm này giữ khô những phần lớn của vải bằng cách bịt kín chúng trong thùng gỗ, cho phép một bộ kimono có những mảng lớn nhiều màu khác nhau. Ngày nay rất ít nghệ nhân còn làm được.","process":"Phần cần giữ không nhuộm được nhồi vào thùng gỗ bách, nắp được kẹp chặt lên vải và buộc dây thừng, để phần cần nhuộm ở bên ngoài. Sau đó cả thùng được nhúng vào một bể nhuộm lớn hơn. Lặp lại cho từng màu.","look":"Những mảng màu lớn, táo bạo với ranh giới gọn, hơi mềm."},"itajime":{"name":"Itajime – nhuộm kẹp ván","region":"Arimatsu, Kyoto và nơi khác","era":"Từ thế kỷ 8","about":"Một trong những kỹ thuật nhuộm chống màu lâu đời nhất Nhật Bản; tiền thân của nó là kyokechi (nhuộm kẹp giữa các tấm ván chạm khắc), còn lưu giữ trong kho báu Shosoin từ thế kỷ 8. Vải gấp được ép giữa các tấm ván để tạo hoa văn lặp lại.","process":"Vải được gấp thành hình tam giác hoặc hình vuông và kẹp chặt giữa các tấm ván gỗ, rồi nhúng vào thuốc nhuộm. Những vùng bị che vẫn giữ màu trắng và tạo thành hoa văn đối xứng.","look":"Hình học lặp lại, chẳng hạn họa tiết như bông tuyết gọi là sekka."},"tsukami":{"name":"Tsukami – shibori nắm","region":"Các vùng sản xuất shibori","era":"Truyền thống","about":"'Tsukami' nghĩa là nắm. Vải được túm thành từng nắm rồi buộc lại, nên mỗi tấm vải đều khác nhau. Nó tạo hiệu ứng tự do, tự nhiên.","process":"Người thợ nắm vải, vặn thành những túm không đều và buộc bằng chỉ trước khi nhuộm. Những nếp gấp ngẫu nhiên tạo nên hoa văn không thể đoán trước.","look":"Hoa văn không đều, như mây hoặc vân đá, không lặp lại."},"kumihimo":{"name":"Kumihimo – dây tết lụa","region":"Kyoto, Iga (Mie)","era":"Từ thế kỷ 7–8","about":"Dây lụa tết, ban đầu dùng cho đồ thờ Phật giáo và trang phục triều đình, sau đó cho áo giáp samurai và dây kiếm. Ngày nay chúng được biết đến nhiều nhất dưới dạng obijime, sợi dây buộc quanh giữa obi.","process":"Hàng chục sợi lụa được quấn trên các ống chỉ có quả nặng và bắt chéo qua nhau trên giá gỗ như giá tròn marudai. Các loại giá và động tác khác nhau tạo ra dây tròn, vuông hoặc dẹt.","look":"Dây tết chắc, đều với hoa văn chéo mịn và phối màu phong phú."},"zogan":{"name":"Zogan – khảm kim loại","region":"Kyoto, Kumamoto (Higo)","era":"Thịnh hành thời Edo trên đồ trang trí kiếm và súng","about":"Nghệ thuật khảm vàng và bạc vào sắt. Từng được dùng để trang trí phụ kiện kiếm, ngày nay nó tô điểm cho phụ kiện kimono như obidome (trâm cài obi) và đồ trang sức tóc.","process":"Bề mặt sắt được khía những rãnh đan chéo mịn. Lá và sợi vàng hoặc bạc được gõ vào rãnh, rồi sắt được cố ý làm gỉ và nung cùng sơn mài hoặc dầu cho đến khi thành màu đen sâu.","look":"Hoa văn vàng bạc lấp lánh trên nền đen sâu thẳm."},"makie":{"name":"Maki-e – sơn mài vàng","region":"Kyoto, Wajima, Kanazawa và nơi khác","era":"Từ thế kỷ 8–9","about":"Nghệ thuật sơn mài trong đó hình vẽ được vẽ bằng sơn mài rồi rắc bột vàng hoặc bạc. Trong thế giới kimono, nó xuất hiện trên lược, trâm cài tóc, obidome và guốc geta.","process":"Hình vẽ được vẽ bằng sơn mài, và trước khi sơn khô, bột vàng hoặc bạc mịn được rắc lên qua một ống tre. Sau đó tác phẩm được phủ và đánh bóng nhiều lần.","look":"Những bức tranh vàng tinh tế với độ bóng sâu trên nền sơn mài đen hoặc đỏ."},"mizuhiki":{"name":"Mizuhiki – dây giấy","region":"Iida (Nagano), Kanazawa (Ishikawa)","era":"Nguồn gốc có từ thế kỷ 7","about":"Dây trang trí làm từ giấy washi xoắn, thắt thành những nút mang lời chúc may mắn. Chúng trang trí phong bì quà tặng, và trong cách phối kimono được dùng làm trang sức tóc cô dâu và trang trí obi.","process":"Giấy washi được xoắn thành dây mảnh, làm cứng bằng hồ, rồi nhuộm màu hoặc bọc màng màu hay màng kim loại. Dây được thắt thành các nút như nút awaji hoặc tạo hình hạc, thông và hoa mơ.","look":"Dây cứng, bóng thắt thành nút đối xứng, thường là đỏ-trắng hoặc vàng-bạc."},"ro":{"name":"Ro – lụa sa mùa hè có sọc lỗ","region":"Kyoto và các vùng dệt lụa khác","era":"Tên gọi đã được ghi nhận từ thế kỷ 15; phổ biến từ thời Edo","about":"Một loại lụa mùa hè có những hàng lỗ nhỏ đều đặn cho gió lùa qua. Đây là loại vải kinh điển cho kimono trang trọng lẫn thường ngày trong những tháng nóng nhất, từ đầu hè đến cuối hè.","process":"Dệt vài hàng dệt trơn, rồi xoắn các cặp sợi dọc quấn vào nhau trong một hàng để chừa lại một đường khe hở. Số hàng dệt trơn giữa các đường khe hở tạo nên các tên gọi 'ro ba hàng', 'ro năm hàng', v.v.","look":"Những đường lỗ nhỏ mảnh chạy ngang (đôi khi dọc) trên nền lụa vốn dày đặc."},"sha":{"name":"Sha – lụa sa toàn phần","region":"Kyoto và các vùng dệt lụa khác","era":"Du nhập từ Trung Quốc vào thế kỷ 7–8","about":"Một loại lụa nhẹ, xuyên thấu, mặc vào giữa mùa hè. Nó nhẹ và trong hơn ro, và cũng được dùng cho haori và áo khoác mùa hè mặc bên ngoài kimono.","process":"Ở mỗi hàng, các cặp sợi dọc được xoắn quấn vào nhau và được sợi ngang khóa lại. Nhờ đó tạo thành một lớp lưới thưa đều khắp tấm vải.","look":"Lớp lưới mỏng xuyên thấu đồng đều, không có sọc dày; các lớp bên dưới ẩn hiện nhẹ nhàng."},"ra":{"name":"Ra – vải sa phức hợp dạng lưới","region":"Kyoto","era":"Cổ đại (thế kỷ 7–8); phục hồi vào thế kỷ 20","about":"Một trong những loại vải sa lâu đời nhất và phức tạp nhất, với các mẫu vật còn lưu giữ trong kho báu Shosoin từ thế kỷ 8. Kỹ thuật này suy tàn ở Nhật Bản sau thời Trung cổ và được các nghệ nhân bậc thầy thời cận đại phục hồi. Ngày nay nó chủ yếu xuất hiện trên obi mùa hè sang trọng.","process":"Mỗi sợi dọc bắt chéo sang xoắn với nhiều sợi bên cạnh, chứ không chỉ một sợi cặp, nên các sợi tạo thành một tấm lưới. Vải được dệt tay chậm rãi trên một khung cửi đặc biệt.","look":"Lớp lưới co giãn như mạng, với các lỗ hình thoi, thường có hoa văn hiện lên trong lưới."},"kobai":{"name":"Kobai – vải mùa hè ô kẻ nổi","region":"Các vùng dệt bông và lụa khắp Nhật Bản","era":"Vải mùa hè truyền thống","about":"Một loại vải mùa hè có bề mặt ô kẻ nổi, làm bằng bông (men-kobai) hoặc lụa pha bông (kinu-kobai). Đây là lựa chọn yêu thích cho yukata cao cấp và kimono mùa hè thường ngày.","process":"Những sợi dày hơn được dệt xen vào theo khoảng cách đều đặn, cả chiều dọc lẫn chiều ngang, trên nền vải mỏng nhẹ. Các sợi dày tạo thành lưới ô vuông nổi.","look":"Vải nhẹ với họa tiết ô kẻ từ những đường nổi; các gờ nổi giúp vải không dính vào da."},"rokechi":{"name":"Rokechi – nhuộm chống màu bằng sáp","region":"Kyoto và khắp Nhật Bản","era":"Thế kỷ 8; được phục hưng vào thế kỷ 20","about":"Một trong ba phương pháp nhuộm chống màu cổ xưa của thời Nara, với các hiện vật còn được lưu giữ trong kho báu Shosoin. Kỹ thuật này mai một trong thời Heian và được các nghệ sĩ thế kỷ 20 phục hưng, biến nó thành một hình thức nhuộm tự do, mang tính hội họa.","process":"Sáp nóng chảy được quét hoặc in dập lên vải ở những chỗ không muốn ăn màu, rồi nhuộm vải. Sau đó sáp được loại bỏ bằng nhiệt hoặc nước nóng. Ở những chỗ sáp bị nứt, thuốc nhuộm thấm vào và để lại những đường mảnh.","look":"Những mảng hình khối mạnh mẽ với các đường rạn mảnh như mạng nhện chạy xuyên qua."},"mokuhan":{"name":"Mokuhan – in vải bằng khuôn gỗ","region":"Kyoto và các vùng khác","era":"Có nguồn gốc từ xa xưa","about":"Một kỹ thuật in trong đó hoa văn khắc trên khuôn gỗ được ép lên vải. Mỗi lần in đều mang dấu tay của người thợ, và những khác biệt nhỏ mang lại cho tấm vải nét ấm áp của đồ thủ công. Ngày nay chỉ còn ít xưởng thực hành kỹ thuật này.","process":"Hoa văn được khắc vào một khối gỗ cứng. Khuôn được phủ thuốc nhuộm hoặc hồ màu rồi ép mạnh lên tấm vải căng, mỗi lần một dấu in. Mỗi màu dùng một khuôn riêng.","look":"Những họa tiết lặp lại với màu hơi không đều, viền mềm, và thoáng hiện vân gỗ."},"chusen":{"name":"Chusen – nhuộm rót","region":"Osaka (Sakai), Hamamatsu (Shizuoka), Tokyo","era":"Cuối thế kỷ 19 (thời Meiji)","about":"Một phương pháp của Nhật Bản để nhuộm yukata và khăn tenugui bằng vải bông. Thuốc nhuộm thấm xuyên suốt tấm vải nên cả hai mặt có cùng màu, và màu sắc trông dịu nhẹ, tươi mát.","process":"Vải được gấp qua lại thành nhiều lớp, mỗi lớp được phết hồ chống màu qua khuôn. Người thợ đắp những bờ hồ bao quanh từng vùng, rót thuốc nhuộm từ ấm vào, và lực hút từ bên dưới kéo thuốc nhuộm xuyên qua tất cả các lớp cùng một lúc.","look":"Màu sắc dịu, hơi nhòe, chuyển sắc nhẹ nhàng, và cùng một hoa văn hiện rõ ở mặt sau."},"bingata":{"name":"Bingata – nhuộm khuôn Okinawa","region":"Okinawa","era":"Vương quốc Lưu Cầu (từ khoảng thế kỷ 15)","about":"Nghệ thuật nhuộm rực rỡ của Okinawa, từng được hoàng tộc và quý tộc Vương quốc Lưu Cầu mặc. Màu sắc tươi sáng cùng hoa văn từ cả Nhật Bản lẫn vùng biển phương Nam mang lại cho nó vẻ vui tươi, nhiệt đới.","process":"Hoa văn được khắc trên khuôn giấy và hồ gạo được phết qua khuôn. Bột màu khoáng và thuốc nhuộm thực vật được quét vào từng vùng, rồi một sắc đậm hơn được chà lên các mép (kumadori) để tạo chiều sâu. Phiên bản chỉ nhuộm bằng chàm được gọi là eigata.","look":"Vàng, đỏ và xanh lam tươi sáng với mép đổ bóng, cùng các hoa văn như hoa, chim, sóng và mây."},"aizome":{"name":"Aizome – nhuộm chàm","region":"Tokushima (Awa) và khắp Nhật Bản","era":"Thời cổ đại; phổ biến rộng rãi vào thời Edo","about":"Chàm là thuốc nhuộm phổ biến nhất ở Nhật Bản, dùng cho mọi thứ từ quần áo lao động của nông dân đến kimono. Du khách nước ngoài thời Meiji ấn tượng đến mức màu này được biết đến với tên gọi 'Japan Blue'.","process":"Lá chàm được ủ thành sukumo, rồi lên men trong vại cùng nước tro gỗ, cám lúa mì và vôi. Tấm vải được nhúng vào và nhấc lên nhiều lần: khi lấy ra vải có màu xanh lục và chuyển sang xanh lam khi gặp không khí. Nhúng càng nhiều lần, màu càng đậm.","look":"Một sắc xanh lam sâu thẳm, sống động, từ xanh da trời nhạt đến gần như đen, dịu đi tuyệt đẹp theo thời gian mặc."},"lace":{"name":"Ren","region":"Phát triển ở châu Âu; được làm ở Nhật Bản và khắp thế giới","era":"Ren châu Âu từ thế kỷ 16; dùng với kimono từ thời Meiji–Taisho","about":"Ren là loại vải có hoa văn lỗ thoáng, chỉ được tạo nên từ sợi chỉ. Trong thời trang kimono ngày nay, kimono, haori và obi bằng ren rất được ưa chuộng, thường được mặc chồng lên một chiếc kimono có màu để màu sắc lộ ra.","process":"Phần lớn ren dùng cho kimono được làm bằng máy thêu. Hoa văn được thêu lên một tấm lưới mịn (ren tuyn) hoặc lên một tấm vải nền mà sau đó được hòa tan, chỉ để lại những đường chỉ thêu (ren hóa học).","look":"Hoa văn hoa lá hoặc hình học xuyên thấu bằng chỉ, với màu bên dưới lộ ra qua các khoảng trống."},"tsuzure":{"name":"Tsuzure – dệt thảm","region":"Kyoto (Nishijin)","era":"Có hiện vật tại Nhật từ thế kỷ 8 (có lẽ nhập từ Trung Quốc); được dệt ở Nishijin từ thế kỷ 18 (thời Edo)","about":"Kiểu dệt thảm của Nhật Bản, có họ hàng với thảm Gobelin của châu Âu. Được xem là obi hạng cao nhất, và những tác phẩm tinh xảo nhất được dệt tay bằng móng tay của người thợ.","process":"Mỗi sợi ngang màu chỉ được dệt qua lại trong phần hoa văn của riêng nó, che kín hoàn toàn sợi dọc. Người thợ giũa móng tay thành hình răng cưa và dùng chúng để nện từng sợi ngang vào chỗ. Mỗi ngày chỉ dệt được vài centimet.","look":"Vải chắc, phẳng, hình ở mặt trước và mặt sau giống nhau, có những khe nhỏ li ti ở chỗ hai màu gặp nhau."},"benibana":{"name":"Benibana – nhuộm hoa rum","region":"Yamagata (Mogami) và Kyoto","era":"Du nhập qua Con đường Tơ lụa vào khoảng thế kỷ 6–7","about":"Một loại thuốc nhuộm đỏ tự nhiên làm từ cánh hoa rum, được triều đình Heian yêu chuộng. Vào thời Edo, nó quý đến mức người ta nói 'một phần đỏ bằng một phần vàng'. Theo truyền thống, nó được dùng cho lớp lót lụa đỏ của kimono (momi).","process":"Cánh hoa được rửa trong nước để loại bỏ phần lớn sắc tố vàng, rồi lên men và ép thành bánh 'beni-mochi'. Màu đỏ được chiết ra bằng nước tro và cố định lên lụa bằng giấm mận hun khói (ubai). Nhuộm lặp lại nhiều lần giúp màu đậm hơn.","look":"Từ hồng trong trẻo, rực sáng đến đỏ thẫm sâu; màu sắc mỏng manh và phai đi dưới ánh sáng mạnh."}}},"ar":{"ui":{"tagline":"الحِرفة وراء الكيمونو — 50 تقنية يابانية تقليدية","all":"الكل","search":"ابحث عن تقنية…","region":"المكان","era":"منذ","about":"ما هي","process":"كيف تُصنع","look":"كيف تتعرّف عليها","listen":"استمع إلى الاسم الياباني","close":"إغلاق","language":"اللغة","count":"عدد التقنيات: {n}","noResults":"لا توجد تقنيات تطابق بحثك.","prev":"السابق","next":"التالي","intro":"يُصنع الكيمونو على مراحل عديدة، ولكل مرحلة أساتذتها. اختر فئة أو انقر على أي تقنية لمعرفة المزيد."},"cats":{"dye":{"name":"الصباغة","desc":"تُرسم الزخارف أو تُطبع بالاستنسل أو بالطباعة على حرير أبيض جاهز. وعادةً ما يكون الكيمونو المصبوغ هو الأكثر رسمية، ويُرتدى في المراسم والاحتفالات."},"weave":{"name":"النسيج","desc":"تُصبغ الخيوط أولًا، وتظهر الزخرفة أثناء نسج القماش. ويُقدَّر الكيمونو المنسوج مثل تسوموغي بوصفه لباسًا يوميًا أنيقًا، بينما قد يكون الأوبي المنسوج الأكثر رسمية على الإطلاق."},"embroidery":{"name":"التطريز","desc":"تُخاط خيوط الحرير والخيوط المعدنية على القماش يدويًا لإضفاء الملمس والبريق والعمق. وكثيرًا ما يُجمع التطريز مع الصباغة في الكيمونو الرسمي."},"shibori":{"name":"شيبوري ⁦(Shibori)⁩: الصباغة بالربط","desc":"تُربط أجزاء من القماش أو تُخاط أو تُطوى أو تُشدّ بالمشابك كي لا تصل إليها الصبغة. وعند إزالة الخيوط تظهر الزخرفة بملمس ناعم ثلاثي الأبعاد."},"other":{"name":"حِرف الإكسسوارات","desc":"يكتمل الكيمونو بالحبال والحُلي والزينة التي يصنعها حرفيون من تقاليد أخرى: صانعو الحبال المضفورة، وحرفيو المعادن، وفنانو الورنيش، وصانعو الحبال الورقية."}},"items":{"kaga-yuzen":{"name":"كاغا يوزن ⁦(Kaga Yuzen)⁩: حرير مرسوم باليد","region":"كانازاوا، إيشيكاوا","era":"أوائل القرن الـ18","about":"أسلوب صباغة مرسوم باليد من إقطاعية كاغا السابقة. يشتهر بالزهور والنباتات الواقعية المرسومة بـ«ألوان كاغا الخمسة»: النيلي، والقرمزي، والمغرة، والأخضر العشبي، والأرجواني الملكي.","process":"تُحدَّد خطوط التصميم بخط رفيع من عجينة الأرز يمنع الألوان من الانتشار. ثم تُلوَّن كل منطقة بالفرشاة، مع تظليل يمتد من الحافة الخارجية نحو المركز. وعادةً ما يشرف فنان واحد على القطعة كلها.","look":"زخارف طبيعية ذات طابع تصويري، وأحيانًا أوراق «نخرها الدود» (موشيكوي) مرسومة فيها. ويقلّ فيها الذهب والتطريز أو ينعدمان."},"kyo-yuzen":{"name":"كيو يوزن ⁦(Kyo Yuzen)⁩: حرير كيوتو المرسوم باليد","region":"كيوتو","era":"أواخر القرن الـ17","about":"أسلوب يوزن الأصلي، سُمّي نسبةً إلى ميازاكي يوزنساي، رسّام المراوح في كيوتو. أضفى على الكيمونو حرية في التصميم تشبه حرية الرسم، وأصبح الأسلوب الكلاسيكي للملابس الرسمية.","process":"يُقسَّم العمل إلى نحو عشرين خطوة، يتولى كلًّا منها متخصص: التصميم، ورسم الخطوط الخارجية، ووضع عجينة الأرز العازلة، والتلوين بالفرشاة، والتبخير، والشطف، وأخيرًا إضافة ورق الذهب والتطريز.","look":"زخارف أنيقة مستوحاة من أجواء البلاط بألوان غنية، مظللة من المركز نحو الخارج، وغالبًا ما تُكمَّل بالذهب والتطريز."},"edo-komon":{"name":"إيدو كومون ⁦(Edo Komon)⁩: صباغة بالاستنسل بزخارف دقيقة","region":"طوكيو","era":"القرن الـ17 (فترة إيدو)","about":"زخارف متكررة متناهية الصغر مصبوغة بلون واحد، دقيقة لدرجة أن القماش يبدو سادة من بعيد. بدأت مع الملابس الرسمية للساموراي، وكان لكل سيد إقطاعي زخرفته الخاصة المحجوزة له.","process":"تُحفر الزخارف في قوالب استنسل مصنوعة من طبقات ورق الواشي المقوّى بعصير الكاكي. يضع الحرفي القالب على الحرير، ويفرد عجينة الأرز من خلاله، ثم ينقله بمحاذاة تامة، وبعدها يصبغ القماش كله.","look":"عن قرب: آلاف النقاط أو الأمواج أو الخطوط الصغيرة. ومن على بُعد خطوات قليلة: لون سادة هادئ."},"tsujigahana":{"name":"تسوجيغاهانا ⁦(Tsujigahana)⁩: صباغة بالخياطة العازلة","region":"كيوتو ومناطق أخرى","era":"القرن الـ15 – أوائل القرن الـ17","about":"أسلوب فاخر من فترتي موروماتشي وموموياما جمع بين صباغة الربط بالخياطة والرسم بالحبر وورق الذهب والتطريز. اختفى في أوائل القرن الـ17، وأُطلق عليه لاحقًا «الصبغة الشبح».","process":"تُخاط حدود الزخارف وتُشدّ بإحكام كي لا تتسرب إليها الصبغة، ويُصبغ القماش على عدة مراحل. ثم تُرسم التفاصيل الدقيقة مثل عروق الأوراق بالحبر. وقد أحيا فنانون معاصرون هذا الأسلوب في القرن الـ20.","look":"أشكال ناعمة ضبابية قليلًا ذات حواف متجعدة، مع رسم رقيق بالحبر."},"sarasa":{"name":"ساراسا ⁦(Sarasa)⁩: زخارف مطبوعة ذات طابع أجنبي","region":"الهند في الأصل؛ صُنعت في ناغاساكي وساكاي وكيوتو وإيدو","era":"القرنان الـ16–17","about":"قطن ملوّن مزخرف من الهند وجنوب شرق آسيا وصل عبر التجارة الخارجية. حظيت زهوره وطيوره وزخارفه الهندسية ذات الطابع الأجنبي بتقدير كبير، وسرعان ما صنع الحرفيون اليابانيون نسخهم الخاصة.","process":"في الهند، كانت الزخارف تُرسم أو تُطبع بالقوالب باستخدام المثبّتات اللونية والشمع. أما «وا-ساراسا» اليابانية فكانت تُصنع عادةً بقوالب استنسل ورقية كثيرة، واحد لكل لون، تُطبَّق تباعًا.","look":"زخارف كثيفة ذات طابع أجنبي من الزهور وأشكال تشبه البيزلي، بألوان ترابية من الأحمر والنيلي والبني."},"kinsai":{"name":"كينساي ⁦(Kinsai)⁩: زخرفة بورق الذهب","region":"كيوتو","era":"قديمة؛ ازدهرت في القرن الـ16","about":"فن تزيين الكيمونو الجاهز بالذهب والفضة الحقيقيين. وعادةً ما يكون اللمسة الأخيرة على الكيمونو الرسمي المصبوغ بأسلوب يوزن، فيضفي بريقًا على الزهور والسحب والخطوط الخارجية.","process":"تُوضع مادة لاصقة عبر قالب استنسل أو تُرسم بقمع رفيع، ثم يُضغط ورق الذهب عليها ويُزال بالفرشاة من الأماكن التي لا ينبغي أن يبقى فيها. ويمكن أيضًا نثر الذهب رقائقَ صغيرة أو رسمه خطوطًا بعجينة الذهب.","look":"تفاصيل لامعة من الذهب أو الفضة فوق التصميم المصبوغ، تلتقط الضوء مع حركة مرتديها."},"oshima":{"name":"أوشيما ⁦(Oshima)⁩: حرير بونجي مصبوغ بالطين","region":"جزيرة أمامي أوشيما، كاغوشيما","era":"أكثر من 1300 عام من التاريخ","about":"من أشهر أقمشة الكيمونو في اليابان. يأتي لونه الأسود المائل إلى البني، العميق واللامع، من صبغ الحرير بشجرة محلية ثم بطين غني بالحديد. وهو خفيف وناعم ولا يكاد يتجعد أبدًا.","process":"تُنسج الخيوط أولًا بإحكام في حصيرة مؤقتة لحجز الزخرفة. تُصبغ الحصيرة عشرات المرات بلحاء شجرة شارينباي ثم بالطين، ثم تُفك، ويُعاد نسج الخيوط واحدًا تلو الآخر مع مطابقة كل نقطة صغيرة يدويًا.","look":"سطح داكن حريري الملمس بزخارف هندسية بالغة الدقة مكوّنة من صلبان صغيرة."},"yuki":{"name":"يوكي ⁦(Yuki)⁩: حرير بونجي مغزول يدويًا","region":"يوكي (إيباراكي) وأوياما (توتشيغي)","era":"تعود أصوله إلى فترة نارا (القرن الـ8) أو قبلها؛ ذاع صيته منذ القرن الـ17","about":"أدرجته اليونسكو في قائمة التراث الثقافي غير المادي عام 2010. يُقال إنه أفخم كيمونو غير رسمي، دافئ وخفيف، ويزداد نعومة كلما طال ارتداؤه.","process":"يُغزل الحرير يدويًا من ألياف الشرانق المفرودة دون أي فتل. تُربط خيوط الزخرفة باليد وتُصبغ، ثم تُنسج على نول بحزام خلفي يشدّ فيه جسدُ الناسج نفسه خيوطَ السدى. وقد تستغرق لفة واحدة من شهور إلى أكثر من عام.","look":"ملمس ناعم غير منتظم قليلًا، ولمعة هادئة غير براقة."},"ushikubi":{"name":"أوشيكوبي ⁦(Ushikubi)⁩: حرير بونجي من الشرانق المزدوجة","region":"هاكوسان، إيشيكاوا","era":"أكثر من 800 عام","about":"حرير بونجي نادر من قرية جبلية، يُصنع من «شرانق مزدوجة» غزلتها دودتا قز معًا. وهو متين لدرجة أنه لُقّب بـ«البونجي نازع المسامير»: إذا علق بمسمار، ينزع القماشُ المسمارَ بدلًا من أن يتمزق.","process":"يُسحب الخيط مباشرة من الشرانق المزدوجة في الماء الساخن، مما يمنحه عُقدًا طبيعية. يُنسج القماش الأبيض أولًا وغالبًا ما يُصبغ بعد ذلك، بل حتى برسم يوزن.","look":"حرير متين بعُقد طبيعية صغيرة ولمعان دافئ هادئ."},"kihachijo":{"name":"كيهاتشيجو ⁦(Kihachijo)⁩: حرير الجزيرة الأصفر","region":"جزيرة هاتشيجو، طوكيو","era":"مُسجَّل منذ فترة موروماتشي؛ رائج في فترة إيدو","about":"حرير يُنسج في جزيرة نائية باستخدام ثلاثة ألوان طبيعية فقط من نباتات الجزيرة: الأصفر الذهبي، والبني الصدئ، والأسود. وقد راج بين سكان مدينة إيدو.","process":"يأتي الأصفر من عشب كارياسو، والبني من لحاء شجرة تابونوكي، والأسود من لحاء شجرة الشينكابين المعالَج بطين غني بالحديد. تُصبغ الخيوط مرارًا وتكرارًا، ثم تُنسج مربعات وخطوطًا.","look":"مربعات أو خطوط صفراء زاهية وبنية وسوداء بلمسة نهائية لامعة."},"meisen":{"name":"ميسن ⁦(Meisen)⁩: حرير بخيوط مطبوعة","region":"إيسيساكي، تشيتشيبو، أشيكاغا، كيريو، هاتشيوجي","era":"ازدهار من العقد الثاني إلى ثلاثينيات القرن الـ20","about":"حرير ميسور التكلفة جلب الموضة إلى النساء العاديات في عصر تايشو وأوائل عصر شووا. وتحظى تصاميمه الجريئة بأسلوبَي الآرت نوفو والآرت ديكو اليوم بحب جامعي القطع العتيقة حول العالم.","process":"تُثبَّت خيوط السدى معًا تثبيتًا مؤقتًا فضفاضًا، وتُطبع عليها الزخرفة بالاستنسل. وأثناء النسج تُزال غرز التثبيت ويُضاف خيط اللُّحمة الفعلي، فتنزاح الألوان قليلًا وتبدو الحواف ضبابية ناعمة.","look":"زخارف جريئة عصرية بخطوط خارجية ريشية منزاحة قليلًا."},"jofu":{"name":"جوفو ⁦(Jofu)⁩: قماش رامي رقيق","region":"إتشيغو (نييغاتا)، مياكو (أوكيناوا)، أومي (شيغا)، نوتو (إيشيكاوا)","era":"أكثر من 1200 عام","about":"«القماش الفاخر»: نسيج بالغ الرقة متماسك الملمس من ألياف الرامي، يُرتدى في ذروة الصيف. ويُدرج إتشيغو جوفو وأوجيا تشيجيمي في قائمة اليونسكو للتراث الثقافي غير المادي.","process":"تُشقّ ألياف الرامي يدويًا إلى خيوط رفيعة كالشعر وتُوصل طرفًا بطرف. وبعد النسج يُفرد إتشيغو جوفو على الثلج في طقس الربيع المشمس ليُبيَّض طبيعيًا.","look":"خفيف وشفاف ومنعش، بملمس متماسك يشبه الورق قليلًا."},"omeshi":{"name":"أوميشي ⁦(Omeshi)⁩: كريب منسوج","region":"كيوتو (نيشيجين)، كيريو، شيوزاوا","era":"فترة إيدو","about":"كريب حريري منسوج سُمّي نسبةً إلى الشوغون توكوغاوا إيِهناري الذي أحبه: فكلمة أوميشي تعني «ما يرتديه شخص مُبجَّل». يقع بين الكيمونو المصبوغ والمنسوج، ويناسب الزيارات الأنيقة والحفلات.","process":"تُصبغ الخيوط قبل النسج. ويُفتل خيط اللُّحمة فتلًا شديدًا ويُنشّى؛ وبعد النسج يُحرِّر الماء الدافئ الفتل فيُكوِّن سطحًا متجعدًا دقيقًا.","look":"كريب متماسك بملمس حُبيبي خفيف، يحافظ على شكله ويقاوم التجعد."},"chirimen":{"name":"تشيريمن ⁦(Chirimen)⁩: كريب حريري","region":"تانغو (كيوتو)، ناغاهاما (شيغا)","era":"منذ القرن الـ16؛ وفي تانغو منذ القرن الـ18","about":"الكريب الحريري الناعم الذي يُستخدم قماشًا أساسيًا لمعظم أنواع الكيمونو المصبوغ، بما فيها يوزن. يتشرّب سطحه المتجعد الألوان بشكل جميل وينسدل برشاقة.","process":"تُفتل خيوط اللُّحمة آلاف المرات في كل متر، بالتناوب بين الفتل يسارًا ويمينًا. وبعد النسج يُغلى القماش لإزالة صمغ الحرير، فتحاول الخيوط أن تنفك، وينكمش القماش مكوّنًا تجاعيد صغيرة تُسمى شيبو.","look":"سطح ناعم مغطى بنتوءات صغيرة؛ ويختلف حجم التجاعيد باختلاف النوع."},"nishijin":{"name":"نيشيجين ⁦(Nishijin)⁩: بروكار","region":"حي نيشيجين، كيوتو","era":"سُمّي في القرن الـ15؛ والنسيج هنا منذ القرنين الـ5–6","about":"أبرز أنواع البروكار في اليابان، سُمّي نسبةً إلى «المعسكر الغربي» في حرب أونين. ينتج نسّاجو نيشيجين أحزمة أوبي وأقمشة فاخرة للبلاط الإمبراطوري والمعابد ومسرح نو.","process":"تُصبغ الخيوط بعشرات الألوان قبل النسج وتُدمج مع خيوط الذهب والفضة. أُدخلت أنوال الجاكار من فرنسا في سبعينيات القرن الـ19، بينما لا يزال أرقى نسيج التابستري يُنفَّذ يدويًا، حيث تُدكّ اللُّحمة بأظافر مُسنَّنة.","look":"قماش ثقيل غني بالزخارف بخيوط الذهب والفضة؛ ويُرى غالبًا في أحزمة الأوبي الرسمية."},"saga-nishiki":{"name":"ساغا نيشيكي ⁦(Saga Nishiki)⁩: بروكار من الورق والحرير","region":"ساغا","era":"أواخر فترة إيدو","about":"بروكار نادر من إقطاعية كاشيما. تقول الأسطورة إن زوجة السيد الإقطاعي ابتكرته مستلهمةً نقشة الخيزران المنسوج (أجيرو) في سقف غرفتها، وتوارثته سيدات الأسرة. وكان يُسمى أولًا كاشيما نيشيكي، ثم أُعيدت تسميته «ساغا نيشيكي» في المعرض الياباني البريطاني عام 1910.","process":"يتكون السدى من شرائط رفيعة من ورق الواشي مغطاة بالذهب أو الفضة أو الورنيش. ترفع أداة مسطّحة صغيرة من الخيزران الشرائطَ الورقية واحدة تلو الأخرى، ويُمرَّر خيط لُحمة من الحرير الملوّن. ولا يمكن نسج سوى بضعة سنتيمترات في اليوم.","look":"زخارف هندسية صغيرة دقيقة على أرضية ذهبية متلألئة؛ تُستخدم لأحزمة الأوبي الرسمية والحقائب والإكسسوارات."},"hakata":{"name":"هاكاتا ⁦(Hakata)⁩: نسيج هاكاتا","region":"فوكوأوكا","era":"1241","about":"بدأه تاجر تعلّم النسيج في الصين في عهد أسرة سونغ. وفي فترة إيدو كان السيد الإقطاعي المحلي يُهديه إلى الشوغون كل عام، لذا يُسمى التصميم الكلاسيكي هاكاتا «كنجو» (أي الهدية المُقدَّمة).","process":"تُرصّ خيوط سدى رفيعة كثيرة بإحكام، وتُدكّ خيوط اللُّحمة السميكة بقوة، فتتشكّل الزخرفة أساسًا من خيوط السدى. وتأتي الزخارف الكلاسيكية من أدوات الطقوس البوذية ومن الخطوط.","look":"حزام أوبي متماسك يُصدر صوت «كيو-كيو» عند ربطه ولا ينفلت أبدًا."},"wana":{"name":"وانا ⁦(Wana)⁩: نسيج بعُرى بارزة","region":"كيوتو","era":"منذ القرن الـ17","about":"«وانا» تعني العُروة. يرفع هذا النسيج عُرى صغيرة من الحرير على السطح، وهي التقنية نفسها المستخدمة في صنع المخمل في اليابان. ويمنح أحزمة الأوبي والمعاطف نقوشًا بارزة ناعمة.","process":"تُنسج أسلاك رفيعة تحت خيوط السدى لرفعها على شكل عُرى، ثم تُسحب الأسلاك. إذا تُركت العُرى كما هي فهو وانا، وإذا قُصّت أصبح مخملًا. ويمكن أن تجمع الزخارف بين عُرى مقصوصة وغير مقصوصة.","look":"زخرفة بارزة مخملية من عُرى صغيرة، ناعمة الملمس."},"sagara":{"name":"ساغارا ⁦(Sagara)⁩: تطريز بالعُقد","region":"من الصين؛ يُمارَس في كيوتو وفي أنحاء اليابان","era":"تقنية قديمة","about":"تطريز مكوّن من عدد لا يُحصى من العُقد الصغيرة، يشبه العُقد الفرنسية. يُنتج ملمسًا ثلاثي الأبعاد يشبه الخرز، وهو متين جدًا، لذا يُستخدم للّمسات المميزة والخطوط الخارجية.","process":"يُلفّ الخيط حول الإبرة ثم يُسحب عبر القماش إلى الأسفل لتكوين عقدة صغيرة. وتُصفّ العُقد واحدة تلو الأخرى لملء شكل أو رسم خط.","look":"نقاط بارزة متراصّة بكثافة كاللآلئ الصغيرة."},"kinkoma":{"name":"كينكوما ⁦(Kinkoma)⁩: تطريز بخيوط الذهب المُثبَّتة","region":"كيوتو وأنحاء اليابان","era":"تقنية قديمة","about":"خيط الذهب أقسى من أن يمرّ عبر الحرير، لذا يُوضع على السطح ويُثبَّت في مكانه. وهذا يمنح الخطوط الخارجية والزخارف خطًا ذهبيًا لامعًا وجريئًا.","process":"يُمدّ خيط الذهب الملفوف على بكرات خشبية صغيرة (كوما) على طول التصميم، عادةً في أزواج، ويُثبَّت على مسافات قصيرة بخيط حرير رفيع.","look":"خطوط ذهبية ناعمة ومتصلة تستقر فوق القماش."},"takeyamachi":{"name":"تاكيياماتشي ⁦(Takeyamachi)⁩: تطريز على الشاش","region":"تاكيياماتشي، كيوتو","era":"فترة إيدو","about":"تطريز على شاش حريري مفتوح النسج، سُمّي نسبةً إلى الشارع الذي بدأ فيه في كيوتو. تتبع الغرز شبكة القماش بدقة شديدة حتى تبدو النتيجة منسوجة لا مطرَّزة.","process":"يُمرَّر خيط ذهبي مسطح في الغالب (مع حرير ملوّن أحيانًا) عبر الثقوب الصغيرة في الشاش، مع عدّ كل ثقب، لملء التصميم كالفسيفساء.","look":"زخرفة ذهبية واضحة تبدو كأنها منسوجة على شاش شفاف؛ تُستخدم لأحزمة الأوبي والفوكوسا وإطارات اللفائف المعلّقة."},"swatow":{"name":"سواتو ⁦(Swatow)⁩: تطريز مُخرَّم","region":"شانتو (سواتو)، قوانغدونغ، الصين","era":"أواخر القرن الـ19","about":"تطريز مُخرَّم رقيق من جنوب الصين يجمع بين فن الغرز الصيني وصناعة الدانتيل الأوروبية. ولطالما حظي الكيمونو المطرّز بتطريز سواتو بتقدير كبير في اليابان بوصفه لباسًا أنيقًا راقيًا.","process":"تُسحب خيوط من القماش أو تُقصّ مساحات صغيرة منه، ثم تُحاط الفتحات وتُملأ بغرز دقيقة لتكوين زخارف تشبه الدانتيل. ويُنفَّذ كل ذلك يدويًا.","look":"زخارف دانتيلية بدرجات اللون نفسه وفتحات صغيرة، غالبًا بالأبيض أو بألوان باستيل هادئة."},"suzhou":{"name":"سوتشو ⁦(Suzhou)⁩: تطريز حريري","region":"سوتشو، جيانغسو، الصين","era":"أكثر من 2000 عام","about":"أحد التقاليد الأربعة الكبرى للتطريز في الصين، ويشتهر بدقته المتناهية. ويُستخدم على الكيمونو وأحزمة الأوبي لتصوير حيوانات وزهور نابضة بالحياة.","process":"يُقسَم خيط الحرير الواحد إلى ما يصل إلى عشرات الشُّعيرات الرفيعة كالشعر. تُمزج الألوان غرزةً غرزة، وبعض القطع تُطرَّز بحيث يُظهر كلا الوجهين صورة مكتملة.","look":"واقعية تشبه الصور الفوتوغرافية، مثل قطط يمكن رؤية كل شعرة منها."},"ran":{"name":"لوانتشن ⁦(Luanzhen)⁩: تطريز بالغرز العشوائية","region":"تشانغتشو، جيانغسو، الصين؛ ويُرى أيضًا على الكيمونو وأحزمة الأوبي","era":"ابتُكر في أوائل القرن الـ20 (العشرينيات والثلاثينيات)","about":"تطريز تتقاطع فيه غرز مختلفة الأطوال والاتجاهات وتتداخل، كضربات الفرشاة في اللوحة الزيتية. ويعبّر عن الفرو والريش والضوء والظل بشكل طبيعي.","process":"بدلًا من صفّ الغرز بانتظام جنبًا إلى جنب، يُراكِم المطرِّز الغرز بحرية في اتجاهات متقاطعة ويمزج الألوان في كل طبقة لبناء العمق.","look":"سطح يشبه اللوحة بتدرجات ناعمة بدلًا من خطوط غرز واضحة."},"hitta":{"name":"هيتا ⁦(Hitta)⁩: شيبوري بالنقاط المربعة","region":"كيوتو","era":"بلغ درجة عالية من التطور بحلول القرن الـ17","about":"أفخم أنواع الشيبوري. تُصفّ نقاط مربعة صغيرة على خطوط مائلة؛ ويُسمى الكيمونو المغطى بالكامل بالهيتا «سو-هيتا»، وهو قمة الفخامة.","process":"تقرص الحرفية قطعة صغيرة من القماش، وتطويها إلى أربع، وتلف الخيط حولها عدة مرات. وتُربط كل نقطة باليد، لذا قد يستغرق الفوريسودي المغطى بالكامل عامًا أو أكثر.","look":"نقاط مربعة بارزة ومنتظمة مصفوفة في صفوف مائلة مرتبة."},"kanoko":{"name":"كانوكو ⁦(Kanoko)⁩: شيبوري بقع الظبي الصغير","region":"كيوتو وأنحاء اليابان","era":"منذ العصور القديمة","about":"تعني «كانوكو» ظبيًا صغيرًا، لأن النقاط البيضاء الصغيرة ذات المركز الملوّن تشبه بقع الظبي الصغير. وهي أشهر أنواع الشيبوري، وتظهر على الأوبيآغه والكيمونو والإكسسوارات.","process":"تُلتقط نقاط صغيرة من القماش وتُربط بإحكام بالخيط قبل الصباغة. وبعد الصباغة وفكّ الربط، تترك كل نقطة دائرة صغيرة بملمس بارز ومحبّب.","look":"حلقات منقّطة صغيرة في وسطها «عين» ملوّنة دقيقة."},"boshi":{"name":"بوشي ⁦(Boshi)⁩: شيبوري القبعة","region":"كيوتو، أريماتسو","era":"فترة إيدو","about":"تعني «بوشي» قبعة. تحمي هذه الطريقة مساحات كبيرة من التصميم من الصبغ بوضع غطاء فوقها كالقبعة، مما يتيح إبقاء الزهور أو الدوائر الكبيرة بيضاء.","process":"يُخاط الخط الخارجي للشكل ويُجمَع، ثم تُغطّى المنطقة الداخلية كالقبعة، تقليديًا بغلاف الخيزران واليوم غالبًا بالفينيل، وتُربط بإحكام بالخيط قبل الصباغة.","look":"أشكال كبيرة غير مصبوغة ذات حواف ناعمة تبدو كالريش قليلًا."},"nuishime":{"name":"نويشيمه ⁦(Nuishime)⁩: شيبوري الخياطة","region":"كيوتو، أريماتسو-نارومي (ناغويا)","era":"منذ فترة موروماتشي على الأقل","about":"طريقة شيبوري تستخدم غرزًا متتابعة لرسم خطوط وأشكال دقيقة، وتتيح أشكالًا أكثر حرية بكثير مما يتيحه الربط وحده.","process":"يُخاط التصميم بغرز متتابعة صغيرة، ثم تُشدّ الخيوط بقوة فيتجمّع القماش في ثنيات. تقاوم المناطق المثنية الصبغة، فيبقى خط خارجي منقّط.","look":"خطوط خارجية واضحة مكوّنة من صفوف من الشرطات الصغيرة."},"arashi":{"name":"أراشي ⁦(Arashi)⁩: شيبوري اللفّ حول العمود","region":"أريماتسو-نارومي (ناغويا)","era":"أواخر القرن الـ19","about":"تعني «أراشي» العاصفة: فالخطوط المائلة تبدو كمطر تدفعه الريح. وهي من كلاسيكيات أريماتسو، أكبر مدينة للشيبوري في اليابان، وتحظى بشعبية في صنع اليوكاتا.","process":"يُلفّ القماش بشكل مائل حول عمود طويل، ويُربط بالخيط، ثم يُدفع إلى الأسفل في ثنيات متراصّة. ولا تتشرّب الصبغة إلا الحواف الخارجية البارزة.","look":"خطوط مائلة رفيعة تشبه المطر المنهمر بميل."},"tatsumaki":{"name":"تاتسوماكي ⁦(Tatsumaki)⁩: شيبوري الزوبعة","region":"أريماتسو-نارومي (ناغويا)، كيوتو","era":"تقنية تقليدية","about":"تعني «تاتسوماكي» الإعصار. يُلفّ الخيط بشكل حلزوني حول القماش، فيلتوي النقش كأنه عالق في زوبعة.","process":"يُجمَع القماش (غالبًا بعد الخياطة أو الطيّ) حول قلب ليصبح قضيبًا دائريًا طويلًا، ويُلفّ الخيط حلزونيًا من الأعلى إلى الأسفل قبل الصباغة. ولا يتشرّب الصبغة إلا السطح المكشوف، فتبقى أشرطة حلزونية.","look":"خطوط حلزونية دوّارة توحي بحركة قوية."},"yanagi":{"name":"ياناغي ⁦(Yanagi)⁩: شيبوري الصفصاف","region":"أريماتسو-نارومي (ناغويا)","era":"فترة إيدو","about":"تعني «ياناغي» الصفصاف. يشبه النقش أغصان الصفصاف المتمايلة مع النسيم، وهو مفضّل ليوكاتا الصيف.","process":"يُجمَع القماش طوليًا في طيّات ضيقة ويُربط بالخيط على مسافات. تقاوم الطيّات الصبغة، فتبقى خطوط عمودية رفيعة متقطّعة.","look":"خطوط عمودية رقيقة تشبه أغصان الصفصاف المتدلّية."},"oke":{"name":"أوكيه ⁦(Oke)⁩: شيبوري الحوض","region":"كيوتو","era":"تقنية تقليدية من كيوتو","about":"تعني «أوكيه» الحوض. تُبقي هذه التقنية النادرة أجزاء كبيرة من القماش جافة بإحكام إغلاقها داخل حوض خشبي، مما يتيح مساحات كبيرة بألوان مختلفة على كيمونو واحد. وقليل جدًا من الحرفيين ما زالوا يتقنونها.","process":"يُوضع الجزء الذي يجب أن يبقى بلا صبغ داخل حوض من خشب السرو، وتُثبّت الأغطية بإحكام وتُشدّ بالحبال على القماش، مع ترك الجزء المراد صبغه خارجه. ثم يُغمر الحوض كله في وعاء صباغة أكبر. وتُكرّر العملية لكل لون.","look":"كتل كبيرة جريئة بألوان مختلفة، بحدود نظيفة وناعمة قليلًا."},"itajime":{"name":"إيتاجيمه ⁦(Itajime)⁩: الصباغة بكبس الألواح","region":"أريماتسو وكيوتو وأماكن أخرى","era":"منذ القرن الـ8","about":"من أقدم تقنيات الصباغة بالحجب في اليابان؛ إذ إن سلفها، كيوكيتشي (الصباغة بين ألواح منحوتة)، محفوظ في مخزن كنوز شوسوين من القرن الـ8. يُكبس القماش المطوي بين ألواح لصنع نقوش متكررة.","process":"يُطوى القماش على شكل مثلثات أو مربعات ويُكبس بإحكام بين ألواح خشبية، ثم يُغمس في الصبغة. تبقى المناطق المغطّاة بيضاء وتشكّل نقشًا متناظرًا.","look":"أشكال هندسية متكررة، مثل زخارف تشبه ندف الثلج تُسمّى سيكّا."},"tsukami":{"name":"تسوكامي ⁦(Tsukami)⁩: شيبوري القبضة","region":"مراكز مختلفة للشيبوري","era":"تقليدية","about":"تعني «تسوكامي» القبض باليد. تُجمع حفنات من القماش وتُربط، فتخرج كل قطعة مختلفة عن غيرها، مما يمنح أثرًا حرًّا وطبيعيًا.","process":"يقبض الحرفي على القماش ويلويه في كتل غير منتظمة ويربطها بالخيط قبل الصباغة. وتصنع الطيّات العشوائية نقوشًا لا يمكن توقّعها.","look":"نقوش غير منتظمة تشبه السحب أو الرخام، دون تكرار."},"kumihimo":{"name":"كوميهيمو ⁦(Kumihimo)⁩: ضفائر الحرير","region":"كيوتو، إيغا (مييه)","era":"منذ القرنين الـ7–8","about":"حبال حريرية مضفورة، استُخدمت أولًا للأدوات البوذية وملابس البلاط، ثم لاحقًا لدروع الساموراي وحبال السيوف. واليوم تُعرف أكثر باسم أوبيجيمه، وهو الحبل المربوط حول منتصف الأوبي.","process":"تُلفّ عشرات الخيوط الحريرية على بكرات مثقّلة، وتُمرَّر فوق بعضها على حامل خشبي مثل الماروداي الدائري. وتصنع الحوامل والحركات المختلفة حبالًا دائرية أو مربعة أو مسطّحة.","look":"ضفيرة متينة ومنتظمة بنقوش مائلة دقيقة وتوليفات ألوان غنية."},"zogan":{"name":"زوغان ⁦(Zogan)⁩: التطعيم بالمعادن","region":"كيوتو، كوماموتو (هيغو)","era":"ازدهرت في فترة إيدو على تجهيزات السيوف والبنادق","about":"فن تطعيم الحديد بالذهب والفضة. استُخدم قديمًا لتزيين تجهيزات السيوف، واليوم يزيّن إكسسوارات الكيمونو مثل الأوبيدومه (دبابيس الأوبي) وزينة الشعر.","process":"يُحفر سطح الحديد بأخاديد دقيقة متقاطعة. ويُطرق ورق الذهب أو الفضة وأسلاكهما داخل الأخاديد، ثم يُترك الحديد ليصدأ عمدًا ويُخبز مع الورنيش أو الزيت حتى يصير أسود داكنًا.","look":"تصاميم ذهبية وفضية لامعة على خلفية سوداء داكنة."},"makie":{"name":"ماكي-إيه ⁦(Maki-e)⁩: الورنيش المرشوش بالذهب","region":"كيوتو، واجيما، كانازاوا وأماكن أخرى","era":"منذ القرنين الـ8–9","about":"فن من فنون الورنيش تُرسم فيه التصاميم بالورنيش ثم يُرشّ عليها مسحوق الذهب أو الفضة. وفي عالم الكيمونو نجده على الأمشاط ودبابيس الشعر والأوبيدومه وصنادل الغيتا.","process":"يُرسم التصميم بالورنيش، وقبل أن يجف يُرشّ عليه مسحوق ذهبي أو فضي ناعم عبر أنبوب من الخيزران. ثم تُطلى القطعة وتُصقل عدة مرات.","look":"صور ذهبية رقيقة ذات لمعان عميق على ورنيش أسود أو أحمر."},"mizuhiki":{"name":"ميزوهيكي ⁦(Mizuhiki)⁩: الحبال الورقية","region":"إيدا (ناغانو)، كانازاوا (إيشيكاوا)","era":"تعود أصولها إلى القرن الـ7","about":"حبال زخرفية من ورق الواشي الملفوف، تُعقد في عُقَد تحمل أمنيات بالحظ السعيد. تزيّن مغلّفات الهدايا، وفي تنسيق الكيمونو تُستخدم لزينة شعر العرائس وزخارف الأوبي.","process":"يُلفّ الواشي في حبال رفيعة ويُقوّى بالنشا، ثم يُصبغ أو يُغلَّف بغشاء ملوّن أو معدني. وتُعقد الحبال في عُقَد مثل عقدة أواجي أو تُشكَّل على هيئة طيور الكركي والصنوبر والبرقوق.","look":"حبال لامعة متماسكة معقودة في عُقَد متناظرة، غالبًا بالأحمر والأبيض أو بالذهبي والفضي."},"ro":{"name":"رو ⁦(Ro)⁩: الشاش الصيفي بخطوط من الفتحات","region":"كيوتو ومناطق أخرى لنسج الحرير","era":"سُجّل الاسم بحلول القرن الـ15؛ وانتشر منذ فترة إيدو","about":"حرير صيفي بصفوف منتظمة من فتحات دقيقة تسمح بمرور الهواء. وهو القماش الكلاسيكي للكيمونو الرسمي واليومي في أشد الشهور حرًّا، من أوائل الصيف إلى أواخره.","process":"تُنسج عدة صفوف بالنسج السادة، ثم تُلفّ أزواج من خيوط السدى حول بعضها في صف واحد لتترك خطًا من الفجوات. ويُعطي عدد الصفوف السادة بين الفجوات أسماء مثل «رو الصفوف الثلاثة» و«رو الصفوف الخمسة» وهكذا.","look":"خطوط أفقية (أو عمودية أحيانًا) رفيعة من الفتحات الصغيرة على حرير مصمت في سائره."},"sha":{"name":"شا ⁦(Sha)⁩: حرير الشاش الكامل","region":"كيوتو ومناطق أخرى لنسج الحرير","era":"جاء من الصين في القرنين الـ7–8","about":"حرير خفيف شفاف يُلبس في ذروة الصيف. وهو أخف وأكثر شفافية من الرو، ويُستخدم أيضًا لمعاطف الهاوري الصيفية والمعاطف التي تُلبس فوق الكيمونو.","process":"في كل صف، تُلفّ أزواج من خيوط السدى حول بعضها وتُثبّتها خيوط اللحمة. فينتج عن ذلك شبك مفتوح ومنتظم عبر القماش كله.","look":"شبك شفاف منتظم بلا خطوط مصمتة؛ تظهر الطبقات التي تحته برفق."},"ra":{"name":"را ⁦(Ra)⁩: الشاش المعقّد الشبيه بالشبكة","region":"كيوتو","era":"قديم (القرنان الـ7–8)؛ أُحيي في القرن الـ20","about":"من أقدم أنواع نسج الشاش وأكثرها تعقيدًا، وتُحفظ نماذج منه في مخزن كنوز شوسوين من القرن الـ8. تراجعت التقنية في اليابان بعد العصور الوسطى وأحياها كبار النسّاجين المعاصرين. واليوم تُرى غالبًا في أوبي الصيف الفاخرة.","process":"يعبر كل خيط من خيوط السدى ليلتفّ مع عدة خيوط مجاورة، لا مع خيط واحد فقط، فتشكّل الخيوط شبكة. ويُنسج ببطء يدويًا على نول خاص.","look":"نسيج شبكي مرن بفتحات على شكل معيّن، وغالبًا ما تظهر نقوش داخل الشبكة."},"kobai":{"name":"كوباي ⁦(Kobai)⁩: القماش الصيفي ذو الشبكة البارزة","region":"مناطق نسج القطن والحرير في أنحاء اليابان","era":"قماش صيفي تقليدي","about":"قماش صيفي بملمس شبكي بارز، يُصنع من القطن (مين-كوباي) أو من الحرير مع القطن (كينو-كوباي). وهو مفضّل لليوكاتا عالية الجودة والكيمونو الصيفي غير الرسمي.","process":"تُنسج خيوط أسمك على مسافات منتظمة، طوليًا وعرضيًا، داخل أرضية رقيقة وخفيفة. فتشكّل الخيوط السميكة شبكة مربعات بارزة.","look":"قماش خفيف بنقش مربعات من خطوط بارزة؛ وتمنع هذه النتوءات القماشَ من الالتصاق بالجلد."},"rokechi":{"name":"روكيتشي ⁦(Rokechi)⁩: الصباغة بحجب الشمع","region":"كيوتو وأنحاء اليابان","era":"القرن الـ8؛ أُحيي في القرن الـ20","about":"إحدى طرق الصباغة بالحجب الثلاث القديمة في فترة نارا، وتُحفظ نماذج منها في مخزن كنوز شوسوين. اندثرت خلال فترة هييان وأحياها فنانو القرن الـ20، فجعلوها شكلًا من الصباغة الحرة ذات الطابع التصويري.","process":"يُوضع الشمع المذاب بالفرشاة أو بالختم على القماش حيث لا ينبغي أن يصل اللون، ثم يُصبغ القماش. وبعدها يُزال الشمع بالحرارة أو بالماء الساخن. وحيث تشقّق الشمع، تتسرّب الصبغة وتترك خطوطًا دقيقة.","look":"أشكال جريئة تخترقها خطوط تشقّق دقيقة تشبه خيوط العنكبوت."},"mokuhan":{"name":"موكوهان ⁦(Mokuhan)⁩: الطباعة بالقوالب الخشبية","region":"كيوتو ومناطق أخرى","era":"جذور قديمة","about":"تقنية طباعة تُضغط فيها تصاميم محفورة في قوالب خشبية على القماش. تحمل كل طبعة لمسة الحرفي، والاختلافات الطفيفة تمنح القماش طابعًا يدويًا دافئًا. وقليلة هي الورش التي ما زالت تمارسها اليوم.","process":"يُحفر التصميم في قالب من الخشب الصلب. ويُطلى القالب بالصبغة أو بالعجينة ويُضغط بقوة على القماش المشدود، طبعةً تلو الأخرى. ويُستخدم قالب منفصل لكل لون.","look":"زخارف متكررة بألوان غير متساوية قليلًا وحواف ناعمة، مع أثر خفيف لعروق الخشب."},"chusen":{"name":"تشوسين ⁦(Chusen)⁩: الصباغة بالسكب","region":"أوساكا (ساكاي)، هاماماتسو (شيزوكا)، طوكيو","era":"أواخر القرن الـ19 (عصر ميجي)","about":"طريقة يابانية لصباغة يوكاتا القطن ومناشف التينوغوي. تنفذ الصبغة عبر القماش كله، فيصبح للوجهين اللون نفسه، وتبدو الألوان ناعمة ونضرة.","process":"يُطوى القماش ذهابًا وإيابًا في طبقات كثيرة، مع فرد عجينة الحجب عبر استنسل على كل طبقة. وتُبنى جدران من العجينة حول كل منطقة، وتُسكب الصبغة من إبريق، ويسحبها شفط من الأسفل عبر جميع الطبقات دفعة واحدة.","look":"ألوان ناعمة ضبابية قليلًا، وتدرّجات لطيفة، والنقش نفسه ظاهر بوضوح على الظهر."},"bingata":{"name":"بينغاتا ⁦(Bingata)⁩: الصباغة بالاستنسل الأوكيناوية","region":"أوكيناوا","era":"مملكة ريوكيو (منذ نحو القرن الـ15)","about":"فن الصباغة الزاهي في أوكيناوا، الذي كانت ترتديه الأسرة المالكة والنبلاء في مملكة ريوكيو. وتمنحه الألوان الساطعة والزخارف المستوحاة من اليابان والبحار الجنوبية معًا طابعًا مبهجًا واستوائيًا.","process":"يُقصّ النقش في استنسل ورقي وتُوضع عجينة الأرز عبره. وتُطلى الأصباغ المعدنية والنباتية بالفرشاة في كل منطقة، ثم يُفرك ظل أغمق على الحواف (كومادوري) لإضافة العمق. وتُسمّى النسخة المصبوغة بالنيلة وحدها إيغاتا.","look":"أصفر وأحمر وأزرق ساطعة بحواف مظلّلة، وزخارف مثل الزهور والطيور والأمواج والسحب."},"aizome":{"name":"آيزومه ⁦(Aizome)⁩: الصباغة بالنيلة","region":"توكوشيما (آوا) وأنحاء اليابان","era":"قديمة؛ وانتشرت في فترة إيدو","about":"كانت النيلة أكثر الأصباغ شيوعًا في اليابان، واستُخدمت في كل شيء من ملابس عمل المزارعين إلى الكيمونو. وقد أُعجب بها الزوار الأجانب في عصر ميجي إلى حد أن اللون صار يُعرف باسم «الأزرق الياباني».","process":"تُحوَّل أوراق النيلة بالتخمير إلى سماد يُسمّى سوكومو، ثم تُخمَّر في وعاء مع قلوي رماد الخشب ونخالة القمح والجير. ويُغمس القماش ويُرفع مرارًا وتكرارًا: يخرج أخضر ثم يتحوّل إلى الأزرق عند ملامسة الهواء. وكلما زاد الغمس صار اللون أعمق.","look":"أزرق عميق نابض بالحياة، يتراوح من أزرق السماء الفاتح إلى ما يقارب الأسود، ويلين بجمال مع الاستعمال."},"lace":{"name":"الدانتيل","region":"تطوّر في أوروبا؛ ويُصنع في اليابان وحول العالم","era":"الدانتيل الأوروبي منذ القرن الـ16؛ ومع الكيمونو منذ عصرَي ميجي وتايشو","about":"الدانتيل نسيج مخرّم مصنوع من الخيوط وحدها. وفي أزياء الكيمونو اليوم، تحظى كيمونو الدانتيل والهاوري والأوبي بشعبية، وغالبًا تُلبس فوق كيمونو ملوّن ليظهر اللون من خلالها.","process":"يُصنع معظم دانتيل الكيمونو على آلات التطريز. يُطرَّز النقش على شبك رقيق (دانتيل التول) أو على قماش أساس يُذاب لاحقًا، فلا يبقى سوى الخيوط المطرّزة (الدانتيل الكيميائي).","look":"نقش زهري أو هندسي شفاف من الخيوط، يظهر اللون الذي تحته من خلال الفتحات."},"tsuzure":{"name":"تسوزوريه ⁦(Tsuzure)⁩: نسج التابستري","region":"كيوتو (نيشيجين)","era":"نماذج في اليابان منذ القرن الـ8 (مستوردة غالبًا من الصين)؛ ويُنسج في نيشيجين منذ القرن الـ18 (فترة إيدو)","about":"النسخة اليابانية من نسج التابستري، وهي قريبة من نسيج غوبلان الأوروبي. وتُعدّ أعلى درجات الأوبي، وتُنسج أرقى القطع يدويًا باستخدام أظافر النسّاج.","process":"تُنسج كل لحمة ملوّنة ذهابًا وإيابًا داخل الجزء الخاص بها من التصميم فقط، فتختفي خيوط السدى تمامًا. ويبرد النسّاج أظافره على شكل أسنان المنشار ويستخدمها لدفع كل لحمة إلى مكانها. ولا يُنسج في اليوم إلا بضعة سنتيمترات.","look":"قماش متين ومسطّح بالصورة نفسها على الوجه والظهر، مع شقوق دقيقة حيث يلتقي لونان."},"benibana":{"name":"بينيبانا ⁦(Benibana)⁩: الصباغة بالعصفر","region":"ياماغاتا (موغامي) وكيوتو","era":"وصلت عبر طريق الحرير في نحو القرنين الـ6–7","about":"صبغة حمراء طبيعية تُستخرج من بتلات العصفر، أحبّها بلاط هييان. وكانت ثمينة جدًا في فترة إيدو حتى قيل إن «وحدة من الأحمر تساوي وحدة من الذهب». واستُخدمت تقليديًا لبطانات الكيمونو الحريرية الحمراء (مومي).","process":"تُغسل البتلات بالماء لإزالة الكثير من الصبغة الصفراء، ثم تُخمَّر وتُكبس في أقراص «بيني-موتشي». ويُستخلص الأحمر بقلوي الرماد ويُثبَّت على الحرير بخل البرقوق المدخّن (أوباي). ويؤدي تكرار الصباغة إلى تعميق اللون.","look":"من الوردي الصافي المتوهّج إلى القرمزي العميق؛ واللون رقيق ويبهت تحت الضوء القوي."}}},"ja":{"ui":{"tagline":"きものを支える匠の技 — 日本の伝統技法50選","all":"すべて","search":"技法を検索…","region":"産地","era":"起源","about":"概要","process":"つくり方","look":"見分け方","listen":"日本語の名前を聞く","close":"閉じる","language":"言語","count":"{n}件の技法","noResults":"該当する技法が見つかりません。","prev":"前へ","next":"次へ","intro":"きものは多くの工程を経てつくられ、それぞれの工程に専門の職人がいます。カテゴリーを選ぶか、気になる技法をタップしてご覧ください。"},"cats":{"dye":{"name":"染め","desc":"白く織り上げた絹地（白生地）に、手描き・型染め・捺染などで柄を表します。染めのきものは一般に格が高く、式典やお祝いの席で着用されます。"},"weave":{"name":"織り","desc":"先に糸を染め、織りながら柄を表します。紬などの織りのきものはおしゃれな普段着として愛され、一方で織りの帯は最も格の高いものにもなります。"},"embroidery":{"name":"刺繍","desc":"絹糸や金銀糸を手で縫い付け、立体感や光沢、奥行きを加えます。礼装のきものでは染めと組み合わせることが多い技法です。"},"shibori":{"name":"絞り","desc":"布の一部をくくる・縫う・折る・挟むなどして、染料が入らないようにします。糸をほどくと、やわらかく立体的な風合いの柄が現れます。"},"other":{"name":"装身具の工芸","desc":"きもの姿は、組紐師・金工師・漆芸家・水引職人など、ほかの分野の職人がつくる紐や装飾品によって完成します。"}},"items":{"kaga-yuzen":{"name":"加賀友禅","region":"石川県金沢市","era":"18世紀初め","about":"旧加賀藩に伝わる手描き友禅。藍・臙脂・黄土・草・古代紫の「加賀五彩」で描かれる写実的な草花で知られます。","process":"色のにじみを防ぐ細い糊の線（糸目糊）で図柄の輪郭を描き、各部分を筆で彩色します。ぼかしは外側から内側へ向かって入れます。一人の作家が全体を手がけるのが一般的です。","look":"自然で絵画的な文様。虫に食われた葉（虫喰い）を描き込むこともあります。金彩や刺繍はほとんど用いません。"},"kyo-yuzen":{"name":"京友禅","region":"京都","era":"17世紀後半","about":"京都の扇絵師・宮崎友禅斎にちなむ、友禅染の原点。絵画のように自由な意匠をきものにもたらし、礼装の代表的な染めとなりました。","process":"図案、下絵、糸目糊置き、彩色、蒸し、水元、そして仕上げの金彩・刺繍まで、約20の工程をそれぞれ専門の職人が担います。","look":"豊かな色彩による雅やかな王朝風の文様。ぼかしは中心から外側へ。金彩や刺繍で仕上げることが多いです。"},"edo-komon":{"name":"江戸小紋","region":"東京","era":"17世紀（江戸時代）","about":"一色で染めた極めて細かな柄の繰り返しで、遠目には無地に見えるほど。武士の裃に始まり、各大名家がそれぞれ専用の柄（定め柄）を持っていました。","process":"和紙を柿渋で貼り合わせた型紙に柄を彫ります。職人が型紙を絹に置いて糊を置き、寸分の狂いもなく送りながら繰り返し、最後に生地全体を染めます。","look":"近くで見ると無数の細かな点や波、線。少し離れると落ち着いた無地に見えます。"},"tsujigahana":{"name":"辻が花","region":"京都ほか","era":"15世紀〜17世紀初め","about":"室町・桃山時代の華やかな染めで、縫い締め絞りに墨の描き絵、摺箔、刺繍を組み合わせたもの。1600年代初めに姿を消し、のちに「幻の染め」と呼ばれました。","process":"文様の輪郭を縫って引き締め、染料が入らないようにして、何段階にも分けて染めます。葉脈などの細部は墨で描き入れます。20世紀に現代の作家たちがその趣を復活させました。","look":"縁に縮れのある、やわらかくにじんだ形と、繊細な墨の描線。"},"sarasa":{"name":"更紗","region":"インド発祥。長崎・堺・京都・江戸で製作","era":"16〜17世紀","about":"海外との交易を通じてインドや東南アジアから伝わった、色鮮やかな模様の木綿布。異国情緒あふれる花鳥や幾何学文様が珍重され、やがて日本の職人も独自に作るようになりました。","process":"インドでは媒染剤や蝋を使い、手描きや木版で柄を表しました。日本の「和更紗」は、色ごとに用意した多数の型紙を順に重ねて染めるのが一般的です。","look":"赤土色・藍・茶系で表された、異国風の花文様やペイズリー風の模様がびっしりと並びます。"},"kinsai":{"name":"金彩","region":"京都","era":"古代より。16世紀に隆盛","about":"染め上がったきものに本金・本銀で装飾を施す技法。友禅染の礼装の仕上げとして用いられることが多く、花や雲、輪郭に輝きを添えます。","process":"型紙を通して、または細い筒で接着剤を置き、金箔を押して不要な部分を払い落とします。金を細かな砂子として蒔いたり、金泥で線を描いたりすることもあります。","look":"染め柄の上に金銀が輝き、着る人の動きにつれて光をとらえます。"},"oshima":{"name":"大島紬","region":"鹿児島県奄美大島","era":"1300年以上の歴史","about":"日本を代表するきもの地のひとつ。地元の木で絹を染めてから鉄分を含む泥で染める泥染めにより、深く艶のある黒褐色が生まれます。軽くしなやかで、ほとんどしわになりません。","process":"まず締機で糸を固く織り締めて仮の筵（むしろ）をつくり、柄の部分を防染します。この筵を車輪梅（テーチ木）で何十回も染めては泥で染め、ほどいた糸を一本ずつ手で細かな点を合わせながら織り上げます。","look":"黒く絹らしい光沢のある地に、小さな十字（絣）で構成された極めて細かな幾何学柄。"},"yuki":{"name":"結城紬","region":"茨城県結城市・栃木県小山市","era":"奈良時代（8世紀）以前に起源。17世紀から名声を得る","about":"2010年にユネスコ無形文化遺産に登録。最高級の普段着といわれ、暖かく軽く、着るほどにやわらかくなります。","process":"真綿から撚りをかけずに手で糸を紡ぎます。絣糸は手で括って染め、織り手が自分の体で経糸の張りを調整する地機で織ります。一反に数か月から一年以上かかることもあります。","look":"やわらかく、わずかに節のある風合いと、マットでやさしい光沢。"},"ushikubi":{"name":"牛首紬","region":"石川県白山市","era":"800年以上","about":"山あいの村で織られる希少な紬で、2頭の蚕が一緒につくった玉繭を原料とします。釘に引っかけても布が破れず釘を抜いてしまうほど丈夫なことから、「釘抜紬」とも呼ばれます。","process":"玉繭から湯の中で直接糸を引くため、自然な節が生まれます。まず白生地を織り、そのあと友禅などで後染めすることが多いのが特徴です。","look":"小さな自然の節があり、落ち着いた温かみのある光沢をもつ丈夫な絹。"},"kihachijo":{"name":"黄八丈","region":"東京都八丈島","era":"室町時代から記録があり、江戸時代に流行","about":"離島で、島の植物から得る黄・樺（鳶）・黒の三色だけを使って織られる絹織物。江戸の町人の間で流行しました。","process":"黄はコブナグサ（八丈刈安）、樺色はタブノキの樹皮、黒はスダジイの樹皮で染めて泥で媒染します。糸を何度も繰り返し染め、格子や縞に織り上げます。","look":"鮮やかな黄・茶・黒の格子や縞と、艶のある仕上がり。"},"meisen":{"name":"銘仙","region":"伊勢崎・秩父・足利・桐生・八王子","era":"1910〜1930年代に大流行","about":"大正から昭和初期にかけて、一般の女性におしゃれをもたらした手頃な絹織物。大胆なアール・ヌーヴォーやアール・デコ調の柄は、今も世界中のアンティーク愛好家に人気です。","process":"経糸を粗く仮織りし、そこに型紙で柄を捺染します（解し絣）。織る際に仮の緯糸をほどきながら本来の緯糸を織り込むため、色がわずかにずれ、輪郭がやわらかくかすれます。","look":"羽毛のようにかすれ、わずかにずれた輪郭をもつ大胆でモダンな柄。"},"jofu":{"name":"上布","region":"越後（新潟）・宮古（沖縄）・近江（滋賀）・能登（石川）","era":"1200年以上","about":"「上等な布」の意。苧麻で織る極めて薄くハリのある布で、盛夏に着用します。越後上布・小千谷縮はユネスコ無形文化遺産に登録されています。","process":"苧麻の繊維を手で髪の毛ほどの細さに裂き、一本ずつつなぎます。越後上布は織り上げたあと、春の晴れた日に雪の上に広げて自然に漂白します（雪晒し）。","look":"軽く透け感があり涼やか。シャリッとした紙のような手触り。"},"omeshi":{"name":"御召","region":"京都（西陣）・桐生・塩沢","era":"江戸時代","about":"将軍・徳川家斉が好んだことに由来する、先染めの絹縮み。「御召」は「高貴な方がお召しになる」の意です。染めと織りのきものの中間に位置し、ちょっとした訪問やパーティーに向きます。","process":"糸を先に染めてから織ります。緯糸には強撚糸を用いて糊付けし、織り上げたあとにお湯で撚りを戻して細かなシボを出します。","look":"ほどよい張りのある縮みで、ほのかなシボ感があり、型くずれやしわに強い。"},"chirimen":{"name":"縮緬","region":"丹後（京都）・長浜（滋賀）","era":"16世紀から。丹後は18世紀から","about":"友禅をはじめ、多くの染めのきものの白生地となるやわらかな絹縮み。シボのある表面は発色が美しく、優雅なドレープを描きます。","process":"緯糸に1メートルあたり数千回の撚りをかけ（強撚糸）、右撚りと左撚りを交互に織り込みます。織り上げたあと精練でセリシンを落とすと糸が撚りを戻そうとし、生地が縮んで「シボ」と呼ばれる細かな凹凸が生まれます。","look":"細かな凹凸に覆われたやわらかな表面。シボの大きさは種類によって異なります。"},"nishijin":{"name":"西陣織","region":"京都・西陣","era":"15世紀に命名。5〜6世紀からこの地で機織り","about":"日本を代表する紋織物で、名は応仁の乱の「西陣」に由来します。西陣の織元は、豪華な帯をはじめ、宮中・寺社・能装束の織物を手がけています。","process":"糸を何十色にも先染めし、金銀糸と組み合わせて織ります。1870年代にはフランスからジャカード織機が導入されましたが、最高級の爪掻き本綴れは今も手織りで、ギザギザに刻んだ爪で緯糸を掻き寄せて織ります。","look":"金銀糸を使った重厚で華やかな柄の織物。礼装の帯として目にすることが多いです。"},"saga-nishiki":{"name":"佐賀錦","region":"佐賀","era":"江戸時代後期","about":"鹿島藩に伝わる希少な織物。藩主夫人が天井の網代模様に着想を得て考案し、奥女中たちの間
