で受け継がれたと伝えられます。はじめは「鹿島錦」と呼ばれ、1910年の日英博覧会を機に「佐賀錦」と名付けられました。","process":"経糸には金箔・銀箔や漆を貼った和紙を細く裁ったものを使います。色絹の緯糸を、小さなへらで和紙の経糸を一本ずつすくいながら織り込みます。1日に織れるのはわずか数センチです。","look":"きらめく金地に、細かく精緻な幾何学文様。礼装用の帯やバッグ、小物に用いられます。"},"hakata":{"name":"博多織","region":"福岡","era":"1241年","about":"宋で織物を学んだ商人が始めたもの。江戸時代、藩主が毎年将軍に献上したことから、代表的な柄は「献上博多」と呼ばれます。","process":"多数の細い経糸を密に並べ、太い緯糸を強く打ち込むため、柄は主に経糸で表されます。代表的な文様は仏具と縞に由来します。","look":"締めると「キュッキュッ」と絹鳴りがし、ゆるまない張りのある帯。"},"wana":{"name":"輪奈織（ワナ織）","region":"京都","era":"17世紀から","about":"「輪奈」は輪（ループ）のこと。表面に絹の小さな輪を立てる織り方で、日本でビロードをつくるのと同じ技法です。帯やコートにやわらかな立体感を与えます。","process":"経糸の下に細い針金を織り込んで輪を立て、あとで針金を抜きます。輪をそのまま残せば輪奈、切ればビロードになります。切った輪と切らない輪を組み合わせた柄もあります。","look":"小さな輪が浮き上がったビロード調の柄で、手触りはやわらか。"},"sagara":{"name":"相良刺繍","region":"中国伝来。京都をはじめ全国","era":"古くからの技法","about":"フレンチノットに似た、無数の小さな結び玉でつくる刺繍。粒状の立体的な質感が生まれ、とても丈夫なため、アクセントや輪郭に用いられます。","process":"糸を針に巻きつけて布に刺し、小さな結び玉をつくります。結び玉を一つずつ並べて、面を埋めたり線を描いたりします。","look":"小さな真珠のように、ぷっくりした粒がぎっしりと並びます。"},"kinkoma":{"name":"金駒刺繍","region":"京都・全国","era":"古くからの技法","about":"金糸は硬くて絹地を通せないため、布の表面に置いて留めつけます。輪郭や文様に、くっきりと輝く金の線が生まれます。","process":"小さな木製の糸巻き（駒）に巻いた金糸を、ふつう2本どりで図柄に沿わせ、細い絹糸で短い間隔ごとに留めていきます。","look":"布の上に乗った、なめらかで途切れのない金の線。"},"takeyamachi":{"name":"竹屋町刺繍","region":"京都・竹屋町","era":"江戸時代","about":"目の粗い絹の紗に施す刺繍で、発祥の地である京都の通りの名にちなみます。生地の目に沿って緻密に刺すため、刺繍というより織物のように見えます。","process":"紗の小さな目を一つずつ数えながら、主に平金糸（ときに色糸も）を通し、モザイクのように図柄を埋めていきます。","look":"透ける紗の上の、織物のようにきりっとした金の柄。帯、袱紗、掛軸の表装などに用いられます。"},"swatow":{"name":"スワトウ刺繍（汕頭刺繍）","region":"中国広東省汕頭（スワトウ）","era":"19世紀後半","about":"中国の刺繍技法とヨーロッパのレース技法を融合した、中国南部の繊細な透かし刺繍。スワトウ刺繍のきものは、上品で洗練された装いとして日本で長く愛されてきました。","process":"布から糸を抜き取ったり、小さな部分を切り抜いたりして、その穴をかがり、細かな刺繍で埋めてレースのような模様をつくります。すべて手作業です。","look":"小さな透かしのあるレースのような同系色の柄。白や淡いパステルカラーが多く見られます。"},"suzhou":{"name":"蘇州刺繍","region":"中国江蘇省蘇州","era":"2000年以上","about":"中国四大刺繍のひとつで、極めて精緻なことで有名。きものや帯では、生き生きとした動物や花の表現に用いられます。","process":"1本の絹糸を、多いときは数十本の髪の毛ほどの細さに分けます。一針ごとに色をなじませ、表裏どちらからも絵が見える作品もあります。","look":"猫の毛一本一本まで見えるような、写真のようなリアルさ。"},"ran":{"name":"乱針繍（乱繍）","region":"中国江蘇省常州発祥。きものや帯にも","era":"20世紀前半（1920〜30年代）に創始","about":"長さや向きの異なる針目を交差させ重ねていく、油絵の筆致のような刺繍。毛並みや羽根、光と影を自然に表現します。","process":"針目をきちんと並べるのではなく、方向を交差させながら自由に重ね、層ごとに色を混ぜて奥行きを出していきます。","look":"はっきりした針目の線ではなく、やわらかなグラデーションのある絵画的な表面。"},"hitta":{"name":"疋田絞り","region":"京都","era":"17世紀までに高度に発達","about":"最も贅を尽くした絞り。小さな四角い粒が斜めに並びます。全体を疋田で埋め尽くしたきものは「総疋田」と呼ばれ、贅沢の極みとされます。","process":"職人が布をごく小さくつまんで四つに折り、糸を数回巻きつけます。一粒ずつ手でくくるため、総絞りの振袖には1年以上かかることもあります。","look":"斜めの列にきちんと並んだ、均一で立体的な四角い粒。"},"kanoko":{"name":"鹿の子絞り","region":"京都・全国","era":"古くから","about":"中心に色の残った小さな白い粒が子鹿の斑点に似ていることから「鹿の子」と呼ばれます。最もよく知られた絞りで、帯揚げやきもの、小物に見られます。","process":"布の小さな点をつまみ、染める前に糸で固くくくります。染めてほどくと、それぞれの点がぷつぷつと盛り上がった輪の形の粒になります。","look":"中央に小さな色の「目」がある、小さな輪の粒。"},"boshi":{"name":"帽子絞り","region":"京都・有松","era":"江戸時代","about":"「帽子」をかぶせるように覆いをして、図柄の広い部分を染料から守る技法。大きな花や丸を白く残すことができます。","process":"輪郭を縫って引き締め、内側を帽子のように覆って糸で固く巻いてから染めます。覆いは昔は竹の皮、現在は主にビニールを使います。","look":"やわらかく、わずかに羽毛のようにかすれた縁をもつ、大きな白抜きの形。"},"nuishime":{"name":"縫い締め絞り","region":"京都・有松鳴海（名古屋）","era":"少なくとも室町時代から","about":"運針で縫って、正確な線や形を表す絞り。くくるだけの方法よりも、はるかに自由な形を表現できます。","process":"図柄を細かな並縫いで縫い、糸を引き締めて布にひだを寄せます。ひだの部分が防染され、点線状の輪郭が残ります。","look":"小さな破線の連なりでできた、はっきりとした輪郭。"},"arashi":{"name":"嵐絞り","region":"有松鳴海（名古屋）","era":"19世紀後半","about":"斜めの線が風に吹きつけられる雨のように見えることから「嵐」と名付けられました。日本最大の絞りの町・有松の代表的な絞りで、浴衣に人気です。","process":"長い棒に布を斜めに巻きつけ、糸で巻いて押し縮め、細かなひだを寄せます。外側の山の部分だけが染まります。","look":"斜めに降る雨のような細い斜線。"},"tatsumaki":{"name":"竜巻絞り","region":"有松鳴海（名古屋）・京都","era":"伝統技法","about":"「竜巻」の名のとおり、布に糸をらせん状に巻きつけることで、つむじ風に巻き込まれたような模様になります。","process":"布を（縫いやひだ寄せをしたうえで）芯に沿わせて丸い棒状にし、上から下へ糸をらせん状に巻きつけて染めます。表面に出ている部分だけが染まり、らせん状の縞が現れます。","look":"躍動感あふれる、渦を巻くらせん状の縞。"},"yanagi":{"name":"柳絞り","region":"有松鳴海（名古屋）","era":"江戸時代","about":"そよ風に揺れる柳の枝のような柄で、夏の浴衣に人気の絞りです。","process":"布を縦に細かくひだ寄せし、一定の間隔で糸でくくります。ひだの部分が防染され、細く途切れた縦線が残ります。","look":"垂れ下がる柳の枝のような、やさしい縦線。"},"oke":{"name":"桶絞り","region":"京都","era":"京都に伝わる伝統技法","about":"布の広い部分を木の桶に閉じ込めて染料から守る希少な技法で、一枚のきものに大きな色面を染め分けることができます。現在この技を受け継ぐ職人はごくわずかです。","process":"染めずに残す部分を檜の木桶に詰め、布を挟んだまま蓋を固く締めて縄で縛り、染める部分は桶の外に出します。桶ごと、より大きな染液の桶に浸けて染めます。これを色の数だけ繰り返します。","look":"大胆に染め分けられた大きな色面。境目はすっきりとしながらも、ややにじみがあります。"},"itajime":{"name":"板締め絞り","region":"有松・京都ほか","era":"8世紀から","about":"日本で最も古い防染技法のひとつで、その源流である夾纈（きょうけち／彫った板で挟んで染める技法）が8世紀の正倉院宝物に残っています。折りたたんだ布を板で挟み、繰り返し模様をつくります。","process":"布を三角形や四角形に折りたたみ、木の板で固く挟んで染液に浸けます。板で覆われた部分が白く残り、対称的な模様になります。","look":"「雪花」と呼ばれる雪の結晶のような文様など、繰り返される幾何学形。"},"tsukami":{"name":"つかみ絞り","region":"各地の絞り産地","era":"伝統技法","about":"布を手でつかんで束ね、くくる絞り。一枚ごとに柄が異なり、自由で自然な表情が生まれます。","process":"職人が布をつかんで不規則にねじって束ね、糸でくくってから染めます。ランダムなひだが予想できない柄を生み出します。","look":"繰り返しのない、雲のような、あるいは大理石のような不規則な柄。"},"kumihimo":{"name":"組紐","region":"京都・伊賀（三重）","era":"7〜8世紀から","about":"絹糸を組み上げた紐で、はじめは仏具や貴族の装束に、のちに武士の鎧や刀の下げ緒にも使われました。現在は、帯の中央に締める帯締めとして最もよく知られています。","process":"何十本もの絹糸を重りのついた玉に巻き、丸台などの木の台の上で互いに交差させて組みます。台や組み方の違いで、丸組・角組・平組の紐ができます。","look":"細かな斜めの柄と豊かな配色をもつ、しっかりと均一な組み目。"},"zogan":{"name":"象嵌","region":"京都・熊本（肥後）","era":"江戸時代に刀装具や鉄砲の装飾で発展","about":"鉄に金や銀をはめ込む技法。かつては刀装具の装飾に用いられ、現在は帯留めや髪飾りなどのきもの小物を彩ります。","process":"鉄の表面に細かな布目状の溝を刻み、金銀の箔や線を打ち込みます。その後、鉄にわざと錆を出し、漆や油を焼き付けて深い黒に仕上げます。","look":"深い黒地に輝く金銀の意匠。"},"makie":{"name":"蒔絵","region":"京都・輪島・金沢ほか","era":"8〜9世紀から","about":"漆で文様を描き、金粉や銀粉を蒔きつける漆芸。きものの世界では、櫛・簪・帯留め・下駄などに見られます。","process":"漆で図柄を描き、乾かないうちに竹筒から細かな金粉や銀粉を蒔きます。その後、塗りと研ぎを何度も重ねて仕上げます。","look":"黒や朱の漆の上に、深い艶をたたえた繊細な金の絵。"},"mizuhiki":{"name":"水引","region":"飯田（長野）・金沢（石川）","era":"起源は7世紀にさかのぼるとされる","about":"和紙をよった紐で、幸運への願いを込めた結びに仕立てる装飾。祝儀袋を飾るほか、きもののコーディネートでは花嫁の髪飾りや帯飾りに使われます。","process":"和紙を細くよって紐にし、糊で固めてから、染めたり色や金属のフィルムを巻いたりします。この紐をあわじ結びなどに結んだり、鶴や松、梅の形に仕立てたりします。","look":"光沢のある張りのある紐を左右対称に結んだもの。紅白や金銀が多く見られます。"},"ro":{"name":"絽","region":"京都ほか各地の絹織物産地","era":"15世紀には名称が見られ、江戸時代に普及","about":"細かなすき間が規則正しく並び、風を通す夏の絹織物です。初夏から晩夏まで、盛夏も含めて礼装からふだん着まで夏のきものの代表的な生地です。","process":"平織りを数段織ったあと、1段だけ経糸（たていと）を2本ずつ絡ませてすき間をつくります。すき間とすき間の間に入る平織りの段数によって「三本絽」「五本絽」などと呼ばれます。","look":"平織りの地に、細かなすき間の筋が横（ときに縦）に並んでいます。"},"sha":{"name":"紗","region":"京都ほか各地の絹織物産地","era":"7〜8世紀に中国から伝来","about":"盛夏に着る、軽く透けるような絹織物です。絽よりも軽く透け感が強く、夏の羽織やコートにも使われます。","process":"すべての段で経糸を2本ずつ絡ませ、緯糸（よこいと）で留めて織ります。そのため布全体に均一な目が現れます。","look":"筋のない均一な透けた織り目で、下に重ねたものがやわらかく透けて見えます。"},"ra":{"name":"羅","region":"京都","era":"古代（7〜8世紀）、20世紀に復元","about":"からみ織りの中でも古い歴史をもつ最も複雑な織物で、正倉院にも伝わります。中世以降衰退していましたが、近代の名匠によって復元されました。現在は主に高級な夏帯に用いられます。","process":"経糸が決まった相手だけでなく、左右の複数の経糸と絡み合い、網のような組織をつくります。専用の機で、手作業でゆっくりと織り上げます。","look":"伸縮性のある網目状の織物で、菱形のすき間が並び、網目の中に文様が浮かぶこともあります。"},"kobai":{"name":"紅梅織","region":"全国の綿・絹織物産地","era":"伝統的な夏の生地","about":"格子状の凹凸がある夏の生地で、綿の「綿紅梅」と、絹に綿を織り込んだ「絹紅梅」があります。上質な浴衣や夏の普段着として好まれます。","process":"薄く軽い地に、太い糸を縦横に一定の間隔で織り込みます。この太糸が格子状の畝（うね）をつくります。","look":"軽い生地に格子状の凸凹があり、肌に張りつかずさらりとした着心地です。"},"rokechi":{"name":"蠟纈染め","region":"京都ほか全国","era":"8世紀、20世紀に復興","about":"奈良時代の「天平の三纈」と呼ばれる防染技法のひとつで、正倉院にも作品が伝わります。平安時代に廃れましたが、20世紀に染色作家たちによって復興され、絵を描くような自由な染めとして親しまれています。","process":"溶かした蠟を筆や型で生地にのせ、色を入れたくない部分を防染してから染めます。その後、熱や湯で蠟を取り除きます。蠟にひびが入った部分には染料がしみ込み、細い線が残ります。","look":"大胆な模様の中に、ひび割れのような細い線（亀裂）が走っています。"},"mokuhan":{"name":"木版染め","region":"京都ほか","era":"古くからの技法","about":"木の版に彫った文様を布に押して染める技法です。一つひとつ職人の手で押すため、わずかなかすれや揺らぎが生まれ、温かみのある手仕事の風合いになります。現在、手がける工房はわずかです。","process":"堅い木の版に文様を彫ります。版に染料や糊を付け、張った生地に一押しずつしっかりと押していきます。色ごとに別の版を使います。","look":"繰り返される文様に、ややむらのあるやわらかな色と、かすかな木目の風合いが見られます。"},"chusen":{"name":"注染","region":"大阪（堺）、静岡（浜松）、東京","era":"19世紀後半（明治時代）","about":"木綿の浴衣や手ぬぐいを染める日本独自の技法です。染料が生地の奥まで通るため表裏が同じ色に染まり、やわらかく爽やかな色合いになります。","process":"生地を屏風のように何層にも折り重ね、一層ごとに型紙で防染糊を置きます。糊で土手をつくって区切り、上から薬缶（やかん）で染料を注ぎ、下から吸引して全層を一度に染めます。","look":"にじみのあるやわらかな色と自然なぼかしがあり、裏側にも同じ柄がはっきり出ています。"},"bingata":{"name":"紅型","region":"沖縄","era":"琉球王国時代（15世紀ごろから）","about":"沖縄の色鮮やかな染めで、かつては琉球王国の王族や士族が身にまといました。鮮やかな色彩と、日本と南国の両方に由来する文様が、明るく南国らしい魅力を生み出します。","process":"型紙に文様を彫り、型紙を通して糊を置きます。顔料や植物染料を筆で色差しし、さらに濃い色を縁にすり込む「隈取り」で立体感を出します。藍だけで染めたものは「藍型（えーがた）」と呼ばれます。","look":"黄・赤・青などの鮮やかな色と隈取りのぼかし、花・鳥・波・雲などの文様が特徴です。"},"aizome":{"name":"藍染","region":"徳島（阿波）ほか全国","era":"古代、江戸時代に広く普及","about":"藍は日本で最も身近な染料で、野良着からきものまで幅広く使われました。明治時代に来日した外国人がその美しさに驚き、「ジャパン・ブルー」と呼ばれるようになりました。","process":"藍の葉を発酵させて蒅（すくも）をつくり、甕の中で木灰の灰汁・ふすま・石灰とともに発酵させて染め液を建てます。布を浸しては引き上げることを繰り返すと、緑色に上がった布が空気に触れて青に変わります。回数を重ねるほど色が深くなります。","look":"淡い水色から黒に近い紺まで深みのある青で、着るほどに味わいのある色になります。"},"lace":{"name":"レース","region":"ヨーロッパで発展、日本ほか世界各地で生産","era":"ヨーロッパでは16世紀から、きものには明治・大正時代から","about":"糸だけで透かし模様をつくる布です。現代のきものファッションでは、レースのきもの・羽織・帯が人気で、色のあるきものに重ねて下の色を透かして楽しみます。","process":"きもの用のレースの多くは刺繍機でつくられます。細かな網地に刺繍する「チュールレース」や、土台の布に刺繍してから土台を溶かし、糸だけを残す「ケミカルレース」があります。","look":"花や幾何学の透かし模様で、すき間から下の色が透けて見えます。"},"tsuzure":{"name":"綴れ織","region":"京都（西陣）","era":"8世紀の作例が伝わる（中国からの舶載品とみられる）。国内での製織は江戸時代中期（18世紀）の西陣から","about":"日本のタペストリー織で、ヨーロッパのゴブラン織と同じ系統の技法です。帯の最高格とされ、最上のものは織り手が自分の爪を使って手で織り上げます。","process":"色ごとの緯糸（よこいと）を、図柄のその色の部分だけで往復させて織り、経糸（たていと）を完全に覆います。織り手は爪をのこぎりの歯のように刻み、その爪で緯糸を一本ずつ掻き寄せます（爪掻き本綴れ）。1日に織れるのはわずか数センチです。","look":"張りのある平らな生地で表裏に同じ図柄が現れ、色の境目に「把釣孔（はつりこう）」と呼ばれる小さなすき間があります。"},"benibana":{"name":"紅花染め","region":"山形（最上地方）、京都","era":"6〜7世紀ごろシルクロードを経て伝来","about":"紅花の花びらから得る天然の赤い染料で、平安時代の宮廷で愛されました。江戸時代には「紅一匁、金一匁」といわれるほど貴重でした。きものの裏地に使う赤い絹「紅絹（もみ）」にも用いられてきました。","process":"花びらを水で洗って黄色の色素を流し、発酵させて「紅餅（べにもち）」にします。灰汁で赤の色素を取り出し、烏梅（うばい）の酢で絹に定着させます。染め重ねるほど色が深まります。","look":"澄んだ輝きのある淡いピンクから深い紅色。繊細な色で、強い光に当たると退色します。"}}}};
DATA.hi={"ui": {"tagline": "किमोनो के पीछे की कारीगरी — जापान की 50 पारंपरिक तकनीकें", "all": "सभी", "search": "तकनीक खोजें…", "region": "कहाँ", "era": "कब से", "about": "यह क्या है", "process": "यह कैसे बनता है", "look": "इसे कैसे पहचानें", "listen": "जापानी नाम सुनें", "close": "बंद करें", "language": "भाषा", "count": "{n} तकनीकें", "noResults": "आपकी खोज से कोई तकनीक मेल नहीं खाती।", "prev": "पिछला", "next": "अगला", "intro": "किमोनो कई चरणों में बनता है, और हर चरण के अपने उस्ताद होते हैं। कोई श्रेणी चुनें या किसी भी तकनीक पर टैप करके और जानें।"}, "cats": {"dye": {"name": "रंगाई", "desc": "तैयार सफ़ेद रेशम पर डिज़ाइन हाथ से रंगे जाते हैं, स्टेंसिल से बनाए जाते हैं या छापे जाते हैं। रंगे हुए किमोनो प्रायः अधिक औपचारिक होते हैं और समारोहों व उत्सवों में पहने जाते हैं।"}, "weave": {"name": "बुनाई", "desc": "धागों को पहले रंगा जाता है और कपड़ा बुनते समय डिज़ाइन उभरता है। सुत्सुमुगी जैसे बुने किमोनो रोज़मर्रा के स्टाइलिश परिधान के रूप में सराहे जाते हैं, जबकि बुना हुआ ओबी सबसे औपचारिक भी हो सकता है।"}, "embroidery": {"name": "कढ़ाई", "desc": "बनावट, चमक और गहराई जोड़ने के लिए रेशमी और धात्विक धागों से कपड़े पर हाथ से कढ़ाई की जाती है। औपचारिक किमोनो में कढ़ाई अक्सर रंगाई के साथ मिलाई जाती है।"}, "shibori": {"name": "शिबोरी (बाँधनी रंगाई)", "desc": "कपड़े के कुछ हिस्सों को बाँधा, सिला, मोड़ा या दबाया जाता है ताकि रंग वहाँ न पहुँचे। धागे खोलने पर डिज़ाइन कोमल, त्रिआयामी बनावट के साथ उभरता है।"}, "other": {"name": "सहायक शिल्प", "desc": "किमोनो को डोरियों, आभूषणों और सजावटों से पूरा किया जाता है, जो अन्य परंपराओं के शिल्पकार बनाते हैं: चोटी-डोरी बुनने वाले, धातुकार, लाख कलाकार और कागज़ की डोरी बनाने वाले।"}}, "items": {}};
DATA.tl={"ui": {"tagline": "Ang sining sa likod ng kimono — 50 tradisyonal na teknik ng Japan", "all": "Lahat", "search": "Maghanap ng teknik…", "region": "Saan", "era": "Mula noong", "about": "Ano ito", "process": "Paano ito ginagawa", "look": "Paano ito makikilala", "listen": "Pakinggan ang pangalang Hapones", "close": "Isara", "language": "Wika", "count": "{n} teknik", "noResults": "Walang teknik na tumutugma sa iyong hinahanap.", "prev": "Nakaraan", "next": "Susunod", "intro": "Maraming yugto ang paggawa ng kimono, at may kanya-kanyang maestro ang bawat yugto. Pumili ng kategorya o i-tap ang anumang teknik para matuto pa."}, "cats": {"dye": {"name": "Pagtitina", "desc": "Ipinipinta, ini-stencil o ini-print ang mga disenyo sa tapos nang puting seda. Karaniwang mas pormal ang mga kimonong tinina at isinusuot sa mga seremonya at pagdiriwang."}, "weave": {"name": "Paghahabi", "desc": "Tinitina muna ang mga sinulid at lumilitaw ang disenyo habang hinahabi ang tela. Ang mga habing kimono tulad ng tsumugi ay pinahahalagahan bilang naka-istilong pang-araw-araw, habang ang habing obi ay maaaring pinakapormal sa lahat."}, "embroidery": {"name": "Burda", "desc": "Tinatahi nang kamay ang sutlang sinulid at metalikong sinulid sa tela upang magdagdag ng tekstura, kislap at lalim. Madalas na pinagsasama ang burda at pagtitina sa mga pormal na kimono."}, "shibori": {"name": "Shibori (tie-dye)", "desc": "Itinatali, tinatahi, tinutupi o ini-clamp ang ilang bahagi ng tela para hindi maabot ng tina. Kapag tinanggal ang mga sinulid, lilitaw ang disenyo na may malambot at tatlong-dimensyong tekstura."}, "other": {"name": "Mga pantulong na sining", "desc": "Kinukumpleto ang kimono ng mga lubid, palamuti at dekorasyong gawa ng mga manggagawa mula sa ibang tradisyon: mga manlalala, panday-metal, artistang lacquer at gumagawa ng lubid na papel."}}, "items": {}};
DATA.ms={"ui": {"tagline": "Seni di sebalik kimono — 50 teknik tradisional Jepun", "all": "Semua", "search": "Cari teknik…", "region": "Di mana", "era": "Sejak", "about": "Apakah ini", "process": "Cara ia dibuat", "look": "Cara mengenalinya", "listen": "Dengar nama Jepun", "close": "Tutup", "language": "Bahasa", "count": "{n} teknik", "noResults": "Tiada teknik sepadan dengan carian anda.", "prev": "Sebelumnya", "next": "Seterusnya", "intro": "Kimono dihasilkan melalui banyak peringkat, dan setiap peringkat ada tukang mahirnya sendiri. Pilih kategori atau ketik mana-mana teknik untuk ketahui lebih lanjut."}, "cats": {"dye": {"name": "Pencelupan", "desc": "Corak dilukis, distensil atau dicetak pada sutera putih yang sudah siap. Kimono celup biasanya lebih formal dan dipakai pada upacara serta perayaan."}, "weave": {"name": "Tenunan", "desc": "Benang dicelup dahulu dan corak muncul semasa kain ditenun. Kimono tenun seperti tsumugi dihargai sebagai pakaian harian yang bergaya, manakala obi tenun boleh menjadi yang paling formal."}, "embroidery": {"name": "Sulaman", "desc": "Benang sutera dan benang logam dijahit pada kain dengan tangan untuk menambah tekstur, kilauan dan kedalaman. Sulaman sering digabungkan dengan pencelupan pada kimono formal."}, "shibori": {"name": "Shibori (ikat celup)", "desc": "Bahagian kain diikat, dijahit, dilipat atau diapit supaya pewarna tidak sampai ke situ. Apabila benang dibuka, corak muncul dengan tekstur lembut tiga dimensi."}, "other": {"name": "Kraf aksesori", "desc": "Kimono dilengkapkan dengan tali, perhiasan dan hiasan yang dibuat oleh tukang daripada tradisi lain: penganyam tali, tukang logam, artis lakuer dan pembuat tali kertas."}}, "items": {}};
DATA.ta={"ui": {"tagline": "கிமோனோவின் பின்னால் உள்ள கைவினை — ஜப்பானின் 50 பாரம்பரிய நுட்பங்கள்", "all": "அனைத்தும்", "search": "நுட்பங்களைத் தேடுங்கள்…", "region": "எங்கே", "era": "எப்போதிலிருந்து", "about": "இது என்ன", "process": "இது எப்படி உருவாகிறது", "look": "எப்படி அடையாளம் காண்பது", "listen": "ஜப்பானியப் பெயரைக் கேளுங்கள்", "close": "மூடு", "language": "மொழி", "count": "{n} நுட்பங்கள்", "noResults": "உங்கள் தேடலுக்குப் பொருந்தும் நுட்பம் இல்லை.", "prev": "முந்தையது", "next": "அடுத்தது", "intro": "கிமோனோ பல கட்டங்களில் உருவாகிறது, ஒவ்வொரு கட்டத்திற்கும் தனி நிபுணர்கள் உள்ளனர். ஒரு வகையைத் தேர்ந்தெடுங்கள் அல்லது ஏதேனும் நுட்பத்தைத் தொட்டு மேலும் அறியுங்கள்."}, "cats": {"dye": {"name": "சாயமிடல்", "desc": "தயாரான வெள்ளைப் பட்டில் வடிவங்கள் தூரிகையால் வரையப்படும், ஸ்டென்சில் மூலம் இடப்படும் அல்லது அச்சிடப்படும். சாயமிட்ட கிமோனோக்கள் பொதுவாக முறைசார்ந்தவை; விழாக்களிலும் கொண்டாட்டங்களிலும் அணியப்படுகின்றன."}, "weave": {"name": "நெசவு", "desc": "நூல்கள் முதலில் சாயமிடப்பட்டு, துணி நெய்யப்படும்போது வடிவம் தோன்றும். சுட்சுமுகி போன்ற நெய்த கிமோனோக்கள் நாகரிகமான அன்றாட உடையாகப் போற்றப்படுகின்றன; நெய்த ஓபி எல்லாவற்றிலும் முறைசார்ந்ததாகவும் இருக்கலாம்."}, "embroidery": {"name": "எம்பிராய்டரி", "desc": "அமைப்பு, பளபளப்பு, ஆழம் சேர்க்க பட்டு மற்றும் உலோக நூல்கள் துணியில் கையால் தைக்கப்படுகின்றன. முறைசார் கிமோனோக்களில் எம்பிராய்டரி பெரும்பாலும் சாயமிடலுடன் இணைக்கப்படும்."}, "shibori": {"name": "ஷிபோரி (கட்டுச்சாயம்)", "desc": "துணியின் சில பகுதிகள் கட்டப்படும், தைக்கப்படும், மடிக்கப்படும் அல்லது இறுக்கப்படும்; அங்கு சாயம் செல்லாது. நூல்களை அவிழ்த்ததும் மென்மையான முப்பரிமாண அமைப்புடன் வடிவம் தோன்றும்."}, "other": {"name": "துணைக் கைவினைகள்", "desc": "பின்னல் கயிறு செய்பவர்கள், உலோகக் கலைஞர்கள், அரக்குக் கலைஞர்கள், காகிதக் கயிறு செய்பவர்கள் போன்ற பிற மரபுகளின் கைவினைஞர்கள் செய்யும் கயிறுகள், அணிகலன்கள், அலங்காரங்களால் கிமோனோ நிறைவடைகிறது."}}, "items": {}};

    case"tsuji":fill(c[1]);for(let i=0;i<7;i++){const x=R()*W,y=R()*H,r=14+R()*20;const gr=g.createRadialGradient(x,y,r*.3,x,y,r);gr.addColorStop(0,i%2?c[0]:c[2]);gr.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill()}g.strokeStyle=c[3];g.lineWidth=.7;for(let i=0;i<10;i++){const x=R()*W,y=R()*H;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+10,y-12,x+22,y-4);g.stroke()}break;

function renderTabs(){
  const t=$("tabs");t.innerHTML="";
  const mk=(key,label,jp,n)=>{const b=document.createElement("button");b.className="tab";b.setAttribute("role","tab");b.setAttribute("aria-selected",cat===key);b.innerHTML="<span></span>"+(jp?'<span class="jp" lang="ja"></span>':"");b.firstChild.textContent=label+" ("+n+")";if(jp)b.lastChild.textContent=jp;b.onclick=()=>{cat=key;render()};t.appendChild(b)};
  mk("all",T().ui.all,"",ITEMS.length);
  for(const [k,kanji,jp] of CATS)mk(k,T().cats[k].name,jp,ITEMS.filter(i=>i[1]===k).length);
}
function matches(it){
  if(!q)return true;const s=q.toLowerCase(),t=tr(it[0]);
  return [it[2],it[3],it[4],t.name,t.region,t.about].join(" ").toLowerCase().includes(s)||it[4].normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().includes(s);
}
function card(it){
  const t=tr(it[0]);const b=document.createElement("button");b.className="card";b.type="button";
  b.innerHTML='<canvas aria-hidden="true"></canvas><div class="body"><span class="kanji" lang="ja"></span><span class="romaji"></span><span class="tr"></span></div>';
  b.querySelector(".kanji").textContent=it[2];b.querySelector(".romaji").textContent=it[4];b.querySelector(".tr").textContent=t.name;
  b.onclick=()=>openSheet(it[0]);
  return b;
}
function render(){
  document.documentElement.lang=HTML_LANG[lang];document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  const u=T().ui;
  $("tagline").textContent=u.tagline;$("search").placeholder=u.search;$("search").setAttribute("aria-label",u.search);
  renderLangs();renderTabs();
  const cd=$("catdesc");cd.innerHTML="";
  if(cat==="all"){cd.innerHTML='<p class="catdesc" style="display:block;color:var(--muted)"></p>';cd.firstChild.textContent=u.intro}
  else{const c=CATS.find(x=>x[0]===cat);cd.innerHTML='<div class="catdesc"><span class="k" lang="ja"></span><h2></h2><p></p></div>';cd.querySelector(".k").textContent=c[1];cd.querySelector("h2").textContent=T().cats[cat].name;cd.querySelector("p").textContent=T().cats[cat].desc}
  const list=$("list");list.innerHTML="";let n=0;const toPaint=[];
  for(const [k,kanji,jp] of CATS){
    if(cat!=="all"&&cat!==k)continue;
    const items=ITEMS.filter(i=>i[1]===k&&matches(i));if(!items.length)continue;n+=items.length;
    if(cat==="all"){const h=document.createElement("h2");h.className="section-h";h.innerHTML='<span class="jp" lang="ja"></span><span></span>';h.firstChild.textContent=jp;h.lastChild.textContent=T().cats[k].name;list.appendChild(h)}
    const g=document.createElement("div");g.className="grid";
    for(const it of items){const c=card(it);g.appendChild(c);toPaint.push([c.querySelector("canvas"),it])}
    list.appendChild(g);
  }
  if(!n){list.innerHTML='<p class="empty"></p>';list.firstChild.textContent=u.noResults}
  $("count").textContent=u.count.replace("{n}",n);
  for(const [cv,it] of toPaint)paint(cv,it[5],it[6],it[0]);
  if(openId)fillSheet(openId);
}
function visibleIds(){return ITEMS.filter(i=>(cat==="all"||i[1]===cat)&&matches(i)).map(i=>i[0])}
function fillSheet(id){
  const it=ITEMS.find(i=>i[0]===id),t=tr(id),u=T().ui;
  $("sCat").textContent=T().cats[it[1]].name;$("sKanji").textContent=it[2];$("sKana").textContent=it[3];$("sRomaji").textContent=it[4];$("sTr").textContent=t.name;
  $("lRegion").textContent=u.region;$("lEra").textContent=u.era;$("lAbout").textContent=u.about;$("lProcess").textContent=u.process;$("lLook").textContent=u.look;
  $("sRegion").textContent=t.region;$("sEra").textContent=t.era;$("sAbout").textContent=t.about;$("sProcess").textContent=t.process;$("sLook").textContent=t.look;
  $("sListenT").textContent=u.listen;$("sClose").setAttribute("aria-label",u.close);
  const ids=visibleIds(),ix=ids.indexOf(id);
  const pv=ITEMS.find(i=>i[0]===ids[(ix-1+ids.length)%ids.length]),nx=ITEMS.find(i=>i[0]===ids[(ix+1)%ids.length]);
  const rtl=lang==="ar";$("sPrev").textContent=(rtl?"→ ":"← ")+u.prev+(pv?"  "+pv[2]:"");$("sNext").textContent=u.next+(nx?"  "+nx[2]:"")+(rtl?" ←":" →");
  $("sPrev").onclick=()=>pv&&openSheet(pv[0]);$("sNext").onclick=()=>nx&&openSheet(nx[0]);
  $("sListen").hidden=!("speechSynthesis" in window);
  requestAnimationFrame(()=>paint($("sCanvas"),it[5],it[6],it[0]+"x"));
}
let lastFocus=null;
function openSheet(id){if(!openId)lastFocus=document.activeElement;openId=id;$("sheetBg").hidden=false;document.body.style.overflow="hidden";fillSheet(id);$("sheetBg").scrollTop=0;$("sClose").focus()}
function closeSheet(){openId=null;$("sheetBg").hidden=true;document.body.style.overflow="";try{speechSynthesis.cancel()}catch(e){}if(lastFocus)lastFocus.focus()}
$("sClose").onclick=closeSheet;
$("sheetBg").addEventListener("click",e=>{if(e.target===$("sheetBg"))closeSheet()});
document.addEventListener("keydown",e=>{if(!openId)return;if(e.key==="Escape")closeSheet();const r=document.documentElement.dir==="rtl";if(e.key==="ArrowRight")$(r?"sPrev":"sNext").click();if(e.key==="ArrowLeft")$(r?"sNext":"sPrev").click()});
$("sListen").onclick=()=>{try{const it=ITEMS.find(i=>i[0]===openId);speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(it[3]);u.lang="ja-JP";u.rate=.85;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith("ja"));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}};
$("search").addEventListener("input",e=>{q=e.target.value.trim();render()});
let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(render,200)});
render();
</script>

</body>
</html>
