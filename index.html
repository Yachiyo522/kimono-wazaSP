<style>
/* Layout: a fabric-swatch book — header with language chips, category tabs, a grid of swatch cards, and a full detail sheet */
:root{
  --paper:#F2F3F5; --surface:#FFFFFF; --ink:#1B2A44; --muted:#5B6578; --line:#D9DDE5;
  --enji:#9C2B3C; --gold:#A8842F; --ai:#24406B; --chip:#E6E9EF; --on-enji:#FFFFFF;
  --shadow:0 1px 2px rgba(27,42,68,.08),0 8px 24px rgba(27,42,68,.06);
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-latin:"Cormorant Garamond","Shippori Mincho",Georgia,serif;
  --f-body:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans","Noto Sans JP","Noto Sans SC","Noto Sans TC","Noto Sans KR","Noto Sans Thai","Leelawadee UI","Malgun Gothic","Noto Sans Devanagari","Kohinoor Devanagari","Nirmala UI","Noto Sans Tamil","Tamil Sangam MN","Noto Sans Arabic","Geeza Pro","Segoe UI Arabic",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1420; --surface:#171E2D; --ink:#E6E9F0; --muted:#A3ABBB; --line:#2A3347;
  --enji:#E48594; --gold:#D8B566; --ai:#9DB6E0; --chip:#222B3D; --on-enji:#1A0E13; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1420; --surface:#171E2D; --ink:#E6E9F0; --muted:#A3ABBB; --line:#2A3347;
  --enji:#E48594; --gold:#D8B566; --ai:#9DB6E0; --chip:#222B3D; --on-enji:#1A0E13; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--enji);outline-offset:2px}

header{display:grid;gap:18px;padding-block:28px 8px}
.brand{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.mark{flex:none;display:grid;place-items:center;width:64px;height:64px;font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;color:var(--on-enji);background:var(--enji);border-radius:8px}
.brand-text{min-width:0;display:grid;gap:4px}
.brand h1{margin:0;font-family:var(--f-latin);font-weight:600;font-size:clamp(34px,5vw,48px);line-height:1;letter-spacing:.02em}
.brand p{margin:0;color:var(--muted);font-size:15px;text-wrap:balance}

.langs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.langs .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.lang{display:inline-flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 12px 4px;font-size:14px;line-height:1.3;cursor:pointer}
.lang .lj{font-family:var(--f-display);font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.lang[aria-pressed="true"] .lj{color:var(--paper);opacity:.85}
.lang[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:grid;gap:10px;padding-block:14px 12px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:none;background:var(--chip);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:15px;display:flex;gap:8px;align-items:baseline}
.tab .jp{font-family:var(--f-display);font-size:13px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--enji);color:var(--on-enji)}
.tab[aria-selected="true"] .jp{color:var(--on-enji);opacity:.8}
.row2{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font-size:15px;color:var(--ink)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.catdesc{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:start;margin:0 0 22px;max-width:820px}
.catdesc .k{font-family:var(--f-display);font-size:40px;line-height:1;color:var(--gold);grid-row:span 2}
.catdesc h2{margin:0;font-size:20px;font-weight:600}
.catdesc p{margin:0;color:var(--muted);text-wrap:pretty}

.section-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.section-h .jp{font-family:var(--f-display);font-size:18px;color:var(--ink);letter-spacing:.1em;text-transform:none}
.section-h::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{display:grid;grid-template-rows:auto 1fr;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;overflow:hidden;padding:0;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card canvas{display:block;width:100%;height:96px}
.card .body{padding:12px 14px 14px;display:grid;gap:2px;min-width:0}
.card .kanji{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.25}
.card .romaji{font-family:var(--f-latin);font-style:italic;font-size:16px;color:var(--enji)}
.card .tr{font-size:13.5px;color:var(--muted);line-height:1.4}
.empty{color:var(--muted);padding:40px 0;text-align:center}

/* detail sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,24,.55);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px 32px}
.sheet{background:var(--surface);border-radius:14px;width:100%;max-width:760px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet canvas{display:block;width:100%;height:160px}
.sheet .in{padding:22px 24px 26px;display:grid;gap:18px}
.s-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.s-name{display:grid;gap:2px;min-width:0}
.s-cat{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:600}
.s-kanji{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,7vw,46px);line-height:1.15;margin:0}
.s-kana{font-family:var(--f-display);color:var(--muted);font-size:15px}
.s-romaji{font-family:var(--f-latin);font-style:italic;color:var(--enji);font-size:22px}
.s-tr{font-size:17px;font-weight:600}
.iconbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;cursor:pointer;display:grid;place-items:center;font-size:20px;line-height:1}
.listen{justify-self:start;display:inline-flex;gap:8px;align-items:center;border:1px solid var(--enji);color:var(--enji);background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 20px;border-block:1px solid var(--line);padding-block:12px}
.meta div{display:grid;gap:2px;min-width:0}
.meta dt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meta dd{margin:0;font-size:15px}
.para{display:grid;gap:4px}
.para h3{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ai)}
.para p{margin:0;font-size:16.5px;line-height:1.7;max-width:65ch}
.para.look{background:var(--chip);border-radius:10px;padding:12px 16px}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.nav button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px}
@media (max-width:480px){.mark{width:52px;height:52px;font-size:32px}.sheet .in{padding:18px 18px 22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card .kanji{font-size:20px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>

<script>
const DATA = {"en":{"ui":{"tagline":"The craft behind the kimono — 50 traditional techniques of Japan","all":"All","search":"Search techniques…","region":"Where","era":"Since","about":"What it is","process":"How it is made","look":"How to spot it","listen":"Hear the Japanese name","close":"Close","language":"Language","count":"{n} techniques","noResults":"No techniques match your search.","prev":"Previous","next":"Next","intro":"A kimono is made in many stages, and each stage has its own masters. Choose a category or tap any technique to learn more."},"cats":{"dye":{"name":"Dyeing","desc":"Patterns are painted, stenciled or printed onto finished white silk. Dyed kimono are generally the more formal kind, worn for ceremonies and celebrations."},"weave":{"name":"Weaving","desc":"The threads are dyed first and the pattern appears as the cloth is woven. Woven kimono such as tsumugi are prized as stylish everyday wear, while woven obi can be the most formal of all."},"embroidery":{"name":"Embroidery","desc":"Silk and metallic threads are stitched onto the fabric by hand to add texture, light and depth. Embroidery is often combined with dyeing on formal kimono."},"shibori":{"name":"Shibori (tie-dye)","desc":"Parts of the cloth are bound, stitched, folded or clamped so the dye cannot reach them. When the threads are removed, the pattern appears with a soft, three-dimensional texture."},"other":{"name":"Accessory crafts","desc":"The kimono is completed with cords, ornaments and decorations made by craftspeople from other traditions: braiders, metalworkers, lacquer artists and paper-cord makers."}},"items":{"kaga-yuzen":{"name":"Kaga Yuzen hand-painted silk","region":"Kanazawa, Ishikawa","era":"Early 18th century","about":"A hand-painted dyeing style from the former Kaga domain. It is known for realistic flowers and plants drawn in the 'five Kaga colors': indigo, crimson, ochre, grass green and royal purple.","process":"The design is outlined with a thin line of rice paste that keeps colors from bleeding. Each area is then painted by brush, with shading that runs from the outer edge toward the center. One artist usually oversees the whole piece.","look":"Natural, painterly motifs, sometimes with 'worm-eaten' leaves (mushikui) drawn in. Little or no gold or embroidery."},"kyo-yuzen":{"name":"Kyoto Yuzen hand-painted silk","region":"Kyoto","era":"Late 17th century","about":"The original yuzen style, named after Miyazaki Yuzensai, a fan painter in Kyoto. It brought painting-like freedom of design to kimono and became the classic style for formal wear.","process":"The work is divided into around twenty steps, each handled by a specialist: designing, drawing the outline, applying rice-paste resist, brushing on color, steaming, rinsing, and finally adding gold leaf and embroidery.","look":"Elegant, courtly motifs in rich colors, shaded from the center outward, often finished with gold and embroidery."},"edo-komon":{"name":"Edo fine-pattern stencil dyeing","region":"Tokyo","era":"17th century (Edo period)","about":"Tiny repeated patterns dyed in a single color, so fine that from a distance the cloth looks plain. It began with the ceremonial wear of samurai, and each feudal lord had his own reserved pattern.","process":"Patterns are carved into stencils made of layered washi paper hardened with persimmon juice. A craftsman lays the stencil on the silk, spreads rice paste through it, moves it with perfect alignment, then dyes the whole cloth.","look":"Up close: thousands of tiny dots, waves or lines. From a few steps away: a quiet solid color."},"tsujigahana":{"name":"Tsujigahana stitched-resist dyeing","region":"Kyoto and other areas","era":"15th – early 17th century","about":"A luxurious style of the Muromachi and Momoyama periods that combined stitched tie-dye with ink painting, gold leaf and embroidery. It disappeared in the early 1600s and was later called 'the phantom dye'.","process":"Motif outlines are stitched and drawn tight so dye cannot enter, and the cloth is dyed in several stages. Fine details such as leaf veins are then painted in with ink. Modern artists revived the look in the 20th century.","look":"Soft, slightly blurred shapes with crinkled edges, combined with delicate ink drawing."},"sarasa":{"name":"Sarasa (exotic printed patterns)","region":"Originally India; made in Nagasaki, Sakai, Kyoto and Edo","era":"16th–17th century","about":"Colorful patterned cotton from India and Southeast Asia that arrived through foreign trade. Its exotic flowers, birds and geometric motifs were treasured, and Japanese craftsmen soon made their own versions.","process":"In India, patterns were drawn or block-printed with mordants and wax. Japanese 'wa-sarasa' was usually made with many paper stencils, one for each color, applied in turn.","look":"Dense, foreign-looking floral and paisley-like patterns in earthy reds, indigo and browns."},"kinsai":{"name":"Gold-leaf decoration","region":"Kyoto","era":"Ancient; flourished in the 16th century","about":"The art of decorating finished kimono with real gold and silver. It is usually the final touch on yuzen-dyed formal kimono, adding light to flowers, clouds and outlines.","process":"Adhesive is applied through a stencil or drawn with a fine cone, and gold leaf is pressed on and brushed away where it should not stay. Gold can also be sprinkled as tiny flakes or drawn as lines of gold paste.","look":"Shining gold or silver details on top of a dyed design that catch the light as the wearer moves."},"oshima":{"name":"Oshima mud-dyed pongee","region":"Amami Oshima Island, Kagoshima","era":"Over 1,300 years of history","about":"One of the most famous kimono fabrics in Japan. Its deep, glossy black-brown comes from dyeing silk with a local tree and then with iron-rich mud. It is light, smooth and almost never wrinkles.","process":"The threads are first woven tightly into a temporary mat to reserve the pattern. The mat is dyed dozens of times with sharinbai bark and then in mud, unpicked, and the threads are rewoven one by one, matching every tiny dot by hand.","look":"A dark, silky surface with extremely fine geometric patterns made of tiny crosses."},"yuki":{"name":"Yuki hand-spun pongee","region":"Yuki, Ibaraki and Oyama, Tochigi","era":"Origins in the Nara period (8th century) or earlier; famous since the 17th century","about":"Listed by UNESCO as Intangible Cultural Heritage in 2010. It is said to be the most luxurious casual kimono, warm and light, becoming softer the longer it is worn.","process":"Silk is hand-spun from floss without any twisting. Pattern threads are tied by hand, dyed, and woven on a backstrap loom where the weaver's own body tensions the warp. One bolt can take months to more than a year.","look":"A soft, slightly uneven texture and a matte, gentle sheen."},"ushikubi":{"name":"Ushikubi double-cocoon pongee","region":"Hakusan, Ishikawa","era":"Over 800 years","about":"A rare pongee from a mountain village, made from 'double cocoons' spun by two silkworms together. It is so strong it was nicknamed 'nail-pulling pongee': caught on a nail, the cloth pulls the nail out instead of tearing.","process":"Thread is drawn directly from double cocoons in hot water, which gives it natural slubs. The white cloth is woven first and often dyed afterward, even with yuzen painting.","look":"A sturdy silk with small natural knots and a quiet, warm luster."},"kihachijo":{"name":"Kihachijo yellow island silk","region":"Hachijo Island, Tokyo","era":"Recorded since the Muromachi period; popular in the Edo period","about":"A silk woven on a remote island using only three natural colors from island plants: golden yellow, rusty brown and black. It became fashionable among townspeople in Edo.","process":"Yellow comes from kariyasu grass, brown from tabunoki bark, and black from chinquapin bark treated with iron-rich mud. Threads are dyed again and again, then woven into checks and stripes.","look":"Bright yellow, brown and black checks or stripes with a lustrous finish."},"meisen":{"name":"Meisen printed-thread silk","region":"Isesaki, Chichibu, Ashikaga, Kiryu, Hachioji","era":"Boom in the 1910s–1930s","about":"Affordable silk that brought fashion to ordinary women in the Taisho and early Showa eras. Its bold Art Nouveau and Art Deco designs are now loved by vintage collectors around the world.","process":"The warp is loosely tacked together and the pattern is stencil-printed onto it. During weaving the tacking is removed and the real weft is added, so the colors shift slightly and the edges look softly blurred.","look":"Bold, modern patterns with feathery, slightly shifted outlines."},"jofu":{"name":"Jofu fine ramie cloth","region":"Echigo (Niigata), Miyako (Okinawa), Omi (Shiga), Noto (Ishikawa)","era":"Over 1,200 years","about":"'Superior cloth': an extremely fine, crisp fabric of ramie fiber, worn in high summer. Echigo jofu and Ojiya chijimi are on UNESCO's Intangible Cultural Heritage list.","process":"Ramie fibers are split by hand into hair-thin strands and joined end to end. After weaving, Echigo jofu is laid out on snow in sunny spring weather to be bleached naturally.","look":"Light, see-through and cool, with a crisp, slightly papery feel."},"omeshi":{"name":"Omeshi woven crepe","region":"Kyoto (Nishijin), Kiryu, Shiozawa","era":"Edo period","about":"A woven silk crepe named after the shogun Tokugawa Ienari, who loved it: omeshi means 'worn by an honored person'. It sits between dyed and woven kimono and suits smart visits and parties.","process":"The threads are dyed before weaving. The weft is twisted very tightly and starched; after weaving, warm water releases the twist and creates a fine crinkled surface.","look":"A firm crepe with a subtle grainy texture, holding its shape and resisting wrinkles."},"chirimen":{"name":"Chirimen silk crepe","region":"Tango (Kyoto), Nagahama (Shiga)","era":"Since the 16th century; Tango from the 18th","about":"The soft silk crepe that serves as the base cloth for most dyed kimono, including yuzen. Its crinkled surface takes color beautifully and drapes gracefully.","process":"Weft threads are twisted thousands of times per meter, alternating left and right twists. After weaving, the cloth is boiled to remove the silk gum, the threads try to untwist, and the fabric shrinks into tiny crinkles called shibo.","look":"A soft surface covered with tiny ridges; the size of the crinkle varies by type."},"nishijin":{"name":"Nishijin brocade","region":"Nishijin district, Kyoto","era":"Named in the 15th century; weaving here since the 5th–6th century","about":"Japan's leading brocade, named after the 'Western Camp' of the Onin War. Nishijin weavers produce gorgeous obi and fabrics for the imperial court, temples and Noh theater.","process":"Threads are dyed in dozens of colors before weaving and combined with gold and silver threads. Jacquard looms were introduced from France in the 1870s, while the finest tapestry weave is still done by hand, beating the weft with serrated fingernails.","look":"Heavy, richly patterned cloth with gold and silver threads; most often seen as formal obi."},"saga-nishiki":{"name":"Saga Nishiki paper-and-silk brocade","region":"Saga","era":"Late Edo period","about":"A rare brocade from the Kashima domain. Legend says the lord's wife, inspired by the woven bamboo (ajiro) pattern on her ceiling, devised it, and it was passed down among the ladies of the household. First called Kashima Nishiki, it was renamed 'Saga Nishiki' at the 1910 Japan-British Exhibition.","process":"The warp is made of thin strips of washi paper covered in gold, silver or lacquer. A small bamboo spatula lifts the paper strips one by one, and colored silk weft is passed through. Only a few centimeters can be woven a day.","look":"Tiny, precise geometric patterns on a shimmering gold ground; used for formal obi, bags and accessories."},"hakata":{"name":"Hakata weave","region":"Fukuoka","era":"1241","about":"Started by a merchant who learned weaving in Song-dynasty China. In the Edo period the local lord presented it to the shogun every year, so the classic design is called 'kenjo' (offering) Hakata.","process":"Many fine warp threads are packed tightly and the thick weft is beaten in firmly, so the pattern is made mainly by the warp. Classic motifs come from Buddhist ritual tools and stripes.","look":"A firm obi that makes a 'kyu-kyu' sound when tied and never slips loose."},"wana":{"name":"Wana loop-pile weave","region":"Kyoto","era":"From the 17th century","about":"'Wana' means loop. This weave raises small loops of silk on the surface, the same technique used to make velvet in Japan. It gives obi and coats a soft, sculpted relief.","process":"Thin wires are woven in under the warp to lift it into loops; the wires are then pulled out. If the loops are left, it is wana; if they are cut, it becomes velvet. Patterns can mix cut and uncut loops.","look":"A raised, velvety pattern of tiny loops that feels soft to the touch."},"sagara":{"name":"Sagara knot embroidery","region":"From China; practiced in Kyoto and across Japan","era":"Ancient technique","about":"An embroidery made of countless tiny knots, similar to French knots. It creates a bead-like, three-dimensional texture and is very durable, so it is used for accents and outlines.","process":"The thread is wrapped around the needle and pulled down through the cloth to form a small knot. Knots are lined up one by one to fill a shape or draw a line.","look":"Raised dots packed closely together like tiny pearls."},"kinkoma":{"name":"Kinkoma couched gold embroidery","region":"Kyoto and across Japan","era":"Ancient technique","about":"Gold thread is too stiff to pass through silk, so it is laid on the surface and held in place. This gives outlines and motifs a bold, shining gold line.","process":"Gold thread wound on small wooden spools (koma) is laid along the design, usually in pairs, and tacked down at short intervals with fine silk thread.","look":"Smooth, continuous lines of gold sitting on top of the fabric."},"takeyamachi":{"name":"Takeyamachi gauze embroidery","region":"Takeyamachi, Kyoto","era":"Edo period","about":"An embroidery on open-weave silk gauze, named after the Kyoto street where it began. The stitches follow the grid of the fabric so closely that the result looks woven rather than embroidered.","process":"Mainly flat gold thread (sometimes with colored silk) is passed through the tiny holes of the gauze, counting each hole, to fill the design like a mosaic.","look":"A crisp, woven-looking gold pattern on sheer gauze; used for obi, fukusa and the mountings of hanging scrolls."},"swatow":{"name":"Swatow openwork embroidery","region":"Shantou (Swatow), Guangdong, China","era":"Late 19th century","about":"A delicate openwork embroidery from southern China that combines Chinese stitchery with European lacework. Kimono with Swatow embroidery have long been prized in Japan as elegant, refined wear.","process":"Threads are pulled out of the cloth or small areas are cut away, and the openings are bound and filled with fine stitches to make lace-like patterns. All of it is done by hand.","look":"Tone-on-tone, lacy patterns with tiny openings, often in white or soft pastels."},"suzhou":{"name":"Suzhou silk embroidery","region":"Suzhou, Jiangsu, China","era":"Over 2,000 years","about":"One of China's four great embroidery traditions, famous for its extreme fineness. On kimono and obi it is used for lifelike animals and flowers.","process":"A single silk thread is split into as many as dozens of hair-fine filaments. Colors are blended stitch by stitch, and some pieces are embroidered so both sides show a finished picture.","look":"Photo-like realism, such as cats whose individual hairs can be seen."},"ran":{"name":"Random-stitch embroidery (luanzhen)","region":"Changzhou, Jiangsu, China; also seen on kimono and obi","era":"Created in the early 20th century (1920s-30s)","about":"An embroidery where stitches of different lengths and directions cross and overlap, like brushstrokes in an oil painting. It expresses fur, feathers, light and shadow naturally.","process":"Instead of laying stitches neatly side by side, the embroiderer layers them freely in crossing directions and mixes colors in each layer to build up depth.","look":"A painterly surface with soft gradations rather than clear stitch lines."},"hitta":{"name":"Hitta square-dot shibori","region":"Kyoto","era":"Highly developed by the 17th century","about":"The most luxurious kind of shibori. Tiny square dots are lined up on the diagonal; a kimono covered entirely in hitta is called 'so-hitta' and is the height of luxury.","process":"A craftswoman pinches a tiny piece of cloth, folds it into four and winds thread around it several times. Each dot is tied by hand, so a fully covered furisode can take a year or more.","look":"Even, raised square dots arranged in neat diagonal rows."},"kanoko":{"name":"Kanoko fawn-spot shibori","region":"Kyoto and across Japan","era":"Since ancient times","about":"'Kanoko' means fawn, because the small white dots with a colored center look like the spots of a young deer. It is the best-known shibori and appears on obiage, kimono and accessories.","process":"Small points of cloth are picked up and tightly bound with thread before dyeing. After dyeing and untying, each point leaves a ring-shaped dot with a raised, bumpy texture.","look":"Small dotted rings with a tiny colored 'eye' in the middle."},"boshi":{"name":"Boshi (capped) shibori","region":"Kyoto, Arimatsu","era":"Edo period","about":"'Boshi' means hat. This method protects large areas of a design from dye by putting a cap over them, making it possible to keep big flowers or circles white.","process":"The outline is stitched and gathered, then the area inside is covered like a cap, traditionally with bamboo sheath, today usually vinyl, and tightly bound with thread before dyeing.","look":"Large undyed shapes with soft, slightly feathered edges."},"nuishime":{"name":"Nuishime stitched shibori","region":"Kyoto, Arimatsu-Narumi (Nagoya)","era":"Since at least the Muromachi period","about":"A shibori method that uses running stitches to draw precise lines and shapes. It allows shapes much freer than tying alone.","process":"The design is sewn with small running stitches, and the threads are pulled tight so the cloth gathers into folds. The folded areas resist the dye, leaving a dotted outline.","look":"Clear outlines formed by rows of small dashes."},"arashi":{"name":"Arashi pole-wrap shibori","region":"Arimatsu-Narumi (Nagoya)","era":"Late 19th century","about":"'Arashi' means storm: the diagonal lines look like rain driven by the wind. It is a classic of Arimatsu, Japan's largest shibori town, and is popular for yukata.","process":"Cloth is wrapped diagonally around a long pole, bound with thread, and pushed down into tight folds. Only the outer ridges take the dye.","look":"Fine diagonal lines that look like slanting rain."},"tatsumaki":{"name":"Tatsumaki whirlwind shibori","region":"Arimatsu-Narumi (Nagoya), Kyoto","era":"Traditional technique","about":"'Tatsumaki' means tornado. Thread is wound in a spiral around the cloth, so the pattern twists as if caught in a whirlwind.","process":"The cloth is gathered (often after stitching or pleating) around a core into a long round bar, and thread is wound spirally from top to bottom before dyeing. Only the exposed surface takes the dye, leaving spiral bands.","look":"Swirling, spiral stripes with a strong sense of movement."},"yanagi":{"name":"Yanagi willow shibori","region":"Arimatsu-Narumi (Nagoya)","era":"Edo period","about":"'Yanagi' means willow. The pattern looks like willow branches swaying in the breeze and is a favorite for summer yukata.","process":"The cloth is gathered lengthwise into narrow pleats and bound with thread at intervals. The pleats resist the dye, leaving thin, broken vertical lines.","look":"Gentle vertical lines that look like hanging willow branches."},"oke":{"name":"Oke tub shibori","region":"Kyoto","era":"Traditional Kyoto technique","about":"'Oke' means tub. This rare technique keeps large parts of the cloth dry by sealing them inside a wooden tub, allowing big areas of different colors on one kimono. Very few craftsmen can still do it.","process":"The part to stay undyed is packed into a wooden cypress tub and the lids are tightly clamped and roped shut on the cloth, leaving the part to be dyed outside. The whole tub is then immersed in a larger dye vat. It is repeated for every color.","look":"Large, bold blocks of different colors with clean, slightly soft borders."},"itajime":{"name":"Itajime board-clamp dyeing","region":"Arimatsu, Kyoto and elsewhere","era":"Since the 8th century","about":"One of the oldest resist techniques in Japan; its ancestor, kyokechi (dyeing between carved boards), survives in the 8th-century Shosoin treasure house. Folded cloth is pressed between boards to create repeating patterns.","process":"The cloth is folded into triangles or squares and clamped tightly between wooden boards, then dipped in dye. The covered areas stay white and form a symmetrical pattern.","look":"Repeating geometric shapes, such as snowflake-like motifs called sekka."},"tsukami":{"name":"Tsukami grab shibori","region":"Various shibori centers","era":"Traditional","about":"'Tsukami' means grab. Handfuls of cloth are bunched up and bound, so every piece comes out different. It gives a free, natural effect.","process":"The craftsman grabs the cloth, twists it into irregular bunches and binds them with thread before dyeing. The random folds create unpredictable patterns.","look":"Irregular, cloud-like or marbled patterns with no repeat."},"kumihimo":{"name":"Kumihimo silk braiding","region":"Kyoto, Iga (Mie)","era":"Since the 7th–8th century","about":"Braided silk cords, first used for Buddhist objects and court dress, and later for samurai armor and sword cords. Today they are best known as obijime, the cord tied around the middle of the obi.","process":"Dozens of silk threads are wound on weighted bobbins and crossed over one another on a wooden stand such as the round marudai. Different stands and moves create round, square or flat cords.","look":"A firm, even braid with fine diagonal patterns and rich color combinations."},"zogan":{"name":"Zogan metal inlay","region":"Kyoto, Kumamoto (Higo)","era":"Flourished in the Edo period on sword and gun fittings","about":"The art of inlaying gold and silver into iron. Once used to decorate sword fittings, today it adorns kimono accessories such as obidome (obi brooches) and hair ornaments.","process":"The iron surface is scored with fine crosshatched grooves. Gold or silver foil and wire are hammered into the grooves, then the iron is deliberately rusted and baked with lacquer or oil to a deep black.","look":"Gleaming gold and silver designs against a deep black background."},"makie":{"name":"Maki-e gold lacquer","region":"Kyoto, Wajima, Kanazawa and elsewhere","era":"Since the 8th–9th century","about":"A lacquer art in which designs are drawn in lacquer and sprinkled with gold or silver powder. In the kimono world it is found on combs, hairpins, obidome and geta sandals.","process":"The design is painted with lacquer, and before it dries, fine gold or silver powder is sprinkled on through a bamboo tube. The piece is then coated and polished several times.","look":"Delicate gold pictures with a deep, glossy shine on black or red lacquer."},"mizuhiki":{"name":"Mizuhiki paper cords","region":"Iida (Nagano), Kanazawa (Ishikawa)","era":"Origins traced to the 7th century","about":"Decorative cords made of twisted washi paper, tied into knots that carry wishes for good fortune. They decorate gift envelopes and, in kimono styling, are used for bridal hair ornaments and obi decorations.","process":"Washi is twisted into thin cords and stiffened with starch, then dyed or wrapped in colored or metallic film. The cords are tied into knots such as the awaji knot or shaped into cranes, pine and plum.","look":"Shiny, stiff cords tied into symmetrical knots, often in red-and-white or gold-and-silver."},"ro":{"name":"Ro summer gauze with stripes of openings","region":"Kyoto and other silk weaving areas","era":"Name recorded by the 15th century; widespread from the Edo period","about":"A summer silk with neat rows of tiny openings that let air through. It is the classic fabric for formal and everyday kimono in the hottest months, from early summer to late summer.","process":"Several rows of plain weave are woven, then pairs of warp threads are twisted around each other for one row to leave a line of gaps. The number of plain rows between gaps gives the names 'three-row ro', 'five-row ro' and so on.","look":"Fine horizontal (or sometimes vertical) lines of small openings across an otherwise solid silk."},"sha":{"name":"Sha full-gauze silk","region":"Kyoto and other silk weaving areas","era":"Came from China in the 7th–8th century","about":"A light, see-through silk worn at the height of summer. It is lighter and more transparent than ro, and is also used for summer haori and coats worn over kimono.","process":"On every row, pairs of warp threads are twisted around each other and locked by the weft. This creates an even, open mesh across the whole cloth.","look":"A uniform, sheer mesh with no solid stripes; layers underneath show through softly."},"ra":{"name":"Ra net-like complex gauze","region":"Kyoto","era":"Ancient (7th–8th century); revived in the 20th century","about":"One of the oldest and the most complex of the gauze weaves, with examples kept in the 8th-century Shosoin treasure house. The technique declined in Japan after the Middle Ages and was revived by modern master weavers. Today it is mostly seen in luxurious summer obi.","process":"Each warp thread crosses over to twist with several neighboring threads, not just one partner, so the threads form a net. It is woven slowly by hand on a special loom.","look":"A stretchy, net-like mesh with diamond-shaped openings, often with patterns appearing in the net."},"kobai":{"name":"Kobai waffle-grid summer cloth","region":"Cotton and silk weaving areas across Japan","era":"Traditional summer fabric","about":"A summer fabric with a raised grid texture, made in cotton (men-kobai) or silk with cotton (kinu-kobai). It is a favorite for high-quality yukata and casual summer kimono.","process":"Thicker threads are woven in at regular intervals, both lengthwise and crosswise, into a thin, light ground. The thick threads form a raised square grid.","look":"A light cloth with a checked pattern of raised lines; the ridges keep it from sticking to the skin."},"rokechi":{"name":"Rokechi wax-resist dyeing","region":"Kyoto and across Japan","era":"8th century; revived in the 20th century","about":"One of the three ancient resist-dyeing methods of the Nara period, with examples kept in the Shosoin treasure house. It faded out during the Heian period and was revived by 20th-century artists, who made it a form of free, painterly dyeing.","process":"Melted wax is brushed or stamped onto the cloth where the color should not go, and the cloth is dyed. The wax is then removed with heat or hot water. Where the wax cracked, the dye seeps in and leaves fine lines.","look":"Bold shapes with fine, spidery crackle lines running through them."},"mokuhan":{"name":"Mokuhan woodblock printing","region":"Kyoto and other areas","era":"Ancient roots","about":"A printing technique in which designs carved into wooden blocks are pressed onto cloth. Each print carries the hand of the craftsman, and the slight variations give the fabric a warm, handmade character. Few workshops still practice it today.","process":"A design is carved into a hardwood block. The block is coated with dye or paste and pressed firmly onto the stretched cloth, one impression at a time. A separate block is used for each color.","look":"Repeated motifs with slightly uneven, soft-edged color and the faint texture of the wood grain."},"chusen":{"name":"Chusen pour-dyeing","region":"Osaka (Sakai), Hamamatsu (Shizuoka), Tokyo","era":"Late 19th century (Meiji era)","about":"A Japanese method for dyeing cotton yukata and tenugui towels. The dye goes all the way through the cloth, so both sides have the same color, and the colors look soft and fresh.","process":"The cloth is folded back and forth into many layers, with resist paste spread through a stencil on each layer. Walls of paste are built around each area, dye is poured in from a kettle, and suction from below draws it through all the layers at once.","look":"Soft, slightly blurred colors, gentle gradations, and the same pattern clearly visible on the back."},"bingata":{"name":"Bingata Okinawan stencil dyeing","region":"Okinawa","era":"Ryukyu Kingdom (from around the 15th century)","about":"The vivid dyeing art of Okinawa, once worn by the royal family and nobles of the Ryukyu Kingdom. Bright colors and motifs from both Japan and the southern seas give it a cheerful, tropical character.","process":"A pattern is cut into a paper stencil and rice paste is applied through it. Mineral pigments and plant dyes are brushed into each area, then a darker shade is rubbed over the edges (kumadori) to add depth. A version dyed only in indigo is called eigata.","look":"Bright yellows, reds and blues with shaded edges, and motifs such as flowers, birds, waves and clouds."},"aizome":{"name":"Aizome indigo dyeing","region":"Tokushima (Awa) and across Japan","era":"Ancient; widespread in the Edo period","about":"Indigo was the most common dye in Japan, used for everything from farmers' work clothes to kimono. Foreign visitors in the Meiji era were so struck by it that the color became known as 'Japan Blue'.","process":"Indigo leaves are composted into sukumo, then fermented in a vat with wood-ash lye, wheat bran and lime. The cloth is dipped and lifted again and again: it comes out green and turns blue as it meets the air. More dips give a deeper color.","look":"A deep, living blue, ranging from pale sky blue to almost black, that softens beautifully with wear."},"lace":{"name":"Lace","region":"Developed in Europe; made in Japan and worldwide","era":"European lace from the 16th century; with kimono since the Meiji–Taisho era","about":"Lace is an openwork textile made of threads alone. In today's kimono fashion, lace kimono, haori and obi are popular, often layered over a colored kimono so the color shows through.","process":"Most lace for kimono is made on embroidery machines. The pattern is stitched onto a fine net (tulle lace) or onto a base cloth that is later dissolved, leaving only the stitched threads (chemical lace).","look":"A see-through floral or geometric pattern of threads, with the color underneath showing through the openings."},"tsuzure":{"name":"Tsuzure tapestry weave","region":"Kyoto (Nishijin)","era":"Examples in Japan from the 8th century (likely imported from China); woven in Nishijin from the 18th century (Edo period)","about":"Japan's version of tapestry weaving, related to European Gobelin tapestry. It is considered the highest grade of obi, and the finest pieces are woven by hand using the weaver's fingernails.","process":"Each colored weft is woven back and forth only within its own part of the design, hiding the warp completely. The weaver files the fingernails into a saw-tooth shape and uses them to push each weft into place. Only a few centimeters can be woven in a day.","look":"A firm, flat cloth with the same picture on front and back, and tiny slits where two colors meet."},"benibana":{"name":"Benibana safflower dyeing","region":"Yamagata (Mogami) and Kyoto","era":"Arrived via the Silk Road around the 6th–7th century","about":"A natural red dye made from safflower petals, loved by the Heian court. It was so precious in the Edo period that people said 'one unit of red equals one unit of gold'. It was traditionally used for the red silk linings of kimono (momi).","process":"Petals are washed in water to remove much of the yellow pigment, then fermented and pressed into 'beni-mochi' cakes. The red is drawn out with ash lye and fixed onto silk with smoked-plum (ubai) vinegar. Repeated dyeing deepens the color.","look":"A clear, glowing pink to deep crimson; the color is delicate and fades with strong light."}}},"fr":{"ui":{"tagline":"L’artisanat derrière le kimono — 50 techniques traditionnelles du Japon","all":"Tout","search":"Rechercher une technique…","region":"Où","era":"Depuis","about":"De quoi s’agit-il","process":"Comment c’est fabriqué","look":"Comment le reconnaître","listen":"Écouter le nom japonais","close":"Fermer","language":"Langue","count":"{n} techniques","noResults":"Aucune technique ne correspond à votre recherche.","prev":"Précédent","next":"Suivant","intro":"Un kimono est réalisé en de nombreuses étapes, et chaque étape a ses propres maîtres. Choisissez une catégorie ou touchez une technique pour en savoir plus."},"cats":{"dye":{"name":"Teinture","desc":"Les motifs sont peints, appliqués au pochoir ou imprimés sur une soie blanche déjà tissée. Les kimonos teints sont en général les plus formels, portés lors de cérémonies et de fêtes."},"weave":{"name":"Tissage","desc":"Les fils sont teints d’abord, et le motif apparaît au fil du tissage. Les kimonos tissés comme le tsumugi sont prisés comme tenue élégante du quotidien, tandis que les obi tissés peuvent être les plus formels de tous."},"embroidery":{"name":"Broderie","desc":"Des fils de soie et des fils métalliques sont cousus à la main sur le tissu pour ajouter texture, lumière et profondeur. Sur les kimonos formels, la broderie est souvent associée à la teinture."},"shibori":{"name":"Shibori (teinture nouée)","desc":"Certaines parties du tissu sont ligaturées, cousues, pliées ou serrées pour que la teinture ne les atteigne pas. Une fois les fils retirés, le motif apparaît avec une texture douce et en relief."},"other":{"name":"Artisanats des accessoires","desc":"Le kimono est complété par des cordons, des ornements et des décorations réalisés par des artisans d’autres traditions : tresseurs, métalliers, laqueurs et créateurs de cordons en papier."}},"items":{"kaga-yuzen":{"name":"Kaga Yuzen, soie peinte à la main","region":"Kanazawa, Ishikawa","era":"Début du XVIIIe siècle","about":"Un style de teinture peinte à la main venu de l’ancien domaine de Kaga. Il est réputé pour ses fleurs et plantes réalistes, dessinées dans les « cinq couleurs de Kaga » : indigo, cramoisi, ocre, vert herbe et pourpre royal.","process":"Le dessin est cerné d’un mince trait de pâte de riz qui empêche les couleurs de baver. Chaque zone est ensuite peinte au pinceau, avec un dégradé allant du bord extérieur vers le centre. Un seul artiste supervise généralement toute la pièce.","look":"Des motifs naturels et picturaux, parfois avec des feuilles « mangées par les vers » (mushikui). Peu ou pas d’or ni de broderie."},"kyo-yuzen":{"name":"Kyoto Yuzen, soie peinte à la main","region":"Kyoto","era":"Fin du XVIIe siècle","about":"Le style yuzen d’origine, nommé d’après Miyazaki Yuzensai, peintre d’éventails à Kyoto. Il a apporté au kimono une liberté de dessin proche de la peinture et est devenu le style classique des tenues formelles.","process":"Le travail est réparti en une vingtaine d’étapes, chacune confiée à un spécialiste : conception, tracé du contour, application de la réserve à la pâte de riz, mise en couleur au pinceau, vaporisage, rinçage, puis ajout de feuille d’or et de broderie.","look":"Des motifs élégants d’inspiration courtoise, dans des couleurs riches, dégradés du centre vers l’extérieur, souvent rehaussés d’or et de broderie."},"edo-komon":{"name":"Edo komon, teinture au pochoir à motifs fins","region":"Tokyo","era":"XVIIe siècle (époque d’Edo)","about":"De minuscules motifs répétés teints d’une seule couleur, si fins que, de loin, le tissu paraît uni. Ils sont nés avec les tenues de cérémonie des samouraïs, et chaque seigneur féodal avait son propre motif réservé.","process":"Les motifs sont découpés dans des pochoirs en papier washi superposé, durci au jus de kaki. L’artisan pose le pochoir sur la soie, étale la pâte de riz à travers, le déplace avec un alignement parfait, puis teint tout le tissu.","look":"De près : des milliers de points, vagues ou lignes minuscules. À quelques pas : une couleur unie et discrète."},"tsujigahana":{"name":"Tsujigahana, teinture à réserve cousue","region":"Kyoto et autres régions","era":"XVe – début du XVIIe siècle","about":"Un style luxueux des époques Muromachi et Momoyama qui associait shibori cousu, peinture à l’encre, feuille d’or et broderie. Il a disparu au début des années 1600 et fut plus tard surnommé « la teinture fantôme ».","process":"Les contours des motifs sont cousus puis serrés pour que la teinture ne pénètre pas, et le tissu est teint en plusieurs étapes. Les détails fins, comme les nervures des feuilles, sont ensuite peints à l’encre. Des artistes modernes ont fait revivre ce style au XXe siècle.","look":"Des formes douces, légèrement floues, aux bords froncés, associées à de délicats dessins à l’encre."},"sarasa":{"name":"Sarasa (motifs imprimés exotiques)","region":"À l’origine l’Inde ; fabriqué à Nagasaki, Sakai, Kyoto et Edo","era":"XVIe–XVIIe siècle","about":"Un coton coloré à motifs venu d’Inde et d’Asie du Sud-Est grâce au commerce extérieur. Ses fleurs, oiseaux et motifs géométriques exotiques étaient très prisés, et les artisans japonais en ont vite créé leurs propres versions.","process":"En Inde, les motifs étaient dessinés ou imprimés à la planche avec des mordants et de la cire. Le « wa-sarasa » japonais était généralement réalisé avec de nombreux pochoirs en papier, un par couleur, appliqués tour à tour.","look":"Des motifs floraux denses, d’allure étrangère, proches du cachemire, dans des rouges terreux, de l’indigo et des bruns."},"kinsai":{"name":"Décoration à la feuille d’or","region":"Kyoto","era":"Ancienne ; florissante au XVIe siècle","about":"L’art de décorer des kimonos finis avec de l’or et de l’argent véritables. C’est généralement la touche finale des kimonos formels teints en yuzen, qui fait briller fleurs, nuages et contours.","process":"Un adhésif est appliqué au pochoir ou tracé avec un fin cône, puis la feuille d’or est pressée et retirée au pinceau là où elle ne doit pas rester. L’or peut aussi être saupoudré en minuscules paillettes ou tracé en lignes de pâte d’or.","look":"Des détails dorés ou argentés brillants sur un dessin teint, qui accrochent la lumière quand la personne qui le porte bouge."},"oshima":{"name":"Oshima, pongé teint à la boue","region":"Île d’Amami Oshima, Kagoshima","era":"Plus de 1 300 ans d’histoire","about":"L’un des tissus de kimono les plus célèbres du Japon. Son noir-brun profond et lustré vient de la teinture de la soie avec un arbre local, puis dans une boue riche en fer. Il est léger, lisse et ne se froisse presque jamais.","process":"Les fils sont d’abord tissés serré en une natte provisoire pour réserver le motif. La natte est teinte des dizaines de fois avec l’écorce de sharinbai puis dans la boue, défaite, et les fils sont retissés un à un en faisant coïncider chaque petit point à la main.","look":"Une surface sombre et soyeuse aux motifs géométriques extrêmement fins, faits de minuscules croix."},"yuki":{"name":"Yuki, pongé filé à la main","region":"Yuki (Ibaraki) et Oyama (Tochigi)","era":"Origines à l’époque de Nara (VIIIe siècle) ou avant ; célèbre depuis le XVIIe siècle","about":"Inscrit par l’UNESCO au patrimoine culturel immatériel en 2010. On le dit le plus luxueux des kimonos de tous les jours : chaud et léger, il devient plus doux à mesure qu’on le porte.","process":"La soie est filée à la main à partir de bourre, sans aucune torsion. Les fils du motif sont ligaturés à la main, teints, puis tissés sur un métier à sangle dorsale où le corps même du tisserand tend la chaîne. Une pièce peut demander de plusieurs mois à plus d’un an.","look":"Une texture douce, légèrement irrégulière, et un lustre mat et doux."},"ushikubi":{"name":"Ushikubi, pongé de cocons doubles","region":"Hakusan, Ishikawa","era":"Plus de 800 ans","about":"Un pongé rare d’un village de montagne, fait de « cocons doubles » filés ensemble par deux vers à soie. Il est si solide qu’on l’a surnommé « le pongé arrache-clou » : accroché à un clou, le tissu arrache le clou au lieu de se déchirer.","process":"Le fil est tiré directement des cocons doubles dans l’eau chaude, ce qui lui donne des irrégularités naturelles. Le tissu est d’abord tissé blanc puis souvent teint ensuite, parfois même avec une peinture yuzen.","look":"Une soie robuste aux petits nœuds naturels et au lustre chaud et discret."},"kihachijo":{"name":"Kihachijo, soie jaune de l’île","region":"Île de Hachijo, Tokyo","era":"Attesté depuis l’époque de Muromachi ; populaire à l’époque d’Edo","about":"Une soie tissée sur une île lointaine avec seulement trois couleurs naturelles tirées des plantes de l’île : jaune doré, brun rouille et noir. Elle est devenue à la mode chez les citadins d’Edo.","process":"Le jaune vient de l’herbe kariyasu, le brun de l’écorce de tabunoki, et le noir de l’écorce de castanopsis traitée avec une boue riche en fer. Les fils sont teints encore et encore, puis tissés en carreaux et rayures.","look":"Des carreaux ou rayures jaune vif, bruns et noirs, à la finition lustrée."},"meisen":{"name":"Meisen, soie aux fils imprimés","region":"Isesaki, Chichibu, Ashikaga, Kiryu, Hachioji","era":"Essor dans les années 1910–1930","about":"Une soie abordable qui a apporté la mode aux femmes ordinaires des ères Taisho et début Showa. Ses motifs audacieux Art nouveau et Art déco sont aujourd’hui adorés des collectionneurs de vintage du monde entier.","process":"La chaîne est provisoirement bâtie et le motif y est imprimé au pochoir. Pendant le tissage, le bâti est retiré et la vraie trame est ajoutée : les couleurs se décalent légèrement et les bords semblent doucement flous.","look":"Des motifs audacieux et modernes aux contours plumeux, légèrement décalés."},"jofu":{"name":"Jofu, toile fine de ramie","region":"Echigo (Niigata), Miyako (Okinawa), Omi (Shiga), Noto (Ishikawa)","era":"Plus de 1 200 ans","about":"« Toile supérieure » : un tissu de ramie extrêmement fin et sec au toucher, porté au cœur de l’été. L’Echigo jofu et l’Ojiya chijimi figurent sur la liste du patrimoine culturel immatériel de l’UNESCO.","process":"Les fibres de ramie sont fendues à la main en brins fins comme des cheveux et raboutées. Après le tissage, l’Echigo jofu est étendu sur la neige par beau temps printanier pour être blanchi naturellement.","look":"Léger, transparent et frais, au toucher net, un peu comme du papier."},"omeshi":{"name":"Omeshi, crêpe tissé","region":"Kyoto (Nishijin), Kiryu, Shiozawa","era":"Époque d’Edo","about":"Un crêpe de soie tissé nommé d’après le shogun Tokugawa Ienari, qui l’adorait : omeshi signifie « porté par une personne honorable ». Il se situe entre kimono teint et kimono tissé et convient aux visites élégantes et aux soirées.","process":"Les fils sont teints avant le tissage. La trame est très fortement torsadée et amidonnée ; après le tissage, l’eau chaude relâche la torsion et crée une fine surface froissée.","look":"Un crêpe ferme à la texture subtilement granuleuse, qui garde sa forme et résiste aux plis."},"chirimen":{"name":"Chirimen, crêpe de soie","region":"Tango (Kyoto), Nagahama (Shiga)","era":"Depuis le XVIe siècle ; Tango depuis le XVIIIe","about":"Le crêpe de soie souple qui sert de tissu de base à la plupart des kimonos teints, dont le yuzen. Sa surface froissée prend magnifiquement la couleur et tombe avec grâce.","process":"Les fils de trame sont torsadés des milliers de fois par mètre, en alternant torsions à gauche et à droite. Après le tissage, le tissu est bouilli pour retirer le grès de la soie ; les fils cherchent à se détordre et le tissu se rétracte en minuscules froissures appelées shibo.","look":"Une surface douce couverte de minuscules reliefs ; la taille du grain varie selon le type."},"nishijin":{"name":"Brocart de Nishijin","region":"Quartier de Nishijin, Kyoto","era":"Nommé au XVe siècle ; tissage ici depuis le Ve–VIe siècle","about":"Le principal brocart du Japon, nommé d’après le « camp de l’Ouest » de la guerre d’Onin. Les tisserands de Nishijin produisent de somptueux obi et des tissus pour la cour impériale, les temples et le théâtre nô.","process":"Les fils sont teints avant le tissage en des dizaines de couleurs et associés à des fils d’or et d’argent. Les métiers Jacquard ont été importés de France dans les années 1870, tandis que la plus fine tapisserie se fait encore à la main, la trame étant tassée avec des ongles dentelés.","look":"Un tissu lourd aux motifs riches, avec des fils d’or et d’argent ; on le voit surtout en obi formels."},"saga-nishiki":{"name":"Saga Nishiki, brocart de papier et de soie","region":"Saga","era":"Fin de l’époque d’Edo","about":"Un brocart rare du domaine de Kashima. Selon la légende, l’épouse du seigneur l’imagina en s’inspirant du motif de bambou tressé (ajiro) de son plafond, et il se transmit parmi les dames de la maison. D’abord appelé Kashima Nishiki, il fut rebaptisé « Saga Nishiki » lors de l’Exposition anglo-japonaise de 1910.","process":"La chaîne est faite de fines bandes de papier washi recouvertes d’or, d’argent ou de laque. Une petite spatule en bambou soulève les bandes de papier une à une, et l’on passe la trame de soie colorée. On ne peut tisser que quelques centimètres par jour.","look":"De minuscules motifs géométriques précis sur un fond d’or chatoyant ; utilisé pour les obi formels, les sacs et les accessoires."},"hakata":{"name":"Tissage de Hakata","region":"Fukuoka","era":"1241","about":"Lancé par un marchand qui avait appris le tissage dans la Chine des Song. À l’époque d’Edo, le seigneur local l’offrait chaque année au shogun : le motif classique s’appelle donc Hakata « kenjo » (offrande).","process":"De nombreux fils de chaîne fins sont serrés étroitement et la trame épaisse est tassée fermement, si bien que le motif est surtout formé par la chaîne. Les motifs classiques viennent d’objets rituels bouddhiques et de rayures.","look":"Un obi ferme qui fait un bruit de « kyu-kyu » quand on le noue et ne se desserre jamais."},"wana":{"name":"Wana, tissage à boucles","region":"Kyoto","era":"Depuis le XVIIe siècle","about":"« Wana » signifie boucle. Ce tissage fait ressortir de petites boucles de soie à la surface, la même technique que pour fabriquer le velours au Japon. Il donne aux obi et aux manteaux un relief doux et sculpté.","process":"De fins fils métalliques sont tissés sous la chaîne pour la soulever en boucles, puis retirés. Si les boucles restent, c’est du wana ; si on les coupe, cela devient du velours. Les motifs peuvent mêler boucles coupées et non coupées.","look":"Un motif en relief, velouté, fait de minuscules boucles, doux au toucher."},"sagara":{"name":"Sagara, broderie à nœuds","region":"Venue de Chine ; pratiquée à Kyoto et dans tout le Japon","era":"Technique ancienne","about":"Une broderie faite d’innombrables petits nœuds, proches des points de nœud français. Elle crée une texture en relief comme des perles et est très résistante, d’où son usage pour les accents et les contours.","process":"Le fil est enroulé autour de l’aiguille, puis tiré à travers le tissu pour former un petit nœud. Les nœuds sont alignés un à un pour remplir une forme ou tracer une ligne.","look":"Des points en relief serrés les uns contre les autres comme de minuscules perles."},"kinkoma":{"name":"Kinkoma, broderie d’or couchée","region":"Kyoto et tout le Japon","era":"Technique ancienne","about":"Le fil d’or est trop rigide pour traverser la soie : on le pose donc à la surface et on le fixe. Cela donne aux contours et aux motifs une ligne d’or franche et brillante.","process":"Le fil d’or, enroulé sur de petites bobines en bois (koma), est posé le long du dessin, généralement par paires, et fixé à intervalles courts avec un fin fil de soie.","look":"Des lignes d’or lisses et continues posées sur le tissu."},"takeyamachi":{"name":"Takeyamachi, broderie sur gaze","region":"Takeyamachi, Kyoto","era":"Époque d’Edo","about":"Une broderie sur gaze de soie ajourée, nommée d’après la rue de Kyoto où elle est née. Les points suivent si fidèlement la trame du tissu que le résultat semble tissé plutôt que brodé.","process":"Principalement du fil d’or plat (parfois avec de la soie colorée) passe par les minuscules trous de la gaze, en comptant chaque trou, pour remplir le dessin comme une mosaïque.","look":"Un motif d’or net, d’aspect tissé, sur une gaze transparente ; utilisé pour les obi, les fukusa et les montages des rouleaux suspendus."},"swatow":{"name":"Swatow, broderie ajourée","region":"Shantou (Swatow), Guangdong, Chine","era":"Fin du XIXe siècle","about":"Une délicate broderie ajourée du sud de la Chine, qui allie broderie chinoise et dentelle européenne. Les kimonos brodés Swatow sont depuis longtemps appréciés au Japon comme tenues élégantes et raffinées.","process":"Des fils sont tirés du tissu ou de petites zones sont découpées, puis les ouvertures sont bordées et remplies de points fins pour former des motifs de dentelle. Tout est fait à la main.","look":"Des motifs ton sur ton, comme de la dentelle, avec de minuscules jours, souvent en blanc ou en pastels doux."},"suzhou":{"name":"Broderie de soie de Suzhou","region":"Suzhou, Jiangsu, Chine","era":"Plus de 2 000 ans","about":"L’une des quatre grandes traditions de broderie chinoises, célèbre pour son extrême finesse. Sur les kimonos et les obi, elle sert à représenter animaux et fleurs plus vrais que nature.","process":"Un seul fil de soie est divisé en jusqu’à plusieurs dizaines de filaments fins comme des cheveux. Les couleurs sont fondues point par point, et certaines pièces sont brodées de sorte que les deux faces montrent une image achevée.","look":"Un réalisme quasi photographique, comme des chats dont on distingue chaque poil."},"ran":{"name":"Broderie à points aléatoires (luanzhen)","region":"Changzhou, Jiangsu, Chine ; également présente sur des kimonos et des obi","era":"Créée au début du XXe siècle (années 1920-1930)","about":"Une broderie où des points de longueurs et de directions différentes se croisent et se superposent, comme les touches d’une peinture à l’huile. Elle rend naturellement la fourrure, les plumes, la lumière et l’ombre.","process":"Au lieu d’aligner sagement les points côte à côte, le brodeur les superpose librement dans des directions croisées et mélange les couleurs à chaque couche pour créer de la profondeur.","look":"Une surface picturale aux dégradés doux plutôt qu’aux points nettement visibles."},"hitta":{"name":"Hitta, shibori à points carrés","region":"Kyoto","era":"Très développé dès le XVIIe siècle","about":"Le plus luxueux des shibori. De minuscules points carrés sont alignés en diagonale ; un kimono entièrement couvert de hitta s’appelle « so-hitta » et représente le comble du luxe.","process":"Une artisane pince un tout petit morceau de tissu, le plie en quatre et l’enroule plusieurs fois de fil. Chaque point est noué à la main : un furisode entièrement couvert peut demander un an ou plus.","look":"Des points carrés réguliers et en relief, disposés en rangées diagonales bien nettes."},"kanoko":{"name":"Kanoko, shibori « taches de faon »","region":"Kyoto et tout le Japon","era":"Depuis l’Antiquité","about":"« Kanoko » signifie faon, car les petits points blancs au centre coloré rappellent les taches d’un jeune cerf. C’est le shibori le plus connu ; on le trouve sur les obiage, les kimonos et les accessoires.","process":"De petites pointes de tissu sont pincées et fortement ligaturées avec du fil avant la teinture. Après teinture et dénouage, chaque pointe laisse un point en anneau à la texture bosselée et en relief.","look":"De petits anneaux pointillés avec un minuscule « œil » coloré au centre."},"boshi":{"name":"Boshi, shibori « à chapeau »","region":"Kyoto, Arimatsu","era":"Époque d’Edo","about":"« Boshi » signifie chapeau. Cette méthode protège de la teinture de grandes zones du dessin en les coiffant d’un capuchon, ce qui permet de garder blanches de grandes fleurs ou de grands cercles.","process":"Le contour est cousu et froncé, puis la zone intérieure est recouverte comme d’un bonnet, traditionnellement de gaine de bambou, aujourd’hui le plus souvent de vinyle, et fortement ligaturée avec du fil avant la teinture.","look":"De grandes formes non teintes aux bords doux, légèrement plumeux."},"nuishime":{"name":"Nuishime, shibori cousu","region":"Kyoto, Arimatsu-Narumi (Nagoya)","era":"Depuis au moins l’époque de Muromachi","about":"Une méthode de shibori qui utilise des points avant pour tracer des lignes et des formes précises. Elle permet des formes bien plus libres que la seule ligature.","process":"Le dessin est cousu à petits points avant, puis les fils sont tirés pour que le tissu se fronce en plis. Les zones plissées résistent à la teinture et laissent un contour en pointillés.","look":"Des contours nets formés de rangées de petits tirets."},"arashi":{"name":"Arashi, shibori enroulé sur perche","region":"Arimatsu-Narumi (Nagoya)","era":"Fin du XIXe siècle","about":"« Arashi » signifie tempête : les lignes diagonales évoquent la pluie poussée par le vent. C’est un classique d’Arimatsu, la plus grande ville du shibori au Japon, très apprécié pour les yukata.","process":"Le tissu est enroulé en diagonale autour d’une longue perche, ligaturé avec du fil et tassé en plis serrés. Seules les arêtes extérieures prennent la teinture.","look":"De fines lignes diagonales qui ressemblent à une pluie oblique."},"tatsumaki":{"name":"Tatsumaki, shibori tourbillon","region":"Arimatsu-Narumi (Nagoya), Kyoto","era":"Technique traditionnelle","about":"« Tatsumaki » signifie tornade. Un fil est enroulé en spirale autour du tissu, si bien que le motif se tord comme pris dans un tourbillon.","process":"Le tissu est rassemblé (souvent après avoir été cousu ou plissé) autour d’une âme en une longue barre ronde, et un fil y est enroulé en spirale de haut en bas avant la teinture. Seule la surface exposée prend la teinture, laissant des bandes en spirale.","look":"Des rayures tourbillonnantes en spirale, pleines de mouvement."},"yanagi":{"name":"Yanagi, shibori « saule »","region":"Arimatsu-Narumi (Nagoya)","era":"Époque d’Edo","about":"« Yanagi » signifie saule. Le motif évoque des branches de saule qui se balancent dans la brise ; il est très prisé pour les yukata d’été.","process":"Le tissu est froncé dans la longueur en plis étroits et ligaturé à intervalles. Les plis résistent à la teinture et laissent de fines lignes verticales interrompues.","look":"De douces lignes verticales qui rappellent des branches de saule tombantes."},"oke":{"name":"Oke, shibori au baquet","region":"Kyoto","era":"Technique traditionnelle de Kyoto","about":"« Oke » signifie baquet. Cette technique rare garde au sec de grandes parties du tissu en les enfermant dans un baquet en bois, ce qui permet de grandes zones de couleurs différentes sur un même kimono. Très peu d’artisans savent encore la pratiquer.","process":"La partie qui doit rester non teinte est placée dans un baquet en cyprès, dont les couvercles sont fermement serrés et ficelés sur le tissu, la partie à teindre restant à l’extérieur. Le baquet entier est ensuite plongé dans une plus grande cuve de teinture. On recommence pour chaque couleur.","look":"De grands blocs audacieux de couleurs différentes, aux bordures nettes mais légèrement douces."},"itajime":{"name":"Itajime, teinture serrée entre planches","region":"Arimatsu, Kyoto et ailleurs","era":"Depuis le VIIIe siècle","about":"L’une des plus anciennes techniques de réserve au Japon ; son ancêtre, le kyokechi (teinture entre des planches sculptées), subsiste dans le trésor du Shosoin, datant du VIIIe siècle. Le tissu plié est pressé entre des planches pour créer des motifs répétés.","process":"Le tissu est plié en triangles ou en carrés et serré fortement entre des planches de bois, puis plongé dans la teinture. Les zones couvertes restent blanches et forment un motif symétrique.","look":"Des formes géométriques répétées, comme des motifs en flocon de neige appelés sekka."},"tsukami":{"name":"Tsukami, shibori « à la poignée »","region":"Divers centres de shibori","era":"Traditionnelle","about":"« Tsukami » signifie saisir. Des poignées de tissu sont froncées et ligaturées, si bien que chaque pièce est différente. Le résultat est libre et naturel.","process":"L’artisan saisit le tissu, le tord en paquets irréguliers et les ligature avec du fil avant la teinture. Les plis aléatoires créent des motifs imprévisibles.","look":"Des motifs irréguliers, nuageux ou marbrés, sans répétition."},"kumihimo":{"name":"Kumihimo, tressage de soie","region":"Kyoto, Iga (Mie)","era":"Depuis le VIIe–VIIIe siècle","about":"Des cordons de soie tressés, d’abord utilisés pour les objets bouddhiques et le costume de cour, puis pour les armures et les cordons de sabre des samouraïs. Aujourd’hui, on les connaît surtout comme obijime, le cordon noué au milieu de l’obi.","process":"Des dizaines de fils de soie sont enroulés sur des fuseaux lestés et croisés les uns sur les autres sur un support en bois, comme le marudai rond. Supports et gestes différents créent des cordons ronds, carrés ou plats.","look":"Une tresse ferme et régulière aux fins motifs diagonaux et aux riches associations de couleurs."},"zogan":{"name":"Zogan, incrustation de métal","region":"Kyoto, Kumamoto (Higo)","era":"Florissant à l’époque d’Edo sur les garnitures de sabres et d’armes à feu","about":"L’art d’incruster l’or et l’argent dans le fer. Autrefois utilisé pour orner les garnitures de sabre, il décore aujourd’hui des accessoires de kimono comme les obidome (broches d’obi) et les ornements de cheveux.","process":"La surface du fer est striée de fines rainures croisées. Feuilles et fils d’or ou d’argent sont martelés dans les rainures, puis le fer est volontairement rouillé et cuit avec de la laque ou de l’huile jusqu’à un noir profond.","look":"Des dessins d’or et d’argent éclatants sur un fond noir profond."},"makie":{"name":"Maki-e, laque d’or","region":"Kyoto, Wajima, Kanazawa et ailleurs","era":"Depuis le VIIIe–IXe siècle","about":"Un art de la laque où les dessins sont tracés à la laque puis saupoudrés de poudre d’or ou d’argent. Dans l’univers du kimono, on le trouve sur les peignes, les épingles à cheveux, les obidome et les sandales geta.","process":"Le dessin est peint à la laque et, avant qu’elle ne sèche, une fine poudre d’or ou d’argent est saupoudrée à l’aide d’un tube en bambou. La pièce est ensuite enduite et polie plusieurs fois.","look":"De délicates images dorées au brillant profond sur laque noire ou rouge."},"mizuhiki":{"name":"Mizuhiki, cordons de papier","region":"Iida (Nagano), Kanazawa (Ishikawa)","era":"Origines remontant au VIIe siècle","about":"Des cordons décoratifs en papier washi torsadé, noués en nœuds porteurs de vœux de bonheur. Ils ornent les enveloppes de cadeaux et, dans la tenue en kimono, servent d’ornements de cheveux pour la mariée et de décorations d’obi.","process":"Le washi est torsadé en fins cordons et raidi à l’amidon, puis teint ou enveloppé d’un film coloré ou métallisé. Les cordons sont noués en nœuds comme le nœud awaji, ou façonnés en grues, pins et pruniers.","look":"Des cordons brillants et rigides noués en nœuds symétriques, souvent rouge et blanc ou or et argent."},"ro":{"name":"Ro, gaze d’été à rayures ajourées","region":"Kyoto et d’autres régions de tissage de la soie","era":"Nom attesté dès le XVe siècle ; répandu à partir de l’époque d’Edo","about":"Une soie d’été parcourue de rangées régulières de minuscules ouvertures qui laissent passer l’air. C’est le tissu classique des kimonos de cérémonie comme de tous les jours pendant les mois les plus chauds, du début à la fin de l’été.","process":"Plusieurs rangs d’armure toile sont tissés, puis, sur un seul rang, les fils de chaîne sont torsadés deux à deux pour laisser une ligne d’ajours. Le nombre de rangs toile entre les ajours donne les noms « ro à trois rangs », « ro à cinq rangs », etc.","look":"De fines lignes horizontales (ou parfois verticales) de petites ouvertures sur une soie par ailleurs pleine."},"sha":{"name":"Sha, gaze de soie intégrale","region":"Kyoto et d’autres régions de tissage de la soie","era":"Venu de Chine aux VIIe–VIIIe siècles","about":"Une soie légère et transparente portée au cœur de l’été. Plus légère et plus transparente que le ro, elle sert aussi aux haori et manteaux d’été portés par-dessus le kimono.","process":"À chaque rang, les fils de chaîne sont torsadés deux à deux et bloqués par la trame. Cela crée un maillage régulier et ajouré sur toute l’étoffe.","look":"Un maillage uniforme et transparent, sans rayures pleines ; les couches dessous transparaissent en douceur."},"ra":{"name":"Ra, gaze complexe en filet","region":"Kyoto","era":"Antiquité (VIIe–VIIIe siècle) ; ravivé au XXe siècle","about":"L’une des plus anciennes et la plus complexe des gazes, dont des exemples sont conservés dans le trésor du Shosoin, datant du VIIIe siècle. La technique a décliné au Japon après le Moyen Âge avant d’être ravivée par des maîtres tisserands modernes. On la voit aujourd’hui surtout dans de luxueux obi d’été.","process":"Chaque fil de chaîne croise plusieurs fils voisins pour se torsader avec eux, et non avec un seul partenaire, si bien que les fils forment un filet. Elle est tissée lentement à la main sur un métier spécial.","look":"Un maillage extensible en filet aux ouvertures en losange, où apparaissent souvent des motifs."},"kobai":{"name":"Kobai, étoffe d’été à quadrillage gaufré","region":"Régions de tissage du coton et de la soie dans tout le Japon","era":"Étoffe d’été traditionnelle","about":"Une étoffe d’été à texture quadrillée en relief, en coton (men-kobai) ou en soie et coton (kinu-kobai). Elle est très appréciée pour les yukata de qualité et les kimonos d’été décontractés.","process":"Des fils plus épais sont insérés à intervalles réguliers, en chaîne comme en trame, dans un fond fin et léger. Ces fils épais forment un quadrillage en relief.","look":"Une étoffe légère à carreaux de lignes en relief ; ces nervures l’empêchent de coller à la peau."},"rokechi":{"name":"Rokechi, teinture à réserve à la cire","region":"Kyoto et tout le Japon","era":"VIIIe siècle ; renouveau au XXe siècle","about":"L’une des trois anciennes méthodes de teinture à réserve de l’époque de Nara, dont des exemples sont conservés au trésor du Shosoin. Elle a disparu au cours de l’époque de Heian, puis a été ravivée par des artistes du XXe siècle, qui en ont fait une forme de teinture libre et picturale.","process":"De la cire fondue est appliquée au pinceau ou au tampon sur le tissu, là où la couleur ne doit pas aller, puis le tissu est teint. La cire est ensuite retirée par la chaleur ou à l’eau chaude. Là où la cire s’est craquelée, la teinture s’infiltre et laisse de fines lignes.","look":"Des formes audacieuses parcourues de fines craquelures en toile d’araignée."},"mokuhan":{"name":"Mokuhan, impression à la planche de bois","region":"Kyoto et autres régions","era":"Origines anciennes","about":"Une technique d’impression dans laquelle des motifs gravés dans des planches de bois sont pressés sur le tissu. Chaque impression porte la main de l’artisan, et les légères variations donnent à l’étoffe un caractère chaleureux et artisanal. Peu d’ateliers la pratiquent encore aujourd’hui.","process":"Un motif est gravé dans une planche de bois dur. La planche est enduite de teinture ou de pâte, puis pressée fermement sur le tissu tendu, une empreinte à la fois. Une planche distincte est utilisée pour chaque couleur.","look":"Des motifs répétés à la couleur légèrement irrégulière et aux bords adoucis, avec la discrète texture du fil du bois."},"chusen":{"name":"Chusen, teinture par versement","region":"Osaka (Sakai), Hamamatsu (Shizuoka), Tokyo","era":"Fin du XIXe siècle (ère Meiji)","about":"Une méthode japonaise pour teindre les yukata et les serviettes tenugui en coton. La teinture traverse entièrement le tissu, si bien que les deux faces ont la même couleur, et les couleurs paraissent douces et fraîches.","process":"Le tissu est plié en accordéon en de nombreuses couches, et une pâte de réserve est étalée à travers un pochoir sur chaque couche. Des murets de pâte sont formés autour de chaque zone, la teinture y est versée à l’aide d’une bouilloire, et une aspiration par le dessous la fait traverser toutes les couches à la fois.","look":"Des couleurs douces et légèrement estompées, de délicats dégradés, et le même motif nettement visible au revers."},"bingata":{"name":"Bingata, teinture au pochoir d’Okinawa","region":"Okinawa","era":"Royaume de Ryukyu (à partir du XVe siècle environ)","about":"L’art de la teinture aux couleurs vives d’Okinawa, autrefois porté par la famille royale et les nobles du royaume de Ryukyu. Ses couleurs éclatantes et ses motifs venus à la fois du Japon et des mers du Sud lui donnent un caractère joyeux et tropical.","process":"Un motif est découpé dans un pochoir en papier, et de la pâte de riz est appliquée à travers celui-ci. Des pigments minéraux et des teintures végétales sont passés au pinceau dans chaque zone, puis une nuance plus foncée est frottée sur les bords (kumadori) pour donner de la profondeur. Une version teinte uniquement à l’indigo s’appelle eigata.","look":"Des jaunes, rouges et bleus vifs aux bords ombrés, avec des motifs tels que fleurs, oiseaux, vagues et nuages."},"aizome":{"name":"Aizome, teinture à l’indigo","region":"Tokushima (Awa) et tout le Japon","era":"Antiquité ; très répandue à l’époque d’Edo","about":"L’indigo était la teinture la plus courante au Japon, utilisée pour tout, des vêtements de travail des paysans aux kimonos. Les visiteurs étrangers de l’ère Meiji en furent si frappés que cette couleur fut surnommée « Japan Blue ».","process":"Les feuilles d’indigo sont compostées pour obtenir le sukumo, qui est ensuite fermenté dans une cuve avec de la lessive de cendre de bois, du son de blé et de la chaux. Le tissu est plongé et ressorti encore et encore : il sort vert et devient bleu au contact de l’air. Plus les bains sont nombreux, plus la couleur est profonde.","look":"Un bleu profond et vivant, du bleu ciel pâle au presque noir, qui s’adoucit magnifiquement avec le temps."},"lace":{"name":"Dentelle","region":"Développée en Europe ; fabriquée au Japon et dans le monde entier","era":"Dentelle européenne dès le XVIe siècle ; associée au kimono depuis les ères Meiji–Taisho","about":"La dentelle est un textile ajouré composé uniquement de fils. Dans la mode kimono actuelle, les kimonos, haori et obi en dentelle sont populaires, souvent superposés à un kimono coloré pour laisser transparaître la couleur.","process":"La plupart des dentelles pour kimono sont fabriquées sur des machines à broder. Le motif est brodé sur un tulle fin (dentelle sur tulle) ou sur un tissu de base qui est ensuite dissous, ne laissant que les fils brodés (dentelle chimique).","look":"Un motif floral ou géométrique de fils, transparent, laissant apparaître la couleur du dessous à travers les ajours."},"tsuzure":{"name":"Tsuzure, tapisserie tissée","region":"Kyoto (Nishijin)","era":"Exemples au Japon dès le VIIIe siècle (probablement importés de Chine) ; tissé à Nishijin depuis le XVIIIe siècle (époque d’Edo)","about":"La version japonaise de la tapisserie, apparentée à la tapisserie des Gobelins en Europe. On la considère comme l’obi du plus haut rang, et les plus belles pièces sont tissées à la main avec les ongles du tisserand.","process":"Chaque trame colorée va et vient uniquement dans sa propre partie du motif, cachant entièrement la chaîne. Le tisserand lime ses ongles en dents de scie et s’en sert pour tasser chaque trame. On ne tisse que quelques centimètres par jour.","look":"Un tissu ferme et plat, avec la même image à l’endroit et à l’envers, et de minuscules fentes là où deux couleurs se rencontrent."},"benibana":{"name":"Benibana, teinture au carthame","region":"Yamagata (Mogami) et Kyoto","era":"Arrivée par la route de la soie vers le VIe–VIIe siècle","about":"Une teinture rouge naturelle obtenue à partir des pétales de carthame, très appréciée de la cour de Heian. Elle était si précieuse à l’époque d’Edo que l’on disait « une mesure de rouge vaut une mesure d’or ». On l’utilisait traditionnellement pour les doublures en soie rouge des kimonos (momi).","process":"Les pétales sont lavés à l’eau pour éliminer une grande partie du pigment jaune, puis fermentés et pressés en galettes appelées « beni-mochi ». Le rouge est extrait avec de la lessive de cendre et fixé sur la soie avec du vinaigre de prune fumée (ubai). Des teintures répétées approfondissent la couleur.","look":"Un rose clair et lumineux jusqu’au cramoisi profond ; la couleur est délicate et pâlit sous une lumière forte."}}},"de":{"ui":{"tagline":"Das Handwerk hinter dem Kimono — 50 traditionelle Techniken Japans","all":"Alle","search":"Techniken suchen…","region":"Wo","era":"Seit","about":"Was es ist","process":"Wie es entsteht","look":"Woran man es erkennt","listen":"Japanischen Namen anhören","close":"Schließen","language":"Sprache","count":"{n} Techniken","noResults":"Keine Technik passt zu Ihrer Suche.","prev":"Zurück","next":"Weiter","intro":"Ein Kimono entsteht in vielen Arbeitsschritten, und jeder Schritt hat seine eigenen Meister. Wählen Sie eine Kategorie oder tippen Sie auf eine Technik, um mehr zu erfahren."},"cats":{"dye":{"name":"Färben","desc":"Muster werden auf fertig gewebte weiße Seide gemalt, mit Schablonen aufgetragen oder gedruckt. Gefärbte Kimonos sind meist die formelleren und werden zu Zeremonien und Feiern getragen."},"weave":{"name":"Weben","desc":"Die Fäden werden zuerst gefärbt, und das Muster entsteht erst beim Weben. Gewebte Kimonos wie Tsumugi gelten als stilvolle Alltagskleidung, während gewebte Obi zu den formellsten überhaupt zählen können."},"embroidery":{"name":"Stickerei","desc":"Seiden- und Metallfäden werden von Hand auf den Stoff gestickt und verleihen ihm Struktur, Glanz und Tiefe. Auf formellen Kimonos wird Stickerei oft mit Färbung kombiniert."},"shibori":{"name":"Shibori (Abbindefärbung)","desc":"Teile des Stoffes werden abgebunden, vernäht, gefaltet oder eingeklemmt, damit die Farbe sie nicht erreicht. Werden die Fäden entfernt, erscheint das Muster mit einer weichen, dreidimensionalen Struktur."},"other":{"name":"Kunsthandwerk für Accessoires","desc":"Vollendet wird der Kimono durch Schnüre, Schmuck und Verzierungen von Handwerkern anderer Traditionen: Flechtern, Metallkünstlern, Lackkünstlern und Papierschnurmachern."}},"items":{"kaga-yuzen":{"name":"Kaga Yuzen – handbemalte Seide","region":"Kanazawa, Ishikawa","era":"Frühes 18. Jahrhundert","about":"Ein handgemalter Färbestil aus dem früheren Kaga-Lehen. Bekannt ist er für realistische Blumen und Pflanzen in den „fünf Kaga-Farben“: Indigo, Karmesin, Ocker, Grasgrün und Königspurpur.","process":"Das Motiv wird mit einer dünnen Linie aus Reispaste umrandet, die das Verlaufen der Farben verhindert. Dann wird jede Fläche mit dem Pinsel bemalt, schattiert vom äußeren Rand zur Mitte hin. Meist betreut ein einziger Künstler das ganze Stück.","look":"Natürliche, malerische Motive, manchmal mit „wurmzerfressenen“ Blättern (Mushikui). Wenig oder gar kein Gold und keine Stickerei."},"kyo-yuzen":{"name":"Kyoto Yuzen – handbemalte Seide","region":"Kyoto","era":"Spätes 17. Jahrhundert","about":"Der ursprüngliche Yuzen-Stil, benannt nach Miyazaki Yuzensai, einem Fächermaler in Kyoto. Er brachte eine malerische Gestaltungsfreiheit auf den Kimono und wu
